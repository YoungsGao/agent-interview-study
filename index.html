    return Array.isArray(savedData?.[key]) ? savedData[key].filter(valid) : [];
  }
  const starred = new Set(readArray('starred', n => questionVariants.has(n)));
  const mastered = new Set(readArray('mastered', n => questionVariants.has(n)));
  const validChecks = new Set(data.focus.flatMap(stage => stage.items.map((_, i) => `${stage.number}-${i}`)));
  const checked = new Set(readArray('checked', key => validChecks.has(key)));
  let recent = readArray('recent', key => lookup.has(key)).slice(0, 6);
  let route = {};
  let filter = 'any';
  let page = 1;
  let answerVisible = false;
  let startingLink = '#browse';
  let menu = false;

  const encoder = new Intl.NumberFormat('zh-CN');
  const percent = (num, total) => Math.min(100, Math.round(num * 100 / (total || 1)));
  const format = num => encoder.format(num);
  const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const normalize = text => text.normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim();
  const index = new Map(data.questions.map(q => [
    q.key, normalize([q.title, q.number, banks[q.bank].name, ...q.sections.map(s => s.text)].join(' ')),
  ]));
  const titleOf = { home: '学习总览', library: '全部题库', focus: '第一轮重点', saved: '我的收藏', question: '刷题' };
  const questionLink = q => `#question/${q.key}`;
  const bankLink = key => `#bank/${key}`;
  const numCount = list => list.filter(q => mastered.has(q.number)).length;

  function inline(text) {
    const tokens = /`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\((https:\/\/[^\s)]+|#q-\d+)\)/g;
    let value = '';
    let cursor = 0;
    for (const match of text.matchAll(tokens)) {
      value += esc(text.slice(cursor, match.index));
      if (match[1]) value += `<code>${esc(match[1])}</code>`;
      if (match[2]) value += `<strong>${esc(match[2])}</strong>`;
      if (match[3]) value += linked(match[3], match[4]);
      cursor = match.index + match[0].length;
    }
    return value + esc(text.slice(cursor));
  }

  function linked(label, url) {
    const local = url.startsWith('#q-') ? lookup.get(`mysql-${url.slice(3)}`) : byUrl.get(url);
    return local
      ? `<a href="${questionLink(local)}">${esc(label)}</a>`
      : `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} <span aria-hidden="true">↗</span></a>`;
  }

  function renderBlock(text) {
    const lines = text.split('\n');
    if (lines[0].startsWith('```')) return `<pre><code>${esc(lines.slice(1, -1).join('\n'))}</code></pre>`;
    if (lines.length >= 3 && lines.every(line => line.startsWith('|') && line.endsWith('|'))) {
      const row = (line, tag) => `<tr>${line.slice(1, -1).split('|').map(cell =>
        `<${tag}>${inline(cell.trim())}</${tag}>`).join('')}</tr>`;
      return `<div class="answer-table"><table><thead>${row(lines[0], 'th')}</thead>
        <tbody>${lines.slice(2).map(line => row(line, 'td')).join('')}</tbody></table></div>`;
    }
    const list = /^(?:(\d+)\.|[-*])\s+/;
    if (lines.every(line => list.test(line))) {
      const start = lines[0].match(list)[1];
      const tag = start ? 'ol' : 'ul';
      const items = lines.map(line => `<li>${inline(line.replace(list, ''))}</li>`).join('');
      return `<${tag}${start && start !== '1' ? ` start="${start}"` : ''}>${items}</${tag}>`;
    }
    return `<p>${inline(text)}</p>`;
  }

  function studyText(text) {
    return text.split(/(^```[\w-]*\n[\s\S]*?^```[ \t]*$)/m)
      .flatMap((part, i) => i % 2 ? [part] : part.trim().split(/\n\s*\n/))
      .filter(Boolean)
      .map(renderBlock)
      .join('');
  }

  function store() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        starred: [...starred], mastered: [...mastered], checked: [...checked], recent,
      }));
    } catch {
      document.querySelector('#storage-note').textContent = '此浏览环境只能临时保存进度';
    }
  }

  function say(message) {
    document.querySelector('#status').textContent = message;
  }

  function meter(num, total) {
    const score = percent(num, total);
    return `<div class="meter" role="progressbar" aria-label="当前进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${score}"><span style="width:${score}%"></span></div>`;
  }

  function questionTags(q, includeBank = true) {
    const kind = includeBank ? `<span class="tag ${q.bank}">${banks[q.bank].short}</span>` : '';
    const job = jobByNumber.get(q.number);
    return kind
      + (job ? `<span class="tag job-tag">岗位重点 · 第 ${job.rank} 题</span>` : addedByNumber.has(q.number) ? '<span class="tag priority-tag">第一轮新增</span>' : q.priority ? '<span class="tag priority-tag">★ 第一轮</span>' : '')
      + (mastered.has(q.number) ? '<span class="tag done-tag">✓ 已掌握</span>' : '');
  }

  function getRoute() {
    const hash = location.hash.slice(1);
    const [path, params] = hash.split('?');
    const [name, value] = path.split('/');
    const options = new URLSearchParams(params);
    const query = (options.get('q') || '').slice(0, 90);
    const selected = options.has('jobs') ? 'jobs' : options.has('first') ? 'priority'
      : ['todo', 'mastered'].includes(options.get('filter')) ? options.get('filter') : 'any';
    if (name === 'bank' && Object.hasOwn(banks, value)) return { view: 'library', bank: value, query, selected };
    if (name === 'browse') return { view: 'library', bank: '', query, selected };
    if (name === 'focus') return { view: 'focus', step: Number(value) };
    if (name === 'saved') return { view: 'saved', bank: '', query, selected };
    if (name === 'question' && lookup.has(value)) return { view: 'question', key: value, bank: lookup.get(value).bank };
    return { view: 'home' };
  }

  function libraryLink(base, query, selected) {
    const options = new URLSearchParams();
    if (selected === 'jobs') options.set('jobs', '1');
    else if (selected === 'priority') options.set('first', '1');
    else if (selected === 'todo' || selected === 'mastered') options.set('filter', selected);
    if (query) options.set('q', query);
    return options.size ? base + '?' + options : base;
  }

  function setMenu(open) {
    menu = open;
    document.body.classList.toggle('menu-open', open);
    document.querySelector('.overlay').hidden = !open;
    document.querySelector('.menu-button').setAttribute('aria-expanded', String(open));
    if (open) document.querySelector('.sidebar .nav-link').focus();
  }

  function updateRoute() {
    const next = getRoute();
    if (next.view === 'question' && next.key !== route.key) {
      if (route.view === 'library' || route.view === 'saved') {
        const base = route.view === 'saved' ? '#saved' : route.bank ? bankLink(route.bank) : '#browse';
        startingLink = libraryLink(base, route.query, filter);
      } else if (route.view === 'focus') {
        startingLink = '#focus';
      } else if (route.view !== 'question') {
        startingLink = bankLink(next.bank);
      }
      recent = [next.key, ...recent.filter(key => lookup.get(key).number !== lookup.get(next.key).number)].slice(0, 6);
      answerVisible = false;
      store();
    }
    route = next;
    page = 1;
    filter = route.selected || 'any';
    search.value = route.query || '';
    setMenu(false);
    render();
    if (route.view === 'focus' && route.step) {
      document.querySelector(`#stage-${route.step}`)?.scrollIntoView();
    } else {
      window.scrollTo(0, 0);
    }
  }

  function sidebar() {
    document.querySelector('#header-title').textContent = route.bank && route.view === 'library' ? banks[route.bank].short : titleOf[route.view];
    document.querySelectorAll('[data-nav]').forEach(link => {
      const active = link.dataset.nav === route.view && !(route.view === 'library' && route.bank);
      if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    });
    document.querySelector('#bank-nav').innerHTML = groups.map(([label, keys]) => `
      <div class="bank-nav-group" role="group" aria-label="${label}">
        <span class="bank-nav-label" aria-hidden="true">${label}</span>
        ${keys.map(key => `<a class="nav-bank ${key}" href="${bankLink(key)}" ${route.bank === key ? 'aria-current="page"' : ''}>
          <span class="bank-dot" aria-hidden="true"></span><span>${banks[key].short}</span><small>${grouped[key].length}</small>
        </a>`).join('')}
      </div>`).join('');
    const progress = percent(mastered.size, questionVariants.size);
    document.querySelector('#side-progress').style.width = `${progress}%`;
    document.querySelector('#side-meter').setAttribute('aria-valuenow', String(progress));
    document.querySelector('#side-progress-label').textContent = `${format(mastered.size)} / ${format(questionVariants.size)}`;
    document.querySelector('#saved-count').textContent = starred.size ? format(starred.size) : '';
  }

  function renderHome() {
    const continueTo = recent.length ? questionLink(lookup.get(recent[0])) : '#browse';
    const stageRows = data.focus.map(stage => {
      const completed = stage.items.filter((_, i) => checked.has(`${stage.number}-${i}`)).length;
      return `<a class="step-row" href="#focus/${stage.number}">
        <span class="step-number">${stage.number}</span><span class="step-name">${esc(stage.title)}</span>
        <small>${completed}/${stage.items.length} 项 <span aria-hidden="true">›</span></small>
      </a>`;
    }).join('');
    const history = recent.length ? recent.slice(0, 4).map(key => {
      const q = lookup.get(key);
      return `<a class="recent-row ${q.bank}" href="${questionLink(q)}"><span class="bank-dot" aria-hidden="true"></span>
        <span>${esc(q.title)}</span><small>#${q.number}</small></a>`;
    }).join('') : '<p class="empty-mini">打开一道题后，可以在这里继续复习。</p>';
    home.innerHTML = `
      <section class="hero" aria-labelledby="welcome-title">
        <div class="hero-copy">
          <span class="eyeline">面试备考</span>
          <h1 id="welcome-title">Agent 开发面试<span>从重点开始</span></h1>
          <p>${Object.keys(banks).length} 个题库 · ${format(data.questions.length)} 个题目条目</p>
          <div class="hero-actions">
            <a class="button button-primary" href="#focus">查看第一轮重点 <span class="button-arrow" aria-hidden="true">›</span></a>
            <a class="button button-light" href="${continueTo}">${recent.length ? '继续上次学习' : '浏览全部题目'}</a>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="art-grid"></div><div class="art-orbit"></div><div class="art-sun"></div><span class="art-spark">✦</span>
          <div class="study-stack"><div class="stack-layer"></div><div class="stack-layer"></div>
            <div class="stack-card"><small>第一轮已掌握</small><strong>${numCount(priorities)}<span style="font-size:.45em"> / ${priorities.length}</span></strong>${meter(numCount(priorities), priorities.length)}</div>
            <div class="stack-check">✓</div>
          </div>
        </div>
      </section>
      <section class="section" aria-labelledby="bank-heading">
        <div class="section-title"><h2 id="bank-heading">选择题库</h2><a href="#browse">查看全部题目 <span aria-hidden="true">›</span></a></div>
        ${groups.map(([label, keys]) => `<div class="bank-group"><h3>${label}</h3>
          <div class="bank-grid">${keys.map(key => {
            const bank = banks[key];
            return `
          <a class="bank-card ${key}" href="${bankLink(key)}">
            <div class="bank-header"><span class="bank-icon ${key === 'agent' ? '' : 'text-icon'}" aria-hidden="true">${bank.icon}</span><span class="bank-total">${grouped[key].length} 题</span></div>
            <h4>${bank.name}</h4><p>${bank.description}</p>
            ${meter(numCount(grouped[key]), grouped[key].length)}
            <div class="bank-bottom"><span>已掌握 ${numCount(grouped[key])} 题</span><b aria-hidden="true">›</b></div>
          </a>`;
          }).join('')}</div></div>`).join('')}
      </section>
      <div class="dashboard-grid">
        <section class="section"><div class="section-title"><h2>第一轮学习路径</h2><a href="#focus">打开清单 <span aria-hidden="true">›</span></a></div><div class="surface">${stageRows}</div></section>
        <section class="section"><div class="section-title"><h2>最近学习</h2></div><div class="surface">${history}</div></section>
      </div>`;
  }

  function starButton(q) {
    const isSaved = starred.has(q.number);
    return `<button type="button" class="icon-button" data-action="star" data-key="${q.key}" aria-pressed="${isSaved}" aria-label="${isSaved ? '取消收藏' : '收藏题目'}" title="${isSaved ? '取消收藏' : '收藏题目'}">${isSaved ? '★' : '☆'}</button>`;
  }

  function pagination(total) {
    if (total <= 1) return '';
    const pages = [...new Set([1, page - 1, page, page + 1, total])].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
    const buttons = pages.map((n, i) => `${i && n - pages[i - 1] > 1 ? '<i aria-hidden="true">…</i>' : ''}
      <button class="pill" type="button" data-action="page" data-page="${n}" ${n === page ? 'aria-current="page"' : ''} aria-label="第 ${n} 页">${n}</button>`).join('');
    return `<nav class="pagination" aria-label="题目分页">
      <button class="pill" type="button" data-action="page" data-page="${page - 1}" ${page === 1 ? 'disabled' : ''}>上一页</button>${buttons}
      <button class="pill" type="button" data-action="page" data-page="${page + 1}" ${page === total ? 'disabled' : ''}>下一页</button>
    </nav>`;
  }

  function renderLibrary() {
    const isSaved = route.view === 'saved';
    let matches = route.bank ? grouped[route.bank] : data.questions;
    if (isSaved) matches = matches.filter(q => starred.has(q.number));
    const conditions = {
      any: () => true,
      priority: q => q.priority,
      jobs: q => jobByNumber.has(q.number),
      todo: q => !mastered.has(q.number),
      mastered: q => mastered.has(q.number),
    };
    matches = matches.filter(conditions[filter]);
    if (filter === 'jobs') matches = matches.slice().sort((a, b) => jobByNumber.get(a.number).rank - jobByNumber.get(b.number).rank);
    if (route.query) {
      const terms = normalize(route.query).replace(/^#(?=\d)/, '').split(' ');
      matches = matches.filter(q => terms.every(s => index.get(q.key).includes(s)));
      const rank = q => {
        if (terms.length === 1 && terms[0] === String(q.number)) return 2;
        const title = normalize(`${q.number} ${q.title}`);
        return terms.every(s => title.includes(s)) ? 1 : 0;
      };
      matches.sort((a, b) => rank(b) - rank(a));
    }
    if (isSaved || filter === 'jobs' || filter === 'priority') matches = uniqueQuestions(matches);
    const pages = Math.max(1, Math.ceil(matches.length / pageSize));
    page = Math.min(page, pages);
    const displayed = matches.slice((page - 1) * pageSize, page * pageSize);
    const heading = isSaved ? '我的收藏' : route.bank ? banks[route.bank].name : '全部题库';
    const introduction = filter === 'jobs' ? '按岗位复习优先级排列，题名前的数字是面试鸭原站题号。' : isSaved ? '把需要再练的题放在一起。' : route.bank ? banks[route.bank].description : '按面试鸭题库顺序浏览，题目前的数字为原站题号。';
    const filterLabels = { any: '全部', priority: '★ 第一轮', jobs: '岗位重点', todo: '未掌握', mastered: '已掌握' };
    const bankItems = [['', '全部题库'], ...Object.entries(banks).map(([k, b]) => [k, b.short])];
    const emptyTitle = isSaved && starred.size === 0 ? '还没有收藏题目' : '没有符合条件的题目';
    const emptyText = isSaved && starred.size === 0 ? '点击题目旁的星标，即可加入收藏。' : '换一个关键词，或切换题库和进度筛选。';
    home.innerHTML = `
      <div class="page-intro"><h1 class="page-title">${heading}</h1><p class="page-description">${introduction}</p></div>
      <div class="library-controls">
        ${!isSaved ? `<div class="filters" aria-label="题库筛选"><span class="filter-label">题库</span>${bankItems.map(([k, label]) =>
          `<a class="pill" href="${esc(libraryLink(k ? bankLink(k) : '#browse', route.query, filter))}" ${k === route.bank ? 'aria-current="page"' : ''}>${label}</a>`
        ).join('')}</div>` : ''}
        <div class="filters" aria-label="进度筛选"><span class="filter-label">筛选</span>${Object.entries(filterLabels).map(([key, label]) =>
          `<button type="button" class="pill" data-action="filter" data-filter="${key}" aria-pressed="${filter === key}">${label}</button>`
        ).join('')}</div>
      </div>
      <div class="results-head"><span><strong>${format(matches.length)} 题</strong>${route.query ? ` · 搜索「${esc(route.query)}」` : ''}</span>
      ${route.query ? '<button type="button" class="pill" data-action="clear">清空搜索</button>' : pages > 1 ? `<span>第 ${page} / ${pages} 页</span>` : ''}</div>
      ${displayed.length ? `<div class="question-list">${displayed.map(q => `
        <article class="question-item">
          <a class="question-entry" href="${questionLink(q)}"><span class="number-tag">${q.number}</span>
            <span><span class="question-line">${esc(q.title)}</span><span class="metadata">${questionTags(q)}</span></span>
          </a>${starButton(q)}
        </article>`).join('')}</div>${pagination(pages)}` : `
        <div class="empty"><h2>${emptyTitle}</h2><p>${emptyText}</p><a class="button button-subtle" href="#browse">浏览题库</a></div>`}`;
  }

  function renderQuestion() {
    const q = lookup.get(route.key);
    const adjacent = grouped[q.bank];
    const offset = q.position - 1;
    const prev = adjacent[offset - 1];
    const next = adjacent[offset + 1];
    const mastery = mastered.has(q.number);
    const stem = q.sections.find(s => s.kind === '题干条件');
    const neighborhood = Math.min(Math.max(0, offset - 3), Math.max(0, adjacent.length - 7));
    const headline = `<div class="metadata"><span class="number-tag">原站 ${q.number}</span>${questionTags(q)}</div>`;
    const quote = q.quote ? `<blockquote><strong>面试鸭原文短摘</strong>「${esc(q.quote)}」</blockquote>` : '';
    const answer = q.sections.filter(s => s.kind !== '题干条件').map(s => `
      <div class="answer-section"><h2>${esc(s.kind)}</h2>${studyText(s.text)}</div>`).join('');
    const source = data.sources[q.source];
    const sourceNote = {
      preview: '这份讲解参考了官方预览。登录原站可查看当前账号可读的内容。',
      visible: '这份讲解用自己的话整理了官方要点，并补充示例。官方措辞见原站。',
      written: '这份讲解为独立补写。面试鸭后续更新可在原题页面查看。',
    }[q.source];
    const hasOriginal = q.source !== 'written';
    const originalLink = `<a class="button ${hasOriginal ? 'button-primary' : 'button-light'}" href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">${hasOriginal ? '读面试鸭推荐答案' : '查看原站题目'} <span aria-hidden="true">↗</span></a>`;
    const localButton = `<button type="button" class="button ${hasOriginal ? 'button-subtle' : 'button-primary'}" data-action="reveal" aria-expanded="${answerVisible}" aria-controls="answer-panel">${answerVisible ? '收起本地讲解' : '展开本地讲解'}</button>`;
    const variants = questionVariants.get(q.number).filter(other => other.key !== q.key);
    const job = jobByNumber.get(q.number);
    const nextJob = job && jobLessons[job.rank];
    const addedItem = addedByNumber.get(q.number);
    home.innerHTML = `
      <nav class="question-crumb" aria-label="当前题目位置"><a href="${startingLink}">‹ 返回</a><span aria-hidden="true">/</span><a href="${bankLink(q.bank)}">${banks[q.bank].name}</a><span>第 ${q.position} / ${adjacent.length} 题</span></nav>
      <div class="question-layout">
        <article class="question-main">
          ${headline}<h1>${esc(q.title)}</h1>
          ${job ? `<div class="job-target"><strong>掌握标准</strong><p>${esc(job.target)}</p>
            ${job.prompt ? `<p><b>自测</b>　${esc(job.prompt)}</p><details><summary>查看自测思路</summary><p>${esc(job.answer)}</p></details>` : ''}
            <div><a href="#focus">岗位重点清单</a>${nextJob ? `<a href="${questionLink(nextJob.q)}">下一道重点 · #${nextJob.q.number} ›</a>` : ''}</div></div>` : ''}
          ${addedItem ? `<div class="job-target added-target"><strong>第一轮掌握标准 · ${esc(addedItem.label)}</strong><p>${esc(addedItem.goal)}</p></div>` : ''}
          ${stem ? `<div class="stem"><strong>题干条件</strong>${studyText(stem.text)}</div>` : ''}
          <p class="question-origin">${esc(source)} · ${q.quote ? '含原文短摘' : '正文为本地讲解'}</p>
          <div class="question-toolbar">
            ${hasOriginal ? originalLink + localButton : localButton + originalLink}
            <button type="button" class="button ${mastery ? 'button-ok' : 'button-light'}" data-action="master" data-key="${q.key}" aria-pressed="${mastery}">${mastery ? '✓ 已掌握' : '标为已掌握'}</button>
            ${starButton(q)}
          </div>
          <div class="answer-box" id="answer-panel" ${answerVisible ? '' : 'hidden'}>${answerVisible ? `<p class="lesson-origin"><strong>本地讲解</strong> ${sourceNote}</p>` + quote + answer : ''}</div>
          ${variants.length && answerVisible ? `<div class="answer-hidden">同题还收录在 ${variants.map(other =>
            `<a href="${questionLink(other)}">${banks[other.bank].short} <span aria-hidden="true">›</span></a>`).join(' · ')}</div>` : ''}
          <div class="question-footer">
            ${prev ? `<a class="button button-light" href="${questionLink(prev)}">‹ 上一题</a>` : '<button class="button button-light" disabled>‹ 上一题</button>'}
            ${next ? `<a class="button button-light" href="${questionLink(next)}">下一题 ›</a>` : '<button class="button button-light" disabled>下一题 ›</button>'}
          </div>
        </article>
        <aside class="queue-card">
          <h2>附近题目</h2>
          ${adjacent.slice(neighborhood, neighborhood + 7).map(item => `
            <a class="queue-row" href="${questionLink(item)}" ${item.key === q.key ? 'aria-current="page"' : ''}>
              <strong>${item.position}</strong><span>${esc(item.title)}</span>
            </a>`).join('')}
        </aside>
      </div>`;
  }

  function jobFocusSection() {
    const rows = items => items.map(item => {
      const companies = [...new Set(item.jobs.map(id => jobPlan.jobs[id].company))].join('、');
      return `<li class="job-row"><span class="job-rank">${item.rank}</span><div>
        <a href="${questionLink(item.q)}"><small>#${item.q.number}</small> ${esc(item.label)}</a>
        <p>${esc(item.target)}</p><small>岗位关联 · ${esc(companies)}</small>
      </div></li>`;
    }).join('');
    const cut = jobPlan.firstCount;
    const extension = jobPlan.extensionStart - 1;
    return `<section class="focus-step job-focus" aria-labelledby="job-title">
      <div class="section-title"><h2 id="job-title">企业岗位重点</h2><a href="#browse?jobs=1">筛选这 ${jobLessons.length} 题 ›</a></div>
      <p class="job-intro">${esc(jobPlan.basis)}</p>
      <h3>先练这 ${cut} 道</h3><ol class="job-list">${rows(jobLessons.slice(0, cut))}</ol>
      <details><summary>第 ${cut + 1}–${extension} 题与掌握标准</summary>
        <ol class="job-list" start="${cut + 1}">${rows(jobLessons.slice(cut, extension))}</ol></details>
      <details class="job-extension"><summary>岗位进阶 · 第 ${extension + 1}–${jobLessons.length} 题与项目自测</summary>
        <ol class="job-list" start="${extension + 1}">${rows(jobLessons.slice(extension))}</ol></details>
      <details><summary>岗位依据与项目用法</summary>
        <p class="job-intro">${esc(jobPlan.projects)} 题号与顺序为个人备考建议。岗位核对日期 ${esc(jobPlan.date)}。</p>
        <ul class="job-sources">${Object.values(jobPlan.jobs).map(job => `<li>${esc(job.requirement)} ${linked(job.title, job.url)}</li>`).join('')}</ul>
      </details></section>`;
  }

  function additionsSection() {
    const groups = data.additions.map(group => {
      const learned = group.items.filter(item => mastered.has(lookup.get(item.key).number)).length;
      const rows = group.items.map(item => {
        const q = lookup.get(item.key);
        return `<li><a href="${questionLink(q)}"><small>#${q.number}</small> ${esc(q.title)}</a>
          ${mastered.has(q.number) ? '<span class="tag done-tag">已掌握</span>' : ''}<p>${esc(item.goal)}</p></li>`;
      }).join('');
      return `<details><summary>${esc(group.title)} <small>已掌握 ${learned} / ${group.items.length}</small></summary><ul>${rows}</ul></details>`;
    }).join('');
    return `<section class="focus-step job-focus additions" aria-labelledby="additions-title">
      <div class="section-title"><h2 id="additions-title">第一轮新增 ${addedByNumber.size} 题</h2><a href="#browse?first=1">查看全部 ${priorities.length} 题 ›</a></div>
      ${groups}</section>`;
  }

  function renderFocus() {
    home.innerHTML = `
      <div class="page-intro">
        <h1 class="page-title">第一轮学习重点</h1>
        <p class="page-description">先讲清 Agent 的任务执行，再练可靠性、RAG 和 Go。结合 pi-audit-harness 与 agents-anywhere-go 做自测。</p>
      </div>
      <div class="focus-banner">
        <div><strong>第一轮已掌握题目</strong><small>在题目页标记掌握，跨题库的同一道题只计一次。</small></div>
        <div><span class="count" id="first-total">${numCount(priorities)} / ${priorities.length}</span>${meter(numCount(priorities), priorities.length)}</div>
      </div>
      ${additionsSection()}
      ${jobFocusSection()}
      <div class="section-title"><h2>学习路径</h2></div>
      <div class="focus-banner">
        <div><strong>已完成的知识点</strong><small>完成一项口述或练习后，勾选对应知识点。</small></div>
        <div><span class="count" id="check-total">${checked.size} / ${totalChecks}</span><div id="focus-meter">${meter(checked.size, totalChecks)}</div></div>
      </div>

      <div class="focus-steps">
        ${data.focus.map(stage => `
          <section class="focus-step" id="stage-${stage.number}">
            <h2><span class="step-number" aria-hidden="true">${stage.number}</span>${esc(stage.title)}</h2>
            ${stage.items.map((item, i) => {
              const key = `${stage.number}-${i}`;
              return `<div class="check-card">
                <label for="check-${key}"><input id="check-${key}" type="checkbox" data-check="${key}" ${checked.has(key) ? 'checked' : ''}><strong>${esc(item.title)}</strong></label>
                <p>${inline(item.text)}</p>
                ${item.links.length ? `<div class="check-links">${item.links.map(ref => linked(ref.label, ref.url)).join('')}</div>` : ''}
              </div>`;
            }).join('')}
          </section>`).join('')}
        <section class="focus-step"><h2>第一轮验收</h2><ol class="exam-list">${data.checks.map(item => `<li>${inline(item)}</li>`).join('')}</ol></section>
        <section class="focus-step"><h2>项目追问配套题</h2>
          ${data.extension.map(group => `<div class="support-row"><h3>${group.title}</h3>
            <div class="check-links">${Object.entries(group.links).map(([key, label]) =>
              `<a href="${questionLink(lookup.get(key))}">${label}</a>`).join('')}</div></div>`).join('')}
        </section>
      </div>`;
  }

  function render() {
    sidebar();
    const screens = { home: renderHome, library: renderLibrary, saved: renderLibrary, question: renderQuestion, focus: renderFocus };
    screens[route.view]();
    const name = route.view === 'question' ? `#${lookup.get(route.key).number} ${banks[route.bank].short}`
      : route.bank ? banks[route.bank].short : titleOf[route.view];
    document.title = `${name} · Agent 面试学习台`;
  }

  function changeQuery(query) {
    const target = route.view === 'saved' ? '#saved' : '#browse';
    const url = libraryLink(target, query, ['jobs', 'priority'].includes(filter) ? filter : 'any');
    if (location.hash === url) updateRoute(); else location.hash = url;
  }

  document.querySelector('#search-form').addEventListener('submit', e => {
    e.preventDefault();
    changeQuery(search.value.trim().slice(0, 90));
  });
  document.addEventListener('click', e => {
    const action = e.target.closest('[data-action]');
    if (action) {
      const { action: type, key } = action.dataset;
      if (type === 'skip') { e.preventDefault(); home.focus(); home.scrollIntoView(); return; }
      if (type === 'menu') { setMenu(!menu); return; }
      if (type === 'clear') { changeQuery(''); search.focus(); return; }
      if (type === 'filter') {
        const base = route.view === 'saved' ? '#saved' : route.bank ? bankLink(route.bank) : '#browse';
        const url = libraryLink(base, route.query, action.dataset.filter);
        if (location.hash !== url) location.hash = url;
        return;
      }
      if (type === 'page') { page = Number(action.dataset.page); renderLibrary(); window.scrollTo(0, 0); }
      if (type === 'reveal') { answerVisible = !answerVisible; renderQuestion(); say(answerVisible ? '答案已显示' : '答案已收起'); }
      if (type === 'star' || type === 'master') {
        const q = lookup.get(key);
        const records = type === 'star' ? starred : mastered;
        const added = !records.has(q.number);
        if (added) records.add(q.number); else records.delete(q.number);
        store();
        render();
        say(type === 'star' ? added ? '已收藏' : '已取消收藏' : added ? '已标为掌握' : '已撤销掌握标记');
      }
      const restored = type === 'page' ? `[data-page="${page}"]`
        : type === 'filter' ? `[data-filter="${filter}"]`
        : key ? `[data-action="${type}"][data-key="${key}"]` : `[data-action="${type}"]`;
      home.querySelector(restored)?.focus({ preventScroll: true });
    }
    if (menu && e.target.closest('a[href^="#"]')) setMenu(false);
  });
  document.addEventListener('change', e => {
    const target = e.target.closest('[data-check]');
    if (!target) return;
    const key = target.dataset.check;
    if (target.checked) checked.add(key); else checked.delete(key);
    store();
    document.querySelector('#check-total').textContent = `${checked.size} / ${totalChecks}`;
    document.querySelector('#focus-meter').innerHTML = meter(checked.size, totalChecks);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && menu) {
      setMenu(false);
      document.querySelector('.menu-button').focus();
    }
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      e.preventDefault();
      search.focus();
    }
  });
  window.addEventListener('hashchange', updateRoute);
  updateRoute();
})();
</script>
</body>
</html>
