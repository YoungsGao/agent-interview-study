<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8fc">
  <title>Agent 面试学习台</title>
  <style>:root {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #232739;
  background: #f6f7fc;
  font-synthesis: none;
  --purple: #643fee;
  --purple-dark: #5330d1;
  --purple-pale: #eee9ff;
  --muted: #626a80;
  --line: #e8e9f2;
  --side-width: 230px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid #7351fa; outline-offset: 4px;
}
[hidden] { display: none !important; }
.sr-only, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip:focus { position: fixed; z-index: 10; top: 8px; left: 10px; padding: 10px 16px; background: white; border-radius: 8px; }
.layout { min-height: 100vh; }
.sidebar {
  position: fixed; z-index: 4; inset: 0 auto 0 0; width: var(--side-width); display: flex; flex-direction: column;
  padding: 28px 17px 20px; background: #fff; border-right: 1px solid var(--line); overflow: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; margin-bottom: 24px; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 9px); grid-template-rows: repeat(2, 9px); place-content: center; gap: 3px; width: 38px; height: 38px; background: #eee7ff; border-radius: 12px; flex: none; transform: rotate(-8deg); }
.brand-mark i { background: #7146f6; border-radius: 2px; }
.brand-mark i:nth-child(2) { background: #ff987e; border-radius: 50%; }
.brand-mark i:nth-child(3) { background: #8edec4; }
.brand-mark i:nth-child(4) { background: #ab91ff; }
.brand strong { display: block; color: #28243b; font-size: 17px; white-space: nowrap; font-weight: 780; letter-spacing: -.035em; }
.brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 3px; letter-spacing: .12em; }
.navigation { display: grid; gap: 5px; }
.nav-link, .nav-bank { min-height: 43px; display: flex; align-items: center; gap: 10px; padding: 5px 11px; color: #555d73; border-radius: 10px; font-size: 13px; font-weight: 650; }
.nav-link:hover, .nav-bank:hover { background: #f6f4ff; color: var(--purple-dark); }
.nav-link[aria-current="page"], .nav-bank[aria-current="page"] { background: var(--purple-pale); color: #5633ce; }
.nav-icon { margin-right: 1px; width: 21px; text-align: center; color: inherit; font-size: 19px; font-weight: 600; line-height: 1; }
.nav-link i { margin-left: auto; font-style: normal; font-size: 11px; font-variant-numeric: tabular-nums; }
.library-nav { margin: 14px 0 9px; border-top: 1px solid #f0eff5; padding-top: 13px; }
.bank-nav-group + .bank-nav-group { margin-top: 8px; }
.bank-nav-label { display: block; padding: 0 11px 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
.nav-bank { min-height: 30px; gap: 9px; }
.nav-bank small { margin-left: auto; color: #626a80; font-variant-numeric: tabular-nums; }
.bank-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bank-ink); flex: none; }
.sidebar-foot { margin-top: auto; padding: 12px 11px 4px; color: var(--muted); }
.sidebar-foot small { font-size: 11px; display: block; margin-top: 8px; }
.side-progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11.5px; }
.side-progress-label strong { color: var(--purple-dark); font-weight: 760; }
.meter { width: 100%; height: 6px; border-radius: 10px; background: #eeecf7; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--bar-color, #805ef2); border-radius: inherit; }
.workspace { margin-left: var(--side-width); }
.topbar {
  min-height: 69px; padding: 11px 36px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
  background: #fff; border-bottom: 1px solid var(--line);
}
.top-left { display: flex; align-items: center; gap: 10px; }
.topbar strong { font-size: 14px; color: #3b4055; white-space: nowrap; }
.search {
  height: 39px; display: flex; align-items: center; gap: 9px; width: min(100%, 360px);
  padding: 0 5px 0 12px; background: #f7f7fb; border: 1px solid #e9e8f2; border-radius: 10px;
}
.search:focus-within { border-color: #815ffd; box-shadow: 0 0 0 3px #eee9ff; }
.search input { width: 100%; min-width: 0; border: 0; background: transparent; outline: 0; color: #24273b; font-size: 13px; padding: 4px 0; }
.search input:focus-visible { outline: 0; }
.search input::placeholder { color: #677087; }
.search-icon { width: 11px; height: 11px; border: 1.7px solid #777191; border-radius: 50%; position: relative; flex: none; margin: 0 4px 2px 0; }
.search-icon::after { content: ""; width: 5px; height: 1.7px; background: #777191; position: absolute; top: 8px; left: 7px; transform: rotate(45deg); }
.search-submit { color: #6042bf; background: #eee9fb; border: 0; border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap; }
.search-submit:hover { background: #e5dcfa; }
.menu-button, .overlay { display: none; }
.content { width: min(100%, 1280px); margin: 0 auto; padding: 31px 36px 55px; outline: none; }
.hero {
  min-height: 274px; position: relative; display: flex; align-items: center; overflow: hidden; isolation: isolate; padding: 31px 36px;
  border: 1px solid #e1d9fc; border-radius: 24px;
  background: radial-gradient(ellipse at 83% 87%, #c4f2e5 0%, transparent 44%), linear-gradient(116deg, #f1ebff 1%, #e6e1ff 68%, #e6efff 100%);
}
.hero-copy { position: relative; z-index: 1; max-width: 62%; }
.hero-copy .eyeline {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 20px;
  background: #ffffffb8; padding: 5px 10px; font-size: 11px; font-weight: 750; color: #5d3bd0; letter-spacing: .07em;
}
.hero .eyeline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8b6cf5; }
.hero h1 { margin: 14px 0 9px; font-size: clamp(31px, 4vw, 53px); color: #242039; line-height: 1.12; font-weight: 800; letter-spacing: -.07em; }
.hero h1 span { display: block; color: #643ce2; }
.hero p { margin: 0 0 19px; color: #514b68; font-size: 13.5px; line-height: 1.75; }
.hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.button {
  min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
  border: 1px solid transparent; border-radius: 9px; font-size: 13px; font-weight: 720; line-height: 1.25;
}
.button-primary { background: var(--purple); color: #fff; box-shadow: 0 5px 12px #643fee2c; }
.button-primary:hover { background: var(--purple-dark); }
.button-light { background: #fff; color: #4e3b99; border-color: #e0d6f8; }
.button-light:hover { background: #f6f1ff; }
.button-subtle { background: #f4f1ff; color: var(--purple-dark); }
.button-subtle:hover { background: #eae3ff; }
.button-ok { background: #e5f8ef; color: #087054; border-color: #ceeadf; }
.button[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.button-arrow { font-size: 17px; line-height: 1; }
.hero-art { position: absolute; inset: 0 0 0 55%; pointer-events: none; overflow: hidden; }
.art-grid { position: absolute; inset: 0; opacity: .5; background: radial-gradient(circle, #8f83b8 1px, transparent 1.2px) 0 0 / 16px 16px; mask-image: radial-gradient(ellipse, #000 16%, transparent 72%); }
.art-orbit { position: absolute; width: 235px; height: 235px; border: 1px solid #fff8; border-radius: 50%; top: 24px; right: 45px; box-shadow: 0 0 0 20px #ffffff39, 0 0 0 42px #ffffff29; }
.art-sun { position: absolute; width: 86px; height: 86px; border-radius: 50%; top: 33px; right: 48px; background: #ffdf81; }
.art-spark { position: absolute; top: 39px; right: 188px; color: #9569f6; font-size: 35px; font-weight: 700; }
.study-stack { position: absolute; top: 54px; right: clamp(65px, 9vw, 139px); width: 171px; height: 192px; }
.stack-layer { position: absolute; width: 148px; height: 140px; border-radius: 17px; top: 21px; left: 15px; border: 1px solid #fff8; }
.stack-layer:first-child { background: #a88cfc; transform: translate(32px, 0) rotate(18deg); }
.stack-layer:nth-child(2) { background: #7dddc0; transform: translate(14px, 8px) rotate(4deg); }
.stack-card {
  position: absolute; width: 148px; height: 141px; top: 12px; left: 4px; padding: 18px 16px; border-radius: 15px;
  transform: rotate(-11deg); background: #fbfaff; border: 1px solid #ffffff; box-shadow: 0 11px 26px #493ea327;
}
.stack-card small { display: block; color: #6b6383; font-size: 11px; font-weight: 650; }
.stack-card strong { color: #5f3bd4; display: block; font-size: 35px; line-height: 1.22; margin: 4px 0 10px; letter-spacing: -.06em; }
.stack-card .meter { height: 5px; }
.stack-check { position: absolute; right: -41px; bottom: 24px; color: #207554; background: #dcf8e9; border: 2px solid #fff; box-shadow: 0 6px 16px #21766e20; border-radius: 50%; width: 50px; height: 50px; display: grid; place-items: center; font-size: 25px; transform: rotate(8deg); }
.section { margin-top: 28px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.section-title h2, .section-title h3 { margin: 0; font-size: 18px; color: #292b40; letter-spacing: -.025em; line-height: 1.4; }
.section-title a { font-size: 12px; font-weight: 700; color: #5f3fd0; }
.section-title a:hover { text-decoration: underline; }
.bank-group + .bank-group { margin-top: 16px; }
.bank-group > h3 { margin: 0 0 8px; color: #57586e; font-size: 13px; font-weight: 720; }
.bank-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.agent { --bank-ink: #6242ce; --bank-pale: #eee7ff; --bank-wash: #f9f6ff; --bar-color: #8e6aff; }
.ai { --bank-ink: #976020; --bank-pale: #fff0d1; --bank-wash: #fffbef; --bar-color: #eab357; }
.go { --bank-ink: #096b7e; --bank-pale: #dff5f8; --bank-wash: #f2fbfc; --bar-color: #39abc0; }
.claude { --bank-ink: #9e4128; --bank-pale: #ffe8dc; --bank-wash: #fff5ee; --bar-color: #ee936f; }
.network { --bank-ink: #2159a0; --bank-pale: #e3efff; --bank-wash: #f0f7ff; --bar-color: #75a5f4; }
.design { --bank-ink: #3955a2; --bank-pale: #e9edff; --bank-wash: #f5f6ff; --bar-color: #879bf7; }
.scenario { --bank-ink: #5f49a4; --bank-pale: #f0e9fc; --bank-wash: #faf7ff; --bar-color: #aa8cef; }
.mysql { --bank-ink: #146a83; --bank-pale: #ddf2f7; --bank-wash: #f1fbfc; --bar-color: #57b9cf; }
.redis { --bank-ink: #a63d51; --bank-pale: #ffe5ea; --bank-wash: #fff3f6; --bar-color: #e48596; }
.mq { --bank-ink: #1c7656; --bank-pale: #dcf5e9; --bank-wash: #f2fcf6; --bar-color: #69bfa1; }
.rabbit { --bank-ink: #96501f; --bank-pale: #ffebd5; --bank-wash: #fff8ef; --bar-color: #e6a16c; }
.bank-card, .surface { background: #fff; border: 1px solid var(--line); border-radius: 15px; }
.bank-card { min-width: 0; display: block; padding: 15px 16px 14px; transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
.bank-card:hover { transform: translateY(-3px); border-color: var(--bank-ink); box-shadow: 0 7px 20px #3030430b; }
.bank-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.bank-icon { display: grid; place-items: center; height: 36px; width: 39px; border-radius: 10px; color: var(--bank-ink); background: var(--bank-pale); font-size: 17px; font-weight: 800; }
.bank-icon.text-icon { font-size: 13px; letter-spacing: -.04em; }
.bank-total { white-space: nowrap; color: var(--bank-ink); background: var(--bank-wash); border-radius: 20px; font-size: 11px; font-weight: 750; padding: 4px 8px; }
.bank-card h4 { margin: 10px 0 3px; font-size: 16px; line-height: 1.45; letter-spacing: -.025em; }
.bank-card p { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.6; min-height: 19px; }
.bank-card .bank-bottom { display: flex; justify-content: space-between; align-items: center; color: #5f667c; font-size: 11px; margin-top: 8px; }
.bank-bottom b { color: var(--bank-ink); font-size: 14px; line-height: .9; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.surface { padding: 16px 19px; }
.step-row, .recent-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; min-width: 0; border-bottom: 1px solid #f1f0f7; }
.step-row:last-child, .recent-row:last-child { border-bottom: 0; }
.step-row:hover, .recent-row:hover { color: var(--purple-dark); }
.step-number { width: 29px; height: 29px; display: grid; place-items: center; background: #eee7ff; color: #5734c8; flex: none; border-radius: 8px; font-size: 12px; font-weight: 800; }
.step-row:nth-child(2n) .step-number { color: #0d7259; background: #def8ee; }
.step-row:nth-child(3n) .step-number { color: #945018; background: #ffedd5; }
.step-row .step-name, .recent-row span:not(.bank-dot) { min-width: 0; flex: 1; font-size: 13px; line-height: 1.45; font-weight: 640; }
.step-row small, .recent-row small { flex: none; color: var(--muted); font-size: 11px; }
.empty-mini { padding: 14px 0 15px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.page-title { margin: 1px 0 5px; font-size: clamp(24px, 4vw, 35px); letter-spacing: -.055em; color: #26243a; line-height: 1.25; }
.page-description { margin: 0; color: var(--muted); line-height: 1.78; font-size: 13px; }
.page-intro { margin-bottom: 20px; }
.page-intro .eyeline { color: var(--purple-dark); font-weight: 740; font-size: 11px; margin-bottom: 7px; }
.library-controls { background: #fff; border: 1px solid var(--line); padding: 13px 14px; border-radius: 13px; margin-bottom: 12px; display: grid; gap: 10px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pill {
  appearance: none; border: 1px solid #e9e8f2; border-radius: 7px; background: #fff; color: #5d6478; min-height: 32px;
  display: inline-flex; align-items: center; padding: 4px 10px; font-size: 12px; font-weight: 670; line-height: 1.2;
}
.pill:hover { color: var(--purple); border-color: #cbbcf6; }
.pill[aria-pressed="true"], .pill[aria-current="page"] { background: var(--purple-pale); border-color: #ded4fc; color: #5735c2; }
.filter-label { color: var(--muted); font-size: 11px; font-weight: 720; padding-right: 4px; }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 15px 0 9px; font-size: 12px; color: #565e73; }
.results-head strong { color: #34384d; }
.question-list { border: 1px solid var(--line); background: #fff; border-radius: 15px; overflow: hidden; }
.question-item { display: flex; min-width: 0; align-items: stretch; border-bottom: 1px solid #efeff6; }
.question-item:last-child { border-bottom: 0; }
.question-item:hover { background: #faf9ff; }
.question-entry { flex: 1; min-width: 0; display: grid; grid-template-columns: 50px minmax(0, 1fr); align-items: start; padding: 13px 10px 12px 14px; gap: 11px; }
.number-tag { display: inline-flex; min-height: 23px; align-items: center; justify-content: center; padding: 3px 5px; border-radius: 6px; font-size: 10.5px; font-weight: 760; background: #f0edf8; color: #5d5176; font-variant-numeric: tabular-nums; }
.question-line { display: block; font-size: 14px; font-weight: 700; line-height: 1.6; overflow-wrap: anywhere; }
.question-entry:hover .question-line { color: var(--purple-dark); }
.metadata { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.tag { display: inline-flex; align-items: center; padding: 3px 6px; font-size: 10.5px; font-weight: 650; border-radius: 5px; line-height: 1.2; color: var(--bank-ink); background: var(--bank-pale); }
.priority-tag { color: #8b4d0a; background: #fff1cf; }
.job-tag { color: #075b4f; background: #d6f5e9; }
.job-target { margin: 12px 0; padding: 14px 17px; background: #f0faf5; border-left: 3px solid #36a983; border-radius: 8px; }
.job-target strong, .job-focus h3 { color: #135948; font-size: 14px; }
.job-target p, .job-intro, .job-row p, .job-sources { margin: 5px 0; font-size: 14px; line-height: 1.75; color: #413f50; }
.job-target div { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 7px; }
.job-target a, .job-focus summary, .job-row a { color: #075b4f; }
.job-target details { margin: 7px 0; }
.job-target summary { cursor: pointer; color: #075b4f; font-size: 13px; font-weight: 670; }
.job-target a, .job-sources a { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.job-focus { margin-bottom: 22px; }
.job-focus .section-title { flex-wrap: wrap; margin: 0 0 8px; }
.job-focus .section-title h2 { margin: 0; }
.job-focus h3 { margin: 16px 0 4px; }
.job-list { list-style: none; margin: 0; padding: 0; }
.job-row { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 11px; padding: 10px 0; }
.job-row + .job-row, .job-focus details { border-top: 1px solid #e2ece7; }
.job-rank { display: grid; place-items: center; align-self: start; height: 28px; border-radius: 9px; background: #def5eb; color: #115a48; font-size: 13px; font-weight: 740; }
.job-row a { font-size: 15px; font-weight: 720; }
.job-row a:hover, .job-focus summary:hover { text-decoration: underline; }
.job-row small { font-size: 12px; color: #59635e; }
.job-focus summary { padding: 13px 0; cursor: pointer; font-size: 14px; font-weight: 680; }
.additions summary small { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 500; color: #51655f; }
.additions ul { list-style: none; margin: 0; padding: 0 0 8px; }
.additions li { padding: 9px 0; }
.additions li + li { border-top: 1px solid #e2ece7; }
.additions li a { color: #075b4f; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.additions li small { margin-right: 4px; font-variant-numeric: tabular-nums; }
.additions li p { margin: 5px 0 0; line-height: 1.7; font-size: 14px; color: #413f50; }
.job-sources { padding-left: 20px; }
.job-sources li { margin: 7px 0; }
.done-tag { color: #106c54; background: #e4f7f0; }
.supplement-tag { color: #5e4c88; background: #f1eafa; }
.icon-button {
  flex: none; border: 1px solid #ece9f5; background: #fff; color: #5d6173; border-radius: 8px;
  width: 36px; height: 36px; display: inline-grid; place-items: center; font-size: 18px;
}
.icon-button:hover { border-color: #cbbcf6; color: var(--purple-dark); }
.menu-button { display: none; }
.question-item > .icon-button { margin: 12px 12px 0 0; width: 32px; height: 32px; }
.icon-button[aria-pressed="true"] { background: #fff5d9; border-color: #f7e6ad; color: #8a5400; }
.pagination { margin-top: 15px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; align-items: center; }
.pagination .pill { min-width: 31px; justify-content: center; }
.pagination .pill[disabled] { opacity: .42; cursor: default; }
.pagination i { font-style: normal; color: var(--muted); padding: 0 3px; }
.empty { padding: 34px 18px; text-align: center; background: #fff; border-radius: 16px; border: 1px dashed #d9cef9; color: var(--muted); }
.empty h2 { font-size: 17px; color: #34324b; margin: 0 0 6px; }
.empty p { margin: 0 0 13px; font-size: 13px; }
.question-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(204px, 1fr); gap: 17px; align-items: start; }
.question-crumb { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); margin: 0 0 16px; font-size: 12px; }
.question-crumb a { color: var(--purple-dark); font-weight: 700; }
.question-main, .queue-card { border: 1px solid var(--line); background: #fff; border-radius: 16px; }
.question-main { padding: 22px 25px 23px; }
.question-main h1 { margin: 10px 0 15px; font-size: clamp(21px, 2.3vw, 32px); line-height: 1.43; letter-spacing: -.035em; overflow-wrap: anywhere; }
.question-main .metadata { margin: 0; }
.question-toolbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 17px; }
.question-toolbar .button-light { color: #594b7e; box-shadow: none; }
.answer-box, .stem { margin-top: 17px; border-radius: 12px; }
.answer-box { background: #f8f5ff; border: 1px solid #ede5ff; padding: 15px 17px; }
.stem { background: #f1fbfb; border: 1px solid #daf1f2; padding: 13px 14px; }
.stem strong, .answer-box h2, .answer-box h3 { display: block; margin: 0 0 5px; color: #4a328d; font-size: 13px; }
.stem strong { color: #076b78; }
.answer-box p, .stem p, .check-card p { margin: 0; color: #37354b; font-size: 14px; line-height: 1.89; overflow-wrap: anywhere; }
.answer-section + .answer-section { margin-top: 16px; }

  <script id="study-data" type="application/json">{"questions":[{"key":"agent-13557","number":13557,"bank":"agent","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284768782921729","title":"什么是 AI Agent？它和直接调用大模型 API 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"Agent 把目标、执行状态、模型和外部工具组织成可循环的系统。单次模型请求主要生成输出，Agent 会让宿主执行动作、读回结果并选择下一步。"},{"kind":"扩展知识","text":"假设用户问“订单 42 发到哪儿了”。直接问模型，它能根据你已经提供的信息作答。Agent 可以先查订单，发现只有运单号，再查物流接口，最后用实际回执回答。把“下一步怎么做”和“什么时候停”交给宿主协调，才形成完整任务。"},{"kind":"实战细节","text":"以订单查询为例，模型选工具，宿主验证权限，结果回到下一轮，达到目标后结束。"}],"expanded":false},{"key":"agent-13556","number":13556,"bank":"agent","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284768199913474","title":"AI Agent 的核心组件有哪些？感知、决策、执行、记忆各自的作用是什么？","source":"preview","sections":[{"kind":"回答重点","text":"四个环节是感知、决策、执行、记忆。感知整理文本、图片或事件，决策选择下一步，执行层调用工具，记忆层保存可供后续读取的状态。"},{"kind":"扩展知识","text":"以故障工单为例。感知层提取服务名和报错时间；决策层决定先找运行日志；执行层按权限调用查询；记忆层记录已查时间段和错误原因。任务中断后，恢复程序用这些结构化记录找到下一步，避免重复从头查询。"},{"kind":"实战细节","text":"任务 ID、已完成步骤和工具回执可以结构化持久化，恢复时按需取回。"}],"expanded":false},{"key":"agent-13567","number":13567,"bank":"agent","position":3,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284775367979010","title":"什么是 AI Agent 中的工具调用（Tool Calling）？它的基本流程是怎样的？","source":"visible","sections":[{"kind":"回答重点","text":"宿主把工具名、用途和参数 Schema 给模型。模型返回结构化调用计划，宿主校验权限与参数、执行工具，再用调用 ID 把结果送回模型。"},{"kind":"扩展知识","text":"以“查一下订单 42 的物流”为例。\n\n1. 宿主把查订单工具的名字、用途和输入要求发给模型。要求 order_id 是字符串，缺少时应该先询问。\n2. 模型生成一次工具请求及调用 ID。宿主用真实的用户身份校验参数和订单访问权限，通过后才请求业务接口。\n3. 宿主把运单号、无权限或超时等结果按调用 ID 交回模型。模型有了运单号才决定查物流，拿到状态后据此答复。"},{"kind":"面试官追问","text":"写入工具要把业务幂等键和审批放在执行侧。同一请求反复被模型提出时，宿主仍需保证至多一次业务效果。"},{"kind":"一轮工具调用要保存什么","text":"假设订单查询和地址查询的结果几乎同时返回。宿主靠每次调用的 ID 对上请求和回执，不能按完成先后猜测。如果第二个工具的输入必须取自第一个结果，就要等到第一步返回再发起调用。工具描述应写清适用范围、字段单位与必填项。参数缺失时返回可修正的错误，越权时则停止执行。\n\n可用两条记录检查一次调用。第一条记录模型提出了什么，第二条记录宿主是否实际执行、返回了什么。只出现第一条时，还不能向用户声称任务已经成功。"}],"expanded":true},{"key":"agent-13565","number":13565,"bank":"agent","position":4,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284774025801729","title":"什么是 Agent 的上下文窗口？为什么它是 Agent 工程中最核心的约束？","source":"visible","sections":[{"kind":"回答重点","text":"上下文窗口就是单次请求可处理的 Token 容量。系统指令、历史、工具定义和结果共用空间，应用还要给输出预留配额。"},{"kind":"扩展知识","text":"窗口假设只有 8k token，系统提示与工具定义用去 2k，原样放入 5k 日志后只剩约 1k 给任务与回复。可让工具返回失败摘要和原文件位置，需要上下文时再按范围读取。"},{"kind":"面试官追问","text":"上下文窗口、单轮输出上限和总费用预算要分开看。大窗口也需要给模型保留与任务直接相关的输入。"},{"kind":"算一次可用窗口","text":"假设当前模型的窗口上限是 32,000 token，系统和工具定义占 5,000，任务与最近往来占 7,000，还要给回答留 4,000。这时历史证据最多还能占 16,000。接到 20,000 token 的日志，宿主可先按错误码归类，附上原文位置，让下一轮点读。实际预算以所选模型和 API 的计量为准。\n\n压缩后检查三样东西能否找回：用户的硬约束、已执行的动作、支撑结论的证据。每轮同时记输入用量和剩余预算，就能定位是工具清单、会话历史还是某一次回包导致增长。"}],"expanded":true},{"key":"agent-13558","number":13558,"bank":"agent","position":5,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284769391095809","title":"AI Agent 如何处理工具调用返回超大结果的问题？有哪些实用的解决方案？","source":"visible","sections":[{"kind":"回答重点","text":"工具一次查到的资料，和模型回答当前问题所需的证据，往往差很多。假设用户问“昨天哪种错误最多”，原始日志有十万行。把前一百行发给模型虽然省了空间，却可能让它算出错误的第一名。先分清任务要**精确统计、查找某条证据，还是概括一批内容**，三种需求对应三种处理方式。\n\n1. **调用前缩小范围。** 把时间段、需要的字段、排序方式和页大小写进工具参数。工具端也要设上限。若用户要统计次数，直接调用分组统计，数据库就能把十万行变成几行准确的计数。\n2. **接收时给单次结果设预算。** 单独限制字节数或 token 数，给下一轮推理和最终回答预留空间。列表按完整记录裁剪，日志保留首次异常和必要的前后文。返回已读范围和下一页游标，使模型知道还有什么没有看。\n3. **需要概括时先压缩，再保留回查路径。** 可以先提取错误码、时间和文件位置，再概括重复现象。原始证据保留在有权限控制的存储中，返回有期限的引用。模型遇到互相矛盾的片段时还可以调工具取原文。"},{"kind":"扩展知识","text":"**分页什么时候有用？** 用户要找一条失败记录，可以让工具按稳定的顺序给一小页。匹配到了就停，下一页用服务端返回的游标。若数据还在写入，要约定查询时间边界或快照，否则翻页途中有可能重复或遗漏记录。\n\n**什么时候可以提前停？** 用户要最近一次失败，按时间倒序读到第一条符合条件的记录即可退出。用户要统计全天失败总数，则需要在完整时间范围内做聚合，不能读到第一条就停。对大文件也可以在工具里逐块处理，每块更新计数，最后只返回合计。"},{"kind":"一个算得清楚的例子","text":"某小时共 1,000 次请求。前 100 次有 20 次超时，后 900 次只有 9 次超时。只看第一页会得到 20%，全量超时率其实是 **29 ÷ 1,000 = 2.9%**。合并分页结果时应累加分子和分母，再求比例。把两页的百分比直接取平均也会算错。\n\n如果用户接着问“这些超时为什么发生”，此时再从超时样本里选取有代表性的链路，把请求标识、耗时和异常位置发给模型。统计结果负责回答“多少”，样本负责解释“可能为什么”。"},{"kind":"面试官追问","text":"**怎样避免无限翻页？** 宿主记录上一次游标、累计页数和剩余预算。重复游标、已找到证据或预算耗尽都触发退出。若只检查了部分记录，回答里交代范围，别直接断言“没有异常”。\n\n**摘要是否要用主模型？** 规则能完成的字段提取或聚合交给程序。有大量自由文本时，可让小模型概括，再从原文抽查关键事实。涉及金额、全局极值或错误码时保留原值和出处，多轮摘要丢掉的细节靠原始引用找回。"},{"kind":"参考资料","text":"[Anthropic 工具设计指南](https://www.anthropic.com/engineering/writing-tools-for-agents)"}],"quote":"事前控制、事中截断、事后摘要","expanded":true},{"key":"agent-13548","number":13548,"bank":"agent","position":6,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284763179331586","title":"什么是 Agent Loop（智能体循环）？一个典型的 Agent Loop 包含哪些步骤？","source":"preview","sections":[{"kind":"回答重点","text":"循环可以拆为组装状态、调用模型、判断回答或工具请求、校验并执行、记录观察、下一轮或退出。宿主管理终止条件与任务状态。"},{"kind":"扩展知识","text":"假设 pi-audit-harness 接到“核对这个结论是否有代码证据”的任务。\n\n1. 宿主载入任务、现有证据和剩余预算，模型给出要看的文件与范围。\n2. 工具层校验读取范围，执行后记录文件位置和回执，将结果送回下一轮。\n3. 模型提出继续查证或结束，宿主检查退出条件。成功、无进展、超时或用户取消都应有可恢复的结果和原因。"},{"kind":"面试官追问","text":"一次 run 结束前有多轮工具往返。每轮要有取消、超时和可恢复状态，不能只看最终一段自然语言。"},{"kind":"区分“模型想做”和“任务已完成”","text":"以修改配置并运行测试为例。第一轮模型提出读配置，宿主执行并写下回执。第二轮模型据此提出改动，第三轮才有测试输出。若工具返回“无权写入”，这个回执应进入下一轮，任务状态也应保留失败原因。只看到模型说“改好了”不能证明文件已修改。\n\n恢复任务时读取最后一条已提交的动作及其回执。已经对外执行而回执未知的动作先查状态，有证据后再决定是否重试。"}],"quote":"思考 → 行动 → 观察","expanded":true},{"key":"agent-13552","number":13552,"bank":"agent","position":7,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284765498781698","title":"ReAct 推理范式是什么？它如何让 Agent 更可靠地完成任务？","source":"preview","sections":[{"kind":"回答重点","text":"ReAct 把推理与行动交错起来。模型根据当前观察选择动作，工具结果改变下一轮决策，可反复检查事实并修正路线。"},{"kind":"扩展知识","text":"排查测试失败时，先根据报错选择读目标文件。工具发现传入空指针，再决定读上游调用，观察改变后续动作。可记录每步工具请求和验证结果，方便重放和审计。"},{"kind":"实战细节","text":"工程上记录可审计的工具调用、观察与公开决策摘要，不需要暴露模型私有推理。"}],"expanded":false},{"key":"agent-13546","number":13546,"bank":"agent","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284762055258114","title":"什么是 Reflexion？它和 ReAct 有什么区别？如何提升 Agent 的自我纠错能力？","source":"preview","sections":[{"kind":"回答重点","text":"Reflexion 用结果反馈生成可保存的经验，后续尝试读取该经验。ReAct 主要在单次轨迹内根据观察调整行动。"},{"kind":"扩展知识","text":"第一次检索没找到文档，ReAct 在同一次尝试里换查询词；Reflexion 还会把“该知识库用工单编号作索引”作为可验证经验，下一次同类任务直接使用。写入要限定知识库和版本，避免过时经验覆盖事实。"},{"kind":"实战细节","text":"经验要记录适用条件，隔离未经验证的总结，防止错误经验反复影响后续任务。"}],"expanded":false},{"key":"agent-13547","number":13547,"bank":"agent","position":9,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284762629877762","title":"Agent 系统中如何设计优雅的终止条件？避免死循环有哪些策略？","source":"preview","sections":[{"kind":"回答重点","text":"设计三层退出。目标满足时正常结束，硬上限限制轮次、Token 和时间，无进展检测识别重复调用或状态振荡。"},{"kind":"扩展知识","text":"给总时限 30 秒和最多 6 步。连续两次调用同一查找工具、参数与返回均未变化，就判无进展。正常停止前看目标是否达成，预算停止时保存最后证据、未完成步骤和停止原因。"},{"kind":"面试官追问","text":"重试要区别瞬时错误和参数错误。对写动作先查操作状态或用相同幂等键，避免把重试看成一条新指令。"},{"kind":"怎么识别“忙了很多轮却没进展”","text":"设目标为定位一个失败测试。连续三轮读同一文件、用同样的筛选条件并得到相同结果，期间也没有增加证据，就可要求换一种查证方式。宿主另设硬上限，如最大轮数和截止时间，覆盖模型一直认为还要继续的情况。\n\n退出时区分“已找到并验证原因”“证据不足”和“用户取消”。三者分别决定是否交付结论、提示缺失信息或立即撤销等待中的操作。"}],"expanded":true},{"key":"agent-13555","number":13555,"bank":"agent","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284767310721026","title":"MCP 协议是什么？它在 AI Agent 系统中解决了什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"MCP 标准化 AI 宿主与外部能力之间的连接。服务端公开工具、资源与 Prompt 等能力，客户端发现和使用，宿主控制用户交互和权限。"},{"kind":"扩展知识","text":"三个客户端分别接十个内部系统时，逐个适配会重复实现发现、参数和通信。使用 MCP 各系统按公共协议提供能力，客户端连接并按需调用。业务语义与权限仍由应用和服务端设计。"},{"kind":"实战细节","text":"模型的选择仍来自模型接口，MCP 负责宿主与服务端之间的协议交互。"}],"quote":"M×N 集成困境","expanded":false},{"key":"agent-13554","number":13554,"bank":"agent","position":11,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284766648020994","title":"MCP 协议的架构包含哪些核心组件？Server 和 Client 分别负责什么？","source":"preview","sections":[{"kind":"回答重点","text":"Host 是面向用户的应用，组织上下文、审批和多个连接。Client 建立与指定 Server 的协议会话。Server 暴露并实现能力。"},{"kind":"扩展知识","text":"Host 是带 UI 和权限策略的产品。一个 Host 可维护多个 MCP Client，各自负责与相应 Server 协商能力和会话。Server 提供具体工具、资源或模板。模型调用仍由 Host 编排，密钥和访问权限应在适当边界验证。"},{"kind":"面试官追问","text":"工单 Server 公开查单能力，数据库 Server 公开只读统计。两个连接分别认证，模型得到的工具名不能替代该认证。"},{"kind":"一次请求经过谁","text":"想象编辑器接了文件服务和工单服务。编辑器作为 Host 管理信任边界，对每个 Server 建立相应的 Client 连接。连接初始化并协商能力后，Client 可发现工具，按工具的输入约定发送调用请求，再把服务返回的内容交给 Host。\n\n用户只授权查看项目 A 时，Host 的工具选择与 Server 的资源校验应能分别生效。即使模型能看到“查工单”的工具，也不能据此认定它能查所有工单。"}],"expanded":true},{"key":"agent-13553","number":13553,"bank":"agent","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284766136315906","title":"什么是 A2A 协议？它和 MCP 协议有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"A2A 面向独立 Agent 的发现、任务委托与状态交互。MCP 面向宿主访问外部能力。远端 Agent 自己管理内部计划与工具。"},{"kind":"扩展知识","text":"当模型需要使用查询工单工具时，可以让客户端走 MCP。整个工作交给具备独立任务状态的工单 Agent 时，则可用 A2A 协商任务、状态和结果。两者解决不同接口边界，也可组成同一方案。"},{"kind":"实战细节","text":"跨团队的文档分析可走 A2A，分析 Agent 再经 MCP 查本地资料。按实际协议版本核对传输与字段。"}],"expanded":false},{"key":"agent-13545","number":13545,"bank":"agent","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284761493221377","title":"A2A 协议中的 Agent Card 是什么？它在多 Agent 发现和协作中起什么作用？","source":"preview","sections":[{"kind":"回答重点","text":"Agent Card 是描述 Agent 身份、通信地址、能力、技能和安全方案的结构化声明，用于发现和判断是否适合委派。"},{"kind":"扩展知识","text":"Agent Card 承担目录信息的角色。比如报表 Agent 公开地址、可处理任务、输入输出格式和认证要求；请求方发现它后还要信任校验并鉴权。卡片也能协助协商是否支持流式或异步任务。"},{"kind":"实战细节","text":"发现后仍需认证、授权和信任校验。支持某项技能不是调用者具有权限的证明。"}],"expanded":false},{"key":"agent-13559","number":13559,"bank":"agent","position":14,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284770259316738","title":"当对话历史超出上下文窗口时，有哪些上下文压缩策略？各自的优缺点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"滑窗简单但丢失旧细节。摘要保留主题但可能遗漏约束。按相关性检索可按需取回，状态提取则把目标和已完成步骤结构化保存。"},{"kind":"扩展知识","text":"最近窗口和折叠摘要适合短期状态，但删太早会丢初始约束。把大证据用外部引用保存，挂上可检索索引，再留结构化的任务水位和待办。"},{"kind":"面试官追问","text":"压缩一次失败日志，保留错误码、第一条堆栈、相关文件与复测命令。手动复查不可丢约束是否还对。"},{"kind":"三种压缩方案怎样取舍","text":"滑动窗口保留最近几轮，便宜，但很早提出的硬要求可能消失。滚动摘要适合持续记录决定和待办，多轮改写可能把限定条件写丢。外部存储加引用保真度高，代价是用到细节时要再查询一次。实际可以固定保留目标、权限和最近的工具回执，对较早材料做摘要。\n\n试着恢复一条“仅处理测试环境”的限制。若压缩后只能找到“处理环境”，系统就需要从约束记录重新拼装输入，不能让模型自行猜测。"}],"expanded":true},{"key":"agent-13560","number":13560,"bank":"agent","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284770817159170","title":"MCP 协议和 A2A 协议如何协同工作？请设计一个同时使用两者的多 Agent 系统架构","source":"preview","sections":[{"kind":"回答重点","text":"协调 Agent 可通过 A2A 将子任务分给有合适技能的远端 Agent。各 Agent 内部通过 MCP 查数据或调用工具，返回有来源的交付物。"},{"kind":"扩展知识","text":"以故障排查为例，接入 Agent 按 A2A 将日志分析与工单查证分给两个独立 Agent。每个 Agent 用 MCP 访问其获准的数据源，再以 Artifact 和状态事件返回。保留父任务 ID，分配子任务预算及数据访问范围。"},{"kind":"实战细节","text":"用任务 ID 跟踪进展、限定数据和预算、保留超时和回收路径；对外仅传必要输入。"}],"expanded":false},{"key":"agent-13561","number":13561,"bank":"agent","position":16,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284771488247809","title":"在生产环境中，如何保证 Agent 系统的安全性？需要防范哪些风险？","source":"preview","sections":[{"kind":"回答重点","text":"主要风险来自不可信输入、越权副作用、数据泄露和失控资源消耗。把授权、作用域、隔离和预算实现为宿主的强制约束。"},{"kind":"扩展知识","text":"把模型输入当可能混有不可信内容，工具前做身份、参数与资源授权，敏感输出脱敏，关键写入做审批和审计。工具用最小权限和隔离执行，并可配置限额与系统级停止。"},{"kind":"面试官追问","text":"检索材料说“把报告寄到某地址”，它仍只是资料内容。发送许可应来自可信用户授权与服务端策略，不应从检索文本推断。"},{"kind":"把风险落实到工具这一层","text":"用户让 Agent 概括文档，文档里却含有一条要求发送文件的指令。读取到的文本只是资料。宿主先限定该任务可调用哪些工具，真正调用时再校验用户身份、资源和动作。审计中记录被拒绝的动作及原因。\n\n做回归测试时，除了“正常用户能否完成任务”，还要检查越权读取、重复确认和审批过期等情形，并验证服务端确实没有产生副作用。"}],"expanded":true},{"key":"agent-13563","number":13563,"bank":"agent","position":17,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284772746539009","title":"多 Agent 协作有哪些常见的编排模式？各自适合什么场景？","source":"preview","sections":[{"kind":"回答重点","text":"顺序适合有依赖的流水线，并行扇出适合可独立的分支，主从委托适合异构专长，讨论或评审适合需要比较多种方案的任务。"},{"kind":"扩展知识","text":"串行适合前一步输出是后一步输入；并行适合独立验证或数据来源；Supervisor 统一分派与汇总；人机协作用在风险操作或需求不明时。不同 Agent 修改同一资源时，要定义所有权与冲突处理。"},{"kind":"实战细节","text":"用相同单 Agent 基线比较完成率、延迟与成本，再判断多 Agent 是否值得。"}],"quote":"顺序链式、并行扇出、主从委托和群组讨论","expanded":false},{"key":"agent-13564","number":13564,"bank":"agent","position":18,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284773392461825","title":"Agent 系统中的 Function Calling 和 MCP 有什么区别？各自的优缺点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Function Calling 描述模型 API 如何生成结构化调用请求。MCP 统一宿主对外部服务的能力发现和调用，二者可以接在同一条链路。"},{"kind":"扩展知识","text":"Function Calling 是模型 API 给出调用意图和结构化参数的一层。MCP 是宿主与外部服务交换工具定义和结果的协议。宿主可把 MCP 工具转成模型函数描述，再路由模型的请求。"},{"kind":"面试官追问","text":"仅有几个内部函数可直接用模型工具 API。多客户端接同一外部系统时，公共 MCP 接口减少适配成本，但仍要处理权限和版本。"},{"kind":"用同一个查价工具来说明","text":"模型可以通过供应商的 Function Calling 输出查价请求，宿主收到后既可以调用本地函数，也可以通过 MCP Client 把请求送到库存 Server。前者解决模型怎样表达调用意图，后者约定宿主与工具服务如何协商能力、发现与调用工具。\n\n只有两个固定的进程内函数时，本地适配简单。多个宿主需要复用工具服务器时，标准协议能减少重复接入，但也要处理连接、版本和授权。"}],"expanded":true},{"key":"agent-13566","number":13566,"bank":"agent","position":19,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284774613004289","title":"AI Agent 的记忆机制有哪些类型？短期记忆和长期记忆分别怎么实现？","source":"preview","sections":[{"kind":"回答重点","text":"短期记忆是当前任务上下文和状态，常保留近期消息、进度和引用。长期记忆存到外部，通过业务键、全文或语义检索取回。"},{"kind":"扩展知识","text":"短期状态保存当前会话的输入、摘要和运行位置。长期状态由应用识别稳定偏好、可验证事实和已复用经验，按用户、来源、时间检索。可分对话过程、业务状态和长期资料三种不同生命周期。"},{"kind":"实战细节","text":"区分会话记录、经确认偏好和可更新业务数据，控制过期、删除与租户隔离。"}],"expanded":false},{"key":"agent-13551","number":13551,"bank":"agent","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284764907384833","title":"如何让 AI Agent 具备长期记忆能力？有哪些存储和检索方案？","source":"preview","sections":[{"kind":"回答重点","text":"长期记忆要定义写入策略、存储和召回。向量库找语义相似内容，结构化存储管理事实与偏好，全文检索擅长精确标识。"},{"kind":"扩展知识","text":"偏好能用结构化键值，长文档可用全文或向量搜索，跨服务经历可记录到事件/关系模型。先验证写入权限和数据资格，再按租户、查询和时间过滤，最后返回少量相关证据。给用户修改、过期与删除的渠道。"},{"kind":"实战细节","text":"写入时去重和版本化，读取时按时效、权限和相关度过滤，并保留来源。"}],"expanded":false},{"key":"agent-13568","number":13568,"bank":"agent","position":21,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284775955181570","title":"如何设计 AI Agent 的工具权限控制？不同场景下的工具应该有什么样的权限差异？","source":"preview","sections":[{"kind":"回答重点","text":"按调用者、操作类型和目标资源约束权限。将读取、低风险可逆写入和高影响操作分别授权，限制目录、账户、网络与参数。"},{"kind":"扩展知识","text":"按工具给能力分级，还要校验谁对哪个对象能做什么。查询可按租户范围自动执行，改动可限定路径和写幂等记录，付款或对外发送可需独立确认。"},{"kind":"面试官追问","text":"审计记录 tool ID、权限规则、参数摘要、结果码和真实身份。模型自己附上的角色字段不等于可信权限。"},{"kind":"审批应该授权到什么范围","text":"假设用户同意“给测试项目创建一条工单”。审批记录绑定用户、项目、动作和参数。若执行时目标换成生产项目，宿主必须重新判断。读取型工具也要校验资源归属，写操作还需考虑重复执行和撤销成本。\n\n把允许、拒绝、过期、参数变化四种请求分别发给权限层验证。成功标准是最终业务资源发生了预期变化，而非模型给出了看似合理的说明。"}],"expanded":true},{"key":"agent-13569","number":13569,"bank":"agent","position":22,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284776634658817","title":"子 Agent（Subagent）模式有什么优势和挑战？父 Agent 调用子 Agent 时需要考虑哪些边界问题？","source":"preview","sections":[{"kind":"回答重点","text":"父 Agent 拆任务、分预算并汇总，子 Agent 在较小上下文中处理专门工作。可获得并行与隔离收益，也会增加协调成本。"},{"kind":"扩展知识","text":"父 Agent 把目标、证据范围、预算和交付物给子 Agent；子 Agent 在独立上下文查证，回传结论及定位。避免共享使用未经授权的数据，也避免同时编辑同一工作区导致覆盖。"},{"kind":"实战细节","text":"派发带明确输入输出、资源作用域、截止时间和失败语义。父 Agent 检验交付结果。"}],"expanded":false},{"key":"agent-13562","number":13562,"bank":"agent","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284772146753537","title":"如果让你从零设计一个 Agent 框架，你会优先实现哪些核心模块？为什么？","source":"preview","sections":[{"kind":"回答重点","text":"先实现可终止的循环和模型适配，再实现工具注册与校验，然后加入可持久化状态、预算权限与追踪评测。"},{"kind":"扩展知识","text":"最小版本先完成一条闭环：模型适配器、消息和工具 Schema、模型与工具循环、预算和取消、权限，以及受测试的状态保存。第二阶段再加入任务恢复、可观测性和更复杂编排。先用一项易验证的任务测试各失败路径。"},{"kind":"实战细节","text":"先让一个只读工具从输入到回执完整跑通，再覆盖超时、取消、重复执行与恢复。"}],"expanded":false},{"key":"agent-13549","number":13549,"bank":"agent","position":24,"priority":true,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284763770728450","title":"如何设计一个生产级的 Agent 系统架构？需要考虑哪些关键模块？","source":"preview","sections":[{"kind":"回答重点","text":"生产架构包含入口、执行引擎、模型/工具接入、状态存储、调度 e},{"key":"agent-11654","number":11654,"bank":"agent","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425040719626241","title":"市面上有哪些主流的 LLM Agent 框架？各自的特点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"LangChain 侧重模型与工具组件集成，LangGraph 侧重显式状态和图编排，LlamaIndex 侧重数据索引与检索。AutoGen 等偏多 Agent 协作。"},{"kind":"扩展知识","text":"从工作流、状态、工具协议、部署、观测、语言栈和长期维护比较框架。以相同的工具调用及恢复测试看各框架实现成本。"},{"kind":"面试官追问","text":"需要显式图状态可评估 LangGraph，跨框架和多 Agent 协议要先确认版本兼容。不要把接口名称当成选型唯一依据。"}],"expanded":false},{"key":"agent-11661","number":11661,"bank":"agent","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425042661588994","title":"AutoGPT 如何实现自主决策？","source":"preview","sections":[{"kind":"回答重点","text":"早期 AutoGPT 用模型反复根据目标生成下一步，执行工具后读取反馈，再评估任务与保存记忆，从而逐步调整行动。"},{"kind":"扩展知识","text":"AutoGPT 一类系统把目标、当前状态和工具结果交给模型，生成子任务并反复执行。自主性意味着会根据观察选新动作，开发者仍需明确预算、失败策略和权限。"},{"kind":"面试官追问","text":"连续搜索只返回相同链接时，应检测无进展并退出或人工接管。"}],"expanded":false},{"key":"agent-11662","number":11662,"bank":"agent","position":42,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425042913247233","title":"什么是 A2A 协议，它的核心架构及主要组件有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"A2A 连接客户 Agent 与远端 Agent。Agent Card 描述能力和端点，Message 传交互内容，长期任务通过 Task、状态和 Artifact 表达进展与交付。"},{"kind":"扩展知识","text":"A2A 支持独立 Agent 发现与传达任务。Client Agent 发起交互，Remote Agent 用 Card 描述能力，对话记录与 Task 可追踪进度，生成物用 Artifact 表达。"},{"kind":"面试官追问","text":"分配票据分析任务后，可以订阅进度，最终按 Artifact 获取报告。"}],"expanded":false},{"key":"agent-11663","number":11663,"bank":"agent","position":43,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425043148128258","title":"A2A 协议有哪五大设计原则？","source":"preview","sections":[{"kind":"回答重点","text":"从自主协作、复用成熟传输与数据标准、安全授权、支持持续时间不同的任务、允许多模态交付五个角度理解设计。"},{"kind":"扩展知识","text":"可从独立 Agent 协同、采用通用标准、企业安全、支持短长任务以及适应多模态讲设计原则。接口只传明确的消息、状态与结果，方便异构实现互通。"},{"kind":"面试官追问","text":"图像分析 Agent 无需交出内部模型，只公开支持的输入输出和授权要求。"}],"expanded":false},{"key":"agent-11664","number":11664,"bank":"agent","position":44,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425043395592193","title":"A2A 协议的工作原理是怎样的？","source":"preview","sections":[{"kind":"回答重点","text":"客户 Agent 根据能力说明发消息委托，远端 Agent 接收后创建或推进任务，必要时请求补充输入或回报状态。"},{"kind":"扩展知识","text":"先读取 Agent Card 判断能力和认证，然后发送消息或任务请求。根据服务端支持同步返回、流事件或异步更新，在 Task 中追踪生命周期和结果。"},{"kind":"面试官追问","text":"任务需要补充文件时可进入需要输入状态，调用方填资料后继续同一任务。"}],"expanded":false},{"key":"agent-11665","number":11665,"bank":"agent","position":45,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916425043643056130","title":"A2A 协议的工作流程是怎样的？","source":"preview","sections":[{"kind":"回答重点","text":"流程概括为发现能力、提交请求、跟踪处理、按需交互、接收交付。根据远端支持选择同步、流式或轮询。"},{"kind":"扩展知识","text":"面试可画五步：发现、通过身份验证、发送任务、追踪状态、接收结果。不同操作带上下文或任务标识，用于并发关联。"},{"kind":"面试官追问","text":"报告任务耗时较长，前端收到阶段更新后仍可读历史状态，最终用 Artifact ID 找文件。"}],"expanded":false},{"key":"agent-11667","number":11667,"bank":"agent","position":46,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1916432330246103042","title":"A2A 协议 与 MCP 协议的关系是怎样的？","source":"preview","sections":[{"kind":"回答重点","text":"A2A 解决自治 Agent 互相发现和委托，MCP 解决 Agent 宿主使用外部工具、提示和数据。远端可在履约过程中调用自己的 MCP 工具。"},{"kind":"扩展知识","text":"A2A 把一项自治任务交给另一个 Agent。MCP 把具体工具、文档或模板接到 Agent 的运行时。把两者组合时分别认证与授权，父任务只拿到约定的结果。"},{"kind":"面试官追问","text":"转交“审查订单数据质量”用 A2A，执行者查数据库可调用 MCP。"}],"expanded":false},{"key":"agent-11715","number":11715,"bank":"agent","position":47,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1924281357186498562","title":"什么是 Google ADK？","source":"preview","sections":[{"kind":"回答重点","text":"Google ADK 是构建、运行和评估 Agent 的开发工具包。用代码组织代理、工具、会话与编排，处理顺序、并行或循环型工作流。"},{"kind":"扩展知识","text":"ADK 提供构建、编排、测试和运行 Agent 的开发组件。可核对它的 Agent 类型、工具连接、events/session 与部署接口，选型看现有系统语言、状态和可运维性。"},{"kind":"面试官追问","text":"做同一个客服 Agent 原型时用统一测试集验证路由、工具调用和多轮状态，比较真实集成成本。"}],"expanded":false},{"key":"agent-11777","number":11777,"bank":"agent","position":48,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1929742306206928897","title":"什么是工具调用 Tool Calling？如何利用 Spring AI 实现工具调用？","source":"preview","sections":[{"kind":"回答重点","text":"Spring AI 可将 Java 方法注册为工具，例如使用其支持的工具注解或回调接口，将工具描述提供给 ChatClient。工具调用完成后再将结果交回模型。"},{"kind":"扩展知识","text":"Spring AI 应用可用注解或 ToolCallback 等版本对应的接口注册工具，模型产生请求，框架调用 Java 实现再回传结果。业务层继续处理权限和参数校验。"},{"kind":"面试官追问","text":"把库存查询注册为只读工具，从应用上下文取租户身份。工具报错时给出可解释结果，而非把堆栈发给模型。"}],"expanded":false},{"key":"agent-11788","number":11788,"bank":"agent","position":49,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1929742309348462593","title":"什么是 OpenManus？它的实现原理是什么？","source":"preview","sections":[{"kind":"回答重点","text":"OpenManus 是开源 Agent 实现，可按目标循环选择工具并执行任务。典型模块有模型接口、代理执行循环、工具集、状态和可选隔离环境。"},{"kind":"扩展知识","text":"可把 OpenManus 看成开源 Agent 实作，用模型与工具循环推进计划、处理结果和报告进度；按所用提交版本核对实际模块。"},{"kind":"面试官追问","text":"研究项目时跟一条从输入、工具注册到结果进入下一轮的调用链，比只描述产品能力更具体。"}],"expanded":false},{"key":"agent-11859","number":11859,"bank":"agent","position":50,"priority":false,"url":"https://www.mianshiya.com/bank/2052284728362414082/question/1935997509803618306","title":"Agent 死循环问题有遇到过吗？如何解决？","source":"preview","sections":[{"kind":"回答重点","text":"死循环常表现为同一状态、工具和参数反复出现。设置最大轮次或时限，并对工具请求和任务进度做去重、计数及无进展退出。"},{"kind":"扩展知识","text":"案例可按重复表现、诊断、限制、恢复回答。记录工具名、参数哈希、结果与状态变化，识别重复无进展和状态来回切换。设步数、总时限、花费与重复上限。"},{"kind":"面试官追问","text":"遇到网页无权限，正确结果是停止并说明所需信息。让 Agent 每轮用同一方法重试只会耗费预算。"}],"expanded":false},{"key":"ai-13216","number":13216,"bank":"ai","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2031643525468151809","title":"最近 OpenClaw 这么火，你知道它的原理吗？","source":"preview","sections":[{"kind":"回答重点","text":"OpenClaw 可按多渠道网关理解。渠道适配器接收消息，网关映射身份和会话，再把任务交给模型与工具运行层，将输出送回原渠道。"},{"kind":"扩展知识","text":"从一条聊天消息理解：渠道适配器接入，Gateway 找到会话，Runner 组织模型和工具，完成后按原渠道回传。版本特有的配置以实际文档为准。"}],"expanded":false},{"key":"ai-11626","number":11626,"bank":"ai","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1915309618303901698","title":"什么是护栏技术？","source":"preview","sections":[{"kind":"回答重点","text":"护栏对输入、模型输出与工具行为做确定性检查。组合 Schema、内容策略、权限、审批、隔离和审计，风险高的动作交给宿主判定。"},{"kind":"扩展知识","text":"例如客服的输入检查发现敏感号段，工具前核对订单归属，输出前校验不能承诺未授权退款。三处护栏各处理一种风险。"}],"expanded":false},{"key":"ai-11629","number":11629,"bank":"ai","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1915335173711634433","title":"什么是 LangChain？","source":"preview","sections":[{"kind":"回答重点","text":"LangChain 提供模型、Prompt、工具、消息、文档与检索等可组合接口，适合组装 LLM 应用。需要显式状态与可恢复图时可选 LangGraph。"},{"kind":"扩展知识","text":"把文档问答拆为 loader、切分、retriever、prompt 和模型。框架负责组合，各组件可以独立替换和测试。"}],"expanded":false},{"key":"ai-11656","number":11656,"bank":"ai","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1916425041235525634","title":"LangChain 的核心组件有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"常见核心对象是模型、消息和提示模板、结构化输出、工具、文档加载与切分、向量索引／Retriever，以及将组件连接起来的执行接口。"},{"kind":"扩展知识","text":"同一检索器和 Prompt 可以搭配不同聊天模型。接口抹平通用差别，流式、工具参数等行为仍按 provider 验证。"}],"expanded":false},{"key":"ai-11327","number":11327,"bank":"ai","position":5,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1906191836891095042","title":"什么是向量数据库？在基于大模型的应用开发中，向量数据库主要解决什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"向量库保存文档或实体的向量及元数据，通过相似度找近邻。RAG 用它选证据，仍要补权限过滤、重排和生成质量验证。"},{"kind":"扩展知识","text":"同事搜“发票抬头怎么改”，文档写“修改开票单位”。嵌入模型把意思相近的句子表示得近，向量库从很多条文档里快速找候选。文档 ID、权限和版本仍通过元数据管理。"},{"kind":"面试官追问","text":"普通数据库有精确查询与事务优势，也可以扩展向量检索。选型要用真实过滤条件、召回和 p99 压测。"},{"kind":"向量库是怎样被用上的","text":"先离线把每个知识片段编码成向量，同时保存文档 ID、权限和版本。在线把用户问题用兼容的编码器转成向量，在有权限的候选中查找近邻，再按 ID 取回正文。向量坐标本身不能充当回答的引文。\n\n若错误码 E174 被召回成 E147，要检查关键词检索与精确匹配。若新文档完全找不到，还要核对索引是否更新，以及离线和在线用了哪个模型版本。"}],"expanded":true},{"key":"ai-11627","number":11627,"bank":"ai","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1915316449118035969","title":"什么是 GPTCache？","source":"preview","sections":[{"kind":"回答重点","text":"GPTCache 是面向模型请求的语义缓存思路。嵌入查询后查相似结果，合适时直接返回；缓存键须纳入模型、提示版本与权限。"},{"kind":"扩展知识","text":"先对模型请求生成语义表示，查询相近历史问答。只有仍适用、同权限且超过阈值才复用。价格、版本、模型和 Prompt 变更应参与失效。"}],"expanded":false},{"key":"ai-11607","number":11607,"bank":"ai","position":7,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1914614341832523778","title":"什么是 Advanced RAG？","source":"preview","sections":[{"kind":"回答重点","text":"Advanced RAG 在基础检索生成上加入查询重写、筛选、混合召回、重排与上下文压缩，每一段都可单独测试和改进。"},{"kind":"扩展知识","text":"基础 RAG 已能从知识库取片段。Advanced RAG 可在检索前重写模糊问题，检索后用重排减少无关片段，还可加入结构化筛选。"},{"kind":"面试官追问","text":"例如“怎样报销打车费”加上地区与差旅类别后检索，重排保留财务制度条款。分别记录召回有无、排序位置与答案引用。"},{"kind":"先找出基础 RAG 卡在哪一步","text":"用户问“新员工试用期能否跨省报销”，原文按员工类型和地区分章。可在检索前拆出“试用期”和“跨省”两个条件，召回时结合术语与语义，送入生成前再重排，并带回所在章节的适用条件。\n\n逐项打开这些改动，比较正确条款能否进入前几名、答案是否引用正确版本、延迟增加多少。若原条款尚未入库，再复杂的重排也无法补足。"}],"quote":"检索前优化、检索中优化、检索后优化","expanded":true},{"key":"ai-11628","number":11628,"bank":"ai","position":8,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/1915324657713266690","title":"什么是 GPT Structured Outputs？","source":"preview","sections":[{"kind":"回答重点","text":"Structured Outputs 让支持的模型按 JSON Schema 产生结构化结果，更适合程序消费。调用端仍应处理拒绝、截断并验证业务和证据字段。"},{"kind":"扩展知识","text":"普通 JSON 能保证格式可解析时，输出依然可能少字段。结构化输出可按 schema 约束，比如 order_id 要字符串、status 只能取固定枚举。"},{"kind":"面试官追问","text":"Schema 通过后仍要校验订单确实存在以及调用者权限；JSON 格式正确无法证明内容真实。"},{"kind":"输出满足结构后还要检查什么","text":"让模型提取订单号、金额和币种。Schema 规定金额为数值，币种属于允许集合，缺失订单号时显式给出空值。结构校验之后还要检查订单是否归当前用户、币种和订单是否一致。金额形式正确，仍可能读错原文。\n\n处理拒答、输出截断或请求失败时，走独立分支。不能把无法解析的内容偷偷替换成“金额为 0”，否则下游会把缺失当成真实值。"}],"expanded":true},{"key":"ai-11657","number":11657,"bank":"ai","position":9,"priority":false,"url":"https://www.mia 。"},{"kind":"扩展知识","text":"条件边可以跳回前置节点，直到结果齐或预算到。要有明确状态进展判断，避免两条边无条件循环。"}],"expanded":false},{"key":"ai-13544","number":13544,"bank":"ai","position":283,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284760931184641","title":"LangGraph 的 Reducer 是什么？在状态更新中起什么作用？","source":"preview","sections":[{"kind":"回答重点","text":"Reducer 规定多个更新如何合并到一个状态字段，例如追加或去重。并行分支应考虑结合性与重复执行。"},{"kind":"扩展知识","text":"两分支各返回一条 evidence，reducer 决定是连接、去重还是替换。选择与输入顺序无关的合并可减少不确定性。"}],"expanded":false},{"key":"ai-13545","number":13545,"bank":"ai","position":284,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284761493221377","title":"A2A 协议中的 Agent Card 是什么？它在多 Agent 发现和协作中起什么作用？","source":"preview","sections":[{"kind":"回答重点","text":"Agent Card 是描述 Agent 身份、通信地址、能力、技能和安全方案的结构化声明，用于发现和判断是否适合委派。"},{"kind":"扩展知识","text":"Agent Card 承担目录信息的角色。比如报表 Agent 公开地址、可处理任务、输入输出格式和认证要求；请求方发现它后还要信任校验并鉴权。卡片也能协助协商是否支持流式或异步任务。"},{"kind":"实战细节","text":"发现后仍需认证、授权和信任校验。支持某项技能不是调用者具有权限的证明。"}],"expanded":false},{"key":"ai-13546","number":13546,"bank":"ai","position":285,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284762055258114","title":"什么是 Reflexion？它和 ReAct 有什么区别？如何提升 Agent 的自我纠错能力？","source":"preview","sections":[{"kind":"回答重点","text":"Reflexion 用结果反馈生成可保存的经验，后续尝试读取该经验。ReAct 主要在单次轨迹内根据观察调整行动。"},{"kind":"扩展知识","text":"第一次检索没找到文档，ReAct 在同一次尝试里换查询词；Reflexion 还会把“该知识库用工单编号作索引”作为可验证经验，下一次同类任务直接使用。写入要限定知识库和版本，避免过时经验覆盖事实。"},{"kind":"实战细节","text":"经验要记录适用条件，隔离未经验证的总结，防止错误经验反复影响后续任务。"}],"expanded":false},{"key":"ai-13547","number":13547,"bank":"ai","position":286,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284762629877762","title":"Agent 系统中如何设计优雅的终止条件？避免死循环有哪些策略？","source":"preview","sections":[{"kind":"回答重点","text":"设计三层退出。目标满足时正常结束，硬上限限制轮次、Token 和时间，无进展检测识别重复调用或状态振荡。"},{"kind":"扩展知识","text":"给总时限 30 秒和最多 6 步。连续两次调用同一查找工具、参数与返回均未变化，就判无进展。正常停止前看目标是否达成，预算停止时保存最后证据、未完成步骤和停止原因。"},{"kind":"面试官追问","text":"重试要区别瞬时错误和参数错误。对写动作先查操作状态或用相同幂等键，避免把重试看成一条新指令。"},{"kind":"怎么识别“忙了很多轮却没进展”","text":"设目标为定位一个失败测试。连续三轮读同一文件、用同样的筛选条件并得到相同结果，期间也没有增加证据，就可要求换一种查证方式。宿主另设硬上限，如最大轮数和截止时间，覆盖模型一直认为还要继续的情况。\n\n退出时区分“已找到并验证原因”“证据不足”和“用户取消”。三者分别决定是否交付结论、提示缺失信息或立即撤销等待中的操作。"}],"expanded":true},{"key":"ai-13548","number":13548,"bank":"ai","position":287,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284763179331586","title":"什么是 Agent Loop（智能体循环）？一个典型的 Agent Loop 包含哪些步骤？","source":"preview","sections":[{"kind":"回答重点","text":"循环可以拆为组装状态、调用模型、判断回答或工具请求、校验并执行、记录观察、下一轮或退出。宿主管理终止条件与任务状态。"},{"kind":"扩展知识","text":"假设 pi-audit-harness 接到“核对这个结论是否有代码证据”的任务。\n\n1. 宿主载入任务、现有证据和剩余预算，模型给出要看的文件与范围。\n2. 工具层校验读取范围，执行后记录文件位置和回执，将结果送回下一轮。\n3. 模型提出继续查证或结束，宿主检查退出条件。成功、无进展、超时或用户取消都应有可恢复的结果和原因。"},{"kind":"面试官追问","text":"一次 run 结束前有多轮工具往返。每轮要有取消、超时和可恢复状态，不能只看最终一段自然语言。"},{"kind":"区分“模型想做”和“任务已完成”","text":"以修改配置并运行测试为例。第一轮模型提出读配置，宿主执行并写下回执。第二轮模型据此提出改动，第三轮才有测试输出。若工具返回“无权写入”，这个回执应进入下一轮，任务状态也应保留失败原因。只看到模型说“改好了”不能证明文件已修改。\n\n恢复任务时读取最后一条已提交的动作及其回执。已经对外执行而回执未知的动作先查状态，有证据后再决定是否重试。"}],"quote":"思考 → 行动 → 观察","expanded":true},{"key":"ai-13549","number":13549,"bank":"ai","position":288,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284763770728450","title":"如何设计一个生产级的 Agent 系统架构？需要考虑哪些关键模块？","source":"preview","sections":[{"kind":"回答重点","text":"生产架构包含入口、执行引擎、模型/工具接入、状态存储、调度、权限和观测评测。将任务状态与外部副作用明确持久化。"},{"kind":"扩展知识","text":"接入区管理身份与请求；运行区处理状态、模型和工具；权限区校验风险；存储记录事件、快照和产物；监控覆盖延迟、成本与失败。"},{"kind":"面试官追问","text":"Worker 崩溃后找最后提交的工具回执和水位，恢复时用幂等键查已做的外部操作。客户端按序号补事件，独立于任务是否已经结束。"},{"kind":"一个进程在调用中途消失","text":"把任务状态、工具请求和工具回执持久化。调度器负责选择下一步，执行层负责鉴权和实际调用，观察层负责把一次调用的耗时、错误与任务关联。若模型已提出写入但进程崩溃，恢复后按调用 ID 查询外部结果。\n\n区分任务、一次执行尝试和一次工具调用的标识。工具重试会创建新尝试，但写入的幂等键应能指向同一业务意图。"}],"expanded":true},{"key":"ai-13550","number":13550,"bank":"ai","position":289,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284764349542401","title":"如何评估 AI Agent 的效果？有哪些评估维度和方法？","source":"preview","sections":[{"kind":"回答重点","text":"同时评估结果、过程、成本和安全。固定场景测任务成功、证据正确、工具调用合法、恢复能力、延迟与 Token。"},{"kind":"扩展知识","text":"同时看任务完成率、工具选对率、参数正确率、越权率、成本、时延和人工接管率；测试集覆盖正常、边界、工具失败及中断。评估工具轨迹与最终结果，能区分模型决策和外部故障。"},{"kind":"面试官追问","text":"100 个任务中有 10 个最终成功但使用了无关工具，最终正确率掩盖了路径成本与风险，回归时应分开追踪。"},{"kind":"如何给 Agent 的一次运行打分","text":"假设要完成 100 个客服改派任务。先用数据库最终状态判定工单是否归属正确的人，再看是否误改其他工单。两条轨迹都能成功时，还可比较每个成功任务的模型成本、工具调用数和超时时间。\n\n同一题重复跑几次，分别记录“一次作答的成功率”和“多次是否都成功”。前者衡量平均表现，后者更接近用户连续使用时能否信任它。"}],"expanded":true},{"key":"ai-13551","number":13551,"bank":"ai","position":290,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284764907384833","title":"如何让 AI Agent 具备长期记忆能力？有哪些存储和检索方案？","source":"preview","sections":[{"kind":"回答重点","text":"长期记忆要定义写入策略、存储和召回。向量库找语义相似内容，结构化存储管理事实与偏好，全文检索擅长精确标识。"},{"kind":"扩展知识","text":"偏好能用结构化键值，长文档可用全文或向量搜索，跨服务经历可记录到事件/关系模型。先验证写入权限和数据资格，再按租户、查询和时间过滤，最后返回少量相关证据。给用户修改、过期与删除的渠道。"},{"kind":"实战细节","text":"写入时去重和版本化，读取时按时效、权限和相关度过滤，并保留来源。"}],"expanded":false},{"key":"ai-13552","number":13552,"bank":"ai","position":291,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284765498781698","title":"ReAct 推理范式是什么？它如何让 Agent 更可靠地完成任务？","source":"preview","sections":[{"kind":"回答重点","text":"ReAct 把推理与行动交错起来。模型根据当前观察选择动作，工具结果改变下一轮决策，可反复检查事实并修正路线。"},{"kind":"扩展知识","text":"排查测试失败时，先根据报错选择读目标文件。工具发现传入空指针，再决定读上游调用，观察改变后续动作。可记录每步工具请求和验证结果，方便重放和审计。"},{"kind":"实战细节","text":"工程上记录可审计的工具调用、观察与公开决策摘要，不需要暴露模型私有推理。"}],"expanded":false},{"key":"ai-13553","number":13553,"bank":"ai","position":292,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284766136315906","title":"什么是 A2A 协议？它和 MCP 协议有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"A2A 面向独立 Agent 的发现、任务委托与状态交互。MCP 面向宿主访问外部能力。远端 Agent 自己管理内部计划与工具。"},{"kind":"扩展知识","text":"当模型需要使用查询工单工具时，可以让客户端走 MCP。整个工作交给具备独立任务状态的工单 Agent 时，则可用 A2A 协商任务、状态和结果。两者解决不同接口边界，也可组成同一方案。"},{"kind":"实战细节","text":"跨团队的文档分析可走 A2A，分析 Agent 再经 MCP 查本地资料。按实际协议版本核对传输与字段。"}],"expanded":false},{"key":"ai-13554","number":13554,"bank":"ai","position":293,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284766648020994","title":"MCP 协议的架构包含哪些核心组件？Server 和 Client 分别负责什么？","source":"preview","sections":[{"kind":"回答重点","text":"Host 是面向用户的应用，组织上下文、审批和多个连接。Client 建立与指定 Server 的协议会话。Server 暴露并实现能力。"},{"kind":"扩展知识","text":"Host 是带 UI 和权限策略的产品。一个 Host 可维护多个 MCP Client，各自负责与相应 Server 协商能力和会话。Server 提供具体工具、资源或模板。模型调用仍由 Host 编排，密钥和访问权限应在适当边界验证。"},{"kind":"面试官追问","text":"工单 Server 公开查单能力，数据库 Server 公开只读统计。两个连接分别认证，模型得到的工具名不能替代该认证。"},{"kind":"一次请求经过谁","text":"想象编辑器接了文件服务和工单服务。编辑器作为 Host 管理信任边界，对每个 Server 建立相应的 Client 连接。连接初始化并协商能力后，Client 可发现工具，按工具的输入约定发送调用请求，再把服务返回的内容交给 Host。\n\n用户只授权查看项目 A 时，Host 的工具选择与 Server 的资源校验应能分别生效。即使模型能看到“查工单”的工具，也不能据此认定它能查所有工单。"}],"expanded":true},{"key":"ai-13555","number":13555,"bank":"ai","position":294,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284767310721026","title":"MCP 协议是什么？它在 AI Agent 系统中解决了什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"MCP 标准化 AI 宿主与外部能力之间的连接。服务端公开工具、资源与 Prompt 等能力，客户端发现和使用，宿主控制用户交互和权限。"},{"kind":"扩展知识","text":"三个客户端分别接十个内部系统时，逐个适配会重复实现发现、参数和通信。使用 MCP 各系统按公共协议提供能力，客户端连接并按需调用。业务语义与权限仍由应用和服务端设计。"},{"kind":"实战细节","text":"模型的选择仍来自模型接口，MCP 负责宿主与服务端之间的协议交互。"}],"quote":"M×N 集成困境","expanded":false},{"key":"ai-13556","number":13556,"bank":"ai","position":295,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284768199913474","title":"AI Agent 的核心组件有哪些？感知、决策、执行、记忆各自的作用是什么？","source":"preview","sections":[{"kind":"回答重点","text":"四个环节是感知、决策、执行、记忆。感知整理文本、图片或事件，决策选择下一步，执行层调用工具，记忆层保存可供后续读取的状态。"},{"kind":"扩展知识","text":"以故障工单为例。感知层提取服务名和报错时间；决策层决定先找运行日志；执行层按权限调用查询；记忆层记录已查时间段和错误原因。任务中断后，恢复程序用这些结构化记录找到下一步，避免重复从头查询。"},{"kind":"实战细节","text":"任务 ID、已完成步骤和工具回执可以结构化持久化，恢复时按需取回。"}],"expanded":false},{"key":"ai-13557","number":13557,"bank":"ai","position":296,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284768782921729","title":"什么是 AI Agent？它和直接调用大模型 API 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"Agent 把目标、执行状态、模型和外部工具组织成可循环的系统。单次模型请求主要生成输出，Agent 会让宿主执行动作、读回结果并选择下一步。"},{"kind":"扩展知识","text":"假设用户问“订单 42 发到哪儿了”。直接问模型，它能根据你已经提供的信息作答。Agent 可以先查订单，发现只有运单号，再查物流接口，最后用实际回执回答。把“下一步怎么做”和“什么时候停”交给宿主协调，才形成完整任务。"},{"kind":"实战细节","text":"以订单查询为例，模型选工具，宿主验证权限，结果回到下一轮，达到目标后结束。"}],"expanded":false},{"key":"ai-13558","number":13558,"bank":"ai","position":297,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284769391095809","title":"AI Agent 如何处理工具调用返回超大结果的问题？有哪些实用的解决方案？","source":"visible","sections":[{"kind":"回答重点","text":"工具一次查到的资料，和模型回答当前问题所需的证据，往往差很多。假设用户问“昨天哪种错误最多”，原始日志有十万行。把前一百行发给模型虽然省了空间，却可能让它算出错误的第一名。先分清任务要**精确统计、查找某条证据，还是概括一批内容**，三种需求对应三种处理方式。\n\n1. **调用前缩小范围。** 把时间段、需要的字段、排序方式和页大小写进工具参数。工具端也要设上限。若用户要统计次数，直接调用分组统计，数据库就能把十万行变成几行准确的计数。\n2. **接收时给单次结果设预算。** 单独限制字节数或 token 数，给下一轮推理和最终回答预留空间。列表按完整记录裁剪，日志保留首次异常和必要的前后文。返回已读范围和下一页游标，使模型知道还有什么没有看。\n3. **需要概括时先压缩，再保留回查路径。** 可以先提取错误码、时间和文件位置，再概括重复现象。原始证据保留在有权限控制的存储中，返回有期限的引用。模型遇到互相矛盾的片段时还可以调工具取原文。"},{"kind":"扩展知识","text":"**分页什么时候有用？** 用户要找一条失败记录，可以让工具按稳定的顺序给一小页。匹配到了就停，下一页用服务端返回的游标。若数据还在写入，要约定查询时间边界或快照，否则翻页途中有可能重复或遗漏记录。\n\n**什么时候可以提前停？** 用户要最近一次失败，按时间倒序读到第一条符合条件的记录即可退出。用户要统计全天失败总数，则需要在完整时间范围内做聚合，不能读到第一条就停。对大文件也可以在工具里逐块处理，每块更新计数，最后只返回合计。"},{"kind":"一个算得清楚的例子","text":"某小时共 1,000 次请求。前 100 次有 20 次超时，后 900 次只有 9 次超时。只看第一页会得到 20%，全量超时率其实是 **29 ÷ 1,000 = 2.9%**。合并分页结果时应累加分子和分母，再求比例。把两页的百分比直接取平均也会算错。\n\n如果用户接着问“这些超时为什么发生”，此时再从超时样本里选取有代表性的链路，把请求标识、耗时和异常位置发给模型。统计结果负责回答“多少”，样本负责解释“可能为什么”。"},{"kind":"面试官追问","text":"**怎样避免无限翻页？** 宿主记录上一次游标、累计页数和剩余预算。重复游标、已找到证据或预算耗尽都触发退出。若只检查了部分记录，回答里交代范围，别直接断言“没有异常”。\n\n**摘要是否要用主模型？** 规则能完成的字段提取或聚合交给程序。有大量自由文本时，可让小模型概括，再从原文抽查关键事实。涉及金额、全局极值或错误码时保留原值和出处，多轮摘要丢掉的细节靠原始引用找回。"},{"kind":"参考资料","text":"[Anthropic 工具设计指南](https://www.anthropic.com/engineering/writing-tools-for-agents)"}],"quote":"事前控制、事中截断、事后摘要","expanded":true},{"key":"ai-13559","number":13559,"bank":"ai","position":298,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284770259316738","title":"当对话历史超出上下文窗口时，有哪些上下文压缩策略？各自的优缺点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"滑窗简单但丢失旧细节。摘要保留主题但可能遗漏约束。按相关性检索可按需取回，状态提取则把目标和已完成步骤结构化保存。"},{"kind":"扩展知识","text":"最近窗口和折叠摘要适合短期状态，但删太早会丢初始约束。把大证据用外部引用保存，挂上可检索索引，再留结构化的任务水位和待办。"},{"kind":"面试官追问","text":"压缩一次失败日志，保留错误码、第一条堆栈、相关文件与复测命令。手动复查不可丢约束是否还对。"},{"kind":"三种压缩方案怎样取舍","text":"滑动窗口保留最近几轮，便宜，但很早提出的硬要求可能消失。滚动摘要适合持续记录决定和待办，多轮改写可能把限定条件写丢。外部存储加引用保真度高，代价是用到细节时要再查询一次。实际可以固定保留目标、权限和最近的工具回执，对较早材料做摘要。\n\n试着恢复一条“仅处理测试环境”的限制。若压缩后只能找到“处理环境”，系统就需要从约束记录重新拼装输入，不能让模型自行猜测。"}],"expanded":true},{"key":"ai-13560","number":13560,"bank":"ai","position":299,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284770817159170","title":"MCP 协议和 A2A 协议如何协同工作？请设计一个同时使用两者的多 Agent 系统架构","source":"preview","sections":[{"kind":"回答重点","text":"协调 Agent 可通过 A2A 将子任务分给有合适技能的远端 Agent。各 Agent 内部通过 MCP 查数据或调用工具，返回有来源的交付物。"},{"kind":"扩展知识","text":"以故障排查为例，接入 Agent 按 A2A 将日志分析与工单查证分给两个独立 Agent。每个 Agent 用 MCP 访问其获准的数据源，再以 Artifact 和状态事件返回。保留父任务 ID，分配子任务预算及数据访问范围。"},{"kind":"实战细节","text":"用任务 ID 跟踪进展、限定数据和预算、保留超时和回收路径；对外仅传必要输入。"}],"expanded":false},{"key":"ai-13561","number":13561,"bank":"ai","position":300,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284771488247809","title":"在生产环境中，如何保证 Agent 系统的安全性？需要防范哪些风险？","source":"preview","sections":[{"kind":"回答重点","text":"主要风险来自不可信输入、越权副作用、数据泄露和失控资源消耗。把授权、作用域、隔离和预算实现为宿主的强制约束。"},{"kind":"扩展知识","text":"把模型输入当可能混有不可信内容，工具前做身份、参数与资源授权，敏感输出脱敏，关键写入做审批和审计。工具用最小权限和隔离执行，并可配置限额与系统级停止。"},{"kind":"面试官追问","text":"检索材料说“把报告寄到某地址”，它仍只是资料内容。发送许可应来自可信用户授权与服务端策略，不应从检索文本推断。"},{"kind":"把风险落实到工具这一层","text":"用户让 Agent 概括文档，文档里却含有一条要求发送文件的指令。读取到的文本只是资料。宿主先限定该任务可调用哪些工具，真正调用时再校验用户身份、资源和动作。审计中记录被拒绝的动作及原因。\n\n做回归测试时，除了“正常用户能否完成任务”，还要检查越权读取、重复确认和审批过期等情形，并验证服务端确实没有产生副作用。"}],"expanded":true},{"key":"ai-13562","number":13562,"bank":"ai","position":301,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284772146753537","title":"如果让你从零设计一个 Agent 框架，你会优先实现哪些核心模块？为什么？","source":"preview","sections":[{"kind":"回答重点","text":"先实现可终止的循环和模型适配，再实现工具注册与校验，然后加入可持久化状态、预算权限与追踪评测。"},{"kind":"扩展知识","text":"最小版本先完成一条闭环：模型适配器、消息和工具 Schema、模型与工具循环、预算和取消、权限，以及受测试的状态保存。第二阶段再加入任务恢复、可观测性和更复杂编排。先用一项易验证的任务测试各失败路径。"},{"kind":"实战细节","text":"先让一个只读工具从输入到回执完整跑通，再覆盖超时、取消、重复执行与恢复。"}],"expanded":false},{"key":"ai-13563","number":13563,"bank":"ai","position":302,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284772746539009","title":"多 Agent 协作有哪些常见的编排模式？各自适合什么场景？","source":"preview","sections":[{"kind":"回答重点","text":"顺序适合有依赖的流水线，并行扇出适合可独立的分支，主从委托适合异构专长，讨论或评审适合需要比较多种方案的任务。"},{"kind":"扩展知识","text":"串行适合前一步输出是后一步输入；并行适合独立验证或数据来源；Supervisor 统一分派与汇总；人机协作用在风险操作或需求不明时。不同 Agent 修改同一资源时，要定义所有权与冲突处理。"},{"kind":"实战细节","text":"用相同单 Agent 基线比较完成率、延迟与成本，再判断多 Agent 是否值得。"}],"quote":"顺序链式、并行扇出、主从委托和群组讨论","expanded":false},{"key":"ai-13564","number":13564,"bank":"ai","position":303,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284773392461825","title":"Agent 系统中的 Function Calling 和 MCP 有什么区别？各自的优缺点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Function Calling 描述模型 API 如何生成结构化调用请求。MCP 统一宿主对外部服务的能力发现和调用，二者可以接在同一条链路。"},{"kind":"扩展知识","text":"Function Calling 是模型 API 给出调用意图和结构化参数的一层。MCP 是宿主与外部服务交换工具定义和结果的协议。宿主可把 MCP 工具转成模型函数描述，再路由模型的请求。"},{"kind":"面试官追问","text":"仅有几个内部函数可直接用模型工具 API。多客户端接同一外部系统时，公共 MCP 接口减少适配成本，但仍要处理权限和版本。"},{"kind":"用同一个查价工具来说明","text":"模型可以通过供应商的 Function Calling 输出查价请求，宿主收到后既可以调用本地函数，也可以通过 MCP Client 把请求送到库存 Server。前者解决模型怎样表达调用意图，后者约定宿主与工具服务如何协商能力、发现与调用工具。\n\n只有两个固定的进程内函数时，本地适配简单。多个宿主需要复用工具服务器时，标准协议能减少重复接入，但也要处理连接、版本和授权。"}],"expanded":true},{"key":"ai-13565","number":13565,"bank":"ai","position":304,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284774025801729","title":"什么是 Agent 的上下文窗口？为什么它是 Agent 工程中最核心的约束？","source":"visible","sections":[{"kind":"回答重点","text":"上下文窗口就是单次请求可处理的 Token 容量。系统指令、历史、工具定义和结果共用空间，应用还要给输出预留配额。"},{"kind":"扩展知识","text":"窗口假设只有 8k token，系统提示与工具定义用去 2k，原样放入 5k 日志后只剩约 1k 给任务与回复。可让工具返回失败摘要和原文件位置，需要上下文时再按范围读取。"},{"kind":"面试官追问","text":"上下文窗口、单轮输出上限和总费用预算要分开看。大窗口也需要给模型保留与任务直接相关的输入。"},{"kind":"算一次可用窗口","text":"假设当前模型的窗口上限是 32,000 token，系统和工具定义占 5,000，任务与最近往来占 7,000，还要给回答留 4,000。这时历史证据最多还能占 16,000。接到 20,000 token 的日志，宿主可先按错误码归类，附上原文位置，让下一轮点读。实际预算以所选模型和 API 的计量为准。\n\n压缩后检查三样东西能否找回：用户的硬约束、已执行的动作、支撑结论的证据。每轮同时记输入用量和剩余预算，就能定位是工具清单、会话历史还是某一次回包导致增长。"}],"expanded":true},{"key":"ai-13566","number":13566,"bank":"ai","position":305,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284774613004289","title":"AI Agent 的记忆机制有哪些类型？短期记忆和长期记忆分别怎么实现？","source":"preview","sections":[{"kind":"回答重点","text":"短期记忆是当前任务上下文和状态，常保留近期消息、进度和引用。长期记忆存到外部，通过业务键、全文或语义检索取回。"},{"kind":"扩展知识","text":"短期状态保存当前会话的输入、摘要和运行位置。长期状态由应用识别稳定偏好、可验证事实和已复用经验，按用户、来源、时间检索。可分对话过程、业务状态和长期资料三种不同生命周期。"},{"kind":"实战细节","text":"区分会话记录、经确认偏好和可更新业务数据，控制过期、删除与租户隔离。"}],"expanded":false},{"key":"ai-13567","number":13567,"bank":"ai","position":306,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284775367979010","title":"什么是 AI Agent 中的工具调用（Tool Calling）？它的基本流程是怎样的？","source":"visible","sections":[{"kind":"回答重点","text":"宿主把工具名、用途和参数 Schema 给模型。模型返回结构化调用计划，宿主校验权限与参数、执行工具，再用调用 ID 把结果送回模型。"},{"kind":"扩展知识","text":"以“查一下订单 42 的物流”为例。\n\n1. 宿主把查订单工具的名字、用途和输入要求发给模型。要求 order_id 是字符串，缺少时应该先询问。\n2. 模型生成一次工具请求及调用 ID。宿主用真实的用户身份校验参数和订单访问权限，通过后才请求业务接口。\n3. 宿主把运单号、无权限或超时等结果按调用 ID 交回模型。模型有了运单号才决定查物流，拿到状态后据此答复。"},{"kind":"面试官追问","text":"写入工具要把业务幂等键和审批放在执行侧。同一请求反复被模型提出时，宿主仍需保证至多一次业务效果。"},{"kind":"一轮工具调用要保存什么","text":"假设订单查询和地址查询的结果几乎同时返回。宿主靠每次调用的 ID 对上请求和回执，不能按完成先后猜测。如果第二个工具的输入必须取自第一个结果，就要等到第一步返回再发起调用。工具描述应写清适用范围、字段单位与必填项。参数缺失时返回可修正的错误，越权时则停止执行。\n\n可用两条记录检查一次调用。第一条记录模型提出了什么，第二条记录宿主是否实际执行、返回了什么。只出现第一条时，还不能向用户声称任务已经成功。"}],"expanded":true},{"key":"ai-13568","number":13568,"bank":"ai","position":307,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284775955181570","title":"如何设计 AI Agent 的工具权限控制？不同场景下的工具应该有什么样的权限差异？","source":"preview","sections":[{"kind":"回答重点","text":"按调用者、操作类型和目标资源约束权限。将读取、低风险可逆写入和高影响操作分别授权，限制目录、账户、网络与参数。"},{"kind":"扩展知识","text":"按工具给能力分级，还要校验谁对哪个对象能做什么。查询可按租户范围自动执行，改动可限定路径和写幂等记录，付款或对外发送可需独立确认。"},{"kind":"面试官追问","text":"审计记录 tool ID、权限规则、参数摘要、结果码和真实身份。模型自己附上的角色字段不等于可信权限。"},{"kind":"审批应该授权到什么范围","text":"假设用户同意“给测试项目创建一条工单”。审批记录绑定用户、项目、动作和参数。若执行时目标换成生产项目，宿主必须重新判断。读取型工具也要校验资源归属，写操作还需考虑重复执行和撤销成本。\n\n把允许、拒绝、过期、参数变化四种请求分别发给权限层验证。成功标准是最终业务资源发生了预期变化，而非模型给出了看似合理的说明。"}],"expanded":true},{"key":"ai-13569","number":13569,"bank":"ai","position":308,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284776634658817","title":"子 Agent（Subagent）模式有什么优势和挑战？父 Agent 调用子 Agent 时需要考虑哪些边界问题？","source":"preview","sections":[{"kind":"回答重点","text":"父 Agent 拆任务、分预算并汇总，子 Agent 在较小上下文中处理专门工作。可获得并行与隔离收益，也会增加协调成本。"},{"kind":"扩展知识","text":"父 Agent 把目标、证据范围、预算和交付物给子 Agent；子 Agent 在独立上下文查证，回传结论及定位。避免共享使用未经授权的数据，也避免同时编辑同一工作区导致覆盖。"},{"kind":"实战细节","text":"派发带明确输入输出、资源作用域、截止时间和失败语义。父 Agent 检验交付结果。"}],"expanded":false},{"key":"ai-13570","number":13570,"bank":"ai","position":309,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284777385439233","title":"如何用 LLM-as-Judge 评估 RAG 系统？评估指标有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"用 Judge 分别评估答案正确、证据支持、引用与拒答。固定评分 Rubric 并与人工标注校准，不把 Judge 单独当检索真值。"},{"kind":"扩展知识","text":"把原问题、参考答案、检索结果和实际答案分别给评估器，按引用、事实和相关性打分。用人工标注校准。"}],"expanded":false},{"key":"ai-13571","number":13571,"bank":"ai","position":310,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284777901338625","title":"2026 年超长上下文模型（100 万 Token）出现后，RAG 还有存在的必要吗？","source":"preview","sections":[{"kind":"回答重点","text":"长窗口可放更多材料，RAG 仍有动态更新、权限、证据定位、成本与精确召回价值。以真实问题比较质量与时延。"},{"kind":"扩展知识","text":"百万 token 能容纳更多材料，知识库仍要筛权限与版本，并保持费用及时延可控。比较相关文档在窗口的覆盖和位置。"}],"expanded":false},{"key":"ai-13572","number":13572,"bank":"ai","position":311,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284778434015234","title":"RAG 系统的缓存策略如何设计？语义缓存和精确缓存分别适合什么场景？","source":"preview","sections":[{"kind":"回答重点","text":"精确缓存适合输入与配置完全一致的请求，语义缓存适合近义、可共享且时效稳定的答案。缓存键包含租户、版本和权限。"},{"kind":"扩展知识","text":"精确缓存键要含模型、提示、权限和知识版本。语义缓存还做相似度及过期检查，价格等高时效数据慎用。"}],"expanded":false},{"key":"ai-13573","number":13573,"bank":"ai","position":312,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284779046383618","title":"什么是 Agentic RAG？它和传统 RAG 的「检索-生成」流程有什么本质区别？","source":"preview","sections":[{"kind":"回答重点","text":"Agentic RAG 让 Agent 判断什么时候查、查哪路、是否重查和何时合成。设置失败、预算及证据合格的停止规则。"},{"kind":"扩展知识","text":"传统流程通常固定检索一次，Agentic 方案根据问题和证据决定查哪、是否重查或分问题。加耗时上限和成果验证。"}],"expanded":false},{"key":"ai-13574","number":13574,"bank":"ai","position":313,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284779767803906","title":"什么是 RAG 2.0？从 Naive RAG 到 Advanced RAG 再到 Modular RAG，RAG 架构经历了怎样的演进？","source":"preview","sections":[{"kind":"回答重点","text":"Naive RAG 是检索再生成，Advanced 改进召回与上下文，Modular 将检索、路由、融合和生成拆为可组合组件。"},{"kind":"扩展知识","text":"Naive 先检索再生成，Advanced 针对查询和排序优化，Modular 多路策略按需切换。用同一问答任务对照哪一步获益。"}],"expanded":false},{"key":"ai-13575","number":13575,"bank":"ai","position":314,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284780514390018","title":"RAG 系统中的多模态检索怎么做？如何同时检索文本和图片？","source":"preview","sections":[{"kind":"回答重点","text":"为图片建立图文嵌入或 OCR／描述文本索引，保留媒体定位。分别召回并校准合并，可用多模态模型二次验证。"},{"kind":"扩展知识","text":"同时索引图像向量、OCR 文本及图注，查询时合并候选。引用保留图或区域 ID，让用户验证结果。"}],"expanded":false},{"key":"ai-13576","number":13576,"bank":"ai","position":315,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284781038678018","title":"什么是 GraphRAG？它和传统向量 RAG 有什么区别？什么场景下 GraphRAG 更有优势？","source":"preview","sections":[{"kind":"回答重点","text":"GraphRAG 用实体关系图支持多跳、主题概括与跨文档关联。向量检索擅长局部近义匹配；建图需额外抽取与维护。"},{"kind":"扩展知识","text":"查询“A 团队和 B 组件为什么相关”可沿实体关系找多跳证据。普通向量更善找直接相似片段，用问题集选择。"}],"expanded":false},{"key":"ai-13577","number":13577,"bank":"ai","position":316,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284781562966018","title":"什么是语义分块（Semantic Chunking）？它相比固定大小分块有什么优势？","source":"preview","sections":[{"kind":"回答重点","text":"语义切块按主题或结构变化分割而非固定字数。可提高段落完整性，需控制过长分块、索引成本和边界置信度。"},{"kind":"扩展知识","text":"先用句段相似度或主题模型确定边界，再应用最小/最大长度。政策条款会跨段时保留合理重叠和标题。"}],"expanded":false},{"key":"ai-13578","number":13578,"bank":"ai","position":317,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284782112419842","title":"如何设计大模型应用的限流和配额？","source":"preview","sections":[{"kind":"回答重点","text":"按租户、用户、模型和资源类型定请求、Token、并发和预算限制。请求前预留，完成后按实结算，限流携带可重试信息。"},{"kind":"扩展知识","text":"入口按租户、请求和 token 维度计量，区分速率、并发和日配额。运行结束对账预估和实际用量，过载快速拒绝或排队。"}],"expanded":false},{"key":"ai-13579","number":13579,"bank":"ai","position":318,"priority":true,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284782754148354","title":"大模型服务失败时如何做重试、降级和 Fallback？","source":"written","sections":[{"kind":"回答重点","text":"瞬态错误按退避和总预算有限重试，超过边界切备用模型或降级；写操作要有幂等机制与最终回执核对。"},{"kind":"扩展知识","text":"429 或暂时网络错误在时间预算内指数退避；参数错直接返回；写工具结果未知要查询或重用幂等键。备选模型与检索路径先用同一用例验证。"},{"kind":"面试官追问","text":"切换供应商也要核对隐私、格式和失败时的用户提示。"},{"kind":"超时以后具体重试哪一步","text":"一次 2 秒预算的请求在 1.8 秒时遇到限流，如果服务端建议 1 秒后再试，本轮已来不及，应给出降级结果或交还任务。读操作可以在总预算内退避，写操作若超时要先区分“未执行”和“已执行但回执丢失”。\n\n备用模型若不支持当前工具的参数约束，降级时可以改为只读建议。把每次尝试的模型、错误、等待时长与最终处理结果记在同一条请求记录。"}],"expanded":true},{"key":"ai-13580","number":13580,"bank":"a tch 多份输入，stream 消费增量。控制并行，标记单条失败和流中断，不假设输出总同顺序。"}],"expanded":false},{"key":"ai-13770","number":13770,"bank":"ai","position":507,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284892137402369","title":"什么是 LangSmith？它在 LangChain 生态中解决什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"LangSmith 用于追踪模型、工具和检索调用，并维护样例集和评测。用 run ID 关联输入、输出、耗时、错误与版本。"},{"kind":"扩展知识","text":"在 LangSmith 关联运行、检索和工具轨迹，再同数据集重放对照版本。对敏感字段按组织规则控制访问和保留。"}],"expanded":false},{"key":"ai-13771","number":13771,"bank":"ai","position":508,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284892716216322","title":"如何设计训练数据的版本管理和可追溯体系？","source":"preview","sections":[{"kind":"回答重点","text":"以不可变版本和 manifest 记录来源、许可、清洗步骤、切分、规则、统计与摘要，训练运行绑定数据版本和配置。"},{"kind":"扩展知识","text":"给原始、清洗、采样和最终产物版本、manifest 与哈希，训练关联到快照，支持删改来源后追溯影响。"}],"expanded":false},{"key":"ai-13772","number":13772,"bank":"ai","position":509,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284893227921409","title":"预训练语料清洗通常要过滤哪些低质量内容？","source":"preview","sections":[{"kind":"回答重点","text":"过滤乱码、低质量重复、模板广告、低相关语言、损坏结构、隐私及不合规来源；分层抽样避免误伤长尾。"},{"kind":"扩展知识","text":"过滤重复、模板、乱码、垃圾来源和无效语言，保留许可与类型信息。用抽样复查正常少数语种没有被误删。"}],"expanded":false},{"key":"ai-13773","number":13773,"bank":"ai","position":510,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284893827706882","title":"代码数据进入训练集前需要做哪些特殊清洗？","source":"preview","sections":[{"kind":"回答重点","text":"按仓库和许可追踪代码，去重、筛秘密与生成垃圾，保留必要结构和上下文，训练与评测按仓库或时间隔离。"},{"kind":"扩展知识","text":"排除密钥与个人数据、重复 repo fork、未授权文件或生成垃圾。确保代码评估题与派生版本未放入训练。"}],"expanded":false},{"key":"ai-13774","number":13774,"bank":"ai","position":511,"priority":false,"url":"https://www.mianshiya.com/bank/1906189461556076546/question/2052284894456852481","title":"大模型预训练数据工程的完整流程是怎样的？","source":"preview","sections":[{"kind":"回答重点","text":"从采集许可核验到规范化、过滤、去重、分片、Tokenize、配比和验证。每阶段留统计、版本和回滚。"},{"k 查能否断言为 []int 是安全的。两个接口若有相同的动态类型而该类型不可比较，例如都是 []int，执行接口相等比较会 panic。\n\n定义 API 时若需要把值用作 map 的键，就要确认动态类型可比较。接口赋值成立和后续操作成立，是先后两个独立问题。"}],"expanded":true},{"key":"go-1735","number":1735,"bank":"go","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484158328833","title":"Go 语言中怎么实现闭包？闭包的主要应用场景是什么？","source":"preview","sections":[{"kind":"回答重点","text":"函数值可捕获外层变量并延长其生命周期。常用于回调、中间件、延迟执行和封装带状态的函数。"},{"kind":"扩展知识","text":"让 newCounter 返回 func() int，函数体每次对其捕获变量 n 加一。由 newCounter 创建的两份闭包各有独立状态，并发共享同一闭包仍可能需要同步。"}],"expanded":false},{"key":"go-1736","number":1736,"bank":"go","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484233826305","title":"Go 语言中触发异常的场景有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"典型 panic 有越界、nil 解引用、失败的单返回断言、整数除零、向关闭通道发送及手动 panic。并发 map 的某些错误属于不可恢复的运行时致命错误。"},{"kind":"扩展知识","text":"数组越界、给 nil map 写入、错误的直接类型断言都可能触发 panic。打开文件失败用 error 正常返回，边界处只在合适的 goroutine 内用 recover 做兜底并记录堆栈。"}],"expanded":false},{"key":"go-1737","number":1737,"bank":"go","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484317712385","title":"Go 语言中通过指针变量 p 访问其成员变量 title，有哪几种方式？","source":"preview","sections":[{"kind":"回答重点","text":"结构体指针可直接用 p.title，语言会自动解引用；也可写成 (*p).title。空指针访问字段会 panic。"},{"kind":"扩展知识","text":"对 *Book 变数 p，p.title 等价于 (*p).title。需要访问的值若为 nil，自动解引用不会保证安全，先判断 nil 或让构造器给出初始值。"}],"expanded":false},{"key":"go-1738","number":1738,"bank":"go","position":7,"priority":true,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484401598465","title":"Go 语言中 defer 的变量快照在什么情况下会失效？","source":"preview","sections":[{"kind":"回答重点","text":"defer 注册时求值函数与实参。闭包在稍后读取捕获变量，指针和切片等参数也仍可能指向随后被修改的底层数据。"},{"kind":"扩展知识","text":"defer fmt.Println(x) 注册时保存 x 当时的值，defer func(){fmt.Println(x)}() 在执行时读闭包中的 x。若传入指向对象的指针，保存的是地址，后续字段更新仍可被看到。"},{"kind":"面试官追问","text":"例如 x 从 1 改为 2，直接传 x 的延迟调用打印 1，捕获 x 的闭包打印 2。"},{"kind":"defer 究竟在什么时候读变量","text":"假设 n 初始为 1。登记 `defer fmt.Println(n)` 后把 n 改成 2，返回时仍打印 1，因为实参早已求值。登记 `defer func() { fmt.Println(n) }()` 时记录的是函数调用，函数体在返回前才读取 n，所以打印 2。\n\n如果实参是指针，登记时保存的是指针值。稍后通过同一指针读取对象时，可能看到对象已经修改。判断题目时分别标出“何时求参数”和“何时取对象内容”。"}],"expanded":true},{"key":"go-1739","number":1739,"bank":"go","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484502261761","title":"不分配内存的指针类型能在 Go 语言中使用吗？","source":"preview","sections":[{"kind":"回答重点","text":"未初始化指针的零值为 nil，可比较和传递，解引用前需它指向有效变量。用取地址、new 或函数返回的指针初始化。"},{"kind":"扩展知识","text":"var p *int 使 p 为 nil，可用于比较、赋值和传递。执行 *p 会解引用空地址。可用 new(int) 或取现有变量地址后再读写。"}],"expanded":false},{"key":"go-1740","number":1740,"bank":"go","position":9,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484602925058","title":"Go 语言中的局部变量是分配在栈上还是堆上？","source":"preview","sections":[{"kind":"回答重点","text":"由编译器逃逸分析、对象大小和使用方式决定。可用 go build -gcflags=-m 观察，位置通常不影响 Go 层语义。"},{"kind":"扩展知识","text":"用 go build -gcflags=-m 在本地比较返回局部变量地址和仅在函数中使用的两种写法。是否逃逸由实际调用路径、内联和分析结果决定。函数生命周期并不限制地址可用性。"}],"expanded":false},{"key":"go-1741","number":1741,"bank":"go","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484691005442","title":"Go 语言中所有的 T 类型都有 *T 类型吗？","source":"preview","sections":[{"kind":"回答重点","text":"可以声明指向多种类型的指针，包括指向接口的指针。接口自身已可承载各种动态值，日常接口参数很少需要 *I。"},{"kind":"扩展知识","text":"type User struct{} 可以构造 *User；即使 T 自己是指针或接口，也可以有 *T。能定义指针类型不等于该指针自动拥有接口方法集，通常不需要 *interface{}。"}],"expanded":false},{"key":"go-1742","number":1742,"bank":"go","position":11,"priority":true,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484837806081","title":"Go 语言中数组与切片有什么异同？","source":"preview","sections":[{"kind":"回答重点","text":"数组长度是静态类型的一部分，赋值复制元素。切片是窗口描述符，含长度、容量与底层存储引用，可重新切分和追加。"},{"kind":"扩展知识","text":"[3]int 的长度是类型组成部分，赋值或传参复制全部元素。[]int 保存底层数组的访问描述，赋值复制头部。a[:] 创建切片后修改 s[0] 也会影响 a[0]。"},{"kind":"面试官追问","text":"追加元素若超过 cap 会到另一底层数组。要共享更新元素与共享增长后的长度，需区分并显式返回新切片。"},{"kind":"从复制行为理解数组和切片","text":"把数组赋给另一个变量，会复制数组元素。把切片赋给另一个变量，复制的是描述底层数组的一小段信息。修改两个切片覆盖的同一元素，双方都能看到。对其中一个执行 append 后，两者是否仍共享底层数组取决于是否扩容。\n\n若希望生成一个独立副本，可分配新切片再 copy。元素本身若是指针或切片，copy 只复制这一层，还要判断是否需要复制元素指向的数据。"}],"expanded":true},{"key":"go-1743","number":1743,"bank":"go","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649484925886465","title":"Go 语言中 init() 函数在什么时候执行？","source":"preview","sections":[{"kind":"回答重点","text":"先初始化依赖包，再按规范完成包变量初始化及 init，最后执行 main。包初始化按依赖顺序执行，init 由运行时调用。"},{"kind":"扩展知识","text":"导入包先初始化，当前包完成变量初始化后执行 init，然后才进入 main。不要用 init 做难以检测失败的远程依赖初始化；显式构造便于测试和管理错误。"}],"expanded":false},{"key":"go-1744","number":1744,"bank":"go","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485009772545","title":"GO语言中非接口的任意类型T都能调用*T的方法么？反过来呢？","source":"preview","sections":[{"kind":"回答重点","text":"可寻址的 T 值能自动取地址调用 *T 的方法，*T 也可调用 T 的值方法。接口实现按正式方法集判断，自动取地址只影响调用语法。"},{"kind":"扩展知识","text":"若 v 可取地址，编译器可把 v.Update() 当作 (\u0026v).Update()。但是把 v 赋给要求 Update 的接口只看 T 的方法集，需传 \u0026v 才满足指针接收者。"}],"expanded":false},{"key":"go-1745","number":1745,"bank":"go","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485093658626","title":"Go 语言中函数返回局部变量的指针是否安全？","source":"preview","sections":[{"kind":"回答重点","text":"安全。变量在函数返回后仍被指针引用时，编译器保证其生命周期，通常因逃逸分配到堆上。"},{"kind":"扩展知识","text":"返回 \u0026x 时，若 x 在函数退出后仍需要，编译器安排适当 storage 生命周期，常报告逃逸。它和返回指向临时栈内存的传统手工内存语言写法不同。"}],"expanded":false},{"key":"go-1746","number":1746,"bank":"go","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485190127618","title":"Go 语言切片的容量是如何增长的？","source":"preview","sections":[{"kind":"回答重点","text":"append 超过容量时分配并复制到新数组。增长策略是运行时细节，受请求容量、元素大小和分配尺寸类别影响。"},{"kind":"扩展知识","text":"创建 len=2、cap=4 的切片，追加两项可复用数组，第五项超容量时才搬。写程序只依赖 append 返回合法长度及容量，具体倍数不能作为接口条件。"}],"expanded":false},{"key":"go-1747","number":1747,"bank":"go","position":16,"priority":true,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485274013698","title":"Go 语言切片作为函数参数，有哪些注意事项？","source":"preview","sections":[{"kind":"回答重点","text":"参数复制切片描述符，修改已有元素可影响共享底层数组。append 改变长度要返回新切片，扩容后新旧数组可能分离。"},{"kind":"扩展知识","text":"函数中修改 s[0] 会写同一底层数组。append 更新的是函数内那份头部，若扩容还会换数组。调用方需要接收返回值才能知道新长度和数组。"},{"kind":"面试官追问","text":"若函数必须与调用方隔离，对元素做一份新副本。元素含指针或 map 时，根据语义继续复制引用对象。"},{"kind":"为什么函数里 append 了，调用方长度没变","text":"假设传入切片长度为 2、容量为 4。函数收到切片描述的副本，修改第 0 个元素会改到共享数组。执行 append 可以利用原数组的空余容量，但变长的是函数内那份描述。调用方仍只能按原长度访问。\n\n惯用写法让函数返回更新后的切片，由调用方接住。如果 append 超过容量，即使元素后续被修改，也可能已经是在新数组上修改。"}],"expanded":true},{"key":"go-1748","number":1748,"bank":"go","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485353705473","title":"Go 语言中的 = 和 := 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"= 给已声明变量赋值，:= 在函数内短声明并初始化变量。同一作用域重用时至少有一个新变量。"},{"kind":"扩展知识","text":"= 给现有变量赋值，:= 在函数内做短声明且左侧至少一个非空白新变量。同一行可复用本块已声明的 err；内层新块却可能遮蔽它。"}],"expanded":false},{"key":"go-1749","number":1749,"bank":"go","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485437591553","title":"Go 语言中的指针的意义是什么？","source":"preview","sections":[{"kind":"回答重点","text":"指针保存变量地址，用于原地修改、共享对象身份和避免复制大值。指针参数自身仍是值传递。"},{"kind":"扩展知识","text":"传 \u0026session 给函数可更新原状态，复制结构体给函数则创建值副本。是否应传指针取决于变更语义、对象大小和并发共享成本。"}],"expanded":false},{"key":"go-1750","number":1750,"bank":"go","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649485525671938","title":"Go 语言的多值返回有什么用？","source":"preview","sections":[{"kind":"回答重点","text":"多值返回常用于结果加 error、值加存在标志或多个相关结果。调用处可用 _ 忽略不需要的结果。"},{"kind":"扩展知识","text":"os.Open 一类函数返回值及 error，调用者先检查 err。map 查找的 value, ok 也用多返回值区分“键缺失”与“值恰好等于零值”。"}],"expanded":false},{"key":"go-1751","number":1751,"b
