理相近截止时间。实际 Kafka 组件及实现随版本变化，答题可区分定时器和等待事件的 purgatory。"}],"expanded":false},{"key":"mq-1200","number":1200,"bank":"mq","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803040468897357825","title":"Kafka的索引设计有什么亮点？","source":"preview","sections":[{"kind":"回答重点","text":"Kafka 每个分区由多个段文件组成。段内稀疏 offset 索引保存逻辑位置到日志文件物理位置的映射，时间索引辅助按时间找偏移。定位到近处后再顺序读记录。"},{"kind":"扩展知识","text":"查偏移量 1250，索引最近一项为 1200，从对应文件位置继续找即可。稀疏索引减少体积，也自然地配合日志顺序读写。"}],"expanded":false},{"key":"mq-1201","number":1201,"bank":"mq","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803060011975827457","title":" 看过源码？那说说 Kafka 控制器事件处理全流程？","source":"preview","sections":[{"kind":"回答重点","text":"先说明 Kafka 版本。旧 ZooKeeper controller 串行处理由选举、节点变化等触发的事件，更新内存状态并向 Broker 发送状态变动。KRaft 由 active controller 串行处理元数据写入，经元数据日志发布后由 Broker 应用。"},{"kind":"扩展知识","text":"Broker 离开时控制器检查受影响的分区，决定新 leader 并发布元数据变化。控制器任期用于区分旧领导的决策，具体类名应以源码分支为准。"}],"expanded":false},{"key":"mq-1212","number":1212,"bank":"mq","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803079507444752385","title":"Kafka 中  Zookeeper 的作用？","source":"preview","sections":[{"kind":"回答重点","text":"旧 Kafka 使用 ZooKeeper 保存集群元数据、Broker 注册信息并协助 controller 选举。数据消息仍保存在 Broker。现代 Kafka 使用 KRaft 的元数据仲裁服务，Kafka 4.x 已移除 ZooKeeper 模式。"},{"kind":"扩展知识","text":"旧节点临时注册消失时，控制器据此处理分区 leader 变化。迁移要按所选版本的官方升级路径规划。"},{"kind":"参考资料","text":"[Apache Kafka 官方文档](https://kafka.apache.org/documentation/)"}],"expanded":false},{"key":"mq-1215","number":1215,"bank":"mq","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803241276880445442","title":"Kafka为什么要抛弃  Zookeeper？","source":"preview","sections":[{"kind":"回答重点","text":"KRaft 把元数据的管理纳入 Kafka 自身，用基于 Raft 的日志在控制器仲裁组复制。由此减少运营一套外部组件的负担，并改变元数据传播和控制器故障恢复路径。"},{"kind":"扩展知识","text":"旧方案依赖 Broker 与 ZooKeeper 的协同。新方案让 Broker 追随元数据日志，运维仍要保证控制器仲裁、磁盘和升级策略。"}],"expanded":false},{"key":"mq-1216","number":1216,"bank":"mq","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803246892680208385","title":"看过源码？那说说 Kafka 处理请求的全流程？","source":"preview","sections":[{"kind":"回答重点","text":"常见 Broker 数据面可从监听、网络处理、请求队列、API handler、存储或等待条件、响应队列、网络回写讲。生产、消费和元数据请求分派到不同处理分支。"},{"kind":"扩展知识","text":"Produce 要验证请求再写对应分区，仍可能等副本确认。Fetch 在数据不足时可能进入延迟等待，等数据或超时再回包，具体线程类名会变。"}],"expanded":false},{"key":"mq-1368","number":1368,"bank":"mq","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803521393330479105","title":"RabbitMQ 中无法路由的消息会去到哪里？","source":"preview","sections":[{"kind":"回答重点","text":"RabbitMQ 无匹配队列时可用 alternate exchange 再尝试路由。如果最终无法路由，AMQP 0-9-1 发布设 mandatory 时 Broker 返回 basic.return，默认这一消息可被丢弃。Publisher confirm 与成功路由是两个判断。"},{"kind":"扩展知识","text":"交换机使用 order.paid 路由键，绑定只有 order.created。生产端接到 basic.return 后记录失败，并修复路由或按策略重发。"}],"expanded":false},{"key":"mq-1369","number":1369,"bank":"mq","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803522489495052290","title":"RabbitMQ 中消息什么时候会进入死信交换机？","source":"preview","sections":[{"kind":"回答重点","text":"常见死信原因有拒绝且不 requeue、消息 TTL 到期、队列容量策略导致丢弃、Quorum Queue 超过投递上限。配置死信交换机与可用路由后，由交换机转发到目标队列。"},{"kind":"扩展知识","text":"消费失败时先区分临时错误与永久错误。永久错误可 nack 并不重入原队列，让死信消费者留存原因、原消息 ID 与来源。"}],"expanded":false},{"key":"mq-1370","number":1370,"bank":"mq","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803525202618343426","title":"说一下 AMQP 协议？","source":"preview","sections":[{"kind":"回答重点","text":"AMQP 定义消息传输的协议语义。RabbitMQ 常见 AMQP 0-9-1 用连接、信道、交换机、队列、绑定描述发送与投递。AMQP 1.0 是不同的协议版本，实体模型与 API 不宜混为一谈。"},{"kind":"扩展知识","text":"客户端保持 TCP 连接，开多个逻辑信道。发布端给交换机与路由键，Broker 根据绑定决定消息进哪一个或多个队列。"}],"expanded":false},{"key":"mq-1371","number":1371,"bank":"mq","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803530785241161729","title":"说一下 RabbitMQ 的事务机制？","source":"preview","sections":[{"kind":"回答重点","text":"AMQP 0-9-1 在信道上用 tx.select 开启事务，tx.commit 提交，tx.rollback 回退未提交的事务操作。它不与应用数据库形成同一个事务。发布路径多用异步 confirms 提高吞吐。"},{"kind":"扩展知识","text":"应用写库后发布时，一次网络故障足以使两边状态不一致。可在本地事务持久化 Outbox，再等 Broker 确认后标记发送成功。"}],"expanded":false},{"key":"mq-1380","number":1380,"bank":"mq","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803765503060598785","title":"RabbitMQ 中主要有哪几个角色或者说概念？","source":"preview","sections":[{"kind":"回答重点","text":"生产者经连接和信道把消息交给交换机，交换机按 binding 和 routing key 交给队列，消费者订阅队列并在需要时确认。vhost 是逻辑命名空间和权限隔离边界。"},{"kind":"扩展知识","text":"日志交换机可绑定审计队列和告警队列，审计收全部，告警只收符合条件的事件。不同队列处理进度相互独立。"}],"expanded":false},{"key":"mq-1388","number":1388,"bank":"mq","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803776657292861442","title":"RabbitMQ 的 routing key 和 binding key 的最大长度是多少字节？","source":"preview","sections":[{"kind":"回答重点","text":"AMQP 0-9-1 把路由键与常见绑定键作为 shortstr 编码，上限是 255 字节。按 UTF-8 字节数判断，避免误以为是 255 个任意字符。"},{"kind":"扩展知识","text":"路由键可选 ASCII 的 tenant.order.paid 等短标识，业务附加信息放消息体或属性。发布和声明绑定都应校验实际字节长度。"}],"expanded":false},{"key":"mq-1414","number":1414,"bank":"mq","position":25,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1803968345437184001","title":"说说 RabbitMQ 的工作模式？","source":"preview","sections":[{"kind":"回答重点","text":"常见教程模式有简单队列、工作队列、发布订阅、按键路由、主题匹配以及 RPC。底层组合来自默认、fanout、direct、topic 等交换机及队列绑定。RPC 还有回复队列和关联 ID。"},{"kind":"扩展知识","text":"多个图片处理进程争一个工作队列，属于负载分摊。一个订单事件同时给通知和积分消费时，需要为两个职责绑定独立队列。"}],"expanded":false},{"key":"mq-1523","number":1523,"bank":"mq","position":26,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1805318051737575426","title":"说说 RabbitMQ 的集群模式？","source":"preview","sections":[{"kind":"回答重点","text":"单个 RabbitMQ 集群共享拓扑与管理视图，队列类型决定消息是否在节点间复制。经典队列常为单副本，旧 classic mirroring 在 RabbitMQ 4.0 移除。现代高可用常用 Quorum Queue，跨区域可另评估 Federation 或 Shovel。"},{"kind":"扩展知识","text":"三节点集群有三个 broker，仍需为重要队列选择三个 quorum 副本，并让它们分布在可独立故障的节点。只加节点无法把单副本队列变成多副本。"},{"kind":"参考资料","text":"[RabbitMQ Quorum Queues](https://www.rabbitmq.com/docs/quorum-queues)"}],"expanded":false},{"key":"mq-1702","number":1702,"bank":"mq","position":27,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1806753671221846017","title":"为什么 RocketMQ 不使用 Zookeeper 作为注册中心呢？而选择自己实现 NameServer？","source":"preview","sections":[{"kind":"回答重点","text":"RocketMQ NameServer 提供集群路由，Broker 定期向各 NameServer 注册，客户端拉取并缓存路由。NameServer 节点之间无需一致性协议同步状态，设计偏简单和可用，可能有暂时不一致的视图。"},{"kind":"扩展知识","text":"Broker 更新路由后，部分客户端要等缓存刷新才能看到变化。RocketMQ 的消息复制和选主另由相应子系统负责，NameServer 的角色是发现路由。"}],"expanded":false},{"key":"mq-1705","number":1705,"bank":"mq","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1807085859591135233","title":"说一下 Kafka 为什么性能高？","source":"preview","sections":[{"kind":"回答重点","text":"Kafka 把数据追加写入分区日志，使用批量、压缩、页缓存与适用条件下的高效传输优化 I/O，多个分区还能并行工作。确认策略、复制、TLS 或小批量会改变收益。"},{"kind":"扩展知识","text":"一条一条等待写确认往返较多。允许在很短延迟预算内攒成批次并压缩，可同时提高网络和磁盘效率，需压测尾延迟。"}],"expanded":false},{"key":"mq-5208","number":5208,"bank":"mq","position":29,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1824003166933868546","title":"RabbitMQ 怎么实现延迟队列？","source":"preview","sections":[{"kind":"回答重点","text":"常见 RabbitMQ 延迟方案是把消息送入没有消费者的等待队列，到 TTL 后通过 DLX 路由到实际工作队列。按固定延时分多个队列可缓解不同 TTL 混用导致的队头阻塞，也可评估受维护的插件或外部调度器。"},{"kind":"扩展知识","text":"超时关闭订单用固定 15 分钟等待队列，到期后消费者重新读订单状态，只关闭未支付订单。TTL 调度存在处理误差且业务必须幂等。"},{"kind":"参考资料","text":"[RabbitMQ 死信交换机](https://www.rabbitmq.com/docs/dlx)"}],"expanded":false},{"key":"mq-11565","number":11565,"bank":"mq","position":30,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1914201809404096514","title":"RocketMQ 的延迟消息是怎么实现的？","source":"preview","sections":[{"kind":"回答重点","text":"RocketMQ 4.x 常按预设延迟级别投递，5.x 可按配置支持指定投递时间。Broker 暂持消息，到期转为可消费的正常消息，延迟范围、精度与积压策略随版本配置而变。"},{"kind":"扩展知识","text":"发送订单超时事件时带预期投递时间。消费时仍检查支付状态，因为延迟期间订单可能已付款，迟到或重复也可能发生。"}],"expanded":false},{"key":"mq-11569","number":11569,"bank":"mq","position":31,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1914227408574390274","title":"RocketMQ 的开发参考了 Kafka，那两者在架构和功能上有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"两者都可用追加日志和分区并行。Kafka 以 partition 保存日志、offset 进度和回放为中心。RocketMQ 提供 CommitLog/ConsumeQueue 结构，并突出业务事务、定时消息等能力。需以版本和交付语义比较。"},{"kind":"扩展知识","text":"流处理流水线可强调 Kafka 可回放和生态。订单事件若看重定时和事务回查，可评估 RocketMQ。实际还要比较吞吐、运维与客户端。"}],"expanded":false},{"key":"rabbit-9502","number":9502,"bank":"rabbit","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081849150304258","title":"RabbitMQ 是什么？它有哪些主要应用场景？","source":"preview","sections":[{"kind":"回答重点","text":"RabbitMQ 是消息中间件。生产者发给交换机，交换机路由到队列，由消费者异步处理。常用在后台任务、削峰以及同一事件分发给多个独立服务。"},{"kind":"扩展知识","text":"用户发起导出，接口返回任务 ID，后台从队列获取后生成文件。失败可重试单个导出任务。"}],"expanded":false},{"key":"rabbit-9503","number":9503,"bank":"rabbit","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081849821392897","title":"RabbitMQ 的基本架构是什么？包括哪些核心组件？","source":"preview","sections":[{"kind":"回答重点","text":"核心链路是生产者、连接与信道、exchange、binding、queue、消费者。交换机负责决定去哪里，队列保存待消费数据，ack 决定已交付消息何时结束。"},{"kind":"扩展知识","text":"把 file.created 发到 topic exchange，缩略图队列与审计队列可各得一份，各自的成功和失败不会混成一个确认。"}],"expanded":false},{"key":"rabbit-9504","number":9504,"bank":"rabbit","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081851079684097","title":"如何在 RabbitMQ 中声明一个队列？有哪些必要参数？","source":"preview","sections":[{"kind":"回答重点","text":"通过 queue.declare 声明名称、durable、exclusive、auto-delete 以及 x-arguments 等参数。服务器可生成空名队列的名称。同名队列重新声明时，声明属性需与已有配置兼容。"},{"kind":"扩展知识","text":"实例临时回复队列可用服务器分配名和排他连接。跨重启的业务队列通常要有稳定名称并启用 durable，类型按耐久需求选。"}],"expanded":false},{"key":"rabbit-9505","number":9505,"bank":"rabbit","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081853218779138","title":"什么是 RabbitMQ 中的消费者和生产者？","source":"preview","sections":[{"kind":"回答重点","text":"生产者按业务组装消息并发布，关注确认与无法路由的返回。消费者订阅队列并处理消息，按完成情况确认或拒绝。两者的可用性与速度无需同步。"},{"kind":"扩展知识","text":"付款服务发付款事件，发票服务先提交发票记录，再 ack。发票服务暂不可用时消息可在队列等待。"}],"expanded":false},{"key":"rabbit-9506","number":9506,"bank":"rabbit","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081853931810818","title":"RabbitMQ 的交换机有哪几种类型？它们的工作方式是什么？","source":"preview","sections":[{"kind":"回答重点","text":"direct 精确比较 routing key，topic 按分段通配符匹配，fanout 不按键区分并分发给所有绑定队列，headers 根据消息头匹配。默认交换机有按队列名路由的特殊绑定。"},{"kind":"扩展知识","text":"order.* 能匹配 order.paid，order.# 能匹配后续多段名称。排查路由时一起看交换机类型、键和绑定版本。"}],"expanded":false},{"key":"rabbit-9507","number":9507,"bank":"rabbit","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081854640648194","title":"在 RabbitMQ 中，如何确保消息不会丢失？","source":"preview","sections":[{"kind":"回答重点","text":"发布端使用 confirms、处理无法路由返回并可靠重发。Broker 用适当的队列类型、持久化及副本。消费端用手动 ack，在业务写入成功后确认。还要有去重、告警和对账。"},{"kind":"扩展知识","text":"进程在提交操作后、ack 前崩溃，重投很正常。幂等键可确保这一消息仍只完成一次效果。"}],"expanded":false},{"key":"rabbit-9508","number":9508,"bank":"rabbit","position":7,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081855202684929","title":"如何在 RabbitMQ 中实现消息的持久化？","source":"preview","sections":[{"kind":"回答重点","text":"经典队列要 durable，重要消息设置 persistent，并用 publisher confirm 观察 Broker 的接收保障。需要副本容错时考虑 quorum queue。交换机和绑定如需重启后可用，也要相应声明。"},{"kind":"扩展知识","text":"仅创建 durable 队列，发送非持久性消息，无法完整保障重启后的消息。恢复测试应按明确的故障边界演练。"}],"expanded":false},{"key":"rabbit-9509","number":9509,"bank":"rabbit","position":8,"priority":true,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081855798276098","title":"RabbitMQ 的消息确认机制是如何工作的？","source":"visible","sections":[{"kind":"回答重点","text":"publisher confirm 确认 Broker 侧发布进度。消费者的 basic.ack 确认此次投递已处理，basic.nack 或 reject 可表明失败及是否重投。delivery tag 是信道内标识，要在对应信道确认。"},{"kind":"扩展知识","text":"发送确认成功表示发布阶段完成相应条件，业务是否成功仍看消费端。记录这两个阶段的延迟有助于定位故障。"},{"kind":"消息到底走到了哪一步","text":"发布者发出“报告已生成”，Broker 接收后可以给发布者 confirm。消费者实际保存通知后才发送消费 ack。发布者收到 confirm 时，消费者可能尚未启动。若消息无匹配路由，也可能收到发布确认，需结合 mandatory 和退回事件核对路由结果。\n\n若消费者已提交数据库事务，但在发送 ack 前断线，Broker 可以重新投递。消费者据业务事件 ID 查到已处理记录后即可确认。把“两段确认”和“业务幂等”连起来，才能解释为什么消息可靠投递后仍可能重复。"},{"kind":"参考资料","text":"[RabbitMQ 消费与发布确认](https://www.rabbitmq.com/docs/confirms)"}],"expanded":true},{"key":"rabbit-9510","number":9510,"bank":"rabbit","position":9,"priority":true,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081857706684418","title":"RabbitMQ 中的 prefetch 参数的作用是什么？","source":"preview","sections":[{"kind":"回答重点","text":"prefetch 控制消费者同时拿到但未确认的投递数。RabbitMQ 常按消费者应用 basic.qos 的预取上限，也支持进一步的信道约束。值太低吞吐不足，太高会增加内存、不公平和故障的重投量。"},{"kind":"扩展知识","text":"单消费者一次只能处理 10 项，设置适度 prefetch 可以补上网络空档。若设置几千，另一台空闲消费者也很难分担已预取的任务。"}],"expanded":false},{"key":"rabbit-9511","number":9511,"bank":"rabbit","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081858268721153","title":"如何在 RabbitMQ 中配置消息的 TTL（过期时间）？","source":"preview","sections":[{"kind":"回答重点","text":"队列可通过策略 message-ttl 或 x-message-ttl 规定消息在其中生存多久，逐条消息还可用 expiration 属性。两者都配置时取较短。x-expires 控制闲置队列自身的到期。"},{"kind":"扩展知识","text":"等候队列设 30 秒 TTL 和 DLX，过期消息进入处理队列。混合多种 TTL 时到期清理与路由可能要等前面的消息，为精确调度应测试。"}],"expanded":false},{"key":"rabbit-9512","number":9512,"bank":"rabbit","position":11,"priority":true,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081858793009154","title":"什么是 RabbitMQ 中的死信队列（DLX）？","source":"preview","sections":[{"kind":"回答重点","text":"DLX 是死信交换机。原队列的消息满足过期、拒绝不重入等条件时转发给 DLX。普通队列绑定到 DLX 后，才承担通常所说的死信队列职责。"},{"kind":"扩展知识","text":"支付通知失败且已超过重试次数，把事件送到死信处理队列，保留失败原因供告警和审计。死信路由也需要绑定、权限和监控。"},{"kind":"参考资料","text":"[RabbitMQ 死信交换机](https://www.rabbitmq.com/docs/dlx)"}],"expanded":false},{"key":"rabbit-9513","number":9513,"bank":"rabbit","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081859908694018","title":"在 RabbitMQ 中，如何实现延迟消息？","source":"preview","sections":[{"kind":"回答重点","text":"可以用等待队列的 TTL 加 DLX 实现固定延迟，也可选部署允许且受维护的延迟能力或外部调度。要测不同 TTL 的队头位置、消息延迟和失败时是否可对账。"},{"kind":"扩展知识","text":"创建订单事件先等 15 分钟，正式处理时再验证是否支付。计时触发和取消业务动作是两个阶段。"}],"expanded":false},{"key":"rabbit-9514","number":9514,"bank":"rabbit","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081861166985218","title":"RabbitMQ 中如何处理未被消费者确认的消息？","source":"preview","sections":[{"kind":"回答重点","text":"手动确认时，未 ack 的消息留在未确认状态。信道或连接关闭后通常重入队列并可再交付。nack 可选择重入或进入死信流程，大量立即重入会造成循环。"},{"kind":"扩展知识","text":"监控 ready 和 unacked。前者大可能消费能力不足，后者大常表示消费者卡在处理，或 prefetch 配置过高。"}],"expanded":false},{"key":"rabbit-9515","number":9515,"bank":"rabbit","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081864778280962","title":"如何在 RabbitMQ 中创建一个镜像队列？","source":"preview","sections":[{"kind":"回答重点","text":"经典镜像队列属于旧版本，通过旧版 HA 策略配置，RabbitMQ 4.0 已移除。新部署使用 quorum queue 等现代复制方案，迁移要新建目标队列并验证切换与兼容性。"},{"kind":"扩展知识","text":"把已有 classic 队列的类型参数直接改为 quorum 常会声明冲突。应规划转发新消息、排空旧队列、验证消费和回滚条件。"},{"kind":"参考资料","text":"[RabbitMQ Quorum Queues](https://www.rabbitmq.com/docs/quorum-queues)"}],"expanded":false},{"key":"rabbit-9516","number":9516,"bank":"rabbit","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081865575198721","title":"什么是 RabbitMQ 中的虚拟主机（vhost）？有什么作用？","source":"preview","sections":[{"kind":"回答重点","text":"vhost 是逻辑隔离单位，队列、交换机、绑定和用户的 configure/write/read 权限按它划分。它通常共享底层集群资源，不等于物理隔离。"},{"kind":"扩展知识","text":"开发和测试可以使用不同 vhost 和凭证，避免同名队列互相影响。资源、合规边界严格时再评估独立集群。"}],"expanded":false},{"key":"rabbit-9517","number":9517,"bank":"rabbit","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081867026427906","title":"RabbitMQ 如何实现消息的路由？有哪些常见的路由策略？","source":"preview","sections":[{"kind":"回答重点","text":"发布请求包含 exchange、routing key 以及属性。交换机按类型和 binding 选目标，可将一条消息交给多个队列。无法路由要设计 mandatory return 或 alternate exchange。"},{"kind":"扩展知识","text":"用 topic 把 account.payment.failed 路给告警，把 account.# 送审计。通过真实测试消息确认两条路径和异常返回。"}],"expanded":false},{"key":"rabbit-9518","number":9518,"bank":"rabbit","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081868616069122","title":"RabbitMQ 中的持久化队列与非持久化队列有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"durable 队列元数据能跨 Broker 重启，非 durable 队列自身不会保留。队列是否保留和队内消息是否持久是两个维度，auto-delete、exclusive 也会影响生命周期。"},{"kind":"扩展知识","text":"临时响应队列可随连接清理，业务任务队列需要持久声明。选经典队列时，还要为重要消息设置持久性并确认写入。"}],"expanded":false},{"key":"rabbit-9519","number":9519,"bank":"rabbit","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081869287157761","title":"如何在 RabbitMQ 中处理消息的重复消费问题？","source":"preview","sections":[{"kind":"回答重点","text":"重复常来自确认丢失、重试和故障重投，消费者用业务事件 ID、最终状态约束或 Inbox 去重。业务事务提交后 ack。redelivered 可辅助观察，不能单独用它判重。"},{"kind":"扩展知识","text":"依据订单扣减库存，每笔订单生成一个固定操作 ID。唯一索引避免多个消费者同时对重复消息扣减两次。"}],"expanded":false},{"key":"rabbit-9520","number":9520,"bank":"rabbit","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081871292035073","title":"在 RabbitMQ 中，如何防止消息堆积？","source":"preview","sections":[{"kind":"回答重点","text":"看发布速率、确认速率、ready、unacked 和最老消息年龄。优化慢下游、调整 prefetch，增加合理并发。过载时限流与容量保护，坏消息延迟重试或送死信。"},{"kind":"扩展知识","text":"消费任务经常等待数据库，盲目增加消费者会进一步塞满连接池。先降每任务查询次数，用压测结果确定并发上限。"}],"expanded":false},{"key":"rabbit-9521","number":9521,"bank":"rabbit","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081874630701058","title":"RabbitMQ 中的消息如何确保顺序性？","source":"preview","sections":[{"kind":"回答重点","text":"顺序要区分入队、投递、处理完成。单队列正常遵守队列顺序，但多消费者、优先级、重投改变观察结果。同实体分队列、单活消费者或应用端按版本串行可保护关键顺序。"},{"kind":"扩展知识","text":"订单 42 两条消息即使先后投递，第二条可能先完成。消费端可比较事件版本并对乱序做等待或补读。"}],"expanded":false},{"key":"rabbit-9522","number":9522,"bank":"rabbit","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081876551692289","title":"如何在 RabbitMQ 中设置队列的最大长度？","source":"preview","sections":[{"kind":"回答重点","text":"通过策略设置 max-length 或 max-length-bytes，也可根据队列类型与场景设置对应声明参数。还要选 overflow 行为，如淘汰头部或拒绝发布，确认发布端能处理错误。"},{"kind":"扩展知识","text":"状态广播可允许丢掉过旧状态，支付指令通常应拒绝新发布并由生产者补偿。上限统计和未确认项语义按版本文档核对。"}],"expanded":false},{"key":"rabbit-9523","number":9523,"bank":"rabbit","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081882339831810","title":"在 RabbitMQ 集群中，节点间如何同步数据？","source":"preview","sections":[{"kind":"回答重点","text":"区分集群共享的队列定义、策略等元数据与消息数据。Quorum Queue 由 leader 向成员复制日志并用多数派提交。经典单副本队列的消息驻留在其承载节点。"},{"kind":"扩展知识","text":"在节点 A 上连接并发送，队列 leader 可能在 B，由集群转发。既要观察客户端连接健康，也要观察该队列的副本和 leader。"}],"expanded":false},{"key":"rabbit-9524","number":9524,"bank":"rabbit","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081883321298946","title":"RabbitMQ 的流控机制（Flow Control）是什么？为什么需要它？","source":"preview","sections":[{"kind":"回答重点","text":"当队列持久化、内存或网络跟不上时，Broker 可减慢发布连接或发出资源报警，减少压垮节点的风险。客户端需监控阻塞、确认延时并设置有限的重试。"},{"kind":"扩展知识","text":"磁盘低于水位时，部分发布连接可能阻塞。若所有发布请求无重试上限地重发，会加重排队，应该由 Outbox 保留待投递业务事件。"}],"expanded":false},{"key":"rabbit-9525","number":9525,"bank":"rabbit","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081884185325570","title":"如何在 RabbitMQ 中实现消息的批量消费？","source":"preview","sections":[{"kind":"回答重点","text":"AMQP 0-9-1 消费者通常接收单条投递，应用可设 prefetch 并在短时间窗积累批次，批量写业务库后确认。multiple 确认只适用于同信道内所有覆盖标签都已安全完成。"},{"kind":"扩展知识","text":"积累 50 条或等待 100 毫秒就批量处理。若其中一条失败，不能批量确认跨过这条仍未完成的数据。"}],"expanded":false},{"key":"rabbit-9526","number":9526,"bank":"rabbit","position":25,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081885150015489","title":"什么是 RabbitMQ 中的分区问题？如何解决？","source":"preview","sections":[{"kind":"回答重点","text":"分区指节点仍运行却相互不可达。少数派的可用性、数据一致性和恢复取决于队列类型、元数据模式和版本。Quorum Queue 少数派不能提交。集群应部署在低延迟可靠网络中。"},{"kind":"扩展知识","text":"三个成员中 A 与另外两个失联，B、C 多数仍可形成可用路径。跨区域高延迟链路应评估 Federation 等异步方案及恢复语义。"}],"expanded":false},{"key":"rabbit-9527","number":9527,"bank":"rabbit","position":26,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081886068568066","title":"RabbitMQ 如何与其他消息队列（如 Kafka）进行对比？它们适用的场景有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"RabbitMQ 擅长可路由的任务、命令与 per-message 确认。Kafka 偏追加日志、按分区留存、消费组位点和长期回放。它们都能异步解耦，按吞吐、留存和失败处理选择。"},{"kind":"扩展知识","text":"任务分派要求按路由键给选择的消费者，RabbitMQ 较直观。分析 Clickstream 要保留多天给多个独立消费者回放，Kafka 日志模型自然。"}],"expanded":false},{"key":"rabbit-9528","number":9528,"bank":"rabbit","position":27,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081891315642369","title":"RabbitMQ 的镜像队列和 Quorum Queue 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"经典镜像队列是历史高可用机制，以镜像追随主副本，4.0 移除。Quorum Queue 采用 Raft 和多数派提交，支持可预测的领导者切换，也有副本与写入成本。"},{"kind":"扩展知识","text":"三成员 quorum 可容忍一个成员失效。维护时同时停两台会失去多数派，滚动升级需要逐台检查副本状态。"},{"kind":"参考资料","text":"[RabbitMQ Quorum Queues](https://www.rabbitmq.com/docs/quorum-queues)"}],"expanded":false},{"key":"rabbit-9529","number":9529,"bank":"rabbit","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1850081848441466881/question/1850081892171280385","title":"RabbitMQ 的高可用集群模式有哪些？如何实现？","source":"preview","sections":[{"kind":"回答重点","text":"现代单集群常用三节点以上、关键队列使用多副本 quorum、客户端多地址重连。跨集群结合 Federation、Shovel 或应用层事件复制，明确它们的异步性、故障范围及恢复时效。"},{"kind":"扩展知识","text":"单机掉电与整站点不可用是两种演练。前者看 leader 切换与客户端恢复，后者验证备份、异地重放和可能的数据损失窗口 e},{"key":"scenario-4945","number":4945,"bank":"scenario","position":14,"priority":true,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1821408560444809217","title":"即时通讯项目中怎么实现历史消息的下拉分页加载？","source":"preview","sections":[{"kind":"回答重点","text":"用会话与稳定的消息序列做游标。上一页最旧的消息作为边界，按序查更早的有限条目。"},{"kind":"扩展知识","text":"索引可建在会话 ID 和序列上。并发新消息不会推移历史边界，客户端按消息 ID 去重。"},{"kind":"下拉下一页应该拿什么当边界","text":"假设第一页拿到序号 100 到 81。下一次按同一会话查询序号小于 81 的最近 20 条，同时有新消息 101 到达，也不会推移这一页的边界。只有时间戳时，同一毫秒可能有多条记录，可用时间戳加唯一 ID 作联合游标。\n\n与断线补读方向相反：下拉历史要读更小的序号，恢复实时流要读大于最后确认序号的记录。两者都应检查请求者仍有权访问该会话。"}],"expanded":true},{"key":"scenario-9801","number":9801,"bank":"scenario","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1854417729925881858","title":"HashMap 是不是线程安全的？如果让你来实现一个线程安全的 HashMap 你要怎么设计？如果不用加锁你要怎么设计？","source":"preview","sections":[{"kind":"回答重点","text":"普通 HashMap 并发写读不安全。可用并发容器、分片锁或不可变快照。如果要求应用不直接加锁，可选 CAS 快照或合适的并发实现。"},{"kind":"扩展知识","text":"读多写少时快照便于读，写频繁时大拷贝代价高。涉及多个键的一致性需要额外边界。"}],"expanded":false},{"key":"scenario-11183","number":11183,"bank":"scenario","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1891761559626002433","title":"接口变慢了应该如何排查？导致接口变慢的原因有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"先确定慢的范围、开始时间和分位数，再按 Trace 分解网关、应用内部排队、SQL、缓存和外部调用。同时对照流量、资源和发布。先保护受影响接口，再根据证据改动并复测。"},{"kind":"扩展知识","text":"p99 从 200 毫秒升到 2 秒，看慢请求的 span。若连接池排队占 1.8 秒，优化 JSON 序列化就不会改变主要耗时。"}],"quote":"硬件资源、网络、应用程序代码、数据库","expanded":false},{"key":"scenario-11209","number":11209,"bank":"scenario","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1896861989806215170","title":"编写一段代码，使得这段代码必定会产生死锁，不能使用Thread.sleep()","source":"preview","sections":[{"kind":"回答重点","text":"用两把锁和 CountDownLatch(2)。线程 A 进入 synchronized(a)，线程 B 进入 synchronized(b)。两者在持有各自锁时先 countDown，再 await，计数归零后分别尝试获得 b、a。这样形成循环等待。"},{"kind":"扩展知识","text":"屏障保证两方都持有第一把锁才尝试第二把，取消了“依赖睡多久”的时序假设。演示可用 daemon 线程和线程转储检查，不在生产请求线程运行。"},{"kind":"示例代码","text":"```java\nimport java.lang.management.ManagementFactory;\nimport java.util.concurrent.CountDownLatch;\n\nclass DeadlockDemo {\n    private static void lockBoth(Object first, Object second, CountDownLatch ready) {\n        synchronized (first) {\n            ready.countDown();\n            try {\n                ready.await();\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return;\n            }\n            synchronized (second) {\n                throw new AssertionError(\"两个线程都持有第一把锁\");\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        var a = new Object();\n        var b = new Object();\n        var ready = new CountDownLatch(2);\n        var first = new Thread(() -\u003e lockBoth(a, b, ready));\n        var second = new Thread(() -\u003e lockBoth(b, a, ready));\n        first.setDaemon(true);\n        second.setDaemon(true);\n        first.start();\n        second.start();\n\n        var monitor = ManagementFactory.getThreadMXBean();\n        while (monitor.findMonitorDeadlockedThreads() == null) {\n            Thread.yield();\n        }\n        System.out.println(\"检测到死锁\");\n    }\n}\n```"}],"expanded":false},{"key":"scenario-11720","number":11720,"bank":"scenario","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1924670464916062209","title":"现在手头上有一个单体项目，系统的整体 QPS 到了 1 万了，要微服务化拆分吗？","source":"preview","sections":[{"kind":"回答重点","text":"1 万 QPS 只是现象，先看 SLO、CPU、连接池、数据库和增长曲线。单体可水平扩容、缓存、拆模块或异步化。只有故障域、独立扩展、发布节奏或团队隔离有清楚价值时逐步拆服务。"},{"kind":"扩展知识","text":"若请求大半都是读缓存，机器余量足，可继续模块化单体。如果报表峰值反复影响交易，则可能先把报表工作负载独立。"}],"expanded":false},{"key":"scenario-11705","number":11705,"bank":"scenario","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1921865492917030913","title":"系统每天晚上都会有一小时左右的时间瘫痪，你觉得可能的原因是什么？有遇到过这样的情况吗？","source":"preview","sections":[{"kind":"回答重点","text":"规律性故障先按时间线关联任务、备份、批处理、日志轮转、证书检查、定点的缓存过期和外部流量。验证前后资源、锁、I/O、错误率与慢 Trace。找到重复关联后做受控移动时间或限并发。"},{"kind":"扩展知识","text":"每天 02:00 备份开始后磁盘延迟和 DB 连接等待一起升高。将备份调到不同时间并限速，观察故障是否随之移动或消失。"}],"quote":"周期性操作或资源瓶颈","expanded":false},{"key":"scenario-11716","number":11716,"bank":"scenario","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1924306376057065474","title":"现在有 40 亿个 QQ 号，给你 1G 的内存，如何实现去重？","source":"preview","sections":[{"kind":"回答重点","text":"若 QQ 号确实落在可用 32 位无符号空间，整域 Bitmap 约 512 MiB。读入一个号就检查和设置其位，可单趟去重并按需输出。范围更大或稀疏时，用哈希/范围分桶到磁盘，逐桶精确去重。"},{"kind":"扩展知识","text":"1 GiB 足以容纳 2³² 位和一些批处理缓冲；并不等于能储存 40 亿个 4 字节整数。布隆过滤器有误判，要求精确不能单独用。"}],"expanded":false},{"key":"scenario-11691","number":11691,"bank":"scenario","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1920758567711932418","title":"在 Java 中，不使用锁如何实现一个线程安全的单例？","source":"preview","sections":[{"kind":"回答重点","text":"不显式加锁可以用静态内部类 Holder 或 enum。Holder 首次访问时利用 JVM 的类初始化保证一次发布。enum 简单，并有语言提供的实例和序列化语义。也可用 CAS 管理唯一引用，但构造副作用需另外设计。"},{"kind":"扩展知识","text":"调用 getInstance 时才读取 Holder.INSTANCE。并发首次访问由类初始化协调，调用方无需自己在每次访问上同步。"}],"expanded":false},{"key":"scenario-11710","number":11710,"bank":"scenario","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1923242337547452418","title":"如果要实现一个抢红包的功能，红包金额是如何计算的？","source":"preview","sections":[{"kind":"回答重点","text":"整数分存金额，固定额按人数确定并处理余数。随机红包可用二倍均值法或预先按规则切分，每次保留剩余人至少一份最小金额，最后一个拿余款。领取时原子更新次数与余额，按用户去重。"},{"kind":"扩展知识","text":"100 分发 3 个，每次随机上限同时受“剩余金额可以给其他人各 1 分”约束。随机算法的公平口径、上限和期望应提前确认。"}],"quote":"公平性 和 总额控制","expanded":false},{"key":"scenario-454","number":454,"bank":"scenario","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1780933294766977025","title":"让你设计一个 HashMap ，怎么设计？","source":"preview","sections":[{"kind":"回答重点","text":"计算 key 哈希后定位桶，用拉链或开放寻址解决冲突，达到负载阈值时扩容。查找时对候选键做相等性判断。"},{"kind":"扩展知识","text":"冲突堆积会拖慢查询，扩容会增加瞬时工作量。合理初始容量和良好哈希可降低长尾。"}],"expanded":false},{"key":"scenario-1730","number":1730,"bank":"scenario","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1807672527650004993","title":"线上业务服务器 CPU 飙高如何排查？","source":"preview","sections":[{"kind":"回答重点","text":"先限流、隔离或回滚止损。用监控确定是用户 CPU、系统 CPU、GC 还是容器限额，再定位忙进程和线程，用线程栈/采样剖析核对热点。关联流量与发布并复测。"},{"kind":"扩展知识","text":"若 CPU profile 大量时间在同一个序列化方法，比较请求对象尺寸和版本。若线程大多在 I/O 等待，单看 CPU 高不能解释全部症状。"}],"expanded":false},{"key":"scenario-11712","number":11712,"bank":"scenario","position":25,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1923315698594385922","title":"线上 CPU Load 飙高如何排查？","source":"preview","sections":[{"kind":"回答重点","text":"Linux load average 统计处于可运行和不可中断睡眠的任务数的时间平滑值。先和核数、CPU 使用率及 iowait 对照，再看阻塞任务、磁盘、网络存储与调度队列。"},{"kind":"扩展知识","text":"8 核机器 load 40 且 CPU 很闲，检查 D 状态和 I/O 延迟。load 40 且 CPU 满，重点检查运行队列、热点程序和容器 CPU quota。"}],"expanded":false},{"key":"scenario-11718","number":11718,"bank":"scenario","position":26,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1924404806943150081","title":"系统上线后，发现某个接口响应很慢，你如何定位可能的原因，以及对应的解决思路？","source":"preview","sections":[{"kind":"回答重点","text":"把总耗时拆到入口、线程池排队、应用函数、数据库、缓存与第三方。按慢请求 Trace 找最耗时的 span，结合慢 SQL、线程栈和依赖监控判断。对比同负载优化前的尾延迟。"},{"kind":"扩展知识","text":"上线后只有某参数的查询慢，拿实际参数看执行计划和扫描行数。如果所有接口一起慢，先看共享资源和发布改动。"}],"quote":"分层排查+指标监控","expanded":false},{"key":"scenario-11692","number":11692,"bank":"scenario","position":27,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1920772653550309378","title":"如果项目需要你实现敏感词过滤功能，如何实现？","source":"preview","sections":[{"kind":"回答重点","text":"词库小可遍历匹配，量大可用 Trie/AC 自动机一次扫描找多个词。在输入侧约定大小写、Unicode 与分隔规则，处理词库热更新、误报和人工复核。"},{"kind":"扩展知识","text":"同一段文本同时匹配一个短词和它的更长词时，决定最长命中、全部命中或审核标记。测试要包含变体和正常上下文。"}],"expanded":false},{"key":"scenario-11693","number":11693,"bank":"scenario","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1920799091749982210","title":"如果现在有 500G 数据需要排序，但是你只有 4G 内存，如何实现？","source":"preview","sections":[{"kind":"回答重点","text":"使用外部归并排序。按可用内存分批读数据、排序并写成有序文件，然后用小顶堆作多路归并，文件过多时分轮合并。事前估算临时盘空间、读写量和句柄。"},{"kind":"扩展知识","text":"500 GB 分成每段 2 GB 大约产生 250 个有序段。每路保留缓冲，通过当前最小记录持续出流，整体无须一次装进 4 GB。"}],"expanded":false},{"key":"scenario-11695","number":11695,"bank":"scenario","position":29,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1921064474499256322","title":"项目上现在需要存储 IP 地址，数据库应该用什么类型来存储？","source":"preview","sections":[{"kind":"回答重点","text":"IPv4 可存无符号 32 位整数。IPv6 可存 16 字节二进制，兼容两种地址时可统一二进制表示并约定映射策略。MySQL 可用 INET6_ATON/INET6_NTOA 转换。"},{"kind":"扩展知识","text":"同一 IPv6 地址有不同的文本缩写。统一按二进制比较便于去重，若按段筛选则还需约定网段表示和索引。"}],"quote":"IPv4和IPv6的最优存储类型","expanded":false},{"key":"scenario-751","number":751,"bank":"scenario","position":30,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1797465845035827202","title":"一笔订单，在取消的那一刻用户刚好付款了，怎么办？","source":"preview","sections":[{"kind":"回答重点","text":"让订单状态变更以条件更新或事务竞争同一记录。取消只允许待付款变已取消，支付回调只允许合法转换。支付渠道实际收款而本地已取消时，从对账或回调进入幂等退款。"},{"kind":"扩展知识","text":"先核验回调与支付单，再根据受影响行数判断是谁完成状态转换。退款也用稳定 ID 和状态机，不能假设一次回调必成功。"}],"expanded":false},{"key":"scenario-9812","number":9812,"bank":"scenario","position":31,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1856228340908228610","title":"如何避免用户重复下单（多次下单未支付，占用库存）","source":"preview","sections":[{"kind":"回答重点","text":"前端按钮禁用可减少误触，后端用业务请求 ID 幂等、对用户和商品限制同时开放的订单数，并用唯一约束或原子状态操作保证并发正确。超时取消后释放预占。"},{"kind":"扩展知识","text":"同一用户重复点两下，两次都用同一个幂等键。第二次返回已创建的原订单，库存仍只预占一次。"}],"expanded":false},{"key":"scenario-725","number":725,"bank":"scenario","position":32,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1795660206586503170","title":"线上发现 Redis 机器爆了，如何优化？","source":"preview","sections":[{"kind":"回答重点","text":"先读 Redis CPU、内存、网络、延迟和主从状态，判断是热点、大键、昂贵命令、集群切换或机器资源。先限流、降级、加容量止损，再对症优化。"},{"kind":"扩展知识","text":"单分片网卡打满而其他节点闲，找大值和热点键。能分片的数据拆热点，纯查询可合并或短时本地缓存，再观察命中与数据时效。"}],"expanded":false},{"key":"scenario-727","number":727,"bank":"scenario","position":33,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1795715838014431233","title":"项目上有个导出 excel 场景发现很慢，怎么优化？","source":"preview","sections":[{"kind":"回答重点","text":"量出数据库分页读取、业务变换和 XLSX 序列化耗时。对 SQL 做索引和游标分页，减少列和重复查询，流式写入文件。大导出后台执行，结果带授权下载。"},{"kind":"扩展知识","text":"导出百万行时每批读 1000 行，使用流式 XLSX writer。单 Sheet 有行数上限，超出可多 Sheet、分文件或改 CSV。"}],"expanded":false},{"key":"scenario-728","number":728,"bank":"scenario","position":34,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1795728040788271105","title":"项目上需要导入一个几百万数据 excel 文件到数据库中，有哪些注意点？","source":"preview","sections":[{"kind":"回答重点","text":"按行或分批流式解析，先校验列、类型和业务键，再批写并记录成功量与断点。限制内存、事务大小、数据库写入并发，错误行单独输出。"},{"kind":"扩展知识","text":"第 700 批失败时，用作业 ID 和业务唯一键恢复失败批，已提交的 699 批不再重复产生订单。对比输入、成功、失败和跳过数。"}],"expanded":false},{"key":"scenario-729","number":729,"bank":"scenario","position":35,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1795733216311943169","title":"如果一笔订单，用户在微信和支付宝同时支付，会怎么样？","source":"preview","sections":[{"kind":"回答重点","text":"第三方支付渠道独立，可能各自收款成功。本地按订单号锁定状态转换和唯一成功记录，分别核验支付单，发现额外资金走退款与对账。不要仅依赖前端切换支付方式。"},{"kind":"扩展知识","text":"微信回调先到后记录成功，支付宝晚到发现订单已用另一支付单确认。保存两笔渠道流水，退回多收款且确保重复退款请求幂等。"}],"expanded":false},{"key":"scenario-752","number":752,"bank":"scenario","position":36,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1797473188553293825","title":"假设有一个 1G 大的 HashMap，此时用户请求过来刚好触发它的扩容，会怎样？让你改造下 HashMap 的实现该怎样优化？","source":"preview","sections":[{"kind":"回答重点","text":"典型 Java HashMap 扩容会分配更大表并迁移桶，触发 put 的线程承担开销，可能带来长停顿和临时内存增长。可预估容量、分片表，或用增量迁移的成熟结构。"},{"kind":"扩展知识","text":"增量 rehash 允许旧表、新表暂时并存，每次操作迁移少量桶，读取要考虑双表。并发版还要定义迁移与读写的可见性。"}],"expanded":false},{"key":"scenario-9813","number":9813,"bank":"scenario","position":37,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1856282033593380866","title":"微服务中远程调用的超时时间应该设置为多少合适？","source":"preview","sections":[{"kind":"回答重点","text":"超时应从端到端的延迟 SLO、历史分位、网络与依赖容量分配。区分连接、握手、读写和整次请求的超时。重试加退避，只用剩余预算并确认安全重试。"},{"kind":"扩展知识","text":"入口 500 毫秒响应预算，网关与应用耗 60 毫秒，依赖两段串行调用就不能各配置 500 毫秒。需要留失败返回与一次重试的空间。"}],"expanded":false},{"key":"scenario-783","number":783,"bank":"scenario","position":38,"priority":true,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1797902903277649922","title":"从网关再到各个后端服务，如何设置 RPC 的超时时间，要考虑哪些问题？","source":"preview","sections":[{"kind":"回答重点","text":"客户端 deadline 贯穿网关和下游。网关扣掉本地处理与回包预算，将剩余时间交给 RPC。串行按总和估算，带依赖的并行按关键路径，继续传递取消与 Trace。"},{"kind":"扩展知识","text":"入口 800 毫秒，网关处理 50、预留回包 50，后端最多用 700 毫秒。若 RPC 同时调用两方，快方成功不代表可以忽略慢方的尾延迟。"}],"expanded":false},{"key":"scenario-473","number":473,"bank":"scenario","position":39,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1780933294901194754","title":"让你设计一个线程池，怎么设计？","source":"preview","sections":[{"kind":"回答重点","text":"线程池用工作线程反复处理任务。设计队列、核心／最大并发、拒绝、超时和停止语义。"},{"kind":"扩展知识","text":"CPU 密集任务看核数，I/O 密集还看阻塞时间、连接池和下游承载。队列设上限，过载时可拒绝或降级。"}],"expanded":false},{"key":"scenario-893","number":893,"bank":"scenario","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1799763214902566914","title":"如果没有内存限制，如何快速、安全地将 1000 亿条数据插入到 HashMap 中？","source":"preview","sections":[{"kind":"回答重点","text":"即使内存充足，常规 Java HashMap 仍有数组和 size 上限，也难承受超大扩容。用稳定哈希把 1000 亿条映射到多个预估容量的 Map，每分片控制并发与所有权。"},{"kind":"扩展知识","text":"按高位取 1024 个分片，平均每片约 9766 万条，仍需估算负载不均和实际对象成本。CPU、GC 与写入校验都会占时间，批量路径要测。"}],"expanded":false},{"key":"scenario-785","number":785,"bank":"scenario","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1797943801076121602","title":"线上数据库连接池爆满问题排查","source":"preview","sections":[{"kind":"回答重点","text":"先看活跃、空闲、等待连接数量与借用时长。按 Trace 和数据库会话判断流量突增、慢 SQL、长事务、连接泄漏或网络。有限限流、降级可以先止损，盲目加池会压垮数据库。"},{"kind":"扩展知识","text":"活跃连接高且数据库 CPU 不高时，看各请求是否借着连接去等外部接口或锁。把远程调用移出事务并验证连接归还。"}],"expanded":false},{"key":"scenario-3179","number":3179,"bank":"scenario","position":42,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1813456791649378305","title":"如何实现数据库的不停服迁移？","source":"preview","sections":[{"kind":"回答重点","text":"先看数据量，再看迁移期间的新写入、校验和回切。原站举双写加灰度切流。这个思路要处理并发写入、两边部分失败和切换后新数据的回流。"},{"kind":"扩展知识","text":"双写需要记录失败并补偿，避免任意一侧成功就被视为完成。也可采用“全量快照 + binlog CDC”来传送增量，将写入所有权从旧库交给新库。下面按这种做法展开。\n\n**实施步骤**　\n\n1. 检查目标表、字符集、权限、索引和容量，确定切换阈值及回退条件。\n2. 建立快照并记录对应位点。分页回填、限流，同时保留 binlog 并接收增量事件。\n3. 追平时确保同键顺序、幂等与删除语义。用分段行数、校验和及业务统计对账。\n4. 先影子读比较结果，再在切换窗口通过路由、写入栅栏和连接排空交接。确需确保零停写时，业务入口可接收并排队，按顺序恢复写入。\n5. 通过反向同步、已验证的回放计划或保留新写入日志支持回退，持续观察错误率、延迟和积压。\n\n[Debezium · MySQL 快照与增量捕获](https://debezium.io/documentation/reference/stable/connectors/mysql.html)"}],"expanded":false},{"key":"scenario-616","number":616,"bank":"scenario","position":43,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1780933295521951745","title":"MySQL 中如何进行 SQL 调优？","source":"preview","sections":[{"kind":"回答重点","text":"流程是定位慢 SQL、看执行计划、再针对问题动手。目标是少读数据和少做无效计算。索引优化可从联合索引的列次序以及能否覆盖所需字段入手。"},{"kind":"扩展知识","text":"**例子与追问**　订单按账号和时间查，现有 `WHERE account_id=? AND DATE(created_at)=?`。可改为原列上的半开区间并验证 `(account_id, created_at)`，同时只取所需列。多表查询还要看基数误估与驱动顺序。若瓶颈是锁阻塞，检查事务长度与访问顺序，单纯调整索引未必能解决。\n\n[MySQL 手册 · SQL 优化](https://dev.mysql.com/doc/refman/8.4/en/statement-optimization.html)"}],"quote":"先定位慢 SQL、再分析执行计划、最后针对性优化","expanded":false},{"key":"scenario-630","number":630,"bank":"scenario","position":44,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1780933295572283394","title":"MySQL 中如何解决深度分页的问题？","source":"preview","sections":[{"kind":"回答重点","text":"深分页的开销来自先读大量结果再丢弃。原站先举用子查询缩小取行成本的办法。先沿较窄的索引找起点或本页主键，再回到聚簇索引读取需要的列。"},{"kind":"扩展知识","text":"能连续翻页时，用上一页的唯一排序键开启下一个范围扫描。有任意跳页要求时，覆盖索引加延迟回表可减小逐行读取成本，也可为固定查询保存页锚点。\n\n**例子与追问**　如果按 `id` 升序，下一页可用 `WHERE id \u003e ? ORDER BY id LIMIT 20`。必须保留偏移量时，可以先在 `(tenant_id, created_at, id)` 上按租户、时间、ID 取得 20 个主键，再 JOIN 原表并在外层重复排序。延迟回表减少了取行成本，扫描偏移的成本仍随偏移量增长。全量导出适合分段流式读取。\n\n[MySQL 手册 · LIMIT 优化](https://dev.mysql.com/doc/refman/8.4/en/limit-optimization.html)"}],"expanded":false},{"key":"scenario-598","number":598,"bank":"scenario","position":45,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1780933295463231490","title":"MySQL 中使用索引一定有效吗？如何排查索引效果？","source":"preview","sections":[{"kind":"回答重点","text":"索引是否被选用由成本决定。小表、命中比例高或需要大量回表时，扫表可能更便宜。统计信息偏差也会让优化器误估成本。排查从 `EXPLAIN` 下手，看候选索引和实际使用的访问路径。"},{"kind":"扩展知识","text":"**排查步骤**　对真实参数运行 `EXPLAIN`，看 `possible_keys`、`key`、`key_len`、`rows`、`filtered`。在受控环境用 `EXPLAIN ANALYZE` 核对实际行数与循环。常见改写是把 `DATE(created_at)='2026-01-01'` 改为与业务时区一致的半开时间区间，或让绑定参数类型与索引列匹配。分布变化时检查统计信息，再按需要分析表或建立直方图，最后用同口径负载复测。\n\n[MySQL 手册 · EXPLAIN 输出](https://dev.mysql.com/doc/refman/8.4/en/explain-output.html)"}],"expanded":false},{"key":"scenario-787","number":787,"bank":"scenario","position":46,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1797947062881484801","title":"每次进入订单列表页面都会触发全量同步？","source":"preview","sections":[{"kind":"回答重点","text":"订单列表查询带来全量同步，先对照 Trace 看是谁在读取路径触发同步，确认范围、请求参数和兜底逻辑。把全量刷新改为单独任务、按游标增量或缺失范围回填。"},{"kind":"扩展知识","text":"首屏访问时若本地水位为空就每次发全量，应把 bootstrap 状态持久化并对重复触发做合并。页面随后读已同步的结果。"}],"expanded":false},{"key":"scenario-796","number":796,"bank":"scenario","position":47,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1798182188865421313","title":"JDK 序列化问题排查","source":"preview","sections":[{"kind":"回答重点","text":"核对异常类型、类名、serialVersionUID、序列化数据来源和新旧版本，复现生产滚动发布的读写组合。长期数据更适合稳定 schema、版本标记和可测试的兼容协议。"},{"kind":"扩展知识","text":"新节点能读新数据、旧节点读不了时，先恢复旧格式输出或兼容读，等缩容旧节点后再切写入格式。"}],"expanded":false},{"key":"scenario-797","number":797,"bank":"scenario","position":48,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1798184874058842113","title":"Spring Cloud Gateway 500 问题排查","source":"preview","sections":[{"kind":"回答重点","text":"先用请求 ID 关联网关、后端和依赖日志，区分本地 filter 异常、发现失败、网络错误和后端 500。观察状态码、路由、连接解析、堆栈与发布时间。"},{"kind":"扩展知识","text":"仅某路由失败时对比当前后端实例列表和健康状态。若只有某节点失败，看 DNS、进程资源、连接池和异常栈，缩小范围后再修。"}],"expanded":false},{"key":"scenario-996","number":996,"bank":"scenario","position":49,"priority":true,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1800848932970242050","title":"线上消息队列故障，兜底改造方案","source":"preview","sections":[{"kind":"回答重点","text":"业务数据和待发送消息写同一数据库事务，发布由后台任务/CDC 驱动。收到 Broker confirm 后标记成功，超时保留重试，记录次数、退避、告警和死信。消费端按事件 ID 幂等。"},{"kind":"扩展知识","text":"MQ 升级期间接口仍可提交订单，Outbox 随流量增大。恢复后按受控速率补发，使用订单和事件计数对账。"},{"kind":"Outbox 如何跨过两个崩溃窗口","text":"订单和待发布事件在同一个数据库事务内提交。若服务随后崩溃，后台发布者仍能找到事件。若发布者已把事件交给队列、却在标记成功前崩溃，重启后可能再发一次，所以消费者需要用相同事件 ID 去重。\n\n以最老待发事件的年龄和待发总数做监控，比单看发布成功率更容易发现悄悄积压。恢复放量时还要给实时流量留容量。"}],"expanded":true},{"key":"scenario-169","number":169,"bank":"scenario","position":50,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1772882950057148418","title":"如何设计一个点赞系统？","source":"preview","sections":[{"kind":"回答重点","text":"用用户和目标的唯一键记录点赞，计数可同步或异步更新。把点赞和取消设计成最终状态设置，支持重复请求。"},{"kind":"扩展知识","text":"读模型可缓存状态和计数。用唯一事件、版本和定期对账控制重复或乱序带来的计数偏差。"}],"expanded":false},{"key":"scenario-4683","number":4683,"bank":"scenario","position":51,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1818990174270726145","title":"怎么分析 JVM 当前的内存占用情况？OOM 后怎么分析？","source":"preview","sections":[{"kind":"回答重点","text":"先区分 Java 堆、元空间、直接内存和容器 OOM。用 jstat、GC 日志和指标看趋势，通过 heap dump 与 MAT 等看支配对象和引用路径，原生内存看 NMT 或 OS 指标。"},{"kind":"扩展知识","text":"如果老年代 Full GC 后仍增长，在可用节点受控取快照比对主要对象。如果被容器杀死还要看 RSS 与 cgroup 事件。"}],"expanded":false},{"key":"scenario-520 sections":[{"kind":"回答重点","text":"先确定从哪里测 1 毫秒和哪个延迟分位。按关键路径拆 1 秒，定位阻塞、依赖和工作量，再选择预计算、本地缓存、并行化或重新定义接口的同步边界。"},{"kind":"扩展知识","text":"若需要跨洲依赖并同步计算，物理往返就可能超过目标。返回已缓存值可接近目标，但要明确缓存命中、数据时效和安全边界。"}],"expanded":false},{"key":"scenario-11824","number":11824,"bank":"scenario","position":78,"priority":true,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1933460494523891713","title":"WebSocket 知道吗？如果让你设计一个 IM 协议，你会考虑什么？","source":"preview","sections":[{"kind":"回答重点","text":"定义连接鉴权、消息 ID/序号、会话路由、心跳、背压、发送与接收确认、离线历史和补读。WebSocket 用双向长连接传递帧，消息语义由应用协议负责。"},{"kind":"扩展知识","text":"客户端断线前收到序号 42，重连带最后确认位置补 43 起的消息。服务端还应能处理重复确认和慢客户端。"},{"kind":"三个“成功”怎样定义","text":"客户端发送一条 IM 消息时，连接层写出成功、服务端持久化成功、对方已读是三种状态。为每条消息分配业务 ID，重发沿用相同 ID。服务端持久化后返回序号供后续补读。已读回执由接收端另外提交。\n\n若连接断在服务端已保存、发送方尚未收到确认之间，发送方可以按业务 ID 重发。服务端返回原序号，从而避免同一条消息在界面上显示两次。"}],"expanded":true},{"key":"scenario-11909","number":11909,"bank":"scenario","position":79,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1940669335884062721","title":"在 Linux 命令行敲下一行命令，会进行哪些事情？","source":"preview","sections":[{"kind":"回答重点","text":"Shell 先解析参数、引号、重定向和管道，展开变量等，再判断 builtin、函数或在 PATH 中找可执行文件。外部命令通过系统进程机制执行并返回退出状态，管道需连接多个进程。"},{"kind":"扩展知识","text":"cd 改变当前 shell 目录，通常是 builtin。运行外部程序多由子进程执行，标准输入、输出和错误可能被重定向。"}],"expanded":false},{"key":"scenario-11846","number":11846,"bank":"scenario","position":80,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1935588620457254913","title":"现在让你负责一个核心系统，需要实现核心数据的缓存预热，如何做？","source":"preview","sections":[{"kind":"回答重点","text":"先识别热点和可预热体量，按租户、时间或优先级分批加载。限速和并发上限保护数据库，成功后逐步切流，同时看可用键比例、命中率与延迟。"},{"kind":"扩展知识","text":"大版本启动时先加载活跃活动和热门商品，批次失败只重试相应范围。TTL 添加随机抖动，避免预热数据同一时刻失效。"}],"expanded":false},{"key":"scenario-11911","number":11911,"bank":"scenario","position":81,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1940678789890166785","title":"设计数据库表时，关联表和在一个表中加冗余字段关联各有什么优势？","source":"preview","sections":[{"kind":"回答重点","text":"规范化关系表表达关系、便于统一维护与约束；冗余字段减少高频查询连接，但必须解决谁是权威、何时同步、如何修复。按读写比例、历史语义和一致性要求选择。"},{"kind":"扩展知识","text":"订单可保留下单时的商品名称快照，即使商品后来改名也不覆盖历史。当前商品资料仍从产品表获得。"}],"expanded":false},{"key":"scenario-11847","number":11847,"bank":"scenario","position":82,"priority":true,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1935599105317093377","title":"当客户端有重连机制，当服务意外宕机重新部署启动时，怎么避免流量洪峰？","source":"preview","sections":[{"kind":"回答重点","text":"客户端指数退避加随机抖动，限制重试次数与并发。服务端先完成健康检查和预热，再逐步恢复入口，设置连接速率、队列和恢复令牌。重连后按水位补数据。"},{"kind":"扩展知识","text":"大量客户端一秒一起重连时会打满认证服务。把每次等待随机化，服务端提供节流提示，从小比例健康流量开始恢复。"},{"kind":"为什么指数退避还需要抖动","text":"若十万个客户端同一秒掉线，而且全部在第 1、2、4 秒重试，指数退避只是把洪峰挪到了新的时刻。让各客户端在逐渐扩大的时间区间内独立随机等待，再配合服务器给出的重试提示，能分散认证和补读请求。\n\n重连成功也要限制历史补读速率。分别监视每秒新建连接数、认证失败率、数据库读负载和积压量，避免连接层恢复后，消息回放把存储压垮。"}],"quote":"重连风暴","expanded":true},{"key":"scenario-11850","number":11850,"bank":"scenario","position":83,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1935615612415721473","title":"第三方上游接口接入做异步处理，是否可以使用 MQ？主要考虑什么？如果不用 MQ，还有什么方式？","source":"preview","sections":[{"kind":"回答重点","text":"MQ 可用于把 API 受理与第三方同步调用解耦。设计任务状态、幂等键、调用配额、重试、确认和查询或回调。低规模可用持久任务表 + Worker，仍须保证可恢复。"},{"kind":"扩展知识","text":"上游允许每秒 30 次，请求先写任务再返回 ID。Worker 按全局预算取任务，异常用指数退避，前端看到状态而不是无限等待。"}],"expanded":false},{"key":"scenario-11852","number":11852,"bank":"scenario","position":84,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1935627498639122433","title":"4C8G和8C16G，这两个配置的服务器你们选哪个？为什么？","source":"preview","sections":[{"kind":"回答重点","text":"先看负载是 CPU、内存、网络还是 I/O 受限，定义 SLO 与稳定峰值，在同一工作负载下压测 CPU 利用率、RSS、GC、尾延迟和成本。考虑多节点故障余量。"},{"kind":"扩展知识","text":"4C8G 在峰值内存接近 8 GB 且有频繁 GC 时，较大实例可减少抖动。若外部数据库瓶颈未变，单纯增 CPU 未必改善吞吐。"}],"expanded":false},{"key":"scenario-11859","number":11859,"bank":"scenario","position":85,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/1935997509803618306","title":"Agent 死循环问题有遇到过吗？如何解 95650132375805954/question/1999046326603489281","title":"什么是死信队列？在什么场景下会用到？如何设计死信队列的处理机制？","source":"preview","sections":[{"kind":"回答重点","text":"死信队列保存达到重试上限、过期或无法处理的消息，便于诊断、补偿或修复后重放。"},{"kind":"扩展知识","text":"保留消息 ID、错误、失败时间和原路由。人工或受控任务重放前要保证消费幂等，避免重复扣款等副作用。"}],"expanded":false},{"key":"scenario-13191","number":13191,"bank":"scenario","position":131,"priority":false,"url":"https://www.mianshiya.com/bank/1795650132375805954/question/2009455720558354434","title":"微信扫码登录是如何实现的？请描述一下技术方案","source":"preview","sections":[{"kind":"回答重点","text":"网页创建短时登录挑战并展示二维码。手机端授权后，服务端确认挑战对应用户，浏览器以轮询或事件拿到状态并换取会话。"},{"kind":"扩展知识","text":"挑战要有随机性、有效期、一次性和会话绑定。网站接入微信应以公开授权流程校验回调与身份。"}],"expanded":false}],"additions":[{"title":"Agent 规划、记忆与工作流","items":[{"key":"agent-13552","label":"ReAct 的行动与观察","goal":"用一次查证任务串起工具选择、实际观察和下一步决策。举例说明工具返回空结果时，计划应怎样改变。"},{"key":"agent-13566","label":"短期与长期记忆","goal":"给任务进度、用户偏好和原始工具回执选择存放位置。说明何时读取、怎样更新，以及怎样隔离不同用户。"},{"key":"agent-13569","label":"子 Agent 的边界","goal":"设计一个只读核对任务，列出子任务的输入、工具权限、预算和返回格式，并说清父任务如何验收证据。"},{"key":"agent-13563","label":"多 Agent 编排","goal":"用两份独立材料的交叉核对比较串行、并行和主管分派，说明什么时候多一个 Agent 只会增加成本。"},{"key":"ai-13533","label":"带审批的工作流","goal":"画出草拟、等待审批、执行和结束四种状态。分别推演审批被拒、超时和重复提交。"},{"key":"ai-13534","label":"工作流暂停与恢复","goal":"说明等待人工输入时需要持久化什么，以及恢复后如何避免重复执行暂停点前已经发生的外部动作。"},{"key":"claude-13988","label":"Resume 与 Fork","goal":"从同一段对话分别继续调试和尝试另一种方案。指出哪些历史共享、后续写入哪个会话，以及文件如何单独隔离。"},{"key":"claude-14012","label":"工具执行前的 Hook","goal":"用一次对受保护文件的编辑说明，在哪个阶段能拒绝调用，用户和模型分别收到什么反馈，如何确认工具没有执行。"}]},{"title":"提示词、知识库与效果成本","items":[{"key":"ai-11802","label":"提示词设计与对照实验","goal":"给同一任务准备两版提示，固定模型、样本和工具，只调整一处指令。用成功、拒答和资料不足三个用例比较效果。"},{"key":"ai-11471","label":"文档清洗与预处理","goal":"给含重复页眉、旧版条款和表格的文档设计入库流程。清洗后还能从检索片段找回版本、页码和原表头。"},{"key":"ai-11535","label":"Embedding 与相似度","goal":"解释问题和文档如何进入同一向量空间。用一次更换编码器的发布说明旧索引为何需要验证或重建。"},{"key":"ai-12654","label":"HNSW 与 IVF 向量索引","goal":"比较在邻接图上搜索与先选向量分区再搜索。固定一组查询，说明如何一起测召回率、延迟和内存。"},{"key":"ai-12666","label":"RAG 的幻觉与拒答","goal":"针对过期证据、证据冲突和完全无证据各设计一例，说明什么时候引用原文、追问条件或明确无法回答。"},{"key":"ai-13570","label":"用模型评判 RAG 答案","goal":"分别给证据支持度和答案完整性写评分准则，再用人工复核样本检查评判模型是否偏爱更长的答案。"},{"key":"ai-13572","label":"RAG 精确缓存与语义缓存","goal":"用同一问法、不同租户或不同制度版本举例，说明缓存键、权限检查和失效条件怎样避免复用错误答案。"},{"key":"ai-13809","label":"延迟、吞吐与成本","goal":"比较两种模型服务配置的首字响应时间、完整响应耗时、单位时间完成任务数和每个成功任务的成本。"}]},{"title":"流式交付、重连与并发","items":[{"key":"ai-13525","label":"流式返回模型输出和运行事件","goal":"画出一个界面如何分别展示生成中的文本、工具进度和最终结果。说明客户端怎样识别一次任务真正结束。"},{"key":"network-10386","label":"HTTP、SSE 与 WebSocket 选型","goal":"分别给单向输出和双向终端选择通信方式。解释连接断开后，应用层还要保存什么才能补读。"},{"key":"design-4945","label":"用游标读取历史","goal":"写出按会话和稳定序号查询上一页的条件。解释并发插入新消息时，游标怎样避免页边界移动。"},{"key":"scenario-11824","label":"实时消息的应用协议","goal":"区分传输成功、服务端持久化和用户已读。用 agents-anywhere-go 的时间线解释消息 ID、序号和确认的用途。"},{"key":"scenario-11847","label":"重连风暴","goal":"模拟一批客户端同时掉线。分别控制建连、认证和历史补读压力，并给出能观察恢复是否平稳的指标。"},{"key":"design-1190","label":"模型调用限流","goal":"给模型入口设计按租户限流和全局并发上限。能说明令牌桶允许的突发流量，以及排队超时如何反馈。"},{"key":"scenario-783","label":"端到端超时预算","goal":"把一次请求的总时限分给网关、模型和下游工具。推演首次调用耗时过长后，剩余时间是否还够重试。"},{"key":"go-1922","label":"原子操作与锁","goal":"给独立计数器和一组必须同时更新的会话字段分别选同步方式。说明怎样让读者看到完整一致的快照。"}]},{"title":"MySQL 持久状态与 Redis 协调","items":[{"key":"mysql-594","label":"联合索引与最左前缀","goal":"给时间线查询设计联合索引，说明会话 ID、事件序号的排列顺序怎样影响范围读取和排序。"},{"key":"mysql-612","label":"读懂 EXPLAIN","goal":"用一条慢查询指出实际选用的索引、扫描方式和估算行数，再说明怎样核对估算与实际执行之间的差距。"},{"key":"mysql-606","label":"事务隔离级别","goal":"让两个事务先后读写同一任务状态。画出两次读取的时序，解释读取已提交和可重复读可能观察到什么。"},{"key":"mysql-610","label":"乐观锁与悲观锁","goal":"两个 worker 同时认领一条任务时，写出带旧版本条件的更新，并说明根据受影响行数如何判断谁成功。"},{"key":"redis-642","label":"TTL 与过期键","goal":"给设备在线记录设置过期时间。分别解释逻辑过期、内存清理与用户看到的在线状态如何关联。"},{"key":"redis-656","label":"租约失效与过期写入","goal":"推演旧持有者暂停、新持有者写入、旧持有者恢复三步，说明资源端如何拒绝迟到的写操作。"},{"key":"redis-659","label":"缓存穿透、击穿与雪崩","goal":"区分连续查询不存在的 ID、单个热门键过期、大量键同时失效。针对三种负载分别选择保护措施。"},{"key":"redis-660","label":"缓存与数据库的一致性","goal":"画出数据库成功更新但缓存删除失败的时序，为关键状态设计失效重试、版本检查或回源策略。"}]},{"title":"消息投递、幂等与积压","items":[{"key":"scenario-996","label":"Outbox 与故障补发","goal":"画出业务数据和待发事件的事务边界。解释发布成功后进程崩溃为什么会重复发送，以及消费者如何处理。"},{"key":"mq-1130","label":"消息在哪一段可能丢失","goal":"沿生产者、Broker、消费者三段标出各自的成功条件，以及在哪一段应保存回执或重试。"},{"key":"mq-1131","label":"消费幂等","goal":"用同一个任务完成事件到达两次举例，说明如何把去重记录和业务变更一起提交，崩溃后怎样判断是否已处理。"},{"key":"mq-1138","label":"同一会话的消息顺序","goal":"为会话事件选择分区键，说明并发消费、失败重试和跨分区分别会怎样影响接收顺序。"},{"key":"mq-1139","label":"消息积压的诊断与恢复","goal":"结合生产速率、消费速率和最老消息年龄判断瓶颈。说明扩容消费者前为何要先看下游数据库容量。"},{"key":"rabbit-9509","label":"发布确认与消费确认","goal":"解释为什么发布者收到确认时，业务可能还没处理。推演消费事务已经提交但确认丢失的后续行为。"},{"key":"rabbit-9510","label":"Prefetch 与慢消费者","goal":"解释预取上限怎样约束未确认投递。用处理时间差异大的任务说明调大或调小后的吞吐与公平性变化。"},{"key":"rabbit-9512","label":"死信交换机与重放","goal":"为持续失败的任务设计有限重试和死信路由。说明人工修复后如何用原业务 ID 重放并防止反复回流。"}]}],"focus":[{"number":1,"title":"Agent Loop、Tool Calling、停止与恢复","items":[{"title":"能画出请求链路","text":"用户目标和状态 → 模型返回工具请求 → 宿主校验参数与权限 → 执行工具并记录回执 → 将结果送回模型 → 继续、提交或停止。能解释模型、宿主和工具各自决定什么。","links":[{"label":"Agent Loop · 13548","url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284763179331586"},{"label":"工具调用 · 13567","url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284775367979010"}]},{"title":"能讲清失败路径","text":"工具超时、参数不合法、同一动作反复执行、用户取消、轮次或 Token 超限、合格完成分别怎么退出。恢复时用持久化进度和工具回执确定哪些动作需要重做。","links":[{"label":"终止条件 · 13547","url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284762629877762"}]},{"title":"项目自测","text":"沿着 Pi 的一条受控取证任务，从候选路径、取证调用和回执，到 `continue`／`finish` 与证据校验。准备回答「模型认为结束，但证据不足时，宿主怎么处理」。","links":[{"label":"pi-audit-harness","url":"https://github.com/YoungsGao/pi-audit-harness"}]}]},{"number":2,"title":"MCP、权限、上下文","items":[{"title":"能分清协议层","text":"Function Calling 由模型接口生成结构化调用请求。MCP 由宿主连接外部能力，涉及 Host、Client、Server、初始化、发现和调用。能说明工具 Schema 的来源、实际执行者和授予读写权限的一方。","links":[{"label":"MCP 架构 · 13554","url":"https://www.mianshiya.com/bank/2052284728362414082/question/2052284766648020994"},{"label":"Function Calling 与 MCP · 13564","url":"https://www.mianshiya.com/bank/20 "agent-13568","label":"工具权限控制","jobs":["ant"],"target":"围绕 Pi 的只读取证，分清模型可见的工具和当前用户实际能调用的工具。给出越权请求被拒时应记录的资源、决定和执行结果。"},{"key":"agent-13549","label":"生产级 Agent 架构","jobs":["volcano","ant","meituan"],"target":"画出模型适配、编排器、工具执行、持久状态与观察记录。说明进程在外部动作成功、回执尚未保存时崩溃，重启后怎样确认结果。"},{"key":"ai-13579","label":"重试与降级","jobs":["volcano","ant"],"target":"分别处理限流、参数错误和写入结果未知。给出一次总时限内的退避与降级决策，并说明怎样避免重试造成重复副作用。"},{"key":"go-1802","label":"Go Context 与取消","jobs":["volcano","ant","meituan"],"target":"结合 agents-anywhere-go，手写一个带截止时间的下游调用。说明哪些工作随 HTTP 请求取消，哪些后台任务应有独立生命周期并支持重连后读取进度。"},{"key":"go-1897","label":"Goroutine 泄漏","jobs":["volcano","meituan"],"target":"推演客户端断开、结果通道无人读取后 worker 为什么退不出。写出同时监听发送与取消的 select，并说明如何用 goroutine profile 验证修复。"},{"key":"ai-13765","label":"结构化输出与业务校验","jobs":["ant","meituan"],"target":"用 Pi 的证据报告说明 JSON 解析、Schema 校验、证据核对分别解决什么问题，指出哪类错误需要重新取证。","prompt":"模型交回的 JSON 字段齐全，但引用了本次任务里不存在的证据编号，能提交报告吗？","answer":"先检查编号能否在本次运行和固定快照的工具回执中找到，再核对文件位置和原文能否支撑结论。缺失时保留失败原因，允许在预算内补证。让模型重新输出同一份合法 JSON 无法补出证据。"},{"key":"agent-13559","label":"长对话的上下文压缩","jobs":["byte","ant"],"target":"给持续几十轮的取证任务设计上下文。能列出必须保留的约束、可摘要的历史，以及需要时可按引用找回的原文。","prompt":"最新几轮全在讨论失败日志，最早的用户消息里还有一条“只读指定目录”。压缩时怎样防止它消失？","answer":"把任务范围和剩余预算保存在宿主状态，每轮重新带入必要约束。近期工具回执保留细节，早期调查写成带证据引用的摘要。用一条包含早期限制的回归用例检验，执行器也要独立检查实际读取范围。"},{"key":"ai-13531","label":"检查点与任务恢复","jobs":["volcano","ant"],"target":"画出一个图节点从开始到提交检查点的过程，再以 Pi 的恢复回执作对照。能分别说明恢复对话、恢复执行和重放外部动作的条件。","prompt":"创建工单的接口已经成功，进程却在保存下一步检查点前退出。恢复时会不会创建第二张？","answer":"从检查点恢复会再次经过尚未确认完成的节点。第一次调用前就持久化业务幂等键，恢复时用它查询原回执，或使用同一个键重试。外部系统缺少去重和查询能力时，要把结果标记为待核对，不能直接重复提交。"},{"key":"agent-13561","label":"不可信工具结果与生产安全","jobs":["ant","volcano"],"target":"沿用户请求、外部文档、模型建议和工具执行画出信任边界。用一个只读任务说明如何验证系统确实阻止了越权副作用。","prompt":"模型在总结文档时读到一句要求把文件发出去的文字。哪一层能保证这次任务保持只读？","answer":"宿主为任务提供只读工具，业务服务依据真实用户身份校验资源范围。把文档内容作为资料处理。回归测试既检查输出，也核对调用记录和实际业务状态，确认没有对外发送。"},{"key":"ai-11532","label":"RAG 分块与证据完整性","jobs":["byte","ant","meituan"],"target":"给同一份制度设计按长度和按章节两种切块方案。用需要同时阅读规则及例外的查询，检查检索结果能否覆盖完整证据。","prompt":"系统找回“可以报销”，却漏了下一段的“试用期需审批”。扩大所有块就能解决吗？","answer":"先记录正确条款的位置，检查分块是否把规则和例外拆开。可保留章节标识，命中规则后补取相邻段，再用一组带例外的问题比较证据覆盖率、重复片段和输入长度。盲目扩大块会增加无关内容。"},{"key":"ai-11456","label":"Rerank 与候选覆盖","jobs":["byte","ant","meituan"],"target":"把召回候选和最终送入模型的片段分开检查。能用排名变化解释重排什么时候有用，并给出一次延迟取舍。","prompt":"正确条款在首轮候选里排第 18，生成只看前三条。另一条查询连前 50 都没有召回证据。两次应怎样改？","answer":"第一条可以在候选上重排，观察正确条款是否进入前三，同时记录增加的耗时。第二条先检查文档覆盖、过滤和首轮召回。重排器只能重排收到的候选。"},{"key":"ai-11355","label":"RAG 召回失败的定位","jobs":["byte","ant"],"target":"对一条真实风格的错例记录原始问题、改写结果、过滤条件和各阶段候选 ID，定位正确文档第一次消失的位置。","prompt":"用户查杭州的现行规定，系统总是引用上海旧版。应该先改 Prompt、换向量模型，还是查数据？","answer":"先在用户有权访问的文档快照中定位杭州现行条款，再检查地区和版本标签、改写是否保留限定词、正确片段在哪一步消失。只改这一环节，并在同城、跨城及旧版查询上复测。"},{"key":"agent-13554","label":"MCP 组件与调用链","jobs":["ant","meituan"],"target":"在 Pi 接入工具服务的例子里标出 Host、Client 和 Server。能顺着一次连接说明能力协商、工具发现、调用与结果回传。","prompt":"工具已出现在列表里，执行时却返回无权限。怎样排查？","answer":"先确认列表来自预期的 Server，再核对该次调用的身份、资源范围和服务端拒绝记录。发现工具仅表明服务提供这项能力。权限问题应依据调用回执定位，网络连通和模型能看到工具名都不足以证明授权。"},{"key":"go-1872","label":"Channel 缓冲与背压","jobs":["volcano","meituan"],"target":"手画一个容量为 2 的结果通道，推演快速生产和慢速消费。说明客户端断开后生产者如何退出，以及哪些事件应持久化供重连补读。","prompt":"消费者暂停时向一个空的、容量为 2 的通道连续发送三个事件，哪一步会停住？","answer":"在没有其他接收者时，前两个发送完成，第三个等待空位。用 select 同时等待发送和取消。对必须交付的事件，另设持久记录和游标。扩大缓冲只能推迟积压，无法保证断线后还能取回事件。"},{"key":"go-1927","label":"Go 数据竞争与验证","jobs":["volcano","meituan"],"target":"用会话状态被两个 goroutine 同时读写的例子，解释 race 报告里的两处访问。能选择合适的同步方式，并设计能跑到冲突路径的测试。","prompt":"一个 goroutine 更新会话状态，另一个读取状态并推送快照。测试跑了一次没有报 race，够了吗？","answer":"用并发用例覆盖更新、读取和取消路径，运行 go test -race。把有关联的字段放进同一临界区读写，或通过单一所有者发布一致快照。修复后同时检查 race 报告和快照内容，避免字段各自读写安全但组合状态失真。"},{"key":"go-1816","label":"HTTP 客户端与连接复用","jobs":["volcano","meituan"],"target":"以 Go 服务持续请求模型 API 为例，说明 Client、Transport 和连接池的关系，并能用观测区分连接等待与模型生成耗时。","prompt":"连续向同一地址发请求，为什么每次看起来都重新建连？","answer":"以 HTTP/1.1 为例，检查是否重复创建独立 Transport、成功路径是否读完并关闭响应体，以及服务端是否关闭了空闲连接。用 httptrace 的 GotConn 查看复用情况，再比较连接和首字节时间。流式请求取消时及时关闭响应体。"},{"key":"ai-13588","label":"线上 A/B 与效果归因","jobs":["byte","ant"],"target":"设计一次提示词或工具描述变更实验，交代分流单位、主要指标、延迟和成本。能区分离线回归改善与线上业务效果改善。","prompt":"新版 Agent 任务完成率上升，但处理简单任务的比例也上升。能归功于新版吗？","answer":"按会话稳定随机分组，核对两组的任务难度和流量来源，在可比任务上检查差异和不确定性。把人工接管率、P95 延迟和单次成功成本一并报告，再决定是否放量。"}]}}</script>
  <script>(() => {

  }
  function uniqueQuestions(questions) {
    const seen = new Set();
    return questions.filter(q => {
      if (seen.has(q.number)) return false;
      seen.add(q.number);

  }
  const priorities = uniqueQuestions(data.questions.filter(q => q.priority));
  const addedByNumber = new Map(data.additions.flatMap(group => group.items.map(item => [lookup.get(item.key).number, item])));
  const jobPlan = data.jobFocus;
  const jobLessons = jobPlan.items.map((item, i) => ({...item, q: lookup.get(item.key), rank: i + 1}));
  const jobByNumber = new Map(jobLessons.map(item => [item.q.number, item]));
  const totalChecks = data.focus.reduce((count, stage) => count + stage.items.length, 0);
  const search = document.querySelector('#search-input');
  const storageKey = 'agent-interview-study/v1';

  let savedData;
  try { savedData = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch { savedData = {}; }
