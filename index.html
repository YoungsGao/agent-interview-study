 手册 · EXPLAIN 输出](https://dev.mysql.com/doc/refman/8.4/en/explain-output.html)"}],"source":"preview","expanded":false},{"key":"mysql-599","number":599,"bank":"mysql","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295467425794","title":"MySQL 中的索引数量是否越多越好？为什么？","sections":[{"kind":"回答重点","text":"索引用写入成本和空间换读取效率。删除一条数据时，聚簇索引和相关二级索引都要维护。修改已索引字段也可能增加页分裂、合并和日志开销，写入频繁时尤其要看实际收益。"},{"kind":"扩展知识","text":"**例子与追问**　已有 `(a,b)` 时，`(a)` 在访问能力上常有重叠，但短索引可能更省读取，或者承担独立唯一性约束。删除前结合实际使用情况和代表性流量验证。MySQL 8 可把适用的索引临时设为不可见来观察优化器选计划的变化，不可见索引仍会被维护，约束也继续生效。\n\n[MySQL 手册 · 不可见索引](https://dev.mysql.com/doc/refman/8.4/en/invisible-indexes.html)"}],"source":"preview","expanded":false},{"key":"mysql-600","number":600,"bank":"mysql","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295471620098","title":"请详细描述 MySQL 的 B+ 树中查询数据的全过程","sections":[{"kind":"回答重点","text":"查找分两步。第一步从根页按分隔键找到下一层的子页，一路到叶子页。第二步在叶页内定位记录。InnoDB 可借页目录缩小页内查找范围，再顺序检查相应记录。"},{"kind":"扩展知识","text":"**例子与追问**　有 `PRIMARY KEY(id)` 与 `KEY idx_score(score)`，执行 `WHERE score BETWEEN 80 AND 90` 可在二级树找到第一条 `score \u003e= 80` 的记录，依次读取匹配的键和主键。若还查未覆盖的 `name`，按主键从聚簇树读取。树高描述从根到叶的层数，实际磁盘读取次数还受 Buffer Pool、预读和记录分布影响。\n\n[MySQL 手册 · InnoDB 索引物理结构](https://dev.mysql.com/doc/refman/8.4/en/innodb-physical-structure.html)"}],"source":"preview","expanded":false},{"key":"mysql-601","number":601,"bank":"mysql","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295475814402","title":"为什么 MySQL 选择使用 B+ 树作为索引结构？","sections":[{"kind":"回答重点","text":"从减少磁盘页访问讲起。B+ 树每个内部页可指向许多子页，内部页主要存分隔键和指针，树高因此较低。叶子页按键存在顺序，再结合叶页链接做范围扫描。"},{"kind":"扩展知识","text":"与二叉平衡树相比，高扇出减少跨页路径。哈希适合等值查找，B+ 树同时提供自然键序。与经典 B 树相比，B+ 树内部节点只做导航，叶子扫描处理范围更直接。键过宽会降低扇出，页分裂和维护频率与写入分布有关。\n\n[MySQL 手册 · InnoDB 索引物理结构](https://dev.mysql.com/doc/refman/8.4/en/innodb-physical-structure.html)"}],"source":"preview","expanded":false},{"key":"mysql-106","number":106,"bank":"mysql","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1772575207802904578","title":"MySQL 中的日志类型有哪些？binlog、redo log 和 undo log 的作用和区别是什么？","sections":[{"kind":"回答重点","text":"先给三种日志分工。binlog 是 Server 层的变更日志，用于复制和配合全量备份恢复到指定时间点，可按语句或行变更记录。InnoDB 的 redo 用来做崩溃恢复，undo 用来回滚和支持 MVCC。"},{"kind":"扩展知识","text":"| 日志 | 层级 | 生成与回收 |\n| --- | --- | --- |\n| redo log | InnoDB | 修改页时产生重做记录，按 WAL 约束刷盘，检查点推进后空间可复用 |\n| undo log | InnoDB | DML 生成回滚所需信息或旧版本，相关快照无需再访问时可 purge |\n| binlog | Server | 事务性变更通常先缓存，提交路径写入日志，文件按保留策略轮转与清理 |\n\n**追问**　崩溃恢复先恢复页状态，并依据事务状态处理未提交变更。启用 binlog 时，内部二阶段提交协调 redo 与 binlog，细节见 [原站第 9498 题](#q-9498)。\n\n[MySQL 手册 · redo log](https://dev.mysql.com/doc/refman/8.4/en/innodb-redo-log.html) · [undo log](https://dev.mysql.com/doc/refman/8.4/en/innodb-undo-logs.html) · [binlog](https://dev.mysql.com/doc/refman/8.4/en/binary-log.html)"}],"source":"preview","expanded":false},{"key":"mysql-602","number":602,"bank":"mysql","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295475814403","title":"MySQL 是如何实现事务的？","sections":[{"kind":"回答重点","text":"按 ACID 对应机制讲。redo 和 WAL 提供持久性的恢复基础，事务回滚靠 undo。锁与 MVCC 共同实现隔离，数据库约束和事务内的业务规则共同维护一致性。"},{"kind":"扩展知识","text":"**例子与追问**　转账将扣款和入账放在同一事务，扣款使用带余额条件的更新，任一步失败时回滚。事务提交过程中 redo 的写入和刷盘受 `innodb_flush_log_at_trx_commit` 控制。开启 binlog 时还要看 `sync_binlog` 和两阶段协调。每笔事务能否抵抗掉电丢失取决于实际配置及存储是否可靠履行刷盘语义。\n\n[MySQL 手册 · InnoDB 与 ACID](https://dev.mysql.com/doc/refman/8.4/en/mysql-acid.html)"}],"source":"preview","expanded":false},{"key":"mysql-603","number":603,"bank":"mysql","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295480008706","title":"MySQL 中长事务可能会导致哪些问题？","sections":[{"kind":"回答重点","text":"长事务持锁时间长，其他业务可能从等行锁发展为占满连接池，进而拖慢上游请求。事务涉及的资源多、持有时间又长时，循环等待的机会也会增加。"},{"kind":"扩展知识","text":"长事务还有两类影响。旧快照可能推迟 purge，导致 undo 历史增长，读旧版本更费时。修改量很大的事务还可能造成日志峰值、回滚耗时和副本应用积压。\n\n**排查步骤**　看 `information_schema.innodb_trx` 中的开始时间与锁等待状态，再用 `performance_schema.data_lock_waits` 找等待链，用 `SHOW ENGINE INNODB STATUS` 观察历史链与死锁。修复时缩短事务，避免事务内调用外部接口，批任务分段提交，并复核一致性边界。空闲连接也可能留有未结束的事务。\n\n[MySQL 手册 · InnoDB 锁等待信息](https://dev.mysql.com/doc/refman/8.4/en/innodb-information-schema-understanding-innodb-locking.html)"}],"source":"preview","expanded":false},{"key":"mysql-604","number":604,"bank":"mysql","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295484203009","title":"MySQL 中的 MVCC 是什么？","sections":[{"kind":"回答重点","text":"MVCC 是多版本并发控制，目标是让普通一致性读与写入并行。更新时，InnoDB 通过当前记录和 undo 保留可重建的旧版本，快照读沿版本链找到自己能看到的版本。"},{"kind":"扩展知识","text":"Read View 在逻辑上记录创建时的活跃事务集合与事务 ID 边界。自己的更新可见，快照前已提交的版本可见，快照创建时还活跃或随后开启的事务版本通常不可见。RC 通常每次一致性读创建新视图，RR 通常复用首次一致性读建立的视图，显式一致性快照可提前建立。加锁读、更新及删除按锁规则读当前可操作版本。\n\n**双会话例子**　假设初始库存为 10。A 在 RR 事务中第一次普通查询读到 10。B 把库存减为 9 并提交。A 再做同样的普通查询仍读到 10，并可在随后执行的 `SELECT ... FOR UPDATE` 中读到 9。这两个结果分别来自 A 的一致性快照和加锁读。\n\n[MySQL 手册 · InnoDB 多版本](https://dev.mysql.com/doc/refman/8.4/en/innodb-multi-versioning.html) · [一致性非锁定读](https://dev.mysql.com/doc/refman/8.4/en/innodb-consistent-read.html)"}],"source":"preview","expanded":false},{"key":"mysql-12132","number":12132,"bank":"mysql","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1963170747031306241","title":"MySQL 二级索引有 MVCC 快照吗？","sections":[{"kind":"回答重点","text":"二级索引条目没有聚簇记录那套 `trx_id`、`roll_ptr` 和逐行的历史版本链。遇到删除标记或页的事务信息无法确认可见性时，可回到聚簇索引，用事务 ID 和 undo 版本链判断。"},{"kind":"扩展知识","text":"**例子与追问**　把索引列 `email` 由 A 改成 B 时，旧二级条目被标记删除，新条目插入。若旧条目仍可能被快照使用，引擎可回聚簇树取得快照可见版本并校验该版本的索引键。二级页能直接确认安全时，覆盖查询可以仅取二级记录。这个细节解释了为什么覆盖访问在 MVCC 下仍可能多一次聚簇访问。\n\n[MySQL 手册 · InnoDB 多版本与二级索引](https://dev.mysql.com/doc/refman/8.4/en/innodb-multi-versioning.html)"}],"source":"preview","expanded":false},{"key":"mysql-605","number":605,"bank":"mysql","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295488397313","title":"如果 MySQL 中没有 MVCC，会有什么影响？","sections":[{"kind":"回答重点","text":"按基于锁的并发控制来设想。A 更新一行还没有提交，B 要读一致的值。缺少可用的历史版本时，B 可能需要等 A 提交或回滚。读持有共享锁时，写也可能等待，长事务下竞争更明显。"},{"kind":"扩展知识","text":"**例子与追问**　报表要在扫描订单的同时接收新订单。MVCC 能给报表一个时点视图，写事务继续提交。纯锁方案为得到同等一致性可能要持有范围锁更久。反过来，MVCC 需要 undo 空间、可见性判断和清理工作，且写写冲突和业务级不变量仍要由锁、约束或条件更新保障。\n\n[MySQL 手册 · InnoDB 事务模型](https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-model.html)"}],"source":"preview","expanded":false},{"key":"mysql-606","number":606,"bank":"mysql","position":25,"priority":true,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295492591617","title":"MySQL 中的事务隔离级别有哪些？","sections":[{"kind":"回答重点","text":"隔离强度从低到高为读未提交、读已提交、可重复读、串行化。读未提交允许读到其他事务没有提交的值。读已提交避免脏读，但同一事务前后两次读取仍可能看到不同的已提交结果。"},{"kind":"扩展知识","text":"| 级别 | 脏读 | 不可重复读 | 幻读（SQL 标准允许情况） |\n| --- | --- | --- | --- |\n| READ UNCOMMITTED | 可能 | 可能 | 可能 |\n| READ COMMITTED | 避免 | 可能 | 可能 |\n| REPEATABLE READ | 避免 | 避免 | 可能 |\n| SERIALIZABLE | 避免 | 避免 | 避免 |\n\n**扩展知识**　InnoDB 的 RR 普通一致性读复用快照。需要锁定的范围查询通常通过 next-key lock 约束新插入，实际锁定范围由索引访问与谓词决定。RC 每次一致性读可见不同提交快照，通常少用间隙锁，外键和重复键检查仍存在例外。用 `SELECT @@SESSION.transaction_isolation` 看会话设置。\n\n[MySQL 手册 · InnoDB 隔离级别](https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html)"}],"source":"preview","expanded":false},{"key":"mysql-607","number":607,"bank":"mysql","position":26,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295492591618","title":"MySQL 默认的事务隔离级别是什么？为什么选择这个级别？","sections":[{"kind":"回答重点","text":"InnoDB 默认使用可重复读（RR）。原站从早期语句级 binlog 的背景解释，RR 的范围锁可以减少并发插入给语句重放带来的不确定性。行格式 binlog 普及后，选择隔离级别时也要看业务的一致性和锁竞争。"},{"kind":"扩展知识","text":"面试可从这项默认设置提供的行为解释取舍。RR 的范围锁会增加某些写业务的等待。RC 允许事务内连续两次普通查询看到不同的已提交结果，某些业务更关心最新提交值且愿意管理这种变化。线上以应用连接的会话值为准，同时可查 `@@GLOBAL.transaction_isolation` 了解默认分配值。\n\n[MySQL 手册 · InnoDB 隔离级别](https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html)"}],"source":"preview","expanded":false},{"key":"mysql-608","number":608,"bank":"mysql","position":27,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295496785922","title":"数据库的脏读、不可重复读和幻读分别是什么？","sections":[{"kind":"回答重点","text":"三种现象看不同对象。脏读看别的事务有没有提交。不可重复读看同一行的数据有没有变化。幻读看重复执行同一个谓词时，满足条件的行集合有没有变化。"},{"kind":"扩展知识","text":"**例子与追问**　A 读取 B 尚未提交的余额 200，B 随后回滚，是脏读。A 先读订单金额 100，B 更新为 200 并提交，A 再读得 200，是不可重复读。A 两次查金额大于 100 的订单，中途 B 插入符合条件的订单并提交，第二次多出该订单，是幻读。请结合隔离级别与一致性读或加锁读解释实际可见结果。\n\n[MySQL 手册 · InnoDB 隔离级别](https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html)"}],"source":"preview","expanded":false},{"key":"mysql-609","number":609,"bank":"mysql","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295500980225","title":"MySQL 中有哪些锁类型？","sections":[{"kind":"回答重点","text":"按粒度讲表锁和行级锁，按模式讲共享锁 S 和排他锁 X。InnoDB 的行级锁还可按保护范围区分。记录锁保护索引记录，间隙锁约束区间内插入，临键锁把记录与其前方间隙一起保护。"},{"kind":"扩展知识","text":"InnoDB 还有表级意向锁 IS 和 IX，帮助协调表级锁与行级锁。排障时也要区分 InnoDB 数据锁与 Server 层保护表定义的 MDL。\n\n记录锁锁定索引记录，间隙锁约束区间内插入，临键锁可理解为记录锁加其前方间隙。RR 下完整唯一键等值命中现有记录时通常只需记录锁。范围扫描和未命中时行为可能不同。MDL 保护表定义，长事务可以拖住 DDL。部分自增模式还涉及 AUTO-INC 锁。排查时先区分在等行锁还是在等 MDL。\n\n[MySQL 手册 · InnoDB 锁](https://dev.mysql.com/doc/refman/8.4/en/innodb-locking.html) · [元数据锁](https://dev.mysql.com/doc/refman/8.4/en/metadata-locking.html)"}],"source":"preview","expanded":false},{"key":"mysql-610","number":610,"bank":"mysql","position":29,"priority":true,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295505174530","title":"MySQL 的乐观锁和悲观锁是什么？","sections":[{"kind":"回答重点","text":"悲观方式预期会出现冲突，先在事务里取得所需锁再处理。例如 `SELECT ... FOR UPDATE` 取得排他锁，`FOR SHARE` 取得共享锁。乐观方式在执行条件更新时验证之前读取的版本或其他前置条件，按受影响行数判断结果。"},{"kind":"扩展知识","text":"**例子与追问**　扣库存可以在一条语句里同时检查当前库存和版本号，并读取受影响行数。这个模式适合冲突较少的场景。悲观模式适合要协调多行状态的短事务，实际锁定范围取决于索引与隔离级别。乐观方案的 `UPDATE` 仍会使用 InnoDB 的写锁。\n\n```sql\nUPDATE inventory\nSET available = available - 1, version = version + 1\nWHERE sku_id = ? AND version = ? AND available \u003e= 1;\n```\n\n[MySQL 手册 · 加锁读](https://dev.mysql.com/doc/refman/8.4/en/innodb-locking-reads.html)"}],"source":"preview","expanded":false},{"key":"mysql-611","number":611,"bank":"mysql","position":30,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295505174531","title":"MySQL 中如果发生死锁应该如何解决？","sections":[{"kind":"回答重点","text":"先讲自动处理，再讲人工排查。InnoDB 默认开启死锁检测，发现等待环时会选一个事务回滚，以便另一方继续。等待超时是另外的保护机制，应用要区分死锁错误和锁等待超时。"},{"kind":"扩展知识","text":"应用收到死锁错误 1213 时，应在新事务中有限重试整个业务单元，保证重试涉及的对外操作可去重。安全重试之前先确认原事务已经结束。\n\n**排查步骤**　用 `SHOW ENGINE INNODB STATUS` 找最近一次死锁，用 `innodb_print_all_deadlocks` 按需把死锁记入错误日志。对照 SQL、索引和访问顺序，统一多行更新的加锁顺序，缩短事务和扫描范围。例如转账固定按账户 ID 顺序锁定两行。错误 1205 是锁等待超时，默认通常只撤销失败语句，应用应明确结束旧事务再判断能否重试。\n\n[MySQL 手册 · 处理死锁](https://dev.mysql.com/doc/refman/8.4/en/innodb-deadlocks-handling.html)"}],"source":"preview","expanded":false},{"key":"mysql-612","number":612,"bank":"mysql","position":31,"priority":true,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295509368833","title":"如何使用 MySQL 的 EXPLAIN 语句进行查询分析？","sections":[{"kind":"回答重点","text":"`EXPLAIN` 展示执行前的预计计划。先看 `type` 确认访问方式，再看 `key` 确认实际选择的索引，`possible_keys` 只列候选。看到 `ALL` 表示全表扫描，要结合表大小及后续算子看是否值得优化。"},{"kind":"扩展知识","text":"| 字段 | 读法 |\n| --- | --- |\n| `type`、`key` | 访问方式与选中的索引，例如 `ref`、`range`、`ALL` |\n| `key_len` | 计划使用的索引键长度，可辅助判断用到哪些键列，需考虑列类型与可空性 |\n| `rows`、`filtered` | 预计读取量与过滤后比例，`rows × filtered / 100` 可帮助估算向下一层传递的行数 |\n| `Extra` | 例如 `Using index`、`Using filesort`、`Using temporary` |\n\n**追问**　`EXPLAIN FORMAT=TREE` 看算子关系。`EXPLAIN ANALYZE SELECT ...` 会实际执行查询，输出实际耗时、行数和循环，用于定位估算偏差、重复探测与排序瓶颈。全扫小表有时就是成本最低的计划。\n\n```sql\nEXPLAIN FORMAT=TREE\nSELECT id, created_at\nFROM orders\nWHERE tenant_id = 17\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n\n-- 在测试数据上实际执行，检查各算子的实际行数与循环。\nEXPLAIN ANALYZE\nSELECT id, created_at\nFROM orders\nWHERE tenant_id = 17\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\n[MySQL 手册 · EXPLAIN 输出](https://dev.mysql.com/doc/refman/8.4/en/explain-output.html) · [EXPLAIN 语法](https://dev.mysql.com/doc/refman/8.4/en/explain.html)"},{"kind":"估算行数和实测行数为什么都要看","text":"一个计划预估某步取 10 行，实测却取了 10,000 行，接下来若对每一行再查一次明细，误差会被放大。先看是哪一步的基数估计偏了，再检查统计信息、联合过滤条件和数据倾斜。\n\n普通 EXPLAIN 给预计计划，EXPLAIN ANALYZE 会执行语句并报告实际时间、行数和循环次数。在代表性且可控的查询上比较变更前后，别仅凭出现了某个索引名就断言查询已经变快。"}],"source":"preview","expanded":true},{"key":"mysql-613","number":613,"bank":"mysql","position":32,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295513563137","title":"MySQL 中 count(*)、count(1) 和 count(字段名) 有什么区别？","sections":[{"kind":"回答重点","text":"`COUNT(*)` 和 `COUNT(1)` 都统计符合查询条件的行，行中有 NULL 也算。`COUNT(列名)` 只统计该列非 NULL 的行。"},{"kind":"扩展知识","text":"MySQL 对 InnoDB 的 `COUNT(*)` 和 `COUNT(1)` 采用相同的处理方式。语义要表达“行数”时，直接写 `COUNT(*)` 最清楚。\n\n**例子与追问**　三行 `col` 为 `NULL, 2, 2` 时，三个结果依次是 3、3、2，`COUNT(DISTINCT col)` 是 1。InnoDB 要依据事务可见性计数。简单无条件计数通常遍历可用的最小二级索引，没有二级索引时扫聚簇索引。要求高吞吐的实时总数时可评估计数表或异步聚合，考虑并发热点与一致性。\n\n[MySQL 手册 · 聚合函数](https://dev.mysql.com/doc/refman/8.4/en/aggregate-functions.html)"}],"source":"preview","quote":"对 NULL 值的处理方式不同","expanded":false},{"key":"mysql-614","number":614,"bank":"mysql","position":33,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295517757441","title":"MySQL 中 int(11) 的 11 表示什么？","sections":[{"kind":"回答重点","text":"11 是历史上的整数显示宽度。`INT` 本身占 4 字节，占用和取值范围不随括号里的数字变化。早期搭配 `ZEROFILL` 可以把较短的值在左侧补零。"},{"kind":"扩展知识","text":"有符号 `INT` 范围为 −2,147,483,648 至 2,147,483,647。无符号范围为 0 至 4,294,967,295。\n\n历史用法中 `INT(4) ZEROFILL` 可把 5 格式化成 `0005`。显示宽度从 MySQL 8.0.17 起被弃用，8.0.19 起多数元数据输出省略该宽度。新建表直接用 `INT`，需要展示补零时用应用格式化或 `LPAD()`。\n\n[MySQL 手册 · 数值属性](https://dev.mysql.com/doc/refman/8.4/en/numeric-type-attributes.html) · [MySQL 8.0.19 更新说明](https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-19.html)"}],"source":"preview","expanded":false},{"key":"mysql-615","number":615,"bank":"mysql","position":34,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295517757442","title":"MySQL 中 varchar 和 char 有什么区别？","sections":[{"kind":"回答重点","text":"`CHAR` 定长，短值通常按定义长度用空格补齐。`VARCHAR` 变长，保留实际字符串，并额外记录长度。两者定义里的长度对非二进制列按字符算。"},{"kind":"扩展知识","text":"普通读取时，`CHAR` 通常去除末尾空格，`VARCHAR` 保留存入的尾部空格。\n\n比如固定两位的国家代码适合 `CHAR(2)`，长短差异大的用户名适合 `VARCHAR`。字符串比较是否忽略尾随空格还取决于排序规则的 PAD 属性。底层存储字节数由字符集和 InnoDB 行格式决定。例如 `utf8mb4` 下单字符可占最多 4 字节，索引与行大小限制以字节计。\n\n[MySQL 手册 · CHAR 与 VARCHAR](https://dev.mysql.com/doc/refman/8.4/en/char.html)"}],"source":"preview","expanded":false},{"key":"mysql-616","number":616,"bank":"mysql","position":35,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295521951745","title":"MySQL 中如何进行 SQL 调优？","sections":[{"kind":"回答重点","text":"流程是定位慢 SQL、看执行计划、再针对问题动手。目标是少读数据和少做无效计算。索引优化可从联合索引的列次序以及能否覆盖所需字段入手。"},{"kind":"扩展知识","text":"**例子与追问**　订单按账号和时间查，现有 `WHERE account_id=? AND DATE(created_at)=?`。可改为原列上的半开区间并验证 `(account_id, created_at)`，同时只取所需列。多表查询还要看基数误估与驱动顺序。若瓶颈是锁阻塞，检查事务长度与访问顺序，单纯调整索引未必能解决。\n\n[MySQL 手册 · SQL 优化](https://dev.mysql.com/doc/refman/8.4/en/statement-optimization.html)"}],"source":"preview","quote":"先定位慢 SQL、再分析执行计划、最后针对性优化","expanded":false},{"key":"mysql-618","number":618,"bank":"mysql","position":36,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295530340354","title":"如何在 MySQL 中避免单点故障？","sections":[{"kind":"回答重点","text":"共同思路是做冗余。主从读写分离时从库平时可以承担读，主库故障时可提为主库。主备方案通常让备库待命。还可以采用 MySQL Group Replication 集群设计故障切换。"},{"kind":"扩展知识","text":"实际部署还要设计健康检查、升级为主库的条件和客户端重连入口。可用 InnoDB Cluster 配合 Group Replication 和 Router，也可用主从复制加独立的故障切换与路由层。\n\n方案取决于 RPO（容忍丢多少数据）和 RTO（容忍停多久）。异步副本可能落后，切主前核对 GTID 与数据完整性。要隔离旧主避免双主写入，定期演练机房故障与备份恢复。副本会复制部分误操作，独立备份和 binlog 保留仍是时间点恢复的基础。\n\n[MySQL 手册 · Group Replication](https://dev.mysql.com/doc/refman/8.4/en/group-replication.html) · [备份与恢复](https://dev.mysql.com/doc/refman/8.4/en/backup-and-recovery.html)"}],"source":"preview","expanded":false},{"key":"mysql-619","number":619,"bank":"mysql","position":37,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295534534657","title":"如何在 MySQL 中实现读写分离？","sections":[{"kind":"回答重点","text":"两条实现路径是应用数据源路由和中间件代理。应用方式可结合 Spring 的 `AbstractRoutingDataSource`，按事务属性或显式业务标记选择主库和副本。代理方式把部分路由与健康检测放在接入层。"},{"kind":"扩展知识","text":"**例子与追问**　创建订单后立即查详情，主库确认写入之后可继续从主库查。历史订单列表允许短暂延迟，则可走健康副本。路由应考虑连接池与事务粘连，检测副本延迟和故障，超过业务阈值后移除副本，回退时限制流量以免把主库压满。按 SQL 关键字拆流时要处理 `SELECT ... FOR UPDATE` 等例外。\n\n[MySQL 手册 · 用复制扩展读取](https://dev.mysql.com/doc/refman/8.4/en/replication-solutions-scaleout.html)"}],"source":"preview","expanded":false},{"key":"mysql-620","number":620,"bank":"mysql","position":38,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295538728962","title":"什么是 MySQL 的主从同步机制？它是如何实现的？","sections":[{"kind":"回答重点","text":"三段线程协作。源库发送线程提供 binlog 事件，副本 I/O 线程接收并写入 relay log，副本应用线程读取并重放。原站的“重放”在 ROW 格式下具体是应用行变更事件。"},{"kind":"扩展知识","text":"新建副本时先拿基线快照和对应的日志位置，再按 binlog 文件位置或 GTID 续传。\n\n异步复制允许源库提交时副本尚未收到。半同步可在满足配置时等待至少一定数量的副本确认已收到并写入 relay log，应用到副本表数据仍可滞后，超时还可能回退异步。ROW 按行变更复制，STATEMENT 按语句，MIXED 视情况切换。故障切换时核对已接收和已执行的 GTID。\n\n[MySQL 手册 · 复制实现](https://dev.mysql.com/doc/refman/8.4/en/replication-implementation.html) · [半同步复制](https://dev.mysql.com/doc/refman/8.4/en/replication-semisync.html)"}],"source":"preview","expanded":false},{"key":"mysql-621","number":621,"bank":"mysql","position":39,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295542923266","title":"如何处理 MySQL 的主从同步延迟？","sections":[{"kind":"回答重点","text":"业务上先保住读一致性。注册后立即查询这类写后读可以走主库。也可设短时间主库读窗口，或在副本查不到时回主库确认。时间窗口是近似判断，出现持续积压时应按复制状态调整路由。"},{"kind":"扩展知识","text":"排障时用 `SHOW REPLICA STATUS\\G`、Performance Schema 的复制表和业务心跳，先分清是日志接收慢，还是副本重放慢。\n\n源库突发写入、大事务、DDL、网络和副本资源不足都可能积压。接收慢先看网络、源端和 relay 写入，应用慢再看 SQL 线程、并行应用、锁等待和表主键。业务上对强一致读走主库，或者等待目标 GTID 并在超时后降级。监控可同时观察延迟、待应用事务量和数据面抽样。\n\n[MySQL 手册 · SHOW REPLICA STATUS](https://dev.mysql.com/doc/refman/8.4/en/show-replica-status.html)"}],"source":"preview","expanded":false},{"key":"mysql-622","number":622,"bank":"mysql","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295542923267","title":"什么是分库分表？分库分表有哪些类型（或策略）？","sections":[{"kind":"回答重点","text":"可按行做水平拆分，按列或业务域做垂直拆分。水平分表是把同结构表的数据分散，例如按用户 ID 取模。垂直分表可以把用户常用字段和少用的大字段放在不同表。分库还可把不同分片或业务域部署到不同实例。"},{"kind":"扩展知识","text":"散列或取模使多数键分布均匀，但调整桶数可能触发迁移。范围与时间路由便于区间查询和归档，但新范围可能成为热点。映射表、虚拟分片等方式让重分布更灵活，也增加路由状态。选分片键要看访问模式、热点、增长和跨分片需求。MySQL 原生表分区与跨实例分库的部署和故障域不同。\n\n[MySQL 手册 · 分区](https://dev.mysql.com/doc/refman/8.4/en/partitioning.html)"}],"source":"preview","expanded":false},{"key":"mysql-623","number":623,"bank":"mysql","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295547117569","title":"如果组长要求你主导项目中的分库分表，大致的实施流程是？","sections":[{"kind":"回答重点","text":"先评估有没有容量或性能瓶颈，再设计分片。把单表增长、实例负载、峰值查询和未来容量列清楚，确认拆分是否有必要。设计时选常用于查询且能分散负载的分片键，再定路由规则和分片数。"},{"kind":"扩展知识","text":"**实施步骤**　\n\n1. 统计增长率、容量、查询条件、热点与峰值延迟，明确目标及迁移风险。\n2. 建好目标分片与路由，统一生成业务 ID，确定跨分片事务、分页与扩容规则。\n3. 建立一致性数据基线和 CDC 位点，分批回填。协调每个业务键的版本与删除事件，防止旧回填覆盖新状态。\n4. 在影子流量或灰读检查结果。待积压、对账和性能达标，切换写入所有权和读路由。\n5. 核验回切时新写入可回放或回流，保留审计记录与回退窗口。"}],"source":"preview","expanded":false},{"key":"mysql-624","number":624,"bank":"mysql","position":42,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295551311873","title":"对数据库进行分库分表可能会引发哪些问题？","sections":[{"kind":"回答重点","text":"重点看跨分片事务、跨库关联和 ID 冲突。原本一库内完成的事务或 JOIN，在数据跨片时需要额外协调。各分片如果独立生成同范围自增 ID，汇总时可能撞号。"},{"kind":"扩展知识","text":"**例子与追问**　订单与订单项用同一订单键路由，常见写操作可在本地事务完成。跨分片全局排序通常要各分片局部取候选，再聚合归并。全局唯一可以用全局 ID 服务或专门的唯一键注册表。跨片业务流程可按一致性要求使用补偿、可靠事件或分布式事务。扩容还要关注热点迁移、幂等回填、备份恢复范围与故障隔离。"}],"source":"preview","expanded":false},{"key":"mysql-625","number":625,"bank":"mysql","position":43,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295555506177","title":"从 MySQL 获取数据，是从磁盘读取的吗？（buffer pool）","sections":[{"kind":"回答重点","text":"InnoDB 先到 Buffer Pool 找数据页或索引页，命中就用内存页，未命中再读入整页。更新也可以先改内存中的页，形成脏页，之后再由刷页机制写回。"},{"kind":"扩展知识","text":"根页和高频叶子页常驻时，查三层树可能只需读一个冷叶子页，或者全程命中。修改通常先发生在池内，成为脏页，再交由刷页机制写回。结合 `Innodb_buffer_pool_read_requests`、`Innodb_buffer_pool_reads` 的增量和磁盘延迟判断 I/O，同时看慢 SQL 的扫描量。\n\n[MySQL 手册 · Buffer Pool](https://dev.mysql.com/doc/refman/8.4/en/innodb-buffer-pool.html)"}],"source":"preview","expanded":false},{"key":"mysql-627","number":627,"bank":"mysql","position":44,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295559700482","title":"MySQL 的 Doublewrite Buffer 是什么？它有什么作用？","sections":[{"kind":"回答重点","text":"Doublewrite 处理部分页写入。常见的 InnoDB 页大于底层的原子写入单位，宕机时可能只写完部分内容，所以引擎在刷最终位置前保留完整页副本。"},{"kind":"扩展知识","text":"redo 通常记录页变更，恢复需要一个可用的基础页。Doublewrite 正是保护这个前提。批量、顺序写 doublewrite 使成本低于把两次写都视为同样的随机 I/O。MySQL 8.0.20 起通常使用独立 doublewrite 文件。MySQL 8.4 的 `DETECT_ONLY` 只保留检测用信息，保留完整页副本取决于模式。\n\n[MySQL 手册 · Doublewrite Buffer](https://dev.mysql.com/doc/refman/8.4/en/innodb-doublewrite-buffer.html)"}],"source":"preview","expanded":false},{"key":"mysql-628","number":628,"bank":"mysql","position":45,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295563894785","title":"MySQL 中的 Log Buffer 是什么？它有什么作用？","sections":[{"kind":"回答重点","text":"Log Buffer 是 InnoDB 用来暂存 redo 的内存区。事务执行期间可以先把小块 redo 记录累积起来，按策略成批写日志，减少频繁的小写入和同步开销。"},{"kind":"扩展知识","text":"`innodb_log_buffer_size` 控制容量，MySQL 8.0 的默认值为 16 MiB，8.4 为 64 MiB。`innodb_flush_log_at_trx_commit` 控制提交时的写入及同步策略。值 1 要求提交时写入并刷盘。值 2 通常提交时写入操作系统缓存，定期同步。值 0 主要依赖后台周期性写入和同步。结合 `Innodb_log_waits` 和事务负载可判断是否遇到缓冲等待。\n\n[MySQL 8.0 手册 · Log Buffer](https://dev.mysql.com/doc/refman/8.0/en/innodb-redo-log-buffer.html) · [MySQL 8.4 手册 · Log Buffer](https://dev.mysql.com/doc/refman/8.4/en/innodb-redo-log-buffer.html)"}],"source":"preview","expanded":false},{"key":"mysql-629","number":629,"bank":"mysql","position":46,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295568089090","title":"为什么在 MySQL 中不推荐使用多表 JOIN？","sections":[{"kind":"回答重点","text":"多表 JOIN 可能让中间行数放大，消耗数据库 CPU 和内存，进而拖慢其他查询。原站也举了企业手册对多表 JOIN 的约束，实际判断仍要看关联键、数据量、索引和执行计划。"},{"kind":"扩展知识","text":"**例子与追问**　订单查订单项时，先尽早筛出账号和日期范围内的少量订单，给订单项 `order_id` 建索引，再看 `EXPLAIN ANALYZE` 的行数和循环。MySQL 8 还会在合适场景使用 Hash Join。跨服务或跨分片查询可用批量应用层拼接、预聚合或专用读模型，同时管理一致性和避免 N+1 往返。\n\n[MySQL 手册 · Hash Join 优化](https://dev.mysql.com/doc/refman/8.4/en/hash-joins.html)"}],"source":"preview","expanded":false},{"key":"mysql-630","number":630,"bank":"mysql","position":47,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295572283394","title":"MySQL 中如何解决深度分页的问题？","sections":[{"kind":"回答重点","text":"深分页的开销来自先读大量结果再丢弃。原站先举用子查询缩小取行成本的办法。先沿较窄的索引找起点或本页主键，再回到聚簇索引读取需要的列。"},{"kind":"扩展知识","text":"能连续翻页时，用上一页的唯一排序键开启下一个范围扫描。有任意跳页要求时，覆盖索引加延迟回表可减小逐行读取成本，也可为固定查询保存页锚点。\n\n**例子与追问**　如果按 `id` 升序，下一页可用 `WHERE id \u003e ? ORDER BY id LIMIT 20`。必须保留偏移量时，可以先在 `(tenant_id, created_at, id)` 上按租户、时间、ID 取得 20 个主键，再 JOIN 原表并在外层重复排序。延迟回表减少了取行成本，扫描偏移的成本仍随偏移量增长。全量导出适合分段流式读取。\n\n[MySQL 手册 · LIMIT 优化](https://dev.mysql.com/doc/refman/8.4/en/limit-optimization.html)"}],"source":"preview","expanded":false},{"key":"mysql-631","number":631,"bank":"mysql","position":48,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295572283395","title":"如何在 MySQL 中监控和优化慢 SQL？","sections":[{"kind":"回答重点","text":"先配置慢查询日志及阈值，再定期汇总，最后对重点 SQL 用 `EXPLAIN` 定位。可用 `mysqldumpslow` 按模式聚合，或者结合 Performance Schema 查看平均耗时、调用次数和累积开销。"},{"kind":"扩展知识","text":"**排查步骤**　根据负载设定 `long_query_time` 及日志配置，同时查看 `events_statements_summary_by_digest`。一次数秒的查询和每秒几千次的小查询都可能值得处理。用代表性参数复现，结合 `EXPLAIN ANALYZE` 核对估算与实际，并查看等待事件。上线关注 p95、p99、扫描与返回行比例，连同写延迟及副本积压一起验证。\n\n[MySQL 手册 · 慢查询日志](https://dev.mysql.com/doc/refman/8.4/en/slow-query-log.html) · [语句汇总表](https://dev.mysql.com/doc/refman/8.4/en/performance-schema-statement-summary-tables.html)"}],"source":"preview","expanded":false},{"key":"mysql-632","number":632,"bank":"mysql","position":49,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295576477697","title":"MySQL 中 DELETE、DROP 和 TRUNCATE 的区别是什么？","sections":[{"kind":"回答重点","text":"`DELETE` 按条件删行，保留表结构。`DROP` 移除整张表及其定义。`TRUNCATE` 清空整张表并保留定义。面试时再区分是否支持 WHERE、用户事务回滚和自增重置。"},{"kind":"扩展知识","text":"| 操作 | 类别及事务行为 | 明显差别 |\n| --- | --- | --- |\n| `DELETE` | DML，InnoDB 显式事务提交前可回滚 | 执行适用的 DELETE 触发器，一般不重置自增 |\n| `TRUNCATE TABLE` | DDL，隐式提交，不能由用户事务回滚 | 无 `WHERE`，重置自增，通常更快，不执行逐行 DELETE 触发器 |\n| `DROP TABLE` | 普通持久表的 DDL，隐式提交 | 表、索引与表上触发器一并删除 |\n\n**追问**　当前表被其他表通过外键引用时，InnoDB 通常拒绝 `TRUNCATE`。MySQL 8 的原子 DDL 涉及崩溃时的整体成功或失败，理论层面应与用户事务中的 `ROLLBACK` 能力分别理解。\n\n[MySQL 手册 · TRUNCATE TABLE](https://dev.mysql.com/doc/refman/8.4/en/truncate-table.html) · [隐式提交](https://dev.mysql.com/doc/refman/8.4/en/implicit-commit.html)"}],"source":"preview","expanded":false},{"key":"mysql-633","number":633,"bank":"mysql","position":50,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295580672002","title":"MySQL 中 INNER JOIN、LEFT JOIN 和 RIGHT JOIN 的区别是什么？","sections":[{"kind":"回答重点","text":"区别在未匹配行怎么处理。INNER JOIN 只保留匹配到的行对。LEFT JOIN 保留全部左表行，右侧没有匹配时填 NULL。RIGHT JOIN 对称地保留右表行。"},{"kind":"扩展知识","text":"**例子与追问**　`customers c LEFT JOIN orders o ON o.customer_id=c.id AND o.status='PAID'` 会保留没有已支付订单的用户。若把 `o.status='PAID'` 移到 `WHERE`，NULL 扩展行会被过滤。连接键对应多条记录时，左表行可在结果里重复。统计每个用户的订单数时，按用户分组并用非空订单键的 `COUNT(o.id)`。\n\n[MySQL 手册 · JOIN](https://dev.mysql.com/doc/refman/8.4/en/join.html)"}],"source":"preview","expanded":false},{"key":"mysql-1214","number":1214,"bank":"mysql","position":51,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803235242875019265","title":"MySQL 中 `LIMIT 100000000, 10` 和 `LIMIT 10` 的执行速度是否相同？","sections":[{"kind":"回答重点","text":"通常 `LIMIT 10` 更快。顺序产生结果时，大偏移量需要先读取并丢弃前 1 亿条合格结果，再取 10 条。无偏移量的查询只要取得前 10 条就有机会停止。"},{"kind":"扩展知识","text":"如果必须先扫描、排序或聚合，`LIMIT 10` 也可能需要处理大量数据。如果匹配行不足 1 亿，大偏移量查询可能耗掉大量读取，最后返回空集。普通 B+ 树可按键定位，通常不能直接按结果集的第几行定位。优先用有索引支持的稳定排序和游标，或用延迟回表减轻内层偏移的取行成本。\n\n[MySQL 手册 · LIMIT 优化](https://dev.mysql.com/doc/refman/8.4/en/limit-optimization.html)"}],"source":"preview","expanded":false},{"key":"mysql-1217","number":1217,"bank":"mysql","position":52,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803251044575600642","title":"MySQL 中 DATETIME 和 TIMESTAMP 类型的区别是什么？","sections":[{"kind":"回答重点","text":"先讲时区和时间范围。`TIMESTAMP` 依会话时区转成 UTC 存储，读取时转回会话时区。`DATETIME` 保存日期时间值，普通读写保持这一值。两者表示范围不同，类型选择时要看是否跨时区及是否会超过 2038 年。"},{"kind":"扩展知识","text":"| 类型 | MySQL 8.4 常用范围概括 | 小数秒精度为 0 的存储 |\n| --- | --- | --- |\n| `DATETIME` | 1000 年至 9999 年 | 5 字节 |\n| `TIMESTAMP` | UTC 1970 年初至 2038 年 1 月 | 4 字节 |\n\n**追问**　两者都能声明精度 0 至 6，并可使用自动初始化或更新配置。营业预约的当地时间可用 `DATETIME`，跨时区安排另存业务时区。事件发生时刻可用 `TIMESTAMP` 并统一连接时区，跨度超出其范围时可用 UTC 约定的 `DATETIME`。\n\n[MySQL 手册 · 日期时间类型](https://dev.mysql.com/doc/refman/8.4/en/datetime.html) · [类型存储要求](https://dev.mysql.com/doc/refman/8.4/en/storage-requirements.html)"}],"source":"preview","expanded":false},{"key":"mysql-1219","number":1219,"bank":"mysql","position":53,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803265470015987713","title":"数据库的三大范式是什么？","sections":[{"kind":"回答重点","text":"三大范式依次关注字段原子性、部分依赖和传递依赖。以复合键为例，若成绩由学生和课程一起确定，但学生姓名只靠学生 ID 就能决定，姓名应该归到学生表。"},{"kind":"扩展知识","text":"严格表述时，2NF 要求所有非主属性完全依赖每个候选键。对 3NF，每个非平凡函数依赖 `X → A` 应满足 `X` 是超键或 `A` 属于某个候选键。拆表应以业务中的真实函数依赖为依据。\n\n**例子与追问**　成绩表键为 `(student_id, course_id)`，姓名只依赖学生，应拆到学生表。学生表若同时存 `dept_id` 与依赖它的 `dept_name`，可拆院系表，避免修改部名时更新多行。业务可为历史快照或高频读取冗余少量字段，同时定义维护和对账方式。"}],"source":"preview","quote":"字段不可再分、消除部分依赖、消除传递依赖","expanded":false},{"key":"mysql-1376","number":1376,"bank":"mysql","position":54,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803675094573637633","title":"在 MySQL 中，你使用过哪些函数？","sections":[{"kind":"回答重点","text":"可按实际用途分类。字符串用 `CONCAT`、`SUBSTRING`、`TRIM`。字符数和字节数分别用 `CHAR_LENGTH` 和 `LENGTH`。日期时间用 `NOW`、`CURDATE` 和 `DATE_FORMAT`。再结合自己项目补充聚合、空值处理或窗口函数的例子。"},{"kind":"扩展知识","text":"**例子与追问**　算每个租户的订单总额时，先用索引友好的时间范围过滤，再用 `SUM(amount)` 聚合。若对空结果要展示零，可用 `COALESCE`。MySQL 8.0 及以上可以用窗口函数实现每用户最新订单，窗口排序应对并列值额外按 ID 排序。窗口函数保留每个输入行，普通 `GROUP BY` 会汇总为每组一行。\n\n[MySQL 手册 · 函数和运算符](https://dev.mysql.com/doc/refman/8.4/en/functions.html)"}],"source":"preview","expanded":false},{"key":"mysql-1377","number":1377,"bank":"mysql","position":55,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803678280223023105","title":"MySQL 中 TEXT 类型最大可以存储多长的文本？","sections":[{"kind":"回答重点","text":"普通 `TEXT` 最大是 65,535 字节，约 64 KiB。这个家族按容量从小到大还有 `TINYTEXT`、`MEDIUMTEXT` 和 `LONGTEXT`，需要按实际载荷选型。"},{"kind":"扩展知识","text":"上限按字节算。`utf8mb4` 中若所有字符都占 4 字节，普通 `TEXT` 最多能保存 16,383 个这样的字符。\n\n| 类型 | 理论载荷上限（字节） |\n| --- | ---: |\n| `TINYTEXT` | 255 |\n| `TEXT` | 65,535 |\n| `MEDIUMTEXT` | 16,777,215 |\n| `LONGTEXT` | 4,294,967,295 |\n\n**追问**　`CHAR_LENGTH()` 返回字符数，`LENGTH()` 返回字节数。协议包、客户端与行格式等可能进一步限制实际可传输或存储大小。普通 B-tree 索引对 TEXT 通常需要前缀长度，词项检索可评估全文索引。\n\n[MySQL 手册 · BLOB 与 TEXT](https://dev.mysql.com/doc/refman/8.4/en/blob.html)"}],"source":"preview","expanded":false},{"key":"mysql-1378","number":1378,"bank":"mysql","position":56,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803679397849849858","title":"MySQL 中 AUTO_INCREMENT 列达到最大值时会发生什么？","sections":[{"kind":"回答重点","text":"整数自增值耗尽后，后续生成自增值的插入会失败。原站举的是到达有符号 `INT` 上限后出现重复键错误的场景，序列不会自然回到 0 或 1。"},{"kind":"扩展知识","text":"**例子与追问**　`INT UNSIGNED` 的上限是 4,294,967,295。可根据自增当前位置、增长速率与容量阈值提前告警。扩大到 `BIGINT` 时，检查关联列、应用驱动类型和接口序列化范围，规划大表 DDL 或迁移。自增会因回滚、批分配等产生空洞，适合生成技术主键，连续业务编号需另行设计。\n\n[MySQL 手册 · InnoDB 自增处理](https://dev.mysql.com/doc/refman/8.4/en/innodb-auto-increment-handling.html)"}],"source":"preview","expanded":false},{"key":"mysql-1379","number":1379,"bank":"mysql","position":57,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803683668511154178","title":"在 MySQL 中存储金额数据，应该使用什么数据类型？","sections":[{"kind":"回答重点","text":"主流做法有两种。用 `DECIMAL` 保存精确小数，或用 `BIGINT` 保存最小货币单位，例如 99.99 元存为 9999 分。近似浮点类型会带来业务金额精度问题。"},{"kind":"扩展知识","text":"`DECIMAL(p,s)` 中 `p` 是总位数，`s` 是小数位数。Java 应用常用 `BigDecimal` 承接这种精确小数。\n\n**例子与追问**　普通两位小数金额可用 `DECIMAL(18,2)`，但汇率或计费单价常要更多小数位，币种也可能使用 0 或 3 位小数。应用端使用精确十进制类型，明确何时舍入、按单项还是合计舍入。多币种列保留币种信息。\n\n[MySQL 手册 · 定点类型](https://dev.mysql.com/doc/refman/8.4/en/fixed-point-types.html)"}],"source":"preview","expanded":false},{"key":"mysql-1418","number":1418,"bank":"mysql","position":58,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1804076675288997889","title":"什么是数据库的视图？","sections":[{"kind":"回答重点","text":"普通视图可以理解为命名查询。原站给出三个用途。把复杂关联封装起来，按权限暴露部分列，以及给应用一个可保持稳定的查询接口。"},{"kind":"扩展知识","text":"**例子与追问**　给运营读取 `active_customers` 视图，只暴露有关字段。定义权限时检查 `SQL SECURITY DEFINER`、`INVOKER` 的差异及授权。部分简单视图可更新，带聚合或 `DISTINCT` 的视图通常不可更新。MySQL 可按情况合并视图定义或使用临时结果，长期持久化的预计算数据可通过汇总表实现。\n\n[MySQL 手册 · 使用视图](https://dev.mysql.com/doc/refman/8.4/en/views.html)"}],"source":"preview","quote":"一条起了名字的 SELECT 语句","expanded":false},{"key":"mysql-1419","number":1419,"bank":"mysql","position":59,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1804078313512837122","title":"什么是数据库的游标？","sections":[{"kind":"回答重点","text":"游标像迭代器，可逐行遍历查询结果。MySQL 存储程序中的典型步骤是 `DECLARE`、`OPEN`、`FETCH`、`CLOSE`。适合确实需要逐行处理或维护行间状态的任务。"},{"kind":"扩展知识","text":"MySQL 存储程序的游标只读、只能向前，通常用 `NOT FOUND` 处理读完。\n\n逐行逻辑可处理状态依赖的业务，但大规模逐行处理时频繁执行语句成本较高，可先考虑集合 SQL 或分批处理。数据库游标属于数据库接口，接口分页里说的 cursor 通常是上一页的排序位置，两道题里的含义各有侧重。\n\n[MySQL 手册 · 游标](https://dev.mysql.com/doc/refman/8.4/en/cursors.html)"}],"source":"preview","expanded":false},{"key":"mysql-1476","number":1476,"bank":"mysql","position":60,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805134256694566913","title":"为什么不推荐在 MySQL 中直接存储图片、音频、视频等大容量内容？","sections":[{"kind":"回答重点","text":"大量图片、音视频入库会放大表空间、缓存和 I/O 负担。复制和备份也需要处理这些大对象的数据量。关系库通常保存业务元数据，媒体内容由对象存储承载。"},{"kind":"扩展知识","text":"跨系统保存时要处理上传成功但元数据写入失败、删除顺序以及孤儿对象。可以先创建待确认记录，上传校验后将状态改为可用，后台定期清理过期对象。小而且需要随业务事务原子提交的附件，可以在容量预算内评估 BLOB。\n\n[MySQL 手册 · BLOB 与 TEXT](https://dev.mysql.com/doc/refman/8.4/en/blob.html)"}],"source":"preview","expanded":false},{"key":"mysql-1477","number":1477,"bank":"mysql","position":61,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805135090346041346","title":"相比于 Oracle，MySQL 的优势有哪些？","sections":[{"kind":"回答重点","text":"原站把 MySQL 的优势归纳为开源社区版和较低的上手门槛。对常见 Web 业务，可结合生态、人员经验和部署复杂度估算总体成本。Oracle 的授权和支持费用取决于合同、版本和部署方式。"},{"kind":"扩展知识","text":"选型要看团队技能、现有应用相容性、专业特性和总成本。依赖 PL/SQL、特定分区能力、RAC 或其他 Oracle 特性的系统，迁移成本可能远高于许可差价。做同数据规模、相同可靠性要求的工作负载验证，并计入支持、迁移、回滚与长期运维。\n\n[MySQL · Community Edition](https://www.mysql.com/products/community/)"}],"source":"preview","expanded":false},{"key":"mysql-1478","number":1478,"bank":"mysql","position":62,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805142216804081666","title":"MySQL 中 VARCHAR(100) 和 VARCHAR(10) 的区别是什么？","sections":[{"kind":"回答重点","text":"括号写的是最多能存多少字符。相同的值不会因定义更大而填充到上限，但长度前缀可能不同。列的声明上限还会参与行宽、索引长度以及部分内部操作的空间判断。"},{"kind":"扩展知识","text":"**例子与追问**　长度前缀以最大可能字节数判断，最大不超过 255 字节用 1 字节，否则 2 字节。`utf8mb4 VARCHAR(10)` 最大 40 字节，通常用 1 字节前缀。`utf8mb4 VARCHAR(100)` 最大 400 字节，通常用 2 字节前缀。超长值在严格模式中通常触发错误，某些尾部空格处理有例外。\n\n[MySQL 手册 · CHAR 与 VARCHAR](https://dev.mysql.com/doc/refman/8.4/en/char.html) · [类型存储要求](https://dev.mysql.com/doc/refman/8.4/en/storage-requirements.html)"}],"source":"preview","expanded":false},{"key":"mysql-1479","number":1479,"bank":"mysql","position":63,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805147589229355009","title":"在什么情况下，不推荐为数据库建立索引？","sections":[{"kind":"回答重点","text":"小表、写多读少的表、过滤效果很弱的列，以及日常查询很少涉及的列，常常不值得加普通索引。先核对主要查询与现有索引，再看新增索引能少扫描多少数据。"},{"kind":"扩展知识","text":"**例子与追问**　`status` 只有几个值，但占比很小的 `PENDING` 可能有价值，`(status, created_at)` 还可支持待处理队列的筛选和排序。索引可能承担唯一性或外键约束，评估删除时也要识别这些依赖。结合使用情况、扫描行数、写放大和代表性参数判断。\n\n[MySQL 手册 · 优化与索引](https://dev.mysql.com/doc/refman/8.4/en/optimization-indexes.html)"}],"source":"preview","expanded":false},{"key":"mysql-1482","number":1482,"bank":"mysql","position":64,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805162404970700802","title":"MySQL 中 EXISTS 和 IN 的区别是什么？","sections":[{"kind":"回答重点","text":"`EXISTS` 关心能不能找到匹配行，只需确认存在。`IN` 关心值是否在集合中。原站用逐行探测和先构建集合解释两种执行思路。现代 MySQL 可能把两者改写为半连接，选择应看实际计划。"},{"kind":"扩展知识","text":"**例子与追问**　查有订单的用户可以写 `WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id)`，也可以用 `u.id IN (SELECT o.user_id FROM orders o)`。对反向筛选尤其要处理 NULL。子查询集合含 NULL 时，`x NOT IN (...)` 对不匹配的非空 x 可得到 UNKNOWN 并被过滤。等值条件下，`NOT EXISTS` 可保留找不到匹配行的用户。外层键可空时同样要明确期望语义。\n\n[MySQL 手册 · 半连接与反连接优化](https://dev.mysql.com/doc/refman/8.4/en/semijoins-antijoins.html)"}],"source":"preview","expanded":false},{"key":"mysql-1534","number":1534,"bank":"mysql","position":65,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805421201916108802","title":"什么是 Write-Ahead Logging (WAL) 技术？它的优点是什么？MySQL 中是否用到了 WAL？","sections":[{"kind":"回答重点","text":"WAL 要求数据页刷盘前，能恢复这些修改的日志已经持久化。InnoDB 的 redo 正是这个机制。事务修改内存数据页、产生 redo，数据页可稍后写回，崩溃时根据日志恢复。"},{"kind":"扩展知识","text":"例如一笔订单同时修改订单页、库存页和索引页。日志追加和批量刷盘可摊薄随机 I/O，数据页随后按刷页策略写回。检查点限制恢复时的扫描范围，并允许复用旧 redo 空间。未提交事务再通过 undo 等机制处理。与页写前的日志要求相关的追问，可结合 doublewrite 解释半页写修复。\n\n[MySQL 手册 · Redo Log](https://dev.mysql.com/doc/refman/8.4/en/innodb-redo-log.html)"}],"source":"preview","quote":"先写日志，再写数据","expanded":false},{"key":"mysql-1535","number":1535,"bank":"mysql","position":66,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1805421515868151810","title":"你们生产环境的 MySQL 中使用了什么事务隔离级别？为什么？","sections":[{"kind":"回答重点","text":"原站从 RR 和 RC 比较切入。RR 的范围加锁可能涉及临键锁，RC 在常规搜索中减少间隙锁，某些高并发写业务会因此采用 RC。回答时说明自己实例的实际设置，以及业务如何处理前后读到不同已提交版本。"},{"kind":"扩展知识","text":"用 `SELECT @@SESSION.transaction_isolation, @@GLOBAL.transaction_isolation` 核对会话值和实例默认值。RC 在外键与重复键检查等场景仍可能使用间隙锁。\n\n**示例回答**　如果项目使用 RC，可以说订单操作主要依赖唯一键、条件更新和短事务，业务允许普通查询每次看到不同的已提交快照，并希望减少部分范围操作的间隙锁。若项目确实使用 RR，可以举需要同一事务内稳定快照的对账查询，并说明如何缩短写事务和检查锁范围。无论选哪一级，多条 SQL 组成的业务不变量都需针对并发冲突验证。\n\n[MySQL 手册 · InnoDB 隔离级别](https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html)"}],"source":"preview","expanded":false},{"key":"mysql-1218","number":1218,"bank":"mysql","position":67,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1803252534539182081","title":"为什么阿里巴巴的 Java 手册不推荐使用存储过程？","sections":[{"kind":"回答重点","text":"原站从工程维护解释。把核心业务逻辑写进数据库方言，迁移时要付出改写成本。存储过程的调试、自动化测试及和应用的联合发布也更复杂。阿里巴巴 Java 开发手册将禁用存储过程列为该规约的强制项。"},{"kind":"扩展知识","text":"例如订单规则同时写在应用和存储过程里，规则升级时两个发布单元和回滚路径都要协调。应用服务可集中管理业务流程，数据库保留约束和擅长的集合操作。存储过程在某些数据密集、通信成本高的任务中有价值，若团队采用，需要纳入代码审查、版本控制和可观测性。\n\n[阿里巴巴 · Java 开发手册](https://github.com/alibaba/Alibaba-Java-Coding-Guidelines)"}],"source":"preview","expanded":false},{"key":"mysql-3179","number":3179,"bank":"mysql","position":68,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1813456791649378305","title":"如何实现数据库的不停服迁移？","sections":[{"kind":"回答重点","text":"先看数据量，再看迁移期间的新写入、校验和回切。原站举双写加灰度切流。这个思路要处理并发写入、两边部分失败和切换后新数据的回流。"},{"kind":"扩展知识","text":"双写需要记录失败并补偿，避免任意一侧成功就被视为完成。也可采用“全量快照 + binlog CDC”来传送增量，将写入所有权从旧库交给新库。下面按这种做法展开。\n\n**实施步骤**　\n\n1. 检查目标表、字符集、权限、索引和容量，确定切换阈值及回退条件。\n2. 建立快照并记录对应位点。分页回填、限流，同时保留 binlog 并接收增量事件。\n3. 追平时确保同键顺序、幂等与删除语义。用分段行数、校验和及业务统计对账。\n4. 先影子读比较结果，再在切换窗口通过路由、写入栅栏和连接排空交接。确需确保零停写时，业务入口可接收并排队，按顺序恢复写入。\n5. 通过反向同步、已验证的回放计划或保留新写入日志支持回退，持续观察错误率、延迟和积压。\n\n[Debezium · MySQL 快照与增量捕获](https://debezium.io/documentation/reference/stable/connectors/mysql.html)"}],"source":"preview","expanded":false},{"key":"mysql-4040","number":4040,"bank":"mysql","position":69,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1816438385021997058","title":"MySQL 数据库的性能优化方法有哪些？","sections":[{"kind":"回答重点","text":"原站分开发侧和运维侧两个角度。开发侧从 SQL、索引、表结构减小扫描和传输，比如只取需要的列、用时间区间过滤日期。运维侧根据监控处理 I/O、锁竞争、内存和实例容量。"},{"kind":"扩展知识","text":"CPU 高先找总耗时最高的 SQL 与扫描量，I/O 紧张再看页读写、缓存和刷盘。锁等待高要缩短事务并降低冲突与扫描范围。优化表结构时选合适列类型和索引，清理冗余、归档冷数据。实例侧根据工作集与主机内存调 Buffer Pool，限制连接并发。副本、缓存和分片可以分流特定瓶颈，同时需要维护一致性和故障切换。\n\n[MySQL 手册 · Optimization](https://dev.mysql.com/doc/refman/8.4/en/optimization.html)"}],"source":"preview","expanded":false},{"key":"mysql-2629","number":2629,"bank":"mysql","position":70,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1811361310328279041","title":"MySQL 中 InnoDB 存储引擎与 MyISAM 存储引擎的区别是什么？","sections":[{"kind":"回答重点","text":"最先比较事务和锁。**InnoDB** 有 ACID 事务和四种隔离级别，默认 RR。它用 MVCC、记录锁及必要的间隙锁协调并发，崩溃后可用 redo 恢复。它用聚簇索引组织行数据，也支持外键。\n\n**MyISAM** 采用表级锁，没有事务和外键，数据与索引文件分开。它支持全文索引与压缩表。满足尾部追加条件时，MyISAM 可以让插入与读取并发，普通更新仍受表锁限制。"},{"kind":"扩展知识","text":"| 维度 | InnoDB | MyISAM |\n| --- | --- | --- |\n| 数据组织 | 聚簇树叶子存行 | 数据和索引文件分开 |\n| 并发 | 行级锁与 MVCC | 主要为表锁 |\n| 崩溃恢复 | 有 redo、undo 支撑 | 可能需要检查、修复表 |\n| 简单无条件 `COUNT(*)` | 通常要扫描索引 | 可使用维护的总行数 |\n\n**追问**　两者均支持全文索引，MyISAM 的少数历史优势应结合实际版本和业务权衡。迁移旧表需要验证锁行为、SQL 语义、空间和导入窗口。\n\n[MySQL 手册 · MyISAM](https://dev.mysql.com/doc/refman/8.4/en/myisam-storage-engine.html) · [MyISAM 并发插入](https://dev.mysql.com/doc/refman/8.4/en/concurrent-inserts.html) · [InnoDB 特点](https://dev.mysql.com/doc/refman/8.4/en/innodb-introduction.html)"}],"source":"visible","expanded":false},{"key":"mysql-2640","number":2640,"bank":"mysql","position":71,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1811361311347494913","title":"MySQL 的查询优化器如何选择执行计划？","sections":[{"kind":"回答重点","text":"按解析、预处理、优化讲。解析得到语法结构，预处理解析表列、检查权限等。优化器比较候选访问路径与连接顺序，用估计的 I/O、CPU 和行数选择成本较低的方案。\n\n以百万行订单表为例，查唯一主键时，走聚簇索引仅需沿树找到对应记录。全表扫描则要读取很多数据页，并逐行判断。换成命中多数记录的过滤条件后，额外的二级索引扫描和回表就可能让扫表更便宜。"},{"kind":"扩展知识","text":"**例子与追问**　订单和客户 JOIN 时，可比较先筛客户再按外键查订单、或先按订单日期过滤后再连接。索引基数、直方图和成本模型影响选择。列分布倾斜、过滤条件相关或统计过旧时，估算可能偏离实际。用 `EXPLAIN`、`EXPLAIN ANALYZE` 或优化器跟踪检查，再决定更新统计、改索引或改 SQL。\n\n[MySQL 手册 · 优化器成本模型](https://dev.mysql.com/doc/refman/8.4/en/cost-model.html) · [优化器跟踪](https://dev.mysql.com/doc/refman/8.4/en/optimizer-tracing.html)"}],"source":"visible","expanded":false},{"key":"mysql-4943","number":4943,"bank":"mysql","position":72,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1821023107360137217","title":"什么是数据库的逻辑删除？数据库的物理删除和逻辑删除有什么区别？","sections":[{"kind":"回答重点","text":"逻辑删除给行加删除标记，例如 `is_deleted=1`，普通查询按可见状态过滤。物理删除执行 `DELETE`，提交后该行从之后的普通查询结果消失。"},{"kind":"扩展知识","text":"InnoDB 的旧行版本可能仍被未结束的快照读取。等相关历史版本不再需要，引擎才会执行 purge。\n\n逻辑删除要保证列表、关联、统计都加正确过滤，也要设计活跃记录唯一性。直接在 `(email, deleted_at)` 上建唯一索引且活跃态为 NULL 时，MySQL 允许重复 NULL，可以改为生成列，只在活跃态生成唯一键、已删除行生成 NULL。物理删除后表空间文件通常也不会立即缩小，清理与磁盘回收需分别观察。\n\n[MySQL 手册 · 多版本与 purge](https://dev.mysql.com/doc/refman/8.4/en/innodb-multi-versioning.html) · [CREATE INDEX](https://dev.mysql.com/doc/refman/8.4/en/create-index.html)"}],"source":"preview","expanded":false},{"key":"mysql-4944","number":4944,"bank":"mysql","position":73,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1821065028363264002","title":"什么是数据库的逻辑外键？数据库的物理外键和逻辑外键各有什么优缺点？","sections":[{"kind":"回答重点","text":"以订单的 `user_id` 为例，逻辑外键把关联当作业务约定，由应用维护。物理外键使用 `FOREIGN KEY`，数据库检查被引用记录是否存在，并可对父表变更设定约束。"},{"kind":"扩展知识","text":"**例子与追问**　订单项引用订单。单库可用外键让缺失父行的写入失败，级联规则要评估锁和影响范围。跨库分片时可用逻辑关系，配合相同路由键、适当的事务、状态约束与孤儿检测，处理并发删除和重试。应用先查父记录再插子记录时，若没有同步机制，两步之间的父记录删除仍能造成孤儿。\n\n[MySQL 手册 · 外键约束](https://dev.mysql.com/doc/refman/8.4/en/create-table-foreign-keys.html)"}],"source":"preview","expanded":false},{"key":"mysql-9498","number":9498,"bank":"mysql","position":74,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1849298413057683458","title":"MySQL 事务的二阶段提交是什么？","sections":[{"kind":"回答重点","text":"二阶段提交协调 InnoDB 的 redo 与 Server 的 binlog。原站先讲 Prepare 阶段，InnoDB 将事务置于可恢复的准备状态，随后再由 binlog 的提交记录和 InnoDB 的最终提交完成协调。"},{"kind":"扩展知识","text":"准备阶段保存可恢复的 prepared 状态。提交路径写入 binlog 中的事务记录，并按相应策略持久化。如果在准备后崩溃，恢复读取有效 binlog 中的事务 XID，存在完整提交记录的 prepared 事务完成提交，缺少有效记录的回滚。组提交可批量协调，强持久性通常结合 `sync_binlog=1` 与 `innodb_flush_log_at_trx_commit=1`。显式 `XA PREPARE` 和 `XA COMMIT` 则涉及由外部协调者管理的全局事务。\n\n[MySQL 手册 · 二进制日志与崩溃恢复](https://dev.mysql.com/doc/refman/8.4/en/binary-log.html) · [XA 事务](https://dev.mysql.com/doc/refman/8.4/en/xa.html)"}],"source":"preview","expanded":false},{"key":"mysql-9499","number":9499,"bank":"mysql","position":75,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1849347477245734913","title":"MySQL 三层 B+ 树能存多少数据？","sections":[{"kind":"回答重点","text":"沿用原站的口算模型。16 KiB 的内部页按每个索引项 14 字节估算，扇出约 1,170。叶页按每行 1 KiB 估算，可放约 16 行。根、中间两层乘上叶页容纳量，得到约 2,190 万行。"},{"kind":"扩展知识","text":"**算例与追问**　上面的估算暂时忽略页头、页目录和空闲空间。若内部项约 20 字节且页有效利用率按 70% 算，两个扇出约 573、叶页约 11 行，结果约 361 万。二级索引的叶页记录内容又不同。回答时给出近似公式与假设，再给数量级。\n\n[MySQL 手册 · InnoDB 索引物理结构](https://dev.mysql.com/doc/refman/8.4/en/innodb-physical-structure.html)"}],"source":"preview","expanded":false},{"key":"mysql-9805","number":9805,"bank":"mysql","position":76,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1854714622329430017","title":"MySQL 在设计表（建表）时需要注意什么？","sections":[{"kind":"回答重点","text":"先按业务边界选择合适的字段类型，再给表设计稳定主键。例如金额用定点数，日期用时间类型，整数和字符串长度按业务范围估算，同时考虑未来增长。"},{"kind":"扩展知识","text":"**例子与追问**　订单表可以有短主键 `id`，用 `UNIQUE(tenant_id, order_no)` 保证租户内单号唯一。金额使用 `DECIMAL` 并明确币种。时间线根据常查路径设计 `(tenant_id, created_at, id)`。高频条件给出明确类型与可空性，对敏感字段明确访问和保留策略。上线大表变更前还应验证 DDL 算法、元数据锁、资源峰值与回滚路径。\n\n[MySQL 手册 · CREATE TABLE](https://dev.mysql.com/doc/refman/8.4/en/create-table.html) · [Online DDL](https://dev.mysql.com/doc/refman/8.4/en/innodb-online-ddl-operations.html)"}],"source":"preview","quote":"够用就好","expanded":false},{"key":"mysql-10385","number":10385,"bank":"mysql","position":77,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1860973240398307330","title":"MySQL 插入一条 SQL 语句，redo log 记录的是什么？","sections":[{"kind":"回答重点","text":"原站用页级修改来解释 redo。插入时可以涉及目标页、记录内容及页目录变化。恢复靠 InnoDB 识别这些低层变更来重做页操作，记录格式随操作类型而变化。"},{"kind":"扩展知识","text":"写入可能触发页分裂、分配新页或修改页指针。redo 按内部记录格式描述这些操作，使引擎在原有页基础上重做，而非重新解析原始 INSERT。LSN 帮助确定日志顺序和恢复范围。binlog 的 ROW 格式面向行变更事件，供复制与恢复消费，它和 redo 的低层职责需要分别说明。\n\n[MySQL 手册 · Redo Log](https://dev.mysql.com/doc/refman/8.4/en/innodb-redo-log.html)"}],"source":"preview","expanded":false},{"key":"mysql-11175","number":11175,"bank":"mysql","position":78,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1889252459911045121","title":"SQL 中 select、from、join、where、group by、having、order by、limit 的执行顺序是什么？","sections":[{"kind":"回答重点","text":"书写顺序和逻辑处理顺序不同。这组子句可按 `FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT` 理解。\n\n- `FROM` 确定数据源，`JOIN` 和 `ON` 处理连接匹配及需要保留的外连接行。\n- `WHERE` 先筛行，`GROUP BY` 分组，`HAVING` 再筛组。\n- `SELECT` 计算要输出的列，`ORDER BY` 排结果，`LIMIT` 最后取指定数量。"},{"kind":"扩展知识","text":"**例子与追问**　订单统计先连接用户和订单，再用 WHERE 过滤原始记录，用 GROUP BY 按用户分组，HAVING 过滤聚合后的组，随后选择输出列、排序并取前 N。MySQL 允许在 HAVING、GROUP BY、ORDER BY 引用某些 SELECT 别名，WHERE 中不能引用同层 SELECT 新定义的别名。物理计划可先用索引过滤、下推条件或重排允许交换的 JOIN。\n\n[MySQL 手册 · SELECT](https://dev.mysql.com/doc/refman/8.4/en/select.html) · [列别名规则](https://dev.mysql.com/doc/refman/8.4/en/problems-with-alias.html)"}],"source":"visible","expanded":false},{"key":"mysql-11623","number":11623,"bank":"mysql","position":79,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1915294533699280898","title":"为什么 MySQL 索引用的是 B+ 树而不是红黑树？","sections":[{"kind":"回答重点","text":"比较重点是读多少磁盘页。红黑树是二叉结构，B+ 树的内部页可有很高的扇出，在相同记录规模下通常更矮。B+ 树叶子页按键有序，还能顺着叶子做范围访问。"},{"kind":"扩展知识","text":"**例子与追问**　平衡二叉结构的节点最多两个子节点，而一个 B+ 树内部页可管理数百个子页。即使两者的点查复杂度都属对数级，按索引页组织时 B+ 树往往减少跨页访问。范围查询先定位起点，再沿叶页读取，适合相邻键批量访问。红黑树也能有序遍历，布局与扇出才是这个场景的主要差别。\n\n[MySQL 手册 · InnoDB 索引物理结构](https://dev.mysql.com/doc/refman/8.4/en/innodb-physical-structure.html)"}],"source":"preview","expanded":false},{"key":"mysql-12134","number":12134,"bank":"mysql","position":80,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1963412684237783041","title":"MySQL一张表最多可以有多少列？","sections":[{"kind":"回答重点","text":"先给两个上限。MySQL 8.4 的理论上限是每表 4096 列，InnoDB 最多 1017 列。实际还受行大小约束，例如多列长字符串达到声明的最大行宽时，即使列数还很少也可能建表失败。"},{"kind":"扩展知识","text":"MySQL 内部行大小上限通常为 65,535 字节，BLOB/TEXT 内容有特殊计算方式。InnoDB 页内记录还受页大小和行格式约束。虚拟生成列计入 InnoDB 列数限制，函数索引实现使用隐藏虚拟生成列，也要纳入计算。字段接近上限时通常需要重新审视冷热字段和结构设计。\n\n[MySQL 手册 · 列数和行大小限制](https://dev.mysql.com/doc/refman/8.4/en/column-count-limit.html) · [InnoDB 限制](https://dev.mysql.com/doc/refman/8.4/en/innodb-limits.html)"}],"source":"preview","expanded":false},{"key":"mysql-12255","number":12255,"bank":"mysql","position":81,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1976910717332246529","title":"什么是 CDC（Change Data Capture）？常见的 CDC 工具有哪些？","sections":[{"kind":"回答重点","text":"CDC 是变更数据捕获，把增删改变成事件送到下游。例如订单新增或手机号变化，可以同步给消息系统、搜索索引或数仓。MySQL 常见实现从 binlog 消费，避免周期性反复全表扫描。"},{"kind":"扩展知识","text":"Debezium 可做初始快照后继续读 binlog，Canal 常用于订阅 MySQL binlog，Flink CDC 可接入流式处理与下游写入。日志捕获通常能保留删除信息并减少反复扫业务表。工程实现还要跟踪位点、保证日志保留、兼容 DDL、处理重放和脱敏。端到端一致性交付取决于源端、检查点和目标写入的配合。\n\n[Debezium · MySQL Connector](https://debezium.io/documentation/reference/stable/connectors/mysql.html) · [阿里巴巴 · Canal](https://github.com/alibaba/canal) · [Apache Flink CDC · MySQL Connector](https://nightlies.apache.org/flink/flink-cdc-docs-stable/docs/connectors/flink-sources/mysql-cdc/)"}],"source":"preview","expanded":false},{"key":"mysql-12258","number":12258,"bank":"mysql","position":82,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1976928525747245058","title":"多线程并发同步数据时（数据库的数据同步到数仓中）需要注意什么问题？","sections":[{"kind":"回答重点","text":"先讲同一行的事件顺序。若先更新 A、后更新 B，线程重排会使目标端最终停在 A。常见做法是按主键哈希分区，同一键固定落到一个有序处理通道，再设计失败重放、断点和对账。"},{"kind":"扩展知识","text":"**实施步骤**　\n\n1. 全量按稳定主键范围或分片并行，避免重叠和遗漏，保证各任务使用一致性快照方案或可验证的增量衔接。\n2. 增量按业务键路由并保持同键写入顺序，目标使用主键 upsert、版本判定和删除事件。跨键事务需要整体可见时，在目标端增加事务边界或发布控制。\n3. 目标持久提交后才推进检查点，失败重放用幂等写消化重复。回填遇到已同步的更新时按版本或流程防止旧数据反覆盖。\n4. 配置限速、背压和重试，监控延迟、失败率、偏移量和数据倾斜。用主键段校验、行数与业务指标对账。\n\n[Apache Flink CDC · MySQL 增量快照](https://nightlies.apache.org/flink/flink-cdc-docs-stable/docs/connectors/flink-sources/mysql-cdc/)"}],"source":"preview","expanded":false},{"key":"redis-651","number":651,"bank":"redis","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295647780865","title":"Redis 主从复制的实现原理是什么？","source":"preview","sections":[{"kind":"回答重点","text":"主节点维护复制 ID 和复制偏移量。副本初次连接时通常全量同步，收到快照后再应用同步期间积累的写命令。短暂断线后发 PSYNC，只要复制历史匹配、缺失的数据还在主节点的复制积压缓冲区，就能从旧偏移续传。"},{"kind":"扩展知识","text":"主节点已写到 1200，副本收到 1000 时断开。积压区里还有从 1001 到 1200 的内容时可以补上。Redis 复制默认异步，因此应用收到主节点的写成功并不代表副本此时能读到同一值。"},{"kind":"参考资料","text":"[Redis 复制](https://redis.io/docs/latest/operate/oss_and_stack/management/replication/)"}],"expanded":false},{"key":"redis-652","number":652,"bank":"redis","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295651975169","title":"Redis 集群的实现原理是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Redis Cluster 把键映射到 16384 个哈希槽，多个主节点各负责一段槽并配有副本。节点通过集群总线交换拓扑和故障状态。客户端根据槽路由，遇到 MOVED 更新常用映射，槽迁移中的 ASK 只临时去目标节点执行这次命令。"},{"kind":"扩展知识","text":"三个主节点可各承担约三分之一的槽。把同一用户有关的两个键写成 user:{42}:profile、user:{42}:quota，可以让支持同槽多键操作的命令在一个节点执行。"}],"expanded":false},{"key":"redis-634","number":634,"bank":"redis","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295584866306","title":"Redis 通常应用于哪些场景？","source":"preview","sections":[{"kind":"回答重点","text":"Redis 适合重复读缓存、短期状态、计数、排行榜和限流。可用 String 存结果和计数，ZSET 按分数排序，Hash 更新对象局部字段，Streams 保存可确认的事件。选型先问能否容忍丢失、是否需要回放。"},{"kind":"扩展知识","text":"Agent 会话里，Redis 可保存模型配额计数和在线标记，TTL 到期自动清理。任务最终结果和可恢复事件还要有明确的持久记录，才能判断断线与真正失败的区别。"}],"expanded":false},{"key":"redis-635","number":635,"bank":"redis","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295589060609","title":"Redis 为什么这么快？","source":"preview","sections":[{"kind":"回答重点","text":"常用数据在内存，查找多用哈希等高效结构。事件循环可同时关注大量连接，主执行路径以串行处理为主，减少共享数据结构上的锁竞争。网络往返、慢命令与持久化成本仍可能主导延迟。"},{"kind":"扩展知识","text":"查一个键通常很快。另一客户端一次读走巨大的集合，或运行耗时脚本时，其他正常请求也可能排队。优化前先看延迟分位数与 SLOWLOG。"}],"expanded":false},{"key":"redis-636","number":636,"bank":"redis","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295593254914","title":"为什么 Redis 设计为单线程？6.0 版本为何引入多线程？","source":"preview","sections":[{"kind":"回答重点","text":"核心命令串行执行，避免为每个数据结构维护复杂的并发访问规则。Redis 6 的可选 I/O 线程主要分担网络读写等工作，典型命令执行仍在主线程。后台持久化、惰性释放等任务也可在其他线程或进程运行。"},{"kind":"扩展知识","text":"大量客户端发送短命令时，网络读写可能先耗满 CPU，I/O 线程有机会提高吞吐。若瓶颈是一条遍历百万元素的命令，要修改访问方式或拆分数据。"}],"expanded":false},{"key":"redis-637","number":637,"bank":"redis","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295593254915","title":"Redis 中常见的数据类型有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"五种常见结构是字符串 String、哈希 Hash、列表 List、集合 Set、有序集合 ZSET。Bitmap、HyperLogLog、Geo 和 Stream 对应不同用法。使用时按需要的查找、排序、去重、范围和确认语义选。"},{"kind":"扩展知识","text":"存用户属性可用 Hash。查是否参加活动用 Set。按积分找前三名用 ZSET。订单通知要支持确认和补处理时，可考虑 Streams 并设计 pending 与重试。"}],"expanded":false},{"key":"redis-638","number":638,"bank":"redis","position":7,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295597449217","title":"Redis 中跳表的实现原理是什么？","source":"preview","sections":[{"kind":"回答重点","text":"跳表把所有元素排在第 0 层，在上方随机抽样形成多层索引。查询从较高层向右，下一步越界时向下一层。随机层高使查找、插入、删除期望为 O(log n)。ZSET 实现还可用跨度辅助求排名。"},{"kind":"扩展知识","text":"找分数 81 时先在顶层跨过一大片低分元素，再下降定位。定位到第一个满足范围的元素后，从底层向右遍历即可取得后续数据。"}],"expanded":false},{"key":"redis-639","number":639,"bank":"redis","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295601643521","title":"Redis 的 hash 是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Hash 是一个 Redis 键内的 field/value 映射，可单独修改一个字段。小 Hash 常用 listpack 节省内存，超过大小或字段数阈值后可转为哈希表，具体取决于版本及配置。"},{"kind":"扩展知识","text":"HSET user:42 city 上海 只改 city。若把整份用户资料编码成一个 JSON String，修改 city 通常要先读、改、覆盖整段，且要处理并发覆盖。"}],"expanded":false},{"key":"redis-640","number":640,"bank":"redis","position":9,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295605837825","title":"Redis 和 Memcached 有哪些区别？","source":"preview","sections":[{"kind":"回答重点","text":"两者都是内存键值服务。Memcached 主要缓存简单值，部署、分片常交给客户端或代理。Redis 支持更多结构、原子命令、可选持久化、复制及故障转移，维护成本也更高。"},{"kind":"扩展知识","text":"热点 HTML 片段只需按键获取且可重建，简单缓存已足够。排行榜需要随时按分数更改排名，ZSET 可以用一条命令完成更新。"}],"expanded":false},{"key":"redis-641","number":641,"bank":"redis","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295610032129","title":"Redis 支持事务吗？如何实现？","source":"preview","sections":[{"kind":"回答重点","text":"MULTI 将后续命令入队，EXEC 连续执行，DISCARD 可在执行前放弃。WATCH 做乐观并发控制，被监视键发生变化时 EXEC 中止。执行期间某条命令报错时，其他已执行的命令不会自动回滚。"},{"kind":"扩展知识","text":"两人都看到计数为 5。先 WATCH 再读值，提交前有人改动时，后提交的一方收到中止结果，重新读后按有限重试规则计算。"}],"expanded":false},{"key":"redis-642","number":642,"bank":"redis","position":11,"priority":true,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295614226434","title":"Redis 数据过期后的删除策略是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Redis 结合惰性过期和主动过期。访问某个键时先检查 TTL，已过期的键视为失效。后台周期性抽样检查带 TTL 的键，逐步清理一直没被访问的过期数据。"},{"kind":"扩展知识","text":"会话键过期后马上读取，应得到逻辑上的不存在，即使后台尚未遍历到它。大量键同一刻到期，仍会给清理和回源带来压力。"}],"expanded":false},{"key":"redis-643","number":643,"bank":"redis","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295618420737","title":"Redis 中有哪些内存淘汰策略？","source":"preview","sections":[{"kind":"回答重点","text":"达到 maxmemory 后按策略淘汰。noeviction 拒绝需要额外内存的写。allkeys 可从全部键中按近似 LRU、LFU 或随机选择，volatile 只挑有 TTL 的键，还可优先淘汰 TTL 即将结束的键。"},{"kind":"扩展知识","text":"纯商品缓存可以测试 allkeys-lfu。若同一实例还存幂等记录，允许从全部键淘汰会改变幂等语义，应隔离数据并监控写拒绝与命中率。"},{"kind":"参考资料","text":"[Redis 淘汰策略](https://redis.io/docs/latest/develop/reference/eviction/)"}],"expanded":false},{"key":"redis-644","number":644,"bank":"redis","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295618420738","title":"Redis 的 Lua 脚本功能是什么？如何使用？","source":"preview","sections":[{"kind":"回答重点","text":"Lua 把几条 Redis 操作在服务端串行完成，期间其他命令不会插入，常用在锁释放和限流。对外声明 KEYS、ARGV，使用 EVAL 或预加载后用 EVALSHA。原子执行不等于失败时回滚。"},{"kind":"扩展知识","text":"释放锁时在脚本里先比较锁值与持有者令牌，相等才删除。若客户端分别 GET 和 DEL，就可能在两步之间删到重新加上的锁。"}],"expanded":false},{"key":"redis-645","number":645,"bank":"redis","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295622615042","title":"Redis 的 Pipeline 功能是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Pipeline 把多条请求写入连接后集中收回复，主要减少网络往返。命令本身的语义不变，服务端仍逐条执行，Pipeline 本身没有事务隔离。批次过大还会占用服务器和客户端缓冲。"},{"kind":"扩展知识","text":"跨网络发 100 条 GET，普通方式要等约 100 次往返。流水线可以分成几批发送，再按回复顺序匹配每个键并检查各自的错误。"}],"expanded":false},{"key":"redis-646","number":646,"bank":"redis","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295626809345","title":"Redis 中的 Big Key 问题是什么？如何解决？","source":"preview","sections":[{"kind":"回答重点","text":"Big Key 指单键值或容器元素很大。风险包括阻塞读取、释放成本、网络突刺与迁移失衡。可用 SCAN 配合类型长度或 MEMORY USAGE、低峰 redis-cli --bigkeys 排查，再按业务拆分、分页或异步删除。"},{"kind":"扩展知识","text":"一个用户消息列表有百万条元素时，可按月拆键并限制每批读的大小。删除大集合时评估 UNLINK，确保旁路任务没有马上重建同样的大键。"}],"expanded":false},{"key":"redis-647","number":647,"bank":"redis","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295631003650","title":"如何解决 Redis 中的热点 key 问题？","source":"preview","sections":[{"kind":"回答重点","text":"热点键是请求集中在单个键上，未必占很多内存。先用应用指标或节点采样定位，再选择本地短缓存、请求合并、读副本或拆分可聚合数据。频繁更新、严格一致时要评估各方案的限制。"},{"kind":"扩展知识","text":"开售时同一个活动配置被读取百万次，多个进程分别保留几秒的缓存可降压。全局限额仍需要统一的原子判定，不能各分片独立多放。"}],"expanded":false},{"key":"redis-648","number":648,"bank":"redis","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295635197954","title":"Redis 的持久化机制有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"RDB 是某一时刻的快照，便于备份和整体恢复。AOF 保存可重放的修改记录，按 fsync 策略决定可能损失多少写入，持续追加的日志可重写。二者可同时开启，恢复还要实际演练。"},{"kind":"扩展知识","text":"每秒同步 AOF 常在可靠性与开销间折中，异常时仍有近期数据风险。appendfsync always 会改变写延迟，外部备份还要覆盖磁盘损坏。"},{"kind":"参考资料","text":"[Redis 持久化](https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/)"}],"expanded":false},{"key":"redis-649","number":649,"bank":"redis","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295639392257","title":"Redis 在生成 RDB 文件时如何处理请求？","source":"preview","sections":[{"kind":"回答重点","text":"BGSAVE 通常 fork 子进程写快照，父进程继续接收请求。操作系统通过 Copy-on-Write 让父子先共享内存页，父进程修改某页时再复制。fork 有短暂成本，写入密集时还会提高内存和 I/O 压力。"},{"kind":"扩展知识","text":"数据库占数十 GB，快照期间持续修改很多不同的页，额外内存可能增长。要测 fork 延迟、COW 大小和磁盘吞吐，避免接近内存上限再备份。"}],"expanded":false},{"key":"redis-650","number":650,"bank":"redis","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295643586562","title":"Redis 的哨兵机制是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Sentinel 负责监控、通知和故障转移。一个 Sentinel 先标记主观下线，足够数量的观察者同意后判为客观下线。选出负责故障转移的 Sentinel，还需获得多数派授权，然后提升合适的副本、调整拓扑。"},{"kind":"扩展知识","text":"三台不同故障域的 Sentinel 看到主库故障，推进切换并让支持 Sentinel 的客户端重新发现主库。Sentinel 不把键分到不同节点。"}],"expanded":false},{"key":"redis-653","number":653,"bank":"redis","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295651975170","title":"Redis 集群会出现脑裂问题吗？","source":"preview","sections":[{"kind":"回答重点","text":"网络分区时，孤立旧主在发现与多数主节点失联前存在短暂接写窗口。多数侧提升副本后，那段异步复制未送达的新写可能丢失。min-replicas-to-write、min-replicas-max-lag 可缩小部分风险。"},{"kind":"扩展知识","text":"旧主写入 42 后隔离，副本只收到 41 就被提升。恢复通信时旧主跟随新主，42 不一定存在。重要业务还需外部持久化、补偿和防旧主写的机制。"}],"expanded":false},{"key":"redis-654","number":654,"bank":"redis","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295656169474","title":"Redis 的订阅发布功能是什么？你了解吗？","source":"preview","sections":[{"kind":"回答重点","text":"PUBLISH 向频道发消息，在线 SUBSCRIBE 或模式订阅者可以收到。Pub/Sub 不保存历史，也不为消费者做确认与重投，典型交付语义是至多一次。"},{"kind":"扩展知识","text":"用它通知在线进程刷新配置合适，掉线进程可再次读配置值。若消息表示一笔必须处理的订单，需选择可持久化、可确认的队列。"}],"expanded":false},{"key":"redis-655","number":655,"bank":"redis","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295660363778","title":"Redis 中如何实现分布式锁？","source":"preview","sections":[{"kind":"回答重点","text":"单实例锁可用 SET key token NX PX 毫秒获取，token 每次申请唯一。释放时以 Lua 原子地比较 token 再删锁。TTL 避免进程崩溃后锁永不释放，仍需处理过期与异步故障转移。"},{"kind":"扩展知识","text":"两个任务同时想生成同一份报表，SET 成功者开始，另一方退避。若旧持有者暂停直到锁过期，重要数据还应拒绝旧持有者提交结果。"},{"kind":"参考资料","text":"[Redis 分布式锁](https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/)"}],"expanded":false},{"key":"redis-656","number":656,"bank":"redis","position":23,"priority":true,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295664558081","title":"分布式锁在未完成逻辑前过期怎么办？","source":"preview","sections":[{"kind":"回答重点","text":"锁是有期限的租约。可在确认仍持有的前提下提前续期，过期后应视为失去资格。保护关键外部写入时让资源端校验单调 fencing token 或版本，避免暂停的旧持有者恢复后覆盖结果。"},{"kind":"扩展知识","text":"A 拿到序号 7 后暂停，B 拿到 8 并先写。数据库保存当前最大序号，恢复后的 A 提交序号 7 会被拒绝。仅延长 TTL 无法消除任意时长暂停。"},{"kind":"怎样拦住已过期的旧持有者","text":"假设 A 拿到租约 41 后暂停，B 获得租约 42 并完成更新。A 恢复后仍能发出网络请求。必须让被保护的资源识别并拒绝旧序号 41，才可防止它覆盖新值。序号需要由能保证单调性的机制发放和持久地比较。\n\n解锁时核对持有者标识，防止 A 把 B 的锁误删。持有者标识解决“谁来释放”，递增序号和资源端校验解决“过期写入能否落地”，两项要分别说明。"}],"expanded":true},{"key":"redis-657","number":657,"bank":"redis","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295664558082","title":"Redis 的 Red Lock 是什么？你了解吗？","source":"preview","sections":[{"kind":"回答重点","text":"Redlock 在多个相互独立的 Redis 主节点上申请同一随机令牌的租约。多数申请成功且总耗时小于原 TTL 才视为获得，扣除耗时与时钟漂移后得到有效时间，不成功要清理已获锁。"},{"kind":"扩展知识","text":"例如五个独立节点至少拿到三个，并且还剩有用的租约时间。它依赖时钟与延迟假设。涉及不可重复的外部副作用，仍要用资源版本或更强的一致性组件。"},{"kind":"参考资料","text":"[Redis 分布式锁](https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/)"}],"expanded":false},{"key":"redis-658","number":658,"bank":"redis","position":25,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295668752385","title":"Redis 实现分布式锁时可能遇到的问题有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"常见问题有锁泄漏、误删他人锁、租约提前过期、热点竞争和主从切换丢锁。用有期限租约、唯一令牌、比较删除、退避与监控分别应对。强一致约束还要在被保护资源上验证资格。"},{"kind":"扩展知识","text":"主库刚返回加锁成功便宕机，副本可能还没复制到锁。另一个任务随后也拿到锁，若数据库用唯一业务键限制执行，同一笔操作仍只落一次。"}],"expanded":false},{"key":"redis-659","number":659,"bank":"redis","position":26,"priority":true,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295672946690","title":"Redis 中的缓存击穿、缓存穿透和缓存雪崩是什么？","source":"preview","sections":[{"kind":"回答重点","text":"击穿是一个热门键失效把大量请求打到数据库，可合并请求或逻辑过期。穿透是反复查不存在的数据，可校验输入、缓存空值或用布隆过滤器。雪崩是很多键同时失效或缓存整体不可用，应随机化 TTL 并限流降级。"},{"kind":"扩展知识","text":"连续查询不存在的商品是穿透，单个爆款缓存突然过期是击穿，一批商品在整点同时过期是雪崩。先区分范围和数据是否真实存在。"}],"expanded":false},{"key":"redis-660","number":660,"bank":"redis","position":27,"priority":true,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295677140994","title":"Redis 中如何保证缓存与数据库的数据一致性？","source":"preview","sections":[{"kind":"回答重点","text":"常见 Cache-Aside 为读时缓存未命中查数据库并回填，更新时提交数据库后删除缓存。删除失败可通过重试、Outbox 或 CDC 重放。并发读回填旧值、主从延迟等仍可能造成短时间不一致。"},{"kind":"扩展知识","text":"价格从 10 改为 12，先提交数据库再删缓存。需要读后立即看到 12 的接口可直接读主库或加版本检查，避免把缓存的最终一致性当成强一致。"}],"expanded":false},{"key":"redis-661","number":661,"bank":"redis","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295681335298","title":"Redis String 类型的底层实现是什么？（SDS）","source":"preview","sections":[{"kind":"回答重点","text":"SDS 是 Redis 的动态字符串。头部记录长度和空间等信息，能 O(1) 得到长度，指定长度也可保存含零字节的二进制。不同类型的头部以及预分配减少短串与频繁追加的成本。"},{"kind":"扩展知识","text":"把二进制文件片段作为字节流写入时，中间的 0 不会把字符串截断。头部保存真实长度，追加时可以先查看剩余容量。"}],"expanded":false},{"key":"redis-662","number":662,"bank":"redis","position":29,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295681335299","title":"如何使用 Redis 快速实现排行榜？","source":"preview","sections":[{"kind":"回答重点","text":"ZADD 写入成员分数，ZINCRBY 增减分数，ZREVRANGE 或 ZRANGE REV 查询高分区间，用 ZREVRANK 获取从高到低的名次。要明确同分处理、周期与更新幂等。"},{"kind":"扩展知识","text":"按周用 rank:2026w47 保存用户积分并设置保留期。用户同分时默认排序有成员值规则，若业务要求先到分者领先，需要显式建模。"}],"expanded":false},{"key":"redis-663","number":663,"bank":"redis","position":30,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295689723905","title":"如何使用 Redis 快速实现布隆过滤器？","source":"preview","sections":[{"kind":"回答重点","text":"布隆过滤器用多个哈希位置标记元素。任一位为 0 可判定未插入，所有位为 1 只表示可能存在。Redis 可通过布隆能力的 BF 命令或 Bitmap 实现，参数由容量和可接受误判率决定。"},{"kind":"扩展知识","text":"查一个大范围商品 ID 时先用过滤器挡掉确定不存在的数据。数据库新上线商品时要同步更新过滤器，否则构建过程的遗漏在业务上会挡掉真实商品。"}],"expanded":false},{"key":"redis-664","number":664,"bank":"redis","position":31,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295689723906","title":"如何使用 Redis 统计大量用户唯一访问量（UV）？","source":"preview","sections":[{"kind":"回答重点","text":"HyperLogLog 用少量内存估算去重基数，用 PFADD 记录访客、PFCOUNT 读估算数量、PFMERGE 合并窗口。它只回答大概有多少不同元素，不能移除指定成员或枚举访客。"},{"kind":"扩展知识","text":"日访问日志特别多时，每天一个 HLL，周报合并七天键。账单或发券要求准确名单时，需要集合或服务端精确去重。"}],"expanded":false},{"key":"redis-665","number":665,"bank":"redis","position":32,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295693918210","title":"Redis 中的 Geo 数据结构是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Redis Geo 把经纬度编码到有序集合的分数中，用 GEOADD 保存位置、GEOSEARCH 搜索半径或矩形范围，可返回距离。工程上还要处理授权、分区、位置失效和误差。"},{"kind":"扩展知识","text":"查周围 3 公里骑手时先取候选，再结合可接单状态与采样时间筛选。直线距离适合粗筛，预计送达时间还需路网与交通数据。"}],"expanded":false},{"key":"redis-666","number":666,"bank":"redis","position":33,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295698112514","title":"你在项目中使用的 Redis 客户端是什么？","source":"preview","sections":[{"kind":"回答重点","text":"先说自己实际用的客户端，再讲池化、超时、序列化、拓扑发现和重试选择。Go 常用 go-redis，Java 也可根据栈选 Lettuce、Jedis 或 Redisson。最终按项目依赖和场景作答。"},{"kind":"扩展知识","text":"若项目用 go-redis，说明 context 如何限制请求，Sentinel/Cluster 如何发现节点，以及超时后 INCR 为什么不宜无条件重试。"}],"expanded":false},{"key":"redis-667","number":667,"bank":"redis","position":34,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295698112515","title":"Redis 字符串类型的最大值大小是多少？","source":"preview","sections":[{"kind":"回答重点","text":"常见回答是 Redis String 默认上限约 512 MB。批量协议长度、服务端配置与版本有关，也要受进程内存限制。大值虽可存，却容易使传输、复制和命令延迟失衡。"},{"kind":"扩展知识","text":"512 MB 的单值会使一次 GET 消耗大量内存和网络缓冲。文件更适合对象存储，Redis 保存短期元数据或 URL。"}],"expanded":false},{"key":"redis-668","number":668,"bank":"redis","position":35,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1780933295702306818","title":"Redis 性能瓶颈时如何处理？","source":"preview","sections":[{"kind":"回答重点","text":"先分辨是 CPU、内存、网络、磁盘还是客户端排队。SLOWLOG 查命令执行，INFO、LATENCY 和客户端指标看资源、分位延迟与连接池等待。随后针对慢命令、热 key、大值、重写或拓扑改进。"},{"kind":"扩展知识","text":"客户端超时但 SLOWLOG 很安静，优先对照连接借用等待、网络和重连。若只有一个分片 CPU 满，先找热点，不宜直接判断整个集群容量不足。"}],"expanded":false},{"key":"redis-827","number":827,"bank":"redis","position":36,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1798639821541662721","title":"Redis 中 EMBSTR 对象的阈值设置为何为 44？其调整历史是什么？","source":"preview","sections":[{"kind":"回答重点","text":"embstr 把 Redis 对象头和 SDS 放在一次连续分配里。常见 64 位实现的 44 字节阈值使 16 字节对象头、3 字节 sdshdr8 头、44 字节内容和结尾 1 字节合计 64。老版本曾因 SDS 头较大用 39，需按源码版本看。"},{"kind":"扩展知识","text":"短字符串可用 OBJECT ENCODING 观察 embstr。变长修改时通常转为 raw，省分配的优化不保证每种值一直保持 embstr。"},{"kind":"参考资料","text":"[Redis 字符串对象源码](https://github.com/redis/redis/blob/7.2/src/object.c)"}],"expanded":false},{"key":"redis-837","number":837,"bank":"redis","position":37,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1798883514609623041","title":"Redis 中原生批处理命令（MSET、MGET）与 Pipeline 的区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"MGET、MSET 是一条原生多键命令，一次往返、同一节点的一次命令执行，不会与其他命令交错。Pipeline 可混合不同命令，减少网络往返，不提供跨命令原子性。Cluster 多键命令还需满足同槽要求。"},{"kind":"扩展知识","text":"同槽的两个配置要一起更新可用 MSET。上百个独立的 SET、EXPIRE 想减少往返可以分批流水线，单个键的值和过期若需一起设置可用带 TTL 的 SET。"}],"expanded":false},{"key":"redis-838","number":838,"bank":"redis","position":38,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1798894486241992706","title":"Redis 主从复制的常见拓扑结构有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"主从拓扑可是一主一从、一主多从或级联。直接挂很多副本可以分担读但提高主节点连接和全量同步开销。级联把部分连接压力迁到中间副本，同时增加链路延迟和故障依赖。"},{"kind":"扩展知识","text":"同城两个读副本、跨区一个级联副本，适合作为不同目的的数据出口。读后马上要确认最新写时，应评估复制延迟并定向读主。"}],"expanded":false},{"key":"redis-880","number":880,"bank":"redis","position":39,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799676524355723265","title":"Redis List 类型的常见操作命令有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"LPUSH/RPUSH 从两端入列，LPOP/RPOP 从两端弹出，BLPOP/BRPOP 是阻塞弹出，LRANGE 查区间，LTRIM 保留范围。遍历或返回超大区间会阻塞其他命令。"},{"kind":"扩展知识","text":"LPUSH 放入一条记录，再配合 LTRIM 保留最新 100 条。若更新和裁剪不能被交错观察，用脚本、事务或更符合语义的结构。"}],"expanded":false},{"key":"redis-881","number":881,"bank":"redis","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799676842099417090","title":"如何在 Redis 中实现队列和栈数据结构？","source":"preview","sections":[{"kind":"回答重点","text":"入队与出队在两端分别执行即可做 FIFO，例如 RPUSH 与 LPOP。两条命令作用在同一端形成 LIFO 栈。需要等待可用阻塞版本，可靠任务还需处理中队列、确认与恢复。"},{"kind":"扩展知识","text":"消费者 LPOP 后进程崩溃，元素已离开队列。可以根据需求用 BLMOVE 移入处理中队列，再确认清理，或改用 Redis Streams。"}],"expanded":false},{"key":"redis-882","number":882,"bank":"redis","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799677102985125890","title":"Redis 中的 Ziplist 和 Quicklist 数据结构的特点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Ziplist 是历史上的紧凑连续结构，小元素省指针，但头插和跨大小阈值可触发移动及连锁更新。Quicklist 把多个紧凑块串成双向链表，平衡内存与两端操作。新版 Quicklist 节点通常用 listpack。"},{"kind":"扩展知识","text":"一百万个小元素若全在一个连续块，中间更新要移动大量字节。分成多个较小块后，多数更新只影响一个块。"}],"expanded":false},{"key":"redis-883","number":883,"bank":"redis","position":42,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799677366223839234","title":"Redis 复制延迟的常见原因有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"主库写入过快、网络带宽不足、全量同步、落盘压力或副本慢命令都可能使复制偏移量拉大。应同时看 INFO replication 的偏移差、复制链路、网络吞吐和副本应用速度。"},{"kind":"扩展知识","text":"故障期间副本慢了几秒，用户刚更新后从副本读到旧值。关键读短时间回主库，根因仍需核对回放压力、网络以及是否反复全量同步。"}],"expanded":false},{"key":"redis-884","number":884,"bank":"redis","position":43,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799677776607125506","title":"Redis 事务与关系型数据库事务的主要区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Redis MULTI/EXEC 将一批命令连贯执行，WATCH 做比较后提交。执行时某条命令失败通常无整体回滚。关系型事务普遍提供回滚、隔离级别等语义，持久性也与各自配置相关。"},{"kind":"扩展知识","text":"Redis 中给错误类型的键增加计数失败，前一条成功的写仍保留。转账跨两条业务记录时，需清楚能否在验证后原子修改，或用具备回滚约束的数据库。"}],"expanded":false},{"key":"redis-885","number":885,"bank":"redis","position":44,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799678013010681858","title":"Redis Cluster 模式与 Sentinel 模式的区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Sentinel 提供一主多从复制的监控和自动选主，全量键空间仍在一个主节点。Cluster 在多个主节点分 16384 个槽，同时可各自故障转移，客户端需理解槽和跨槽约束。"},{"kind":"扩展知识","text":"单机容量够但需要自动切换，可考虑 Sentinel。数据和写吞吐超出单主预算时评估 Cluster，并先审查现有多键命令。"}],"expanded":false},{"key":"redis-886","number":886,"bank":"redis","position":45,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1799678566948216833","title":"Redis 的 ListPack 数据结构是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Listpack 把元素长度和内容顺序存进连续内存，元素尾部记录当前元素长度以支持反向遍历，降低 Ziplist 跨元素连锁改长的问题。小集合或 Quicklist 块可采用它。"},{"kind":"扩展知识","text":"读取 10 个小键值时，紧凑布局比为每个元素分配对象省很多指针。改动长元素仍可能移动后面的字节，规模扩大后应切换更合适的结构。"}],"expanded":false},{"key":"redis-937","number":937,"bank":"redis","position":46,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1800330094683955202","title":"Redis 中的内存碎片化是什么？如何进行优化？","source":"preview","sections":[{"kind":"回答重点","text":"分配器保留的内存页、大小类别错配和释放时序都可能使 RSS 超过实际数据使用量。先区分 allocator_frag、RSS、COW 和客户端缓冲等来源。可评估主动碎片整理、清理冷热键以及分片。"},{"kind":"扩展知识","text":"删除很多大键后 used_memory 减少而 RSS 没马上回落，有可能是分配器未归还页。要结合实际机器余量与延迟观察，比例不能脱离规模解释。"}],"expanded":false},{"key":"redis-939","number":939,"bank":"redis","position":47,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1800334224630554625","title":"Redis 的虚拟内存（VM）机制是什么？","source":"preview","sections":[{"kind":"回答重点","text":"历史 Redis VM 曾把冷值换到磁盘，试图用磁盘扩大可缓存数据量。机制后来被移除，答题时要明确版本。现代 Redis 的持久化、操作系统 swap 与这个旧 VM 功能语义不同。"},{"kind":"扩展知识","text":"现在部署大数据量应评估内存容量、Cluster 拆分、冷热分层或数据库。让操作系统频繁 swap 可能明显恶化命令尾延迟。"}],"expanded":false},{"key":"redis-984","number":984,"bank":"redis","position":48,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1800632740254916610","title":"在 Redis 集群中，如何根据键定位到对应的节点？","source":"preview","sections":[{"kind":"回答重点","text":"普通键用 CRC16(key) % 16384 得到槽号。键里首个有效花括号对的非空内容可作为 hash tag，只对该子串取哈希。客户端用槽表找主节点，收到 MOVED/ASK 时按协议处理。"},{"kind":"扩展知识","text":"order:{812}:meta 和 order:{812}:items 会落同一个槽。所有订单都用 {orders} 则集中在一个槽，抵消分片的收益。"},{"kind":"参考资料","text":"[Redis Cluster 规格](https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/)"}],"expanded":false},{"key":"redis-5206","number":5206,"bank":"redis","position":49,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1823990291696906241","title":"Redis 源码中有哪些巧妙的设计，举几个典型的例子？","source":"preview","sections":[{"kind":"回答重点","text":"可讲三例与代价。字典渐进式 rehash 摊薄大迁移。SDS 保存长度并预分配。小对象用 listpack、较大对象换适合更新的数据结构。还可补 COW 生成快照的开销条件。"},{"kind":"扩展知识","text":"字典扩容时一段时间内同时有两张表，访问要考虑两边。好处是避免一次搬完整个大表造成比平时长很多的停顿。"}],"expanded":false},{"key":"redis-6305","number":6305,"bank":"redis","position":50,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1833406734003052546","title":"说说 Redisson 分布式锁的原理?","source":"preview","sections":[{"kind":"回答重点","text":"Redisson 锁通常用 Redis Hash 表示持有者和重入计数，Lua 原子判断、增减计数和设置 TTL。竞争者通过通知与超时重试。未显式指定固定 leaseTime 的用法可以由 watchdog 续期。"},{"kind":"扩展知识","text":"同一客户端线程对可重入锁加两次，只释放一次时锁仍有效。锁的拥有者信息和 TTL 一起起作用，异步故障切换依旧要评估。"}],"expanded":false},{"key":"redis-10389","number":10389,"bank":"redis","position":51,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1861688534670434305","title":"Redis Zset 的实现原理是什么？","source":"preview","sections":[{"kind":"回答重点","text":"小 ZSET 常用紧凑编码。转为普通编码后，字典根据成员找分数，跳表根据分数和成员顺序做排名、边界定位和区间遍历。两个结构共同承担查找和排序。"},{"kind":"扩展知识","text":"查询用户分数直接走成员索引。查积分 100 到 200 的用户先定位区间起点，再向后扫描，适合做排行榜和时间窗口。"}],"expanded":false},{"key":"redis-10739","number":10739,"bank":"redis","position":52,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1864866815485734914","title":"为什么 Redis Zset 用跳表实现而不是红黑树？B+树？","source":"preview","sections":[{"kind":"回答重点","text":"跳表与平衡树有相近的期望查找复杂度，插入删除多为更新指针，范围遍历与排名实现直观。B+ 树针对页式存储和顺序读很常见。选择取决于内存、缓存局部性、复杂度和目标操作。"},{"kind":"扩展知识","text":"找连续 100 名，跳表定位后沿底层指针走即可。红黑树也能通过迭代提供顺序遍历，因此答题应说明实现取舍，避免绝对化性能结论。"}],"expanded":false},{"key":"redis-10745","number":10745,"bank":"redis","position":53,"priority":false,"url":"https://www.mianshiya.com/bank/1791375592078610434/question/1869931978230796290","title":"Redisson 看门狗（watch dog）机制了解吗？","source":"preview","sections":[{"kind":"回答重点","text":"Watchdog 为仍由当前客户端持有的锁定期续期，客户端停止或发现不再持有时不继续。Redisson 默认 watchdog timeout 常为 30 秒，可配置。指定固定租约时按该调用契约处理。"},{"kind":"扩展知识","text":"任务运行 45 秒，健康进程可能续租多次。长暂停或网络隔离超过租约后仍可能失锁，关键资源写入要结合幂等、版本或 fencing。"}],"expanded":false},{"key":"mq-1142","number":1142,"bank":"mq","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802465623588282370","title":"说一下 RocketMQ 中关于事务消息的实现？","source":"preview","sections":[{"kind":"回答重点","text":"RocketMQ 先保存对消费者不可见的半消息。生产者收到成功后执行本地事务，再通知 Broker 提交或回滚。结果长时间不明确时，Broker 回查生产者，生产者用可持久查询的业务状态回答。"},{"kind":"扩展知识","text":"订单已入库但提交半消息的网络回包丢了，回查订单表可确认订单存在并提交消息。下游收到消息后仍要按业务 ID 幂等消费。"},{"kind":"参考资料","text":"[RocketMQ 事务消息](https://rocketmq.apache.org/docs/featureBehavior/04transactionmessage/)"}],"expanded":false},{"key":"mq-1085","number":1085,"bank":"mq","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801516316525666305","title":"什么是消息队列？","source":"preview","sections":[{"kind":"回答重点","text":"消息队列让生产者把消息交给中间件，由消费者按策略获取和处理。队列承担暂存、分发、确认等职责。是否持久、可否重放以及失败怎么恢复由具体产品和配置决定。"},{"kind":"扩展知识","text":"用户提交视频后接口先返回任务 ID，视频处理服务再从队列拿任务。用户可查询进度，接口无需一直等待转码结果。"}],"expanded":false},{"key":"mq-1087","number":1087,"bank":"mq","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801517574921723905","title":"为什么需要消息队列？","source":"preview","sections":[{"kind":"回答重点","text":"常见收益是异步、解耦、削峰。生产者按事件契约发布，多个下游独立演进。瞬时流量超过消费能力时先排队，较平稳地处理。代价是多了延迟、重试、堆积和一致性问题。"},{"kind":"扩展知识","text":"下单提交后发一条事件，发积分失败可单独重试。若峰值持续大于处理能力，队列会持续增长，仍要限流、扩容或降低非核心工作。"}],"expanded":false},{"key":"mq-1088","number":1088,"bank":"mq","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801520684633235458","title":"说一下消息队列的模型有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"点对点模型里同一条消息通常由一组竞争消费者中的一个处理。发布订阅里多个订阅各自收到一份。日志模型按分区保留记录，消费组保存偏移，不同组可独立读取和回放。"},{"kind":"扩展知识","text":"上传事件可让转码和审核各消费一次。转码组里 10 个工作进程共同处理本组任务，每项业务无需由十个进程都做。"}],"expanded":false},{"key":"mq-1129","number":1129,"bank":"mq","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801946173436928001","title":"简述下消息队列核心的一些术语？","source":"preview","sections":[{"kind":"回答重点","text":"生产者发布、Broker 保存或路由、消费者处理。Topic 表示类别，Queue 常指排队实体，Partition 是分区。Offset 是日志位置，ACK 确认可有不同方向，DLQ 留下最终无法正常处理的消息。"},{"kind":"扩展知识","text":"以订单事件为例，按 orderID 路由到固定分区，消费者提交偏移表示本组进度。消费确认和生产发布确认需要分别设计。"}],"expanded":false},{"key":"mq-1130","number":1130,"bank":"mq","position":6,"priority":true,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801955779278086145","title":"消息队列如何保证消息不丢失？","source":"preview","sections":[{"kind":"回答重点","text":"从生产端、Broker、消费端逐段看。生产者确认成功并保存待重发记录，Broker 按耐久和副本策略保存，消费者提交业务事务后再确认。还要容灾演练、监控与对账。"},{"kind":"扩展知识","text":"Broker 已收消息但生产确认丢失时，生产方会重发。可靠投递通常要接受这类重复，消费端用稳定 ID 去重。"}],"expanded":false},{"key":"mq-1131","number":1131,"bank":"mq","position":7,"priority":true,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1801964482106564610","title":"消息队列如何处理重复消息（保证消息的幂等性）？","source":"preview","sections":[{"kind":"回答重点","text":"使用不可变的业务事件 ID。消费逻辑和去重记录放在同一事务，或用唯一索引、状态条件或外部的幂等键限制副作用，完成后再确认。仅用进程内 Set 会在重启或多实例时失效。"},{"kind":"扩展知识","text":"积分服务用 orderID 和操作类型作唯一键。重复事件到达时发现记录已存在，直接确认即可，无需再次发积分。"},{"kind":"去重记录应该何时写入","text":"积分入账如果先记“已处理”再加分，二者之间崩溃会漏加。如果先加分再记“已处理”，中间崩溃会多加。将唯一事件 ID 的去重记录和积分变更放进同一事务，提交成功后再确认消息。\n\n外部付款等动作无法放进本地事务时，调用外部服务需使用稳定幂等键，并查询未知结果。用会在重启后丢失的内存集合无法覆盖这段故障窗口。"}],"expanded":true},{"key":"mq-1138","number":1138,"bank":"mq","position":8,"priority":true,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802305740993798145","title":"消息队列如何保证消息的有序性（顺序性）？","source":"preview","sections":[{"kind":"回答重点","text":"先明确是全局顺序还是同实体顺序。通常用实体 ID 路由到固定分区或队列，同一键的消费者串行提交或验证版本。并行、重投及失败跳过都会影响观察顺序。"},{"kind":"扩展知识","text":"订单 42 的创建、支付、取消进入同一路径。若支付处理失败，业务决定是阻止后续消息还是用状态机和序号安全地暂停、重试。"}],"expanded":false},{"key":"mq-1139","number":1139,"bank":"mq","position":9,"priority":true,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802306411117748226","title":"消息队列如何处理消息堆积？","source":"preview","sections":[{"kind":"回答重点","text":"看积压量、最老消息年龄、入出速率与故障类型。正常慢时在分区和下游容量允许下增消费者、批处理。单条毒消息应隔离，入速长期过高要限流，补消费要估算时间。"},{"kind":"扩展知识","text":"积压 60 万条，净消化速度为 1000 条每秒，约 10 分钟。若扩消费者把数据库打满，吞吐可能下降，应该同时观察下游延迟。"}],"expanded":false},{"key":"mq-1140","number":1140,"bank":"mq","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802333941753257985","title":"消息队列设计成推消息还是拉消息？推拉模式的优缺点？","source":"preview","sections":[{"kind":"回答重点","text":"Push 由服务端主动发，通常延迟低，需信用或 prefetch 等背压。Pull 由消费者按速率取，更利于批量与自控，空轮询有代价，长轮询可降低开销。"},{"kind":"扩展知识","text":"低延迟小任务可以 Push 并限制未确认数量。日志摄取通常使用有上限的长轮询和批量拉取，处理完再取下一批。"}],"expanded":false},{"key":"mq-1141","number":1141,"bank":"mq","position":11,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802338786811912193","title":"RocketMQ 的事务消息有什么缺点？你还了解过别的事务消息实现吗？","source":"preview","sections":[{"kind":"回答重点","text":"RocketMQ 半消息方案要求本地事务结果可回查，增加 Broker 回查、消息暂存和结果查询成本，也只覆盖消息与相关状态的最终一致。替代方案包括本地事务写 Outbox 后用 CDC 或轮询投递。"},{"kind":"扩展知识","text":"若应用崩溃后只能从内存判断事务是否成功，回查无法正确回答。将决策依据持久化后，生产进程换机器也能判断。"}],"expanded":false},{"key":"mq-1155","number":1155,"bank":"mq","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802605640969166849","title":"说一下 Kafka 中关于事务消息的实现？","source":"preview","sections":[{"kind":"回答重点","text":"Kafka 事务协调器管理用 transactional.id 标识的生产者与事务。可把多分区输出和消费偏移放在同一 Kafka 事务中，协调器写提交或中止标记。read_committed 消费者只读已提交的事务消息及普通消息。"},{"kind":"扩展知识","text":"从 input 读到 offset 10、处理后写 output，在一个事务提交输出和 offset 11。若另外写外部数据库，仍需外部的幂等或一致性方案。"},{"kind":"参考资料","text":"[Apache Kafka 官方文档](https://kafka.apache.org/documentation/)"}],"expanded":false},{"key":"mq-1156","number":1156,"bank":"mq","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1801255316257841153/question/1802609006872961026","title":"你了解 Kafka 中的时间轮实现吗?","source":"preview","sections":[{"kind":"回答重点","text":"Kafka 的时间轮用多个时间桶管理大量延迟任务，层级轮存更远的到期时间。桶到期后刷新，过期任务执行，未到期任务重新进入更合适的层。主要避免每次遍历全部等待任务。"},{"kind":"扩展知识","text":"大量长轮询只等待几十至几百毫秒时，可以集中管
