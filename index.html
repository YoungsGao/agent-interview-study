preview","sections":[{"kind":"回答重点","text":"GC 自动回收不可达的堆对象。程序仍要主动关闭文件、网络连接等外部资源，并防止意外保留引用。"},{"kind":"扩展知识","text":"GC 从根遍历仍可达的数据并回收不可达堆对象。经全局 map 保留的值仍可达，就算业务已不需要，GC 也不会擅自删除。"}],"expanded":false},{"key":"go-1952","number":1952,"bank":"go","position":197,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503242412034","title":"Go 语言中 GC 垃圾回收的过程是怎么样的？请介绍工作原理","source":"preview","sections":[{"kind":"回答重点","text":"解释可达性标记与清扫、并发工作和短暂停止阶段，再说明写屏障和 GC pacer。具体扫描器与阶段细节随版本变化。"},{"kind":"扩展知识","text":"周期包括必要的短暂停顿、并发标记和完成标记、之后清扫并回收。调度器协调后台 worker 与分配辅助，观察 trace 可看真实阶段。"}],"expanded":false},{"key":"go-1953","number":1953,"bank":"go","position":198,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503343075330","title":"什么是 Go 语言中的根对象？","source":"preview","sections":[{"kind":"回答重点","text":"根对象或根引用是可达遍历的起点，如全局引用和 goroutine 栈中的活跃指针。循引用标记可达堆对象。"},{"kind":"扩展知识","text":"根常包括全局指针、goroutine 栈及运行时持有的相关引用。一个对象虽未被主函数变量直接引用，也可能从缓存或队列继续可达。"}],"expanded":false},{"key":"go-1954","number":1954,"bank":"go","position":199,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503426961409","title":"常见的 GC 实现方式有哪些？Go 语言使用的是什么 GC 实现？","source":"preview","sections":[{"kind":"回答重点","text":"常见有引用计数、追踪式标记清扫、复制和分代等。Go 的核心是追踪式并发标记与清扫，具体实现按版本说明。"},{"kind":"扩展知识","text":"常见有引用计数、标记清扫、标记压缩、分代等。Go 以并发追踪、标记清扫为主，具体扫描实现随版本进化。"}],"expanded":false},{"key":"go-1955","number":1955,"bank":"go","position":200,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503506653186","title":"Go 语言中的三色标记法是什么？","source":"preview","sections":[{"kind":"回答重点","text":"白色尚未标记，灰色已发现待扫描，黑色已扫描。扫描灰色对象扩展可达集，结束后白色不可达对象可回收。"},{"kind":"扩展知识","text":"白色尚未访问，灰色已发现但其引用尚未都扫描，黑色已扫描。根开始不断处理灰色，最终仍不可达的白对象才可清理。"}],"expanded":false},{"key":"go-1956","number":1956,"bank":"go","position":201,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503586344961","title":"如何观察 Go 语言的 GC 运行情况？","source":"preview","sections":[{"kind":"回答重点","text":"用 runtime/metrics 看 GC 周期、CPU、堆目标与停顿，配合 GODEBUG=gctrace=1 的诊断和 pprof 识别持续分配。"},{"kind":"扩展知识","text":"看 runtime/metrics 的 GC 周期、堆目标和暂停，配合 GODEBUG=gctrace=1、trace 或 pprof。比较同等负载下多个周期的数据。"}],"expanded":false},{"key":"go-1957","number":1957,"bank":"go","position":202,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503728951298","title":"在有 GC 的情况下，为什么 Go 语言中仍会发生内存泄漏？","source":"preview","sections":[{"kind":"回答重点","text":"仍能从根访问的缓存、全局引用或阻塞 goroutine 所持对象不会被回收。应从引用与生命周期修复，文件等资源也需要显式释放。"},{"kind":"扩展知识","text":"业务缓存、全局 map 或泄漏 goroutine 持续引用对象，GC 仍认为可达。设置淘汰、任务取消，使用堆及 goroutine profile 验证增长停止。"}],"expanded":false},{"key":"go-1958","number":1958,"bank":"go","position":203,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503825420290","title":"Go 语言中并发标记清除法的难点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"应用和回收器会同时访问引用图。难点是防止漏标、控制写屏障开销、同步阶段切换及平衡回收工作和应用延迟。"},{"kind":"扩展知识","text":"应用和 GC 同时改变或扫描对象图。要维护写屏障、保证阶段一致、控制停顿和 CPU 竞争，并防止分配速度持续超过处理能力。"}],"expanded":false},{"key":"go-1959","number":1959,"bank":"go","position":204,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649503921889281","title":"Go 语言中 GC 的具体流程是什么？","source":"preview","sections":[{"kind":"回答重点","text":"典型顺序是进入标记阶段，扫描根并发追踪，使用写屏障维持约束，标记终结后清扫并回收可复用空间。"},{"kind":"扩展知识","text":"从根标记开始，后台推进并发追踪；标记完成后再回收不可达对象。可用时间线画出开始/结束标记的协调和中间应用继续执行。"}],"expanded":false},{"key":"go-1960","number":1960,"bank":"go","position":205,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504001581057","title":"Go 语言中触发 GC 的时机是什么？","source":"preview","sections":[{"kind":"回答重点","text":"通常按堆增长和分配节奏触发，也可定时或显式 runtime.GC。GOGC、GOMEMLIMIT 和运行时 pacer 影响何时开始。"},{"kind":"扩展知识","text":"超过堆触发目标、达到周期定时阈值或显式 runtime.GC 都可能启动周期。优化需考虑 GOGC、软内存限制和分配曲线。"}],"expanded":false},{"key":"go-1961","number":1961,"bank":"go","position":206,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504085467138","title":"如果内存分配速度超过了标记清除的速度，Go 语言会如何处理？","source":"preview","sections":[{"kind":"回答重点","text":"运行时用标记辅助让分配者分担标记，减缓分配速度并推动回收。在软内存限制下仍需监控 GC CPU 和 OOM 风险。"},{"kind":"扩展知识","text":"分配者可能分摊扫描工作即 mark assist，一些程序表现为 CPU 和延迟上升。调高内存只在可用容量足时才应评估，先定位大量分配。"}],"expanded":false},{"key":"go-1962","number":1962,"bank":"go","position":207,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504160964610","title":"Go 语言的 GC 关注的主要指标有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"关注 GC CPU、停顿分位数、分配速率、存活堆、堆目标和 RSS。结合吞吐与 p95／p99 延迟判断效果。"},{"kind":"扩展知识","text":"看停顿 p99、GC CPU 比、分配速率、活堆与堆目标、周期频率。延迟敏感服务还要量应用 tail latency，与 STW 和 assist 关联。"}],"expanded":false},{"key":"go-1964","number":1964,"bank":"go","position":208,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504341319682","title":"Go 语言垃圾回收器的相关 API 有哪些？它们的作用分别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"runtime.GC 触发回收，runtime.ReadMemStats 或 runtime/metrics 读指标，debug.SetGCPercent 调 GOGC，debug.SetMemoryLimit 调软内存限制。"},{"kind":"扩展知识","text":"runtime.GC 主动触发，runtime.ReadMemStats 与 runtime/metrics 用于观察，debug.SetGCPercent 与 SetMemoryLimit 改策略。调参通过压测和稳定性验证。"}],"expanded":false},{"key":"go-1965","number":1965,"bank":"go","position":209,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504425205761","title":"Go 语言历史版本在 GC 方面有哪些改进？","source":"preview","sections":[{"kind":"回答重点","text":"演进方向包括缩短全程停顿、增加并发标记、改进写屏障和 pacer、支持软内存限制。具体特性按版本和发布说明核对。"},{"kind":"扩展知识","text":"从较长 STW 到并发追踪和更短协调停顿，再到 pacer、软内存限制和扫描优化。用版本说明核对准确时间，不用一条历史结论覆盖当前实现。"}],"expanded":false},{"key":"go-1966","number":1966,"bank":"go","position":210,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504559423489","title":"Go GC 演化过程中有哪些设计没有被采用？为什么？","source":"preview","sections":[{"kind":"回答重点","text":"可从分代、压缩搬移等设计谈取舍。是否采用取决于工作负载、写屏障、指针兼容、cgo 约束和实际基准；按目标版本查设计说明。"},{"kind":"扩展知识","text":"分代或移动式 GC 方案的成本包括写屏障、定位引用、与 cgo/指针交互以及吞吐。Go 的设计选择是对多种目标和实测工作负载的取舍。"}],"expanded":false},{"key":"go-1967","number":1967,"bank":"go","position":211,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504647503874","title":"目前 Go 语言的 GC 还存在哪些问题？","source":"preview","sections":[{"kind":"回答重点","text":"高分配率、巨大存活堆及含大量指针的数据会增加 CPU 或尾部延迟，软内存限制也无法解决无限增长的存活集。"},{"kind":"扩展知识","text":"高分配率或大活堆可占较多 CPU，软内存限制与应用上限可能产生权衡。跨 Go 版本对同一工作负载实测，区分 Go 内和系统占用。"}],"expanded":false},{"key":"go-1968","number":1968,"bank":"go","position":212,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504752361473","title":"哪些编程语言提供 GC，哪些不提供？GC 和 No GC 各自的优缺点是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Go、Java、JavaScript 通常使用自动 GC。C、C++ 常用显式管理或 RAII；Rust 常用所有权。比较延迟、吞吐、生命周期控制与开发复杂度。"},{"kind":"扩展知识","text":"Go、Java 等常用自动追踪 GC，C 等多用显式或所有权管理。可比较易用性、暂停、吞吐、确定性与错误代价，语言也可能提供混合手段。"}],"expanded":false},{"key":"go-1969","number":1969,"bank":"go","position":213,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810649504840441858","title":"Go 语言的 GC 性能相比 Java 和 JS V8 引擎中的 GC 怎么样？","source":"preview","sections":[{"kind":"回答重点","text":"Go、JVM 与 V8 的 GC 目标、分配形状和回收策略不同。基于同场景测 p99、RSS、CPU 与吞吐，不能脱离版本和负载给统一排名。"},{"kind":"扩展知识","text":"Java、V8 和 Go 都有不同版本及收集策略，不能只用暂停数字做跨语言结论。比较需同业务、堆余量、分配率和端到端 SLO。"}],"expanded":false},{"key":"go-1970","number":1970,"bank":"go","position":214,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650352899338241","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"一个 const 组先写 a,b = \"golang\",100，下一项 d,e 省略表达式，然后声明 f bool = true，下一项 g 也省略。求打印 d,e,g 的结果。"},{"kind":"回答重点","text":"输出 golang 100 true。题干常量组里省略类型与初始化时，复用上一条非空声明对应的表达式和类型。"},{"kind":"逐步推演","text":"在纸上写出 d,e 继承 a,b 的两个表达式，g 则继承前一条 f 的类型与表达式。const 组的“省略”是复用上一非空声明的写法。"}],"expanded":false},{"key":"go-1971","number":1971,"bank":"go","position":215,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354035994625","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"令 N 为无类型常量 100，M 声明为 int32 常量 100。用两者分别初始化 int 变量 x、y，求程序是输出还是报错。"},{"kind":"回答重点","text":"编译错误。题干中无类型常量 N 可赋给 int，已显式为 int32 的 M 赋给 int 时需要显式转换。"},{"kind":"逐步推演","text":"先判断 100 是否能表示为 int；再判断 M 是不是同一类型。用 int(M) 可使该赋值成立。常量是无类型还是显式有类型是考点。"}],"expanded":false},{"key":"go-1972","number":1972,"bank":"go","position":216,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354128269314","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"除数 a 是值为 -1 的 int8 变量，声明 var b int8 = -128 / a，求 b。"},{"kind":"回答重点","text":"输出 -128。题干除数为变量 int8(-1)，触发有符号最小值除以负一的规范特例，商保持为该最小值。"},{"kind":"逐步推演","text":"int8 的最小值是 -128，最大值 127。运行期最小负数除以 -1 采用语言明确的表示边界规则，与常量表达式可表示检查分开。"}],"expanded":false},{"key":"go-1973","number":1973,"bank":"go","position":217,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354241515522","title":"以下 Go 语言程序的输出结果是？","source":"visible","sections":[{"kind":"题干条件","text":"除数 a 是值为 -1 的 int8 常量，声明 var b int8 = -128 / a，求 b。"},{"kind":"回答重点","text":"程序在编译阶段报错，因此没有运行输出。题目的关键字是 `const`。除数 `a` 是值为 −1 的有类型常量，表达式 `-128 / a` 的数学结果为 128。这个常量需要用 `int8` 表示，而 `int8` 的最大值为 127。"},{"kind":"逐步推演","text":"1. 在声明处圈出 `const a int8 = -1`，确定这一步用常量规则。\n2. 先做数学上的除法，负数除以负数得到正的 128。\n3. 检查目标类型可表示的范围，−128 到 127。128 超出范围，所以程序不能进入打印语句。"},{"kind":"面试官追问","text":"如果改成 `var a int8 = -1`，表达式进入有符号整数运算的特殊情形。对于最小负数除以 −1，Go 规范规定结果等于该最小负数，在这里得到 −128。面试时把“常量必须可表示”和“固定宽度整数的除法规则”各说一句，就能解释只换一个关键字为何会改变结论。"},{"kind":"参考资料","text":"[Go 规范 · 整数运算](https://go.dev/ref/spec#Integer_operators)"}],"expanded":true},{"key":"go-1974","number":1974,"bank":"go","position":218,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354329595906","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"外层 var err error，进入 err == nil 的分支后用 := 新建内部 err 并打印 1 和该错误，出块后仅当外层 err 非 nil 时打印 2 和错误。求输出。"},{"kind":"回答重点","text":"输出一行 1 err。if 内短声明的 err 遮蔽外层变量，离开该块后外层 err 仍为 nil。"},{"kind":"逐步推演","text":"把两个 err 重命名为 outerErr、innerErr 就容易推演。内块赋值若改用 = 才会更新已存在的外层变量。"}],"expanded":false},{"key":"go-1975","number":1975,"bank":"go","position":219,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354413481986","title":"以下 Go 语言程序的输出结果是？","source":"visible","sections":[{"kind":"题干条件","text":"方法 f(n) 打印 n 并返回接收者。main 中注册 defer t.f(1).f(2)，然后直接打印 3。求打印次序。"},{"kind":"回答重点","text":"依次打印 **1、3、2**。理解 `defer t.f(1).f(2)` 时，先确定“哪一次调用被延迟”。最外层是最后那个 `f(2)`。要登记它，Go 必须先知道接收者是谁，于是先执行 `t.f(1)`，得到接收者并打印 1。"},{"kind":"逐步推演","text":"| 时间点 | 执行的动作 | 本步打印 |\n| --- | --- | --- |\n| 遇到 defer | 求出接收者，保存最后一次调用的接收者和参数 | 1 |\n| 继续执行函数体 | 运行紧随其后的打印语句 | 3 |\n| 外层函数返回前 | 对保存的接收者执行最后一次方法调用 | 2 |"},{"kind":"面试官追问","text":"改成 `defer func() { t.f(1).f(2) }()` 会怎样？这次登记的是匿名函数。两个方法调用都写在其函数体里，等到返回前才执行。如果其余代码保持题设顺序，输出次序会变为 **3、1、2**。"},{"kind":"参考资料","text":"[Go 规范 · defer 语句](https://go.dev/ref/spec#Defer_statements)"}],"expanded":true},{"key":"go-1976","number":1976,"bank":"go","position":220,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354518339586","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"f(n) 中先写 defer fmt.Println(n)，随后给 n 加 100。调用 f(1)，求输出。"},{"kind":"回答重点","text":"输出 1。defer fmt.Println(n) 注册时已经保存 n 的值，即使后来在函数内给 n 加 100 也不改变已保存的实参。"},{"kind":"逐步推演","text":"先画记录栈，其中只有一次 Println(1)。之后更新变量不再修改记录中的实参，所以结尾显示的是旧值。"}],"expanded":false},{"key":"go-1977","number":1977,"bank":"go","position":221,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354631585793","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"n=1 时注册一个延迟闭包，闭包内读取并打印 n；随后给 n 加 100。求输出。"},{"kind":"回答重点","text":"输出 101。延迟执行的闭包在运行时读取 n，此时 n 已加 100。"},{"kind":"逐步推演","text":"记录栈保存的是闭包调用，闭包体的 Println 在返回时才读 n。与将 n 作为延迟函数实参相比，快照时间不同。"}],"expanded":false},{"key":"go-1978","number":1978,"bank":"go","position":222,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354736443393","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"n=1 时在 if 内注册 defer fmt.Println(n)，随后给 n 加 100。离开 if 立即打印 n。求两次输出的先后。"},{"kind":"回答重点","text":"先输出一行 101，再输出一行 1。if 分支里的 defer 仍在外围函数结束前执行，注册时已保存原实参。"},{"kind":"逐步推演","text":"if 块退出和函数返回是两个时刻。先执行普通输出，再执行外层函数的 defer 栈。"}],"expanded":false},{"key":"go-1979","number":1979,"bank":"go","position":223,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354832912385","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"真分支注册推迟打印 1，另一分支注册推迟打印 2，分支后立即打印 3。求最终输出。"},{"kind":"回答重点","text":"输出 31。只注册了真分支的延迟调用，3 先直接打印，最后打印 1。"},{"kind":"逐步推演","text":"先选真假分支，只有被进入的块才会登记 defer。登记完成后普通语句先运行，函数返回再处理保留的调用。"}],"expanded":false},{"key":"go-1980","number":1980,"bank":"go","position":224,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650354920992769","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"循环遍历 0 到 4，每轮注册 defer 按十进制打印当次 i，值后有空格。求函数退出时的输出。"},{"kind":"回答重点","text":"输出 4 3 2 1 0，按题干格式有尾部空格。每次注册时 i 已求值，函数退出按后进先出顺序执行。"},{"kind":"逐步推演","text":"把 defer 记录按注册顺序写成 0、1、2、3、4。返回时从最后一条往前读，实参已在每轮固定。"}],"expanded":false},{"key":"go-1981","number":1981,"bank":"go","position":225,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355004878850","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"外层 x=1，内层块短声明 x=2 并打印，出块后再打印 x。求输出。"},{"kind":"回答重点","text":"输出 21。块内 x 遮蔽外层 x，先打印 2，出块后打印外层的 1。"},{"kind":"逐步推演","text":"画两层作用域，内块有同名新变量。打印位置决定读取哪一层。用 = 时则会改变外层 x。"}],"expanded":false},{"key":"go-1982","number":1982,"bank":"go","position":226,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355097153537","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"对 [one, two, three] 用 for _,s := range 启动闭包 goroutine。每个 goroutine 延迟后打印捕获的 s，main 等待再结束。分别讨论新旧循环变量语义。"},{"kind":"回答重点","text":"Go 1.22 及以后语言语义下，短声明的 range 迭代变量每轮独立，通常各打印一个字符串、顺序不定。旧语义变量复用，题设延时下常看到三个 three。实际并发测试用同步等待。"},{"kind":"逐步推演","text":"检查 go.mod 和变量用 := 还是先声明再用 =。输出先后需同步保障，旧语义下用参数传值可以消除共享循环变量。"},{"kind":"实战细节","text":"检查项目 go.mod 的语言版本和循环变量声明形式。旧语义下用每次迭代的参数传给闭包可以固定值；Go 1.22 及以上的声明式循环变量默认逐轮独立。"},{"kind":"参考资料","text":"[相关技术资料](https://go.dev/doc/go1.22)"}],"expanded":false},{"key":"go-1983","number":1983,"bank":"go","position":227,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355202011137","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"对 []string{\"a\",\"b\",\"c\"} 使用 for v := range x，fmt.Print(v)。求输出。"},{"kind":"回答重点","text":"输出 012。对该切片只接收 range 的第一个返回值，所以打印索引。"},{"kind":"逐步推演","text":"切片 range 返回 index、value，只写一个变量取 index。索引从 0 开始且递增，fmt.Print 无换行和分隔。"}],"expanded":false},{"key":"go-1984","number":1984,"bank":"go","position":228,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355302674434","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"对 []string{\"a\",\"b\",\"c\"} 使用 for _,v := range x，fmt.Print(v)。求输出。"},{"kind":"回答重点","text":"输出 abc。用 for _,v 接收切片元素并按迭代顺序打印。"},{"kind":"逐步推演","text":"丢弃第一个 index，打印第二个 value。切片按元素从左到右，和 map 无固定遍历顺序的规则不同。"}],"expanded":false},{"key":"go-1985","number":1985,"bank":"go","position":229,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355411726337","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"i,j 初始为 1,2，执行 i,j = j,i 后无分隔地打印。求输出。"},{"kind":"回答重点","text":"输出 21。多重赋值先取得右侧 i、j 的旧值，再完成交换。"},{"kind":"逐步推演","text":"右侧旧值组成 (2,1)，分别写入 i,j，之后 fmt.Print 依题干不给分隔。这里没有先覆盖 i 再读新 i。"}],"expanded":false},{"key":"go-1986","number":1986,"bank":"go","position":230,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355520778242","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"变量 v 初始为 1，传 \u0026v 到 incr(p *int)，函数执行 *p++，主函数再打印 v。求输出。"},{"kind":"回答重点","text":"输出 2。传递变量地址，函数内部 (*p)++ 修改原变量，传递的指针值本身是复制的。"},{"kind":"逐步推演","text":"写成 (*p)++ 能清楚看到自增对象是指针指向的变量。函数拿到地址副本，也能改到同一个目标。"}],"expanded":false},{"key":"go-1987","number":1987,"bank":"go","position":231,"priority":false,"url":"https://www.mianshiya.com/bank/1983892313021190145/question/1810650355613052929","title":"以下 Go 语言程序的输出结果是？","source":"preview","sections":[{"kind":"题干条件","text":"方法 Add 将实参追加到切片、打印实参并返回接收者。先 defer s.Add(1).Add(2)，再 s.Add(3)。求输出。"},{"kind":"回答重点","text":"输出 132。注册 defer 要先算最后一次调用的接收者，Add(1) 立即执行，随后是 Add(3)，最后才执行延迟的 Add(2)。"},{"kind":"逐步推演","text":"将链式调用拆成 earlier := s.Add(1) 和 defer earlier.Add(2)。先打印 1，再普通调用打印 3，返回时打印 2。"}],"expanded":false},{"key":"claude-13988","number":13988,"bank":"claude","position":1,"priority":true,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027808208486401","title":"Resume 与 Fork session 在会话管理上产生何种不同的数据副作用？二者对 session ID 和历史记录的处理逻辑分别是什么？","source":"visible","sections":[{"kind":"回答重点","text":"Resume 沿用原会话 ID，从已保存的历史接着处理并向同一会话追加记录。Fork 以指定会话和可选位置为起点，生成新 ID，后续消息写到分支历史。源会话可以继续使用。"},{"kind":"扩展知识","text":"调试同一个错误时用 Resume。想从同一基线试两种方案，用 Fork 保存两套思路。会话分支与工作目录分支是两件事，分别编辑代码时再用 Git 分支或 worktree。"},{"kind":"从同一条会话历史试两种修复","text":"在“已复现超时”的消息处保留基线。Resume 后的新讨论会继续追加到这条会话。从基线 Fork 并讨论另一种修复，则产生另一条可以独立恢复的历史。检验的方法是分别重开两个会话，查看各自后续的消息。\n\n会话分叉只隔离会话历史。若两个会话都指向同一工作目录，文件修改仍互相可见。数据库写入和已发送的通知也不会随会话分叉自动回滚。"},{"kind":"参考资料","text":"[Claude Code 会话](https://code.claude.com/docs/en/agent-sdk/sessions)"}],"quote":"回到原地继续写","expanded":true},{"key":"claude-13989","number":13989,"bank":"claude","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027809273839618","title":"Agent SDK 与 Subagents 的关系是什么？前者为后者提供了哪些不可替代的底层能力？","source":"preview","sections":[{"kind":"回答重点","text":"Agent SDK 承担循环、工具调度、权限和上下文管理。Subagent 是在这个运行时中受委派的独立任务执行者，能有自己的上下文、工具权限、模型及生命周期，最后把成果交回调用方。"},{"kind":"扩展知识","text":"主 Agent 让一个只读子 Agent 找测试，再自己改代码。子 Agent 读取的所有文件无需进入父窗口。选了子 Agent 也要明确可用工具和交付格式。"}],"expanded":false},{"key":"claude-13990","number":13990,"bank":"claude","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027809718435842","title":"Agent SDK 默认将哪三类状态写入容器本地磁盘？这些状态在容器重启、缩容或跨节点迁移时是否会丢失？","source":"preview","sections":[{"kind":"回答重点","text":"典型本地状态分三类。会话 transcript 保存交互和工具历史。CLAUDE.md 与 memory 文件保存项目指令或经验。工作目录 artifacts 保存代码改动和其他产物。默认写入本地磁盘时，保留性由部署的存储决定。"},{"kind":"扩展知识","text":"同一个容器进程重启且磁盘还在时可能继续使用。容器被替换、缩容或跨节点调度时，临时文件系统通常不可用。把持久会话目录和工作区迁移策略纳入部署设计。"},{"kind":"参考资料","text":"[Agent SDK 部署](https://code.claude.com/docs/en/agent-sdk/hosting)"}],"expanded":false},{"key":"claude-13991","number":13991,"bank":"claude","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027810217558017","title":"Agent 的标准执行循环（Agent Loop）包含哪些关键阶段？各阶段的核心职责是什么？","source":"preview","sections":[{"kind":"回答重点","text":"可按五步讲运行时。组上下文，调模型获得文本或工具请求，解码并分发工具参数，按策略和用户授权决定能否运行，执行并把结果送回模型。无工具的最终回答、取消或预算用尽均可结束本次运行。"},{"kind":"扩展知识","text":"模型想读测试文件时只提出请求。运行时校验工具和路径，读完把结果连同工具调用 ID 交回模型。失败也应进入下一轮可观察状态。"}],"expanded":false},{"key":"claude-13992","number":13992,"bank":"claude","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027810997698561","title":"Auto memory (MEMORY.md) 在 session 启动时被加载到上下文，决定加载量的两个约束条件是什么？","source":"preview","sections":[{"kind":"回答重点","text":"会话启动载入 MEMORY.md 有行数和字节两个限制，题目所指规格是前 200 行或前 25 KB，以先达到的为准。独立主题文件一般按需读取。"},{"kind":"扩展知识","text":"若每行都很长，100 行就可能超过 25 KB。把 MEMORY.md 写成短索引，保留最需要直接注入的约定，再链接测试和发布主题文件。"},{"kind":"参考资料","text":"[Claude Code 记忆](https://code.claude.com/docs/en/memory)"}],"quote":"取先触达的那个","expanded":false},{"key":"claude-13993","number":13993,"bank":"claude","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027811547152386","title":"Bundled skills（如 ＿code-review、＿debug）与内置命令（如 ＿help、＿compact）在执行机制上的根本区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Bundled skill 被调用时会把任务说明引入模型上下文，允许模型按说明选择工具。内置命令由 CLI 实现，负责立即显示信息、改变配置或触发受控流程。部分命令仍会为特定环节调用模型。"},{"kind":"扩展知识","text":"/help 是直接反馈的命令。/compact 由 CLI 触发压缩流程，其中生成摘要可能需要模型。代码评审 Skill 提供的是流程和验收要求。"}],"expanded":false},{"key":"claude-13994","number":13994,"bank":"claude","position":7,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027812071440386","title":"CLAUDE.md 文件与 Auto Memory 分别代表哪两类记忆机制？它们在生命周期、控制权和持久化方式上有何根本差异？","source":"preview","sections":[{"kind":"回答重点","text":"CLAUDE.md 主要由人维护，可纳入仓库共享，保存长期项目约定。Auto Memory 由 Claude 在工作中增补，可由人查看和修改，通常在用户的本地项目记忆目录，入口 MEMORY.md 会在启动时加载一部分。"},{"kind":"扩展知识","text":"仓库统一使用 pnpm 应写在团队指令里。某次构建只在特定环境失败的经验可写在本地记忆，等验证适用范围后决定是否纳入项目规范。"}],"quote":"Claude 给自己记的学习笔记","expanded":false},{"key":"claude-13995","number":13995,"bank":"claude","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027812524425217","title":"Channels 在 Claude Code 中的作用是什么？其与传统轮询式或新建会话式集成的核心区别何在？","source":"preview","sections":[{"kind":"回答重点","text":"Channels 通过集成服务把外部事件送入一个正在运行的 Claude Code 会话，通常用符合约定的 MCP 通知桥接。它复用已有会话的上下文，也可在授权下向原通道回复。"},{"kind":"扩展知识","text":"收到 CI 完成消息时，当前会话能把它与自己刚发起的操作关联。轮询要自己频繁检查，另建会话则要显式准备所需上下文。"}],"expanded":false},{"key":"claude-13996","number":13996,"bank":"claude","position":9,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027813350703105","title":"Claude Agent SDK 提供哪两种输入模式？它们在会话生命周期、上下文持久性和中断处理能力上的核心差异是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Streaming Input 允许向活跃会话持续提供输入、接收事件和按 SDK 能力中断，适合长时交互。Single Message 以一条输入启动一次查询。需要跨查询连续时，通过 session ID 和 resume 等选项恢复。"},{"kind":"扩展知识","text":"审批员回复许可时，交互服务适合保持输入通道。在定时生成只读摘要的命令中，一次查询的输入输出更容易管理。"},{"kind":"参考资料","text":"[Agent SDK 输入模式](https://code.claude.com/docs/en/agent-sdk/streaming-vs-single-mode)"}],"expanded":false},{"key":"claude-13997","number":13997,"bank":"claude","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027813749161985","title":"Claude Code Agent SDK 中，MCP 工具的命名规范是什么？为何该规范对权限控制至关重要？","source":"preview","sections":[{"kind":"回答重点","text":"MCP 工具通常使用 mcp__服务器名__工具名。服务器名来自配置键，工具名来自服务器暴露的定义。allow/deny 和工具回调常用该完整名称定位权限。"},{"kind":"扩展知识","text":"服务器名为 issues，工具名为 get_issue，规则匹配 mcp__issues__get_issue。另一个服务器即使也提供 get_issue，也应独立授权。"}],"expanded":false},{"key":"claude-13998","number":13998,"bank":"claude","position":11,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027814147620865","title":"Claude Code Agent SDK 支持哪些类型的插件组件？请列举并说明其作用。","source":"preview","sections":[{"kind":"回答重点","text":"插件可打包 Skills、Agents、Hooks、MCP 和 LSP servers，也能按版本带 Monitors、Themes、Bin、Settings 等组件。分别承担说明与流程、角色、事件处理、工具接入、语言服务、观察、展示、可执行能力和默认配置。"},{"kind":"扩展知识","text":"代码质量插件可含一份审查 Skill 与一个格式检查 hook。SDK 里通过 plugins 加载时要核对版本、组件支持范围和权限。"}],"expanded":false},{"key":"claude-13999","number":13999,"bank":"claude","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027814558662658","title":"Claude Code 中，managed-mcp.json 文件与 allowedMcpServers⧸deniedMcpServers 配置项在 MCP 服务器管控中分别承担什么角色？二者是否可叠加生效？","source":"preview","sections":[{"kind":"回答重点","text":"managed-mcp.json 定义由组织管理的 MCP 服务器集合。allowedMcpServers 与 deniedMcpServers 是策略过滤，匹配后限制哪些定义可以运行。两者可叠加，集中管理定义时限制仍能进一步约束。"},{"kind":"扩展知识","text":"公司只下发工单与文档两个服务器，另设 deny 策略可暂时停用某一项。检查生效规则、管理作用域及 denied 的优先级。"}],"expanded":false},{"key":"claude-14000","number":14000,"bank":"claude","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027815284277249","title":"Claude Code 如何保证 subagent worktree 在运行期间不被自动清理？其底层依赖的 Git 机制是什么？","source":"preview","sections":[{"kind":"回答重点","text":"保护工作树的底层机制是 Git 的 worktree lock。运行期间锁住对应工作树的元数据，使普通 prune 等回收过程跳过。完成后解除，回收策略再根据产物与修改状态决定是否清理。"},{"kind":"扩展知识","text":"子 Agent 在独立工作树里完成改动。系统崩溃时可能留下登记项，维护者应确认活跃任务和改动后再清理。"}],"expanded":false},{"key":"claude-14001","number":14001,"bank":"claude","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027815657570305","title":"Claude Code 如何实现对项目全量文件的跨文件协同编辑能力？该能力与传统'inline code assistant'的本质差异是什么？","source":"preview","sections":[{"kind":"回答重点","text":"Claude Code 可以搜索仓库、根据引用读多个文件、分批应用改动、执行测试并继续修正。模型负责决定范围，运行时提供文件工具、命令和权限。并行探索或独立工作树可为大任务服务。"},{"kind":"扩展知识","text":"重命名 API 可先查定义、调用者和测试，再按兼容性修改。编辑器内联补全的典型工作单位是用户光标附近的内容。"}],"expanded":false},{"key":"claude-14002","number":14002,"bank":"claude","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027816035057666","title":"Claude Code 对 checkpoint 数量（100个）和生命周期（30天，默认可配置）的约束，体现了其在 Agent Loop 中对哪两类资源的显式权衡？","source":"preview","sections":[{"kind":"回答重点","text":"题干的 100 个检查点限制约束快照数量与磁盘增长，约 30 天的默认清理窗口约束保留时长。官方文档说明可通过 cleanupPeriodDays 调整时间，数量及触发策略应结合具体版本。"},{"kind":"扩展知识","text":"长任务的重要里程碑可以提交 Git。若会话快照已过保留期，仍可用版本库追溯。工具外部的副作用另有恢复边界。"},{"kind":"参考资料","text":"[Claude Code 检查点](https://code.claude.com/docs/en/checkpointing)"}],"expanded":false},{"key":"claude-14003","number":14003,"bank":"claude","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027816408350721","title":"Claude Code 插件中，技能名称的命名空间由什么决定？为什么需要这种命名空间机制？","source":"preview","sections":[{"kind":"回答重点","text":"技能命名空间通常取插件清单 .claude-plugin/plugin.json 的 name，调用写成 /插件名:技能名。相同的内部名称可来自不同插件，权限与文档可以指明具体来源。"},{"kind":"扩展知识","text":"qualit de 的 Memory _ 项目记忆机制（如 CLAUDE.md、会话记忆）如何工作？与通用 Agent Memory 有何差异？","source":"preview","sections":[{"kind":"回答重点","text":"项目指令与本地记忆使用可读文件管理。会话 transcript 是恢复交互过程的另一类状态。一般 Agent Memory 还可用向量索引、结构化用户档案或数据库，根据跨会话检索和隐私设计。"},{"kind":"扩展知识","text":"记录项目的测试命令只需一行指令。要按用户权限检索数万条内部记录，则另设计数据存储、检索和授权。"}],"expanded":false},{"key":"claude-14008","number":14008,"bank":"claude","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027818635526146","title":"Claude Code 的 agentic loop 包含哪三个核心阶段？这些阶段如何体现'闭环反馈'特性？","source":"preview","sections":[{"kind":"回答重点","text":"用收集上下文、采取行动、验证结果概括。验证证据会送回下一轮决策，直到目标成功或触发停止条件。这种把结果用于下一步的过程就是闭环。"},{"kind":"扩展知识","text":"先查订单处理的现有测试，再修处理逻辑，最后运行相关测试。若提示重放产生重复，结果会引导下一轮检查幂等处理。"}],"quote":"Gather Context（收集上下文）","expanded":false},{"key":"claude-14009","number":14009,"bank":"claude","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027818987847681","title":"Claude Code 的 checkpointing 机制如何平衡上下文窗口管理与状态可逆性？请结合 rewind 的 'Summarize from here' 和 'Summarize up to here' 两种操作说明其设计意图。","source":"preview","sections":[{"kind":"回答重点","text":"文件检查点用于回到受支持的历史文件状态。/rewind 的 Summarize from here、Summarize up to here 针对所选位置之后、或到该位置及之前的对话做摘要，保留另一侧原细节。"},{"kind":"扩展知识","text":"想保留最初需求并压缩后面的探索可选 from here。若旧探索冗长但最近发现重要，可选 up to here，另按需要执行文件恢复。"}],"expanded":false},{"key":"claude-14010","number":14010,"bank":"claude","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027819755405313","title":"Claude Code 的 context window 包含哪些关键组成部分？当上下文逐渐填满时，系统通过何种机制应对容量限制？","source":"preview","sections":[{"kind":"回答重点","text":"上下文包括系统指令、项目规则、对话、工具定义和工具结果，以及被加载的技能、记忆等。窗口上限随模型与配置变化。接近容量时可以裁剪部分输出或自动摘要压缩，也可主动 /compact。"},{"kind":"扩展知识","text":"运行测试只需保留失败用例、关键回溯和重跑命令。让数千行成功日志全进入窗口，会挤占需求和代码证据的空间。"},{"kind":"在压缩前留下恢复工作的最小记录","text":"若会话正在修测试，记下用户要求、已修改的文件、最后一次失败命令和错误位置。大量成功输出可以删减，关键证据保留可重新读取的路径和版本。压缩后先让会话复述当前状态，查一查是否遗漏不可修改的文件范围。\n\n缩短单次工具回包可以从入口降低增长速度 nk/2082027801073975298/question/2082027827414204417","title":"Skills、Hooks 和 Routines 三者在自动化层级上如何分层？请说明各自适用的抽象粒度与触发边界。","source":"preview","sections":[{"kind":"回答重点","text":"Hook 按工具前后或会话事件触发，可承载确定性检查。Skill 是按需加载给模型的重复任务说明。Routine 可按产品提供的计划、API 或 GitHub 事件独立启动，对应更完整的自动运行。"},{"kind":"扩展知识","text":"写文件后格式化用 hook，人工要求审查指定模块时用 Skill，定期生成合法来源的内部质量报告可用 Routine。"}],"expanded":false},{"key":"claude-14027","number":14027,"bank":"claude","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027827774914561","title":"PreCompact 和 PostCompact hook 事件分别在 context management 的哪个环节触发？它们可用于实现哪些工程实践？","source":"preview","sections":[{"kind":"回答重点","text":"PreCompact 在生成压缩摘要前触发，可记录原因、保留工作状态或按版本规则阻断。PostCompact 在压缩后触发，可记录新摘要信息或验证关键约束是否保留，具体输出契约以该事件文档为准。"},{"kind":"扩展知识","text":"为长会话测量每次压缩前后的耗费时，分别在两个事件采样。关键证据先写入可恢复记录，再让会话摘要减少历史。"}],"expanded":false},{"key":"claude-14028","number":14028,"bank":"claude","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027828521500673","title":"agent teams 的适用场景强调'平行探索'价值，哪些任务类型明确被列为强适用用例？请列举至少三项。","source":"preview","sections":[{"kind":"回答重点","text":"强适用的场景有独立研究和评审、可拆分的新模块、对同一故障验证不同假设、跨前端与后端的协同。前提是任务边界够独立、可以写成明确交付，成果可互相验证。"},{"kind":"扩展知识","text":"同一个超时问题，三组分别检查网络、连接池、查询耗时，最后合并证据。必须同时编辑同一文件的任务不容易获益。"}],"expanded":false},{"key":"claude-14029","number":14029,"bank":"claude","position":42,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027828869627905","title":"computer-use 在 CLI 中为何采用'机器级独占锁'设计（v2.1.195+），且锁生命周期绑定至会话退出而非单次操作完成？","source":"preview","sections":[{"kind":"回答重点","text":"桌面是机器级共享资源。独占锁限制同一时刻只有一个会话可操作，避免输入焦点、窗口和审批被另一个会话改变。退出才释放能覆盖连续多步；中止当前操作和释放归属是两个状态。"},{"kind":"扩展知识","text":"一个会话选定文本、准备下一步输入时，另一个会话切换窗口会使动作落错应用。留到退出再交还归属能保护这个操作序列。"},{"kind":"参考资料","text":"[Claude Code Computer Use](https://code.claude.com/docs/en/computer-use)"}],"expanded":false},{"key":"claude-14030","number":14030,"bank":"claude","positio ate、TeamDelete 和显式 team_name 一类参数。旧脚本的具体迁移应对照版本日志。"},{"kind":"扩展知识","text":"发起一次并行任务前确认功能已启用，再通过会话观察队友和共享任务。升级后把显式建删队逻辑改为按实际会话事件管理。"},{"kind":"参考资料","text":"[Claude Code 版本记录](https://code.claude.com/docs/en/changelog)"}],"expanded":false},{"key":"claude-14034","number":14034,"bank":"claude","position":47,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027831113580545","title":"为 AI Agent 设计 Skill 时，应遵循哪些工程化原则与实现要点？","source":"preview","sections":[{"kind":"回答重点","text":"技能实践从清晰 description、按需加载、短主文件、可检查的结果开始。把大参考文档和可重复脚本放在独立文件中，给危险或有副作用的操作明确授权边界。"},{"kind":"扩展知识","text":"发布检查可在说明里写明适用的请求和必跑测试。提供成功、失败与不该触发三组样本，记录实际工具调用验证效果。"}],"expanded":false},{"key":"claude-14035","number":14035,"bank":"claude","position":48,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027831503650818","title":"为什么 CLAUDE.md 被描述为'context, not enforced configuration'？这在工程实践中意味着什么约束？","source":"preview","sections":[{"kind":"回答重点","text":"CLAUDE.md 内容进入模型上下文，提供任务决策的约定。它不会被权限引擎解析成强制规则。必须保证发生的格式、授权和提交门禁可以由 hook、沙箱或 CI 实施。"},{"kind":"扩展知识","text":"写下“改完运行测试”能提高遵循概率。业务要求测试必须真实成功时，让独立 CI 确认结果。"}],"expanded":false},{"key":"claude-14036","number":14036,"bank":"claude","position":49,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027831851778050","title":"为什么 SessionStore.append() 方法需对同一 session 的并发调用进行序列化（如加锁或 CAS）？这与 foldSessionSummary 的纯函数特性之间存在何种协作关系？","source":"preview","sections":[{"kind":"回答重点","text":"append 更新同一会话时可能同时修改日志、偏移和摘要。若两个写者从同一旧摘要计算并覆盖，各自的更新可能丢失。按 session 串行或用 CAS 重试，纯 fold 保证同序事件可稳定重算。"},{"kind":"扩展知识","text":"A 处理第 11 个事件、B 处理第 12 个。若都基于版本 10，最终摘要可能缺一个。CAS 失败者重新读到新版本再折叠。"}],"expanded":false},{"key":"claude-14037","number":14037,"bank":"claude","position":50,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027832208293890","title":"为什么 Streaming Input Mode 被明确标记为 preferred 和 recommended？请结合其对 Tool Integration、Real-time Feedback 和 Context Persistence 的支持说明其与 Agent Loop 设计目标的对齐性。","source":"preview","sections":[{"kind":"回答重点","text":"Streaming Input 提供长连接语义，可送入后续消息、获取工具调用过程与中断信号。持续会话有已收工具结果和当前上下文，适合交互、审批、实时进度。"},{"kind":"扩展知识","text":"排查慢服务时，用户看到当前正跑测试，可以追加更窄的范围。单消息更适合一次性任务，跨任务状态靠显式 resume。"}],"expanded":false},{"key":"claude-14038","number":14038,"bank":"claude","position":51,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027833084903425","title":"为什么 checkpointing 明确不追踪 bash 命令引起的文件变更？该限制反映了 Claude Code 在工程交付中对哪一层抽象边界的坚守？","source":"preview","sections":[{"kind":"回答重点","text":"检查点可以记录受支持的结构化文件编辑，工具给出路径和改动前状态。Bash 允许任意进程修改本地和外部资源，运行时无法用一次命令请求可靠推导全部副作用。"},{"kind":"扩展知识","text":"格式化工具可能一次改几十个文件，上传命令可能改变远端状态。要可逆时使用 Git、备份或外部系统专属的恢复/补偿。"}],"expanded":false},{"key":"claude-14039","number":14039,"bank":"claude","position":52,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027833474973697","title":"为什么 routine 的 prompt 必须'自包含且明确说明要做什么以及成功标准'？这一要求与 Plan Mode 和工程交付物有什么关系？","source":"preview","sections":[{"kind":"回答重点","text":"独立运行的 Routine 缺少当场补问、澄清或交互式选择。输入应写清环境、限定范围、可用权限、可判定成功标准和失败报告。Plan Mode 帮助先理解与确定方案，Routine 更依赖事前已明确的交付约定。"},{"kind":"扩展知识","text":"日常生成报告可写明读取哪个仓库、哪段时间、输出路径和错误时如何报告。这样验收可以读取具体结果和状态。"}],"expanded":false},{"key":"claude-14040","number":14040,"bank":"claude","position":53,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027833844072450","title":"为什么编辑 CLAUDE.md 文件后，修改不会在当前 session 中立即生效？这与 prompt cache 的哪一层及其更新时机有关？","source":"preview","sections":[{"kind":"回答重点","text":"项目根或用户级 CLAUDE.md 通常在会话启动时读入 Project Context 层。中途编辑磁盘不会回写已有前缀，运行 /clear、/compact 或重启时可按文档重载。子目录规则有按需加载时机。"},{"kind":"扩展知识","text":"把“测试用 pnpm”改成“用 npm”后，先用当前会话的上下文诊断看是否重载，避免凭文件在磁盘上的最新样子猜模型看到的是什么。"},{"kind":"参考资料","text":"[Claude Code 提示缓存](https://code.claude.com/docs/en/prompt-caching)"}],"expanded":false},{"key":"claude-14041","number":14041,"bank":"claude","position":54,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027834213171202","title":"为何长时间使用 Claude Code 后响应会变慢？请从上下文窗口、工具调用历史与上下文治理角度分析原因及缓解手段。","source":"preview","sections":[{"kind":"回答重点","text":"每轮模型输入可包含更多历史与工具结果，缓存命中时也仍有新内容处理和工具等待。长会话变慢可来自窗口、缓存失效、重复调用或外部服务。用时间拆分定位后缩短工具输出、压缩历史或复用合适任务入口。"},{"kind":"扩展知识","text":"测试完成很快但首字延迟增加时，看输入 token 和缓存指标。若工具阶段慢，优先看工具等待和网络，压缩对话未必解决问题。"}],"quote":"上下文窗口膨胀","expanded":false},{"key":"claude-14042","number":14042,"bank":"claude","position":55,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027834561298434","title":"为实现真正的自主闭环（unattended run），文档推荐哪三种将验证检查（verification check）集成到 Agent Loop 中的技术方案？它们在设置成本与人工干预需求上如何权衡？","source":"preview","sections":[{"kind":"回答重点","text":"可在 CLAUDE.md 声明验收命令，用 Skill 固化“运行、修复、复测”工作流，或在 hook/CI 触发硬性检查。三种办法的配置成本、执行强制性和维护位置不同。"},{"kind":"扩展知识","text":"让界面任务运行截图或交互测试，用测试结果决定是否标记完成。无人运行时还要记录退出状态、预算和可恢复的失败信息。"}],"expanded":false},{"key":"claude-14043","number":14043,"bank":"claude","position":56,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027835307884545","title":"动态工作流支持哪些可重复的质量保障模式，使其结果比单次代理执行更可信？","source":"preview","sections":[{"kind":"回答重点","text":"可组合相互独立的并行调查、不同假设对照、执行与评审隔离、分阶段 gate、结构化结果、确定性测试和失败时限。由编排层记录依赖和每步证据。"},{"kind":"扩展知识","text":"例如先分头分析两种正确性风险，再用统一测试矩阵验证。收敛条件可写为关键测试通过且每个结论有代码位置。"}],"expanded":false},{"key":"claude-14044","number":14044,"bank":"claude","position":57,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027835689566209","title":"启用 agent teams 必须设置哪个环境变量？该变量未设置时，系统行为有何具体表现？","source":"preview","sections":[{"kind":"回答重点","text":"Agent teams 实验功能用 CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 启用，可在启动环境或 settings.json 的 env 配置。默认关闭，使用普通 subagent 工具不代表启动团队，部分模式还要求交互。"},{"kind":"扩展知识","text":"想观察是否真的启用，可检查团队共享任务与队友消息。升级或改配置后启动新会话验证实际行为。"},{"kind":"参考资料","text":"[Claude Code Agent Teams](https://code.claude.com/docs/en/agent-teams)"}],"expanded":false},{"key":"claude-14045","number":14045,"bank":"claude","position":58,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027836050276354","title":"哪些类型的任务适合沉淀为 Skill？哪些更适合实现为 Tool、MCP、Memory 或 Harness？请结合 AI 应用架构中的职责边界与运行时约束说明判断依据。","source":"preview","sections":[{"kind":"回答重点","text":"可复用说明和步骤用 Skill。需要外部或本地的可调用动作，用 Tool 或 MCP。跨会话保存经验用 Memory。权限、审计、预算、恢复和确定性检查由 Harness、hook、CI 等受控层管理。"},{"kind":"扩展知识","text":"查发布版本是工具能力，如何做发布复核是 Skill，哪些目标获准发布由权限系统决定。分清职责可单独测试每一层。"}],"expanded":false},{"key":"claude-14046","number":14046,"bank":"claude","position":59,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027836490678274","title":"在 Explore first, then plan, then code 最佳实践中，Plan Mode 的核心作用是什么？它适用于哪些典型场景，又应在何时跳过？","source":"preview","sections":[{"kind":"回答重点","text":"Plan Mode 先探索、出方案并请用户确认，再进入可修改阶段。适合跨模块、风险高或代码不熟的变更。小修且改法与验收非常明确时，可按当前许可直接做。"},{"kind":"扩展知识","text":"变更权限模型时先列受影响接口和迁移步骤。修正明显拼写则只需要查看目标和检验变更。"}],"expanded":false},{"key":"claude-14047","number":14047,"bank":"claude","position":60,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027837212098561","title":"在 Agent SDK 中，Skills 的发现机制依赖于哪两个关键配置项？若显式设置  settingSources 却遗漏了它们，会导致什么后果？","source":"preview","sections":[{"kind":"回答重点","text":"Agent SDK 通过 settingSources 或 setting_sources 的 user 和 project 来源发现用户与项目磁盘技能。显式设置却遗漏相应来源，技能即使在磁盘存在也不会载入；启用调用还要核对版本支持的 skills 配置。"},{"kind":"扩展知识","text":"脚本在项目下找不到团队 Skill 时，检查 cwd、搜索范围、settings 来源与 Skill 是否在允许列表。"},{"kind":"参考资料","text":"[Agent SDK Skills](https://code.claude.com/docs/en/agent-sdk/skills)"}],"expanded":false},{"key":"claude-14048","number":14048,"bank":"claude","position":61,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027837568614401","title":"在 Agent SDK 的 loop 执行过程中，turn 的精确定义是什么？为什么 max_turns 参数仅计数 tool-use turns而非所有 Claude 响应轮次？","source":"preview","sections":[{"kind":"回答重点","text":"一个含工具的 turn 由一轮助手响应及其工具调用、结果反馈构成。当前 Agent SDK 文档明确规定 max_turns 还会计入最后的纯文本 turn，题干的“仅计工具轮次”需按版本核对。"},{"kind":"扩展知识","text":"三轮分别读、改、验，加一轮文字汇报共四轮。预算只给三轮时，运行可能演变为 error_max_turns，拿不到最终回答。"},{"kind":"参考资料","text":"[Agent SDK 轮次和预算](https://code.claude.com/docs/en/agent-sdk/agent-loop)"}],"expanded":false},{"key":"claude-14049","number":14049,"bank":"claude","position":62,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027837920935938","title":"在 Claude Code 的 prompt cache 分层结构中，CLAUDE.md 和 auto memory 属于哪一层？该层在什么情况下会变更？","source":"preview","sections":[{"kind":"回答重点","text":"缓存可按系统提示及工具定义、项目上下文、会话历史理解。CLAUDE.md、Auto Memory 与不限定路径的项目规则属于项目上下文。根或用户层常在启动、/clear 或 /compact 时重新加载。"},{"kind":"扩展知识","text":"变动工具定义可能影响更早的缓存前缀。新增对话通常接在历史末尾。排查缓存命中先看最先变化的是哪一层。"},{"kind":"参考资料","text":"[Claude Code 提示缓存](https://code.claude.com/docs/en/prompt-caching)"}],"expanded":false},{"key":"claude-14050","number":14050,"bank":"claude","position":63,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027838302617601","title":"在 Claude Code 的能力体系中，MCP（Model Context Protocol）承担什么角色？它与传统插件机制的本质区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"MCP 是运行时通信协议，支持发现、协商、调用外部能力。插件是分发和管理组件的一种包装，可以包含 MCP 服务器配置，也可提供 hooks、skills 等。"},{"kind":"扩展知识","text":"把工单查询接入 Agent 用 MCP；把这个接入和一套项目评审流程发给团队用插件。两层能分别替换和升级。"}],"expanded":false},{"key":"claude-14051","number":14051,"bank":"claude","position":64,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027838692687874","title":"在 SDK 查询中启用 Skills 后，Claude 如何决定是否调用某个 Skill？其决策依据主要来自 `SKILL.md` 中的哪个字段？","source":"preview","sections":[{"kind":"回答重点","text":"运行时利用 SKILL.md frontmatter 的 description 让模型了解这个技能做什么、何时适用。模型依据当前请求选择。技能通常还可由显式名称触发，权限与加载来源配置同样影响可用性。"},{"kind":"扩展知识","text":"“审查 Go 数据竞争”比“开发助手”更容易在任务里匹配。把不适用的输入纳入评测，例如只问并发定义时无需调用审查工作流。"}],"expanded":false},{"key":"claude-14052","number":14052,"bank":"claude","position":65,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027839430885378","title":"在 agentic loop 中，models与tools分别承担什么角色？为什么文档强调 Claude Code 是围绕 Claude 模型构建的 agentic harness？","source":"preview","sections":[{"kind":"回答重点","text":"模型解释目标、使用上下文并提出下一步。工具实际查看、计算、修改或验证。Harness 协调两者，执行权限检查、结果反馈、状态持久化和停止控制。"},{"kind":"扩展知识","text":"模型可以提出运行测试，执行器返回退出码和失败行。可靠交付来自可观察验证，文字回答反映最终状态。"}],"expanded":false},{"key":"claude-14053","number":14053,"bank":"claude","position":66,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027839879675905","title":"在 auto-format 场景中，PostToolUse hook 如何通过解析 tool_input 结构提取 file_path？该机制依赖于 Claude Code 的哪一层抽象（如 MCP 工具协议或内部 tool schema）？","source":"written","sections":[{"kind":"回答重点","text":"PostToolUse 的输入由 Claude Code 的 hook 事件 schema 定义。匹配 Edit/Write 等内置工具后，从 JSON 中的 tool_input.file_path 读文件路径，按实际工具类型检查字段，再运行合适格式化。"},{"kind":"扩展知识","text":"收到本地 Go 文件成功编辑的事件可调用 gofmt，先检查 extension 和目录。接入别的 MCP 工具时，要看其具体参数 schema，未必有同一个字段。"},{"kind":"拿到事件后从哪个对象读路径","text":"命令型 hook 从标准输入读取事件 JSON。先核对事件名是 PostToolUse、工具名是目标 Write 或 Edit，再取 tool_input 下的 file_path。多个输入文件、自定义工具或来自 MCP 的工具可能采用其他结构，按该工具的参数约定单独处理。\n\n先判断路径属于本次项目且文件类型受支持，再把路径作为参数交给格式化器。格式化失败时保留工具原有的写入结果并报告失败原因。PostToolUse 发生在调用完成后，无法把已经发生的写入变成“从未执行”。"},{"kind":"参考资料","text":"[Claude Code Hooks 输入](https://code.claude.com/docs/en/hooks)"}],"expanded":true},{"key":"claude-14054","number":14054,"bank":"claude","position":67,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027840248774658","title":"在 monorepo 场景下，若项目根目录和 apps⧸web⧸.claude⧸skills⧸ 均定义了名为 deploy 的技能，Claude Code 如何区分并调用后者？","source":"preview","sections":[{"kind":"回答重点","text":"嵌套项目可能给技能提供路径限定名，题目例为 /apps/web:deploy，与根目录的 /deploy 区分。当前工作目录、版本的发现范围和实际显示的注册名决定能否直接调用。"},{"kind":"扩展知识","text":"从 apps/web 或其子目录启动后，查看技能列表确定限定名。权限规则对同名或限定名的匹配也要按版本核对。"},{"kind":"参考资料","text":"[Claude Code Skills](https://code.claude.com/docs/en/skills)"}],"expanded":false},{"key":"claude-14055","number":14055,"bank":"claude","position":68,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027840630456322","title":"如何评估Skill设计对工具调用成功率的提升效果？具体可从工具选错率、参数非法率、无意义重复调用率、高风险工具误调用率等维度衡量。","source":"preview","sections":[{"kind":"回答重点","text":"用同一标注任务集做有无 Skill 的 A/B 比较。分别统计工具错选率、schema 验证失败率、无进展重复调用、越权风险调用和最终任务完成率。按任务级或调用级明确定义分母。"},{"kind":"扩展知识","text":"100 个任务中有 20 个应该用某工具，数合法使用、错用和漏用，并分开看审批风险。最终答案正确也可能掩盖无效调用成本。"}],"expanded":false},{"key":"claude-14056","number":14056,"bank":"claude","position":69,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027841045692418","title":"如何评估和降低 Agent 中 Skill 的误召回率？误召回为何对 Agent 行为构成严重风险？","source":"preview","sections":[{"kind":"回答重点","text":"误召回是本不能或无需调用却触发。它会引入无关指令、浪费预算，也可能触发副作用。用正负样本、清楚的 description、缩小匹配范围和必要的显式触发、权限约束降低风险。"},{"kind":"扩展知识","text":"用户问“我们怎么部署”是知识问答。要求“部署通过审批的版本”才可能进入部署技能，后续还要过真实执行权限。"}],"expanded":false},{"key":"claude-14057","number":14057,"bank":"claude","position":70,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027841775501314","title":"对比 command-type hook 与 prompt-based hook、agent-based hook 的决策模型差异，为什么文档强调前者适用于 'deterministic rules' 而后两者适用于 'judgment'？这反映了 Claude Code 权限控制架构中的何种分层设计原则？","source":"preview","sections":[{"kind":"回答重点","text":"command hook 适合按规则处理可枚举输入，prompt hook 用模型判断，agent hook 可在获得工具支持后查证多步。安全约束尽量放在可预测、可审计的确定性层，语义质量交给判断层辅助。"},{"kind":"扩展知识","text":"禁止修改某目录可比较规范化路径。评审一个重构是否保持行为，则可能需要阅读测试和代码，最终用测试证据确认。"}],"expanded":false},{"key":"claude-14058","number":14058,"bank":"claude","position":71,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027842152988673","title":"将研究任务委托给子 Agent 在上下文窗口方面的关键收益是什么？请用 token 用量进行量化说明。","source":"preview","sections":[{"kind":"回答重点","text":"子 Agent 在自己的窗口使用探索 token，父 Agent 只接收结论和少量元数据。父上下文成本可明显降低，总模型花费仍包含子任务。量化可用原始探查长度对摘要长度。"},{"kind":"扩展知识","text":"若子任务阅读了 6100 token，而回传 420 token，仅按这两部分计算，父窗口比直接载入阅读内容节约约 93%。还要算调用及元数据开销。"}],"expanded":false},{"key":"claude-14059","number":14059,"bank":"claude","position":72,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027842513698817","title":"当 .mcp.json 中定义的 MCP 服务器显示为 Pending approval 时，用户需执行什么操作才能完成审批？该操作还会触发什么安全检查？","source":"preview","sections":[{"kind":"回答重点","text":"在受信任的工作区用交互式 Claude Code，检查项目的 .mcp.json 定义并在审批提示或 MCP 管理界面批准具体服务器。项目目录信任与允许服务器启动/连接是各自的判断。"},{"kind":"扩展知识","text":"多人仓库拉到的新配置可能改了执行命令或远程地址。审批前检查这些字段及访问范围，Scope 和管理策略也可能阻止批准。"}],"expanded":false},{"key":"claude-14060","number":14060,"bank":"claude","position":73,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027842882797570","title":"当 CLAUDE.md 文件过大时，官方推荐的两种缓解上下文开销与提升指令遵循率的策略是什么？","source":"preview","sections":[{"kind":"回答重点","text":"把局部约定移到按路径加载的 rules，把重复多步骤流程提取到能按需加载的 Skills。根 CLAUDE.md 保留高频且跨模块使用的短规则。"},{"kind":"扩展知识","text":"Go 包规则只在 Go 目录生效，前端的发布步骤只有做发布才加载。这样常驻约束更容易找到、理解和维护。"}],"expanded":false},{"key":"claude-14061","number":14061,"bank":"claude","position":74,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027843264479233","title":"当会话上下文过长时，⁄context 和 ⁄compact 命令分别承担什么职责？这反映了 Claude Code 在哪一核心机制上的设计？","source":"preview","sections":[{"kind":"回答重点","text":"/context 看当前上下文花销与占用来源。/compact 将对话历史压缩为可继续工作的摘要，可指定保留重点。两者分别用于观察和控制同一上下文预算。"},{"kind":"扩展知识","text":"先发现长工具日志占比很大，再压缩并保留错误步骤、文件名、复测命令。压缩后重新查看并校验关键输入。"}],"expanded":false},{"key":"claude-14062","number":14062,"bank":"claude","position":75,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027844115922946","title":"当用户创建自定义 subagent 时，frontmatter 中哪些字段是必需的或具有明确语义约束？`model` 字段在不同场景（如 Explore 子代理、用户级 subagent）下如何被继承或覆盖？","source":"preview","sections":[{"kind":"回答重点","text":"自定义 subagent frontmatter 必需 name 和 description。可选 tools、model 等。可使用模型别名或 inherit；调用配置或环境覆盖要按当前文档优先级理解，内置 Explore 可有自身默认模型。"},{"kind":"扩展知识","text":"用户级子 Agent 未指定模型时看继承，配置明确模型后查看该角色的实际运行记录，避免只凭主会话界面推断。"},{"kind":"参考资料","text":"[Claude Code 子 Agent](https://code.claude.com/docs/en/sub-agents)"}],"expanded":false},{"key":"claude-14063","number":14063,"bank":"claude","position":76,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027844543741954","title":"当系统中存在数十个Skill时，Agent如何确保准确选择并调用最合适的Skill？","source":"preview","sections":[{"kind":"回答重点","text":"通过准确 name 与 description、窄的启用范围和按需加载减少选择压力。模型进行语义选择，重要流程可显式调用或列在任务允许清单，再用真实样例监控误召回和漏召回。"},{"kind":"扩展知识","text":"同有“部署”和“解释部署”的请求时，只有明确有批准目标的前者进入执行技能。检查模型是否看到、选择并正确运行该技能。"}],"expanded":false},{"key":"claude-14064","number":14064,"bank":"claude","position":77,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027844954783746","title":"当部署需满足高安全要求（如多租户环境）时，Claude Code 推荐采用哪种安全边界模式来保护敏感凭证？该模式如何实现'凭证不暴露给 agent'这一目标？","source":"preview","sections":[{"kind":"回答重点","text":"在高隔离部署中，把凭证保存在 Agent 环境外，由受控代理或受限服务进行鉴权和授权，Agent 只提交业务请求。代理给指定目标附加短期凭证并记审计，不把凭证明文放进工具结果。"},{"kind":"扩展知识","text":"多租户 Agent 的调用携带租户和操作标识，代理核验租户归属再签署请求。用独立服务边界与最小权限控制横向访问。"}],"expanded":false},{"key":"claude-14065","number":14065,"bank":"claude","position":78,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027845319688193","title":"组织启用 Zero Data Retention 后，为何 ⧸web-setup 及其他云会话功能不可用？","source":"preview","sections":[{"kind":"回答重点","text":"ZDR 约束服务端保留数据，而某些托管会话功能需要服务端持久化执行上下文、仓库设置或会话历史。组织启用政策后这类功能可能被限制，支持清单按组织产品和当前文档核对。"},{"kind":"扩展知识","text":"CLI 本地保存的记录与服务商的保留政策属于不同范围。评估合规时同时确认本地文件、托管会话和外部工具的存储位置。"},{"kind":"参考资料","text":"[Claude Code 云会话](https://code.claude.com/docs/en/claude-code-on-the-web)"}],"expanded":false},{"key":"claude-14066","number":14066,"bank":"claude","position":79,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027846024331265","title":"若 _context 显示 CLAUDE.md 已加载，但 Claude 仍不遵守其中某条指令，根据官方文档（CLAUDE.md spec 及 Context Loading Lifecycle），最可能的根本原因是什么？哪些写作特征（如模糊动词、嵌套条件、未声明 scope 或 priority）会显著降低 CLAUDE.md 的指令遵循率？","source":"preview","sections":[{"kind":"回答重点","text":"/context 表示指令已经进入上下文。遵循还依赖规则清晰、范围与其他指令冲突情况。用可观察的行为和路径指定要求，写明条件和优先级。对硬约束设置确定性检查。"},{"kind":"扩展知识","text":"把“有空完善测试”改成“更改支付处理后运行该模块测试，并记录退出码”。如果规则在子目录，检查它是否在目标文件的适用范围内。"}],"quote":"加载 ≠ 执行","expanded":false},{"key":"claude-14067","number":14067,"bank":"claude","position":80,"priority":false,"url":"https://www.mianshiya.com/bank/2082027801073975298/question/2082027846406012929","title":"项目级 subagent（位于 .claude／agents／）支持嵌套目录扫描，且 v2.1.178+ 采用'离工作目录最近者胜出'的同名冲突解决策略。这一设计对团队协作中的 subagent 版本演进有何实际意义？","source":"preview","sections":[{"kind":"回答重点","text":"从当前目录到仓库根扫描子目录的 Agent 定义，较近者可覆盖同名项目角色，使各模块维护自己的约定，同时共享根定义作为默认。版本变更、目录和运行入口都应纳入验证。"},{"kind":"扩展知识","text":"前端与后端共用 review 名称但各有工具约束。在两个目录分别启动并查实际定义，可确认团队收到正确角色。"},{"kind":"参考资料","text":"[Claude Code 子 Agent](https://code.claude.com/docs/en/sub-agents)"}],"expanded":false},{"key":"network-670","number":670,"bank":"network","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295710695425","title":"HTTP 1.0 和 2.0 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"HTTP/1.0 常见做法是一个 TCP 连接处理一次请求，响应后关闭，除非双方启用兼容的持久连接。HTTP/2 把消息拆成二进制帧，多个流可在同一连接交错传输，并用 HPACK 压缩首部。"},{"kind":"扩展知识","text":"例如同一页面请求样式、图片和数据，三个流可以一起推进。底层 TCP 丢包时，该连接上的多条流可能一起等待。服务端推送的实际可用性要看客户端。"},{"kind":"参考资料","text":"[RFC 9113 · HTTP/2](https://www.rfc-editor.org/rfc/rfc9113)"}],"expanded":false},{"key":"network-671","number":671,"bank":"network","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295710695426","title":"HTTP 2.0 和 3.0 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"HTTP/2 在 TCP 上复用流。HTTP/3 基于 UDP 上的 QUIC，由 QUIC 提供可靠传输、加密和独立流管理。"},{"kind":"扩展知识","text":"假设图片流丢包，HTML 流已完整的数据仍可继续交付。不同流仍共享网络拥塞压力，使用 0-RTT 时要考虑请求重放。"},{"kind":"参考资料","text":"[RFC 9114 · HTTP/3](https://www.rfc-editor.org/rfc/rfc9114)"}],"expanded":false},{"key":"network-5898","number":5898,"bank":"network","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1828371336037654530","title":"常见的 HTTP 状态码有哪些？","source":"preview","sections":[{"kind":"回答重点","text":"先记五类。1xx 是处理提示，2xx 成功，3xx 重定向或缓存，4xx 是请求侧问题，5xx 是服务端问题。高频有 200、201、204、301、302、304、400、401、403、404、429、500、502、503、504。"},{"kind":"扩展知识","text":"登录凭据缺失常用 401，已有身份但无访问权常用 403。网关从上游得到无效响应可能给 502，等待上游超时常给 504。排查时先定位哪一层返回。"},{"kind":"参考资料","text":"[RFC 9110 · HTTP 语义](https://www.rfc-editor.org/rfc/rfc9110)"}],"expanded":false},{"key":"network-5911","number":5911,"bank":"network","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1828679423048978433","title":"HTTP 请求包含哪些内容，请求头和请求体有哪些类型？","source":"preview","sections":[{"kind":"回答重点","text":"HTTP/1.1 请求由请求行、请求头、空行和可选请求体组成。请求行含方法、目标和版本，头描述主机、认证、内容类型、消息长度等。"},{"kind":"扩展知识","text":"JSON 常用 application/json，表单可用 application/x-www-form-urlencoded，文件加表单字段常用 multipart/form-data。HTTP/2、HTTP/3 用帧与伪头承载请求语义。"}],"expanded":false},{"key":"network-672","number":672,"bank":"network","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295714889729","title":"HTTP 和 HTTPS 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"HTTPS 是在经过认证的加密传输上使用 HTTP。TLS 提供传输机密性、完整性和服务端身份验证。HTTP、HTTPS 默认端口通常为 80 和 443。"},{"kind":"扩展知识","text":"浏览器检查证书链、名字和有效期，再协商会话密钥。TLS 保护传输链路，应用仍需验证权限、输入和业务状态。"}],"expanded":false},{"key":"network-9795","number":9795,"bank":"network","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1853639415351156737","title":"HTTP 中 GET 和 POST 的区别是什么？","source":"preview","sections":[{"kind":"回答重点","text":"GET 用于获取资源，语义是安全、幂等的，可按缓存规则复用。POST 让目标处理提交的数据，可能创建资源或触发操作，应用可额外设计幂等。"},{"kind":"扩展知识","text":"点十次商品详情也应只读。提交订单则用幂等键防重复创建。两种方法的安全性都依赖 HTTPS 和正确的权限，敏感数据尽量别进 URL。"}],"expanded":false},{"key":"network-10386","number":10386,"bank":"network","position":7,"priority":true,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1861283789963190273","title":"WebSocket 与 HTTP 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"普通 HTTP 交互以请求和响应为主，响应也可以连续送数据。WebSocket 建立连接后，双方可各自发送消息，形成持续双向通信。在 HTTP/1.1 中经典握手用 Upgrade。"},{"kind":"扩展知识","text":"聊天室常用 WebSocket。只需服务端推送模型进度时，可以用 SSE 持续发送文本事件，客户端发送新操作可另走普通 HTTP。每个进度事件有稳定序号，断线前收到 42 时，SSE 可用 Last-Event-ID 续读，WebSocket 可在应用协议中携带水位。"},{"kind":"面试官追问","text":"重连能力只负责重新建立传输。要真正补到 43 起的事件，服务端必须留存事件，并能验证会话权限和水位。"},{"kind":"如果 HTTP 也能复用连接，差别在哪里","text":"先分清传输连接和应用交互。HTTP/1.1 可以复用连接，HTTP/2 还可在一条连接上并发多个流。普通 HTTP 请求仍由客户端发起。WebSocket 建立后，双方都可主动发送独立的应用消息，适合聊天、交互控制等双向场景。\n\n若浏览器主要接收模型逐字输出，SSE 能沿一个 HTTP 响应持续接收服务端事件。若还要在同一通道提交终端输入或双向实时控制，再考虑 WebSocket。重连和断线补读都要在应用层设计。"},{"kind":"参考资料","text":"[RFC 6455 · WebSocket](https://www.rfc-editor.org/rfc/rfc6455)"}],"expanded":true},{"key":"network-10387","number":10387,"bank":"network","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1861300406956777474","title":"服务端是如何解析 HTTP 请求的数据？（考察 HTTP 请求格式的了解程度）","source":"preview","sections":[{"kind":"回答重点","text":"服务器先解析协议元信息与消息体边界。HTTP/1.1 读取请求行和首部，再按长度或分块读取正文。HTTP/2 和 HTTP/3 解析帧，业务层再按 Content-Type 解码。"},{"kind":"扩展知识","text":"一次 read 未必读齐请求。解析器应限制头和正文大小，拒绝歧义格式并设置超时。大文件应流式接收。"}],"expanded":false},{"key":"network-669","number":669,"bank":"network","position":9,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295706501122","title":"到底什么是 TCP 连接？","source":"preview","sections":[{"kind":"回答重点","text":"TCP 连接是两端共同维护的一组状态，通常由本地和远端的 IP、端口四元组区分。状态包括序列号、窗口、确认进度和重传信息。"},{"kind":"扩展知识","text":"服务端 443 端口能接很多客户端，每条已建立连接的远端地址或端口可以不同。断开后还有部分协议状态需暂时保留。"}],"expanded":false},{"key":"network-673","number":673,"bank":"network","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295719084033","title":"TCP 是用来解决什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"TCP 在 IP 基础上提供可靠、有序、全双工的字节流。它负责重传、去重、重排、流量控制与拥塞控制。"},{"kind":"扩展知识","text":"发送方两次写可能被对方一次读取。TCP 保证字节顺序，消息长短或分隔符由应用层协议约定。"}],"expanded":false},{"key":"network-12284","number":12284,"bank":"network","position":11,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1980188286236348417","title":"一台服务器，最多能建立多少 TCP 连接？","source":"preview","sections":[{"kind":"回答重点","text":"服务器最大连接数受文件描述符、内存、处理能力、协议状态、网络和应用限制。服务器同一个监听端口能接收许多不同四元组。"},{"kind":"扩展知识","text":"65535 不能直接作为服务器总连接上限。单个发起端到固定目的地时，本地临时端口则可能成为瓶颈。压测同时看每连接内存与请求延迟。"}],"expanded":false},{"key":"network-674","number":674,"bank":"network","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295719084034","title":"TCP 和 UDP 有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"TCP 是连接型、可靠有序的字节流。UDP 是面向报文的传输，协议自身不保证到达或顺序。应用可以按需求在 UDP 上加入可靠性机制。"},{"kind":"扩展知识","text":"文件传输重视完整性，实时语音更关注延迟。QUIC 在 UDP 上实现可靠流，说明选择时要看应用协议整体的语义。"}],"expanded":false},{"key":"network-675","number":675,"bank":"network","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295723278337","title":"为什么要 TCP，IP 层实现控制不行么？","source":"preview","sections":[{"kind":"回答重点","text":"IP 负责尽力转送分组。TCP 在端点提供应用所需的可靠传输，包括端口、序列号、确认、窗口和拥塞处理。分层使不同应用能选不同传输协议。"},{"kind":"扩展知识","text":"网页响应需要有序完整，TCP 能补丢失。语音应用则可根据时效决定在 UDP 上是否补发某一段数据。"}],"expanded":false},{"key":"network-676","number":676,"bank":"network","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295727472641","title":"TCP 的粘包和拆包能说说吗？","source":"preview","sections":[{"kind":"回答重点","text":"TCP 是字节流。两次写入可能由一次 read 读取，一次写入也可能拆成若干次读。应用要设计自己的消息边界。"},{"kind":"扩展知识","text":"可用固定长度的头声明正文大小，再循环读足所需字节。一次读到多帧时保留下一帧数据，还要限制声明长度，避免超大分配。"}],"expanded":false},{"key":"network-677","number":677,"bank":"network","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295731666945","title":"说说 TCP 的三次握手？","source":"preview","sections":[{"kind":"回答重点","text":"客户端发 SYN 和初始序列号，服务端回 SYN+ACK 确认客户端起点并提供自己的起点，客户端再回 ACK。两侧确认后进入已建立状态。"},{"kind":"扩展知识","text":"握手还可协商窗口缩放等能力。最后 ACK 丢失时，服务端可以重发 SYN+ACK，正常客户端会再次确认。"},{"kind":"参考资料","text":"[RFC 9293 · TCP](https://www.rfc-editor.org/rfc/rfc9293)"}],"expanded":false},{"key":"network-678","number":678,"bank":"network","position":16,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295731666946","title":"TCP 初始序列号 ISN 怎么取值的？","source":"preview","sections":[{"kind":"回答重点","text":"初始序列号要让新旧连接的序列空间尽量分离，也要降低可预测性。现代实现可结合时间变化与对四元组的带密钥计算。"},{"kind":"扩展知识","text":"客户端与服务端各有独立序列空间。SYN 和 FIN 各占一个序列号位置，ACK 表示下一个期望位置。"}],"expanded":false},{"key":"network-679","number":679,"bank":"network","position":17,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295735861250","title":"TCP 三次握手时，发送 SYN 之后就宕机了会怎么样？","source":"preview","sections":[{"kind":"回答重点","text":"服务端可能暂存半连接并回复 SYN+ACK。客户端宕机就没有最终 ACK，服务端等待并重试，到时释放该状态。"},{"kind":"扩展知识","text":"客户端恢复后重新连接建立新会话。服务端通过队列容量、超时及 SYN 保护机制控制半连接消耗。"}],"expanded":false},{"key":"network-680","number":680,"bank":"network","position":18,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295740055553","title":"什么是 SYN Flood 攻击？","source":"preview","sections":[{"kind":"回答重点","text":"SYN Flood 是消耗连接建立资源的拒绝服务风险。监控看半连接量、握手成功率、重传和正常请求可用性。"},{"kind":"扩展知识","text":"防守可结合入口流量清洗、SYN cookies、速率控制和容量调节。营销洪峰也会有类似信号，要结合来源和已建立连接趋势判断。"}],"expanded":false},{"key":"network-11561","number":11561,"bank":"network","position":19,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1913501273419739137","title":"TCP 协议是如何保证可靠传输的？","source":"preview","sections":[{"kind":"回答重点","text":"用序列号定位字节，用 ACK 反馈接收进度。缺失数据按超时或快速恢复机制重传，接收端去重并按序交付。"},{"kind":"扩展知识","text":"网络交付和应用完成是两个状态。写请求超时可能已被应用处理，重试前用幂等键或业务回执核对。"}],"expanded":false},{"key":"network-681","number":681,"bank":"network","position":20,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295740055554","title":"说说 TCP 的四次挥手？","source":"preview","sections":[{"kind":"回答重点","text":"主动关闭方发 FIN，接收方确认。接收方可继续发送数据，结束后再发自己的 FIN，然后由主动方确认。"},{"kind":"扩展知识","text":"两个方向可以分别结束，半关闭后仍可读取对端数据。FIN 和 ACK 有时可合并，实际报文数量不一定是四个。"},{"kind":"参考资料","text":"[RFC 9293 · TCP](https://www.rfc-editor.org/rfc/rfc9293)"}],"expanded":false},{"key":"network-684","number":684,"bank":"network","position":21,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295748444163","title":"为什么 TCP 挥手需要有 TIME_WAIT 状态?","source":"preview","sections":[{"kind":"回答重点","text":"最后发送 ACK 的一侧进入 TIME_WAIT，可以为对端重发的 FIN 再次确认，也让旧连接的延迟分组先消失。"},{"kind":"扩展知识","text":"大量短连接会增加此状态。先检查是否该复用连接，再判断资源问题，避免随意缩短系统保护时间。"}],"expanded":false},{"key":"network-5920","number":5920,"bank":"network","position":22,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1828727071814619137","title":"除了四次挥手，还有什么方法断开连接？","source":"preview","sections":[{"kind":"回答重点","text":"除正常 FIN 关闭外，RST 能立即重置连接。应用也可通过超时感知不可达并放弃连接。半关闭只结束一个方向。"},{"kind":"扩展知识","text":"应用异常退出有时会让对端看到 reset。具体的 FIN、RST 或超时由系统和关闭方式决定，定位时结合抓包与对端日志。"}],"expanded":false},{"key":"network-687","number":687,"bank":"network","position":23,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295761027073","title":"TCP 超时重传机制是为了解决什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"发送端在预期时间内没有收到确认时重传，避免丢包或确认丢失让连接无法前进。RTO 由 RTT 和波动估算，多次超时往往退避。"},{"kind":"扩展知识","text":"链路抖动大时 RTO 动态变化。应用要管理请求自己的截止时间，不能把一次 TCP 计时器当成业务超时。"}],"expanded":false},{"key":"network-9794","number":9794,"bank":"network","position":24,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1853282734041370626","title":"TCP 中何时会出现 RST（reset）报文？","source":"preview","sections":[{"kind":"回答重点","text":"RST 常见于端口无监听、分组属于不存在的连接、应用主动中止等情况。接收方获知连接立即失效。"},{"kind":"扩展知识","text":"遇 connection reset 时检查上游重启、空闲连接被中间设备清除、客户端复用已关闭连接等，通常需要两边证据。"}],"expanded":false},{"key":"network-688","number":688,"bank":"network","position":25,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295761027074","title":"TCP 有超时重传为什么还需要快速重传机制？","source":"preview","sections":[{"kind":"回答重点","text":"超时重传等计时器，速度可能慢。收到足够的重复 ACK 等信号时，可提前补缺，称为快速重传。"},{"kind":"扩展知识","text":"中间一段丢失但后续段到达时，可能收到多次重复 ACK；尾部丢失时缺少这些信号，仍要靠其他检测或超时。"}],"expanded":false},{"key":"network-689","number":689,"bank":"network","position":26,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295773609986","title":"TCP 的 SACK 的引入是为了解决什么问题？","source":"preview","sections":[{"kind":"回答重点","text":"累计 ACK 表示连续收到哪里，SACK 可以说明缺口后哪些范围已到，帮助发送方更精确地补缺。"},{"kind":"扩展知识","text":"第二段丢了但第三、四段已到，SACK 可报告后两段。这样可减少不必要的重传，具体发送策略由实现决定。"}],"expanded":false},{"key":"network-691","number":691,"bank":"network","position":27,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295777804290","title":"TCP 滑动窗口的作用是什么？","source":"preview","sections":[{"kind":"回答重点","text":"滑动窗口允许等待确认时仍发送多段数据。rwnd 表示接收者可用容量，cwnd 代表发送侧对网络承载的估计。"},{"kind":"扩展知识","text":"实际能发多少还取决于已经飞行的字节。接收方读得慢，窗口可能归零，发送端按机制暂停并探测。"}],"expanded":false},{"key":"network-693","number":693,"bank":"network","position":28,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295781998594","title":"说说 TCP 拥塞控制的步骤？","source":"preview","sections":[{"kind":"回答重点","text":"经典 Reno 可以讲慢启动、拥塞避免、快速重传和快速恢复。发送端探测可承载速率，丢包时减窗，超时后进一步收敛。"},{"kind":"扩展知识","text":"现代系统也可能使用 CUBIC 或 BBR。流量控制保护接收端缓冲，拥塞控制关心网络整体压力。"},{"kind":"参考资料","text":"[RFC 5681 · TCP 拥塞控制](https://www.rfc-editor.org/rfc/rfc5681)"}],"expanded":false},{"key":"network-695","number":695,"bank":"network","position":29,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295790387201","title":"ARP 和 RARP 分别是什么？有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"ARP 按本地链路上的 IPv4 地址查询链路地址。RARP 曾从设备链路地址查 IPv4，地址分配现通常使用 DHCP 等。"},{"kind":"扩展知识","text":"访问远端机器时本地会查询网关的 MAC，通常不直接查询远端机器的 MAC。IPv6 使用邻居发现。"}],"expanded":false},{"key":"network-696","number":696,"bank":"network","position":30,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295790387202","title":"TCP/IP 四层模型是什么？","source":"preview","sections":[{"kind":"回答重点","text":"TCP/IP 常分链路、网络、传输和应用四层。以太网处理本地帧，IP 寻址转发，TCP/UDP 在端点传输，HTTP 描述应用交互。"},{"kind":"扩展知识","text":"访问网页时应用交给下层承载数据。故障从接入、地址路由、连接、TLS 到 HTTP 分层排查。"}],"expanded":false},{"key":"network-697","number":697,"bank":"network","position":31,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295798775809","title":"OSI 七层模型是什么？","source":"preview","sections":[{"kind":"回答重点","text":"OSI 自下而上为物理、数据链路、网络、传输、会话、表示和应用。它用于说明分层职责，实际协议栈不总能一一对应。"},{"kind":"扩展知识","text":"能把以太网、IP、TCP、TLS、HTTP 放到相应职责里更重要。HTTP 超时可拆 DNS、连接、加密和处理阶段。"}],"expanded":false},{"key":"network-698","number":698,"bank":"network","position":32,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295798775810","title":"Cookie、Session、Token 之间有什么区别？","source":"preview","sections":[{"kind":"回答重点","text":"Cookie 是浏览器按条件保存、发送的数据。Session 常指服务端保存的会话状态，客户端保留标识。Token 是凭据，可自包含签名或指向服务端记录。"},{"kind":"扩展知识","text":"网站可用带 HttpOnly、Secure 的 Cookie 保存随机 session ID。撤销、过期和跨实例共享需求会影响选型。"}],"expanded":false},{"key":"network-699","number":699,"bank":"network","position":33,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295802970113","title":"JWT Token 能说说吗？","source":"preview","sections":[{"kind":"回答重点","text":"常见签名 JWT 由 Header、Payload、Signature 组成。服务端验签并核对算法、过期、签发者和受众，签名载荷通常可读。"},{"kind":"扩展知识","text":"不要把秘密放进普通签名 JWT。访问 Token 设短有效期，刷新 Token 可轮换；高风险场景要考虑撤销和实时授权。"}],"expanded":false},{"key":"network-700","number":700,"bank":"network","position":34,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295802970114","title":"简单谈谈你对 DNS 的理解？","source":"preview","sections":[{"kind":"回答重点","text":"DNS 按域名查 A、AAAA、CNAME、MX 等记录。递归解析器利用缓存，需要时依次访问根、顶级域和权威服务器。"},{"kind":"扩展知识","text":"缓存有效期由 TTL 控制。解析异常时区分本机、递归解析器和权威记录，并考虑负缓存和地区调度。"}],"expanded":false},{"key":"network-701","number":701,"bank":"network","position":35,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1780933295807164417","title":"简单谈谈你对 CDN 的理解？","source":"preview","sections":[{"kind":"回答重点","text":"CDN 用边缘节点接近用户提供资源。缓存命中可减少回源和延迟，节点可通过 DNS 或 Anycast 等方式调度。"},{"kind":"扩展知识","text":"带版本号的静态文件适合较长 TTL。个性化资源须设置缓存键和权限，监控命中率、回源流量和边缘错误。"}],"expanded":false},{"key":"network-5619","number":5619,"bank":"network","position":36,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1826556994582671361","title":"从网络角度来看，用户从输入网址到网页显示，期间发生了什么？","source":"preview","sections":[{"kind":"回答重点","text":"通常先处理 URL、查 DNS、建连接并完成必要的 TLS，再请求 HTTP。浏览器收到资源后解析、加载子资源、执行脚本并渲染。"},{"kind":"扩展知识","text":"浏览器缓存、CDN 和连接复用会跳过部分步骤。网络面板能拆出解析、连接、首字节、下载和渲染耗时。"}],"expanded":false},{"key":"network-6352","number":6352,"bank":"network","position":37,"priority":false,"url":"https://www.mianshiya.com/bank/1790948499480616961/question/1835157125712117762","title":"常见的登录鉴权方式有哪些？各自的优缺点是？","source":"preview","sections":[{"kind":"回答重点","text":"可用服务端 Session、签名或不透明 Token、OIDC 联合登录、客户端证书或请求签名。按浏览器、服务间调用和第三方授权需求选。"},{"kind":"扩展知识","text":"浏览器会话可用安全属性齐全的 Cookie，联合登录按 OIDC 流程校验回调与身份。身份认证后还要检查资源授权。"}],"expanded":false},{"key":"design-732","number":732,"bank":"design","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/1796073573673205762","title":"让你设计一个 RPC 框架，怎么设计？","source":"preview","sections":[{"kind":"回答重点","text":"先定义接口描述、序列化和传输，再做服务发现、负载均衡、超时与重试。服务端按方法路由、校验参数，客户端区分网络和业务错误。"},{"kind":"扩展知识","text":"调用方传剩余 deadline，服务按预算执行，取消后释放资源。写接口重试前确保幂等，观测记调用链、重试和延迟分位数。"}],"expanded":false},{"key":"design-4680","number":4680,"bank":"design","po 3","title":"加密后的数据怎么支持模糊搜索？","source":"preview","sections":[{"kind":"回答重点","text":"普通随机密文无法执行明文模糊匹配。按场景评估受控搜索服务、专门可搜索方案，或把需求改为授权下的精确匹配。"},{"kind":"扩展知识","text":"低熵手机号和相似索引可能泄露频率与关系。先明确恰当的威胁模型和可接受暴露，再决定实现。"}],"expanded":false},{"key":"design-13174","number":13174,"bank":"design","position":37,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/1998944444497272834","title":"如何防止接口被恶意刷量？除了限流，还有哪些防护手段？","source":"preview","sections":[{"kind":"回答重点","text":"把认证门槛、风险识别、验证码、缓存和入口防护与分层限流组合。依据监控定位受影响接口和流量特征。"},{"kind":"扩展知识","text":"先保下游服务，逐步细化规则并检查误伤。对真正的热门活动也要做容量和缓存优化。"}],"expanded":false},{"key":"design-13175","number":13175,"bank":"design","position":38,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/1998949356958392321","title":"如何实现一个滑动验证码功能？如何防止被机器识别破解？","source":"preview","sections":[{"kind":"回答重点","text":"服务端生成短期一次性挑战，将挑战绑定会话和动作，独立校验结果并限制尝试。可结合风控和更高等级验证。"},{"kind":"扩展知识","text":"不要只根据客户端声称成功放行。记录失败趋势、正常用户误判与无障碍替代流程。"}],"expanded":false},{"key":"design-13176","number":13176,"bank":"design","position":39,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/1998958844604063746","title":"短信验证码如何防止被恶意轰炸？如果有人不断请求发送验证码，你会如何限制？","source":"preview","sections":[{"kind":"回答重点","text":"从手机号、账号、设备和网络等维度控制速率和费用，设置冷却、配额和异常验证。"},{"kind":"扩展知识","text":"短时间重复发送可以合并；验证码短时有效、使用即作废，验证次数也要受控，接入渠道费用告警。"}],"expanded":false},{"key":"design-13178","number":13178,"bank":"design","position":40,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/1999046326603489281","title":"什么是死信队列？在什么场景下会用到？如何设计死信队列的处理机制？","source":"preview","sections":[{"kind":"回答重点","text":"死信队列保存达到重试上限、过期或无法处理的消息，便于诊断、补偿或修复后重放。"},{"kind":"扩展知识","text":"保留消息 ID、错误、失败时间和原路由。人工或受控任务重放前要保证消费幂等，避免重复扣款等副作用。"}],"expanded":false},{"key":"design-13191","number":13191,"bank":"design","position":41,"priority":false,"url":"https://www.mianshiya.com/bank/1795650093939204097/question/2009455720558354434","title":"微信扫码登录是如何实现的？请描述一下技术方案","source":"preview","sections":[{"kind":"回答重点","text":"网页创建短时登录挑战并展示二维码。手机端授权后，服务端确认挑战对应用户，浏览器以轮询或事件拿到状态并换取会话。"},{"kind":"扩展知识","text":"挑战要有随机性、有效期、一次性和会话绑定。网站接入微信应以公开授权流程校验回调与身份。"}],"expanded":false},{"key":"mysql-617","number":617,"bank":"mysql","position":1,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295526146049","title":"MySQL 中的数据排序是怎么实现的？","sections":[{"kind":"回答重点","text":"MySQL 有两种排序路径。\n\n1. **索引排序**。索引可以提供 `ORDER BY` 要求的键序时，沿 B+ 树叶子页读取即可得到有序结果。\n2. **文件排序（filesort）**。优化器选择额外排序时，先用排序缓冲区处理候选数据。缓冲空间不足时，可以将各段排好序再做外部归并。\n\n面试鸭把排序记录的两种携带方式称为单路和双路。单路把排序键和查询要返回的数据一起带入缓冲，排序后直接取结果。双路只带排序键和行定位信息，排序完成后再按定位信息取其余列。选择时要考虑行宽、排序用内存和后续取行成本。"},{"kind":"扩展知识","text":"索引 `(tenant_id, created_at, id)` 可服务于 `WHERE tenant_id = 7 ORDER BY created_at, id`，能覆盖所需字段时也可减少回表。成本模型仍可能选择扫表再排序，尤其是走索引需要读取许多整行时。MySQL 8.0 支持声明降序键列，例如 `(a ASC, b DESC)`，可评估它能否满足混合方向的排序。\n\n**面试官追问**　怎么判断排序有没有溢出到磁盘？`EXPLAIN` 中 `Using filesort` 只表示计划包含额外排序。可在同一会话执行前后查看 `SHOW SESSION STATUS LIKE 'Sort_merge_passes'` 的变化，或从优化器跟踪查看排序摘要及磁盘溢出的初始有序段数。\n\n[MySQL 手册 · ORDER BY 优化](https://dev.mysql.com/doc/refman/8.4/en/order-by-optimization.html)"}],"source":"visible","quote":"利用索引天然有序","expanded":false},{"key":"mysql-589","number":589,"bank":"mysql","position":2,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295429677057","title":"详细描述一条 SQL 语句在 MySQL 中的执行过程。","sections":[{"kind":"回答重点","text":"先分清两层。Server 层负责连接管理、SQL 解析和优化，存储引擎负责数据的实际存取。客户端连接时先认证，执行语句还要检查权限。老版本可能先查查询缓存，MySQL 8.0 已移除这一环节。"},{"kind":"扩展知识","text":"连接后还有三步。分析器识别 SQL 语法、表名和列名。优化器根据统计信息和成本决定走哪个索引、如何连接表。执行器按计划调用存储引擎，完成过滤、排序或聚合并返回结果。\n\n例如主键点查可以直接定位 InnoDB 聚簇树叶子页，页常驻 Buffer Pool 时可避免数据页物理读取。对更新语句，InnoDB 还要加相应的锁、生成 undo 与 redo，并修改缓冲池页。提交时若启用了 binlog，Server 与 InnoDB 协调提交。物理执行顺序由计划决定，SQL 子句的逻辑处理顺序见 [原站第 11175 题](#q-11175)。\n\n[MySQL 手册 · 优化 SELECT](https://dev.mysql.com/doc/refman/8.4/en/select-optimization.html)"}],"source":"preview","expanded":false},{"key":"mysql-591","number":591,"bank":"mysql","position":3,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295438065665","title":"MySQL 的索引类型有哪些？","sections":[{"kind":"回答重点","text":"按数据结构、存储方式、索引性质三个角度回答。结构上首先讲 B+ 树，叶子数据有序，适合点查和范围查询。哈希索引对等值查询有优势。存储上讲聚簇索引和二级索引，性质上讲主键、唯一和普通索引。"},{"kind":"扩展知识","text":"同一个索引可同时属于几类，例如 `UNIQUE KEY (tenant_id, email)` 是联合唯一索引，也是以 B+ 树组织的二级索引（已有独立主键时）。InnoDB 常规 B-tree 索引支持范围和顺序访问。MEMORY 可用显式 HASH 索引，擅长等值匹配。InnoDB 的自适应哈希由引擎管理。全文适合词项检索，空间索引用于几何数据查询。覆盖索引描述索引与特定查询之间的关系。\n\n[MySQL 手册 · CREATE INDEX](https://dev.mysql.com/doc/refman/8.4/en/create-index.html)"}],"source":"preview","expanded":false},{"key":"mysql-626","number":626,"bank":"mysql","position":4,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295555506178","title":"MySQL 的 Change Buffer 是什么？它有什么作用？","sections":[{"kind":"回答重点","text":"增删改影响某个二级索引页，而页暂时不在 Buffer Pool 时，InnoDB 可以先缓冲符合条件的变更。目标页后来被读入，或者引擎安排后台合并时，再一起应用这些变更。\n\n收益有两项。第一，写入当下可以少做一次为加载冷页产生的随机读。第二，同一页累积多条改动时，可在页加载后集中应用，减少分散读写。"},{"kind":"扩展知识","text":"典型适用对象是普通二级索引。唯一性检查通常要求先访问目标页，聚簇索引和含降序列的特定索引也有适用限制。变更缓冲可持久化，合并仍消耗 I/O，甚至能把一部分开销转移到后续读取。MySQL 8.4 的 `innodb_change_buffering` 默认值为 `none`，排查实例时应确认当前版本和变量实际值。\n\n**面试官追问**　Change Buffer 和 redo 怎么分工？Change Buffer 负责推迟部分冷二级索引页的合并，redo 负责崩溃后的重做，也可记录 Change Buffer 自身的页变更。\n\n[MySQL 手册 · Change Buffer](https://dev.mysql.com/doc/refman/8.4/en/innodb-change-buffer.html)"}],"source":"visible","expanded":false},{"key":"mysql-12256","number":12256,"bank":"mysql","position":5,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1976916016243953666","title":"什么是批量数据入库？相比单条插入有什么优势？","sections":[{"kind":"回答重点","text":"把多条数据合并到一条 SQL 或一次数据库交互中。收益主要有两项。第一，减少客户端与数据库之间的网络往返。第二，把解析、执行及提交等固定开销摊到一批数据上。\n\n以 10 万条记录为例，若逐条发送，应用要发送 10 万条语句。若每批发送 1,000 条记录，写入请求约为 100 批。实际收益取决于驱动是否合并请求和事务的提交方式。"},{"kind":"扩展知识","text":"**例子与追问**　导入订单时按批提交，批大小结合行宽、`max_allowed_packet`、延迟、复制积压和锁持有时间压测。用业务唯一键与批次检查点做幂等恢复，避免客户端超时重试造成重复。批失败时可定位失败记录后按需拆批，记录已提交的边界。\n\n```sql\nINSERT INTO orders (id, amount)\nVALUES (101, 19.90), (102, 29.90), (103, 9.90);\n```\n\nMySQL Connector/J 可以用 `rewriteBatchedStatements` 让驱动在适用时重写 JDBC 批量 INSERT。是否真正合并取决于驱动配置和语句形式。调优时用实际发送的语句、每批耗时和数据库负载验证。\n\n[MySQL 手册 · 优化 INSERT](https://dev.mysql.com/doc/refman/8.4/en/insert-optimization.html) · [MySQL Connector/J 性能参数](https://dev.mysql.com/doc/connector-j/en/connector-j-connp-props-performance-extensions.html)"}],"source":"visible","expanded":false},{"key":"mysql-12251","number":12251,"bank":"mysql","position":6,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1976579387243384834","title":"什么是数据全量同步和增量同步？它们各有什么优缺点？","sections":[{"kind":"回答重点","text":"全量同步复制整个指定数据集，例如用 `mysqldump` 导出整张表再导入。增量同步只处理上次同步以后新增、更新和删除的数据。例如按 `update_time` 拉取新增或更新行，硬删除还需额外机制捕获。\n\n| 方式 | 优点 | 代价 | 常见用途 |\n| --- | --- | --- | --- |\n| 全量同步 | 容易建立完整数据基线 | 数据量大时耗时，占用源库与网络资源 | 初始化、定期重建、容灾恢复 |\n| 增量同步 | 流量小，延迟通常更低 | 需要处理位点、顺序、删除和重放 | 持续同步、实时数仓 |\n\n实际项目常用全量建立基线，再从对应位点接上增量。"},{"kind":"扩展知识","text":"常见做法是用一致性快照初始化，同时记录与快照对应的 binlog 位点或 GTID 集合，再从该边界补齐变化。目标按业务键幂等应用，记录可重放的检查点，定期校验。按 `updated_at` 轮询实现简单，但需处理时间戳撞值、迟到更新及硬删除；可用 `(updated_at, id)` 作为分页水位，并用删除标记或 CDC 补删除能力。\n\n[MySQL 手册 · 选择复制快照方式](https://dev.mysql.com/doc/refman/8.4/en/replication-snapshot-method.html)"}],"source":"visible","expanded":false},{"key":"mysql-12252","number":12252,"bank":"mysql","position":7,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1976592556003184642","title":"什么是游标 Cursor 分页？相比传统 LIMIT OFFSET 分页有什么优势？","sections":[{"kind":"回答重点","text":"游标分页基于位置，用上一页末行的标识作为下一页的起点。`LIMIT OFFSET` 则先跳过指定数量的结果，再取本页。假设上一页最后一条记录的主键实际是 10000，可以比较这两种写法。\n\n```sql\nSELECT id FROM users ORDER BY id LIMIT 10 OFFSET 10000;\nSELECT id FROM users WHERE id \u003e 10000 ORDER BY id LIMIT 10;\n```\n\n游标有两个优势。使用匹配的索引时，下一页可以从边界开始读，成本通常更稳定。边界之前有插入或删除时，固定游标也能减少偏移量移动带来的重复和漏读。整个翻页过程是否看到同一快照，还要看排序键变化和一致性策略。"},{"kind":"扩展知识","text":"**例子与追问**　按创建时间倒序时，用 `id` 打破同一时间戳的并列，索引可用 `(tenant_id, created_at, id)`。首屏省略游标条件，后续请求复用相同过滤条件。排序字段在翻页间变化仍可能跳行或重复，需要稳定浏览口径时应设计快照或水位。\n\n```sql\nSELECT id, created_at\nFROM orders\nWHERE tenant_id = ?\n  AND (created_at \u003c ? OR (created_at = ? AND id \u003c ?))\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\n[MySQL 手册 · 范围优化](https://dev.mysql.com/doc/refman/8.4/en/range-optimization.html)"}],"source":"visible","expanded":false},{"key":"mysql-590","number":590,"bank":"mysql","position":8,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295433871361","title":"MySQL 的存储引擎有哪些？它们之间有什么区别？","sections":[{"kind":"回答重点","text":"存储引擎是可插拔的，决定数据如何组织和读取。面试优先讲 InnoDB 和 MyISAM。InnoDB 是现代 MySQL 的默认引擎，支持事务、行级锁、外键和 MVCC，按聚簇索引组织数据，适合并发事务业务。MyISAM 是旧版本常见引擎。"},{"kind":"扩展知识","text":"MyISAM 采用表级锁，缺少事务和外键。MEMORY 将用户表的数据放在内存中，服务重启后表定义保留，行数据丢失。\n\nMemory 表可选 HASH 或 BTREE。CSV 以 CSV 文件存放数据，便于交换，查询能力和索引有明显限制。NDB Cluster 使用面向集群的 NDB 引擎，需要对应部署。面试时先从事务、并发、可靠性和已有应用兼容性解释选择，普通在线交易表通常选 InnoDB。\n\n[MySQL 手册 · 其他存储引擎](https://dev.mysql.com/doc/refman/8.4/en/storage-engines.html)"}],"source":"preview","expanded":false},{"key":"mysql-592","number":592,"bank":"mysql","position":9,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295442259970","title":"MySQL InnoDB 引擎中的聚簇索引和非聚簇索引有什么区别？","sections":[{"kind":"回答重点","text":"抓住叶子页的差别。InnoDB 聚簇索引的叶子记录承载行数据，一表一棵。二级索引的叶子记录保存索引列及聚簇键，一表可有多棵。二级索引缺少查询需要的字段时，要用聚簇键再找行。"},{"kind":"扩展知识","text":"聚簇键通常由显式主键决定。无主键时采用第一个所有键列均为 `NOT NULL` 的唯一索引，仍找不到时生成隐藏行 ID 作为聚簇键。宽主键会放大各二级索引的体积。随机主键的写入分散在不同叶子页，页分裂和缓存开销取决于键分布及负载。\n\n[MySQL 手册 · 聚簇索引和二级索引](https://dev.mysql.com/doc/refman/8.4/en/innodb-index-types.html)"}],"source":"preview","expanded":false},{"key":"mysql-593","number":593,"bank":"mysql","position":10,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295446454273","title":"MySQL 中的回表是什么？","sections":[{"kind":"回答重点","text":"用二级索引找到候选记录时，先得到索引列和主键。若结果还要其他列，就拿着主键到聚簇索引里读取对应的行，这一步叫回表。"},{"kind":"扩展知识","text":"**例子与追问**　有 `PRIMARY KEY(id)` 和 `KEY idx_email(email)` 时，按 `email` 查 `nickname` 通常会回表。只查 `id, email` 时，该二级索引通常已覆盖查询。减少返回列、用联合索引覆盖高频读、缩小候选集都能降低回表成本。物理访问是否产生磁盘 I/O 取决于缓冲池命中。\n\n[MySQL 手册 · 聚簇索引和二级索引](https://dev.mysql.com/doc/refman/8.4/en/innodb-index-types.html)"}],"source":"preview","quote":"回到主键索引再查一次","expanded":false},{"key":"mysql-594","number":594,"bank":"mysql","position":11,"priority":true,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295450648578","title":"MySQL 索引的最左前缀匹配原则是什么？","sections":[{"kind":"回答重点","text":"联合索引按键列从左到右排序。以 `(first_name, last_name, age)` 为例，先比较名，名相同再比较姓，名和姓都相同才比较年龄。常规范围定位由左侧连续键列决定。"},{"kind":"扩展知识","text":"**例子与追问**　`a=1 AND c=3` 通常先用 `a` 缩小搜索范围，再筛选 `c`。`a=1 AND b\u003e5 AND c=3` 可先定位 `a,b` 的范围，`c` 仍可能用于索引下推或覆盖。只查 `b` 时通常无常规左前缀定位，但成本合适时可能有跳跃扫描或全索引扫描。面试可先讲典型范围，再用 `EXPLAIN` 验证具体计划。\n\n[MySQL 手册 · 多列索引](https://dev.mysql.com/doc/refman/8.4/en/multiple-column-indexes.html)"},{"kind":"根据一个查询选择联合索引顺序","text":"查询某用户最近十笔订单，可以考虑索引 (user_id, created_at, id)。等值筛选先确定用户，再按时间和唯一 ID 排序。时间相同的两条订单仍能稳定分页。把时间放在首列会改变可以连续扫描的范围。\n\n在符合真实数据分布的库中，比较优化器选择的 key、估算行数和实际扫描行数。表很小或条件选择性很差时，即使建了索引，优化器也可能选全表扫描。"}],"source":"preview","expanded":true},{"key":"mysql-595","number":595,"bank":"mysql","position":12,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295454842881","title":"MySQL 的覆盖索引是什么？","sections":[{"kind":"回答重点","text":"二级索引已经包含查询需要的所有列时，通常可直接从索引拿到结果，省去逐行回表取列的成本。覆盖描述的是索引和当前查询之间的关系。"},{"kind":"扩展知识","text":"**例子与追问**　对 `users(id PRIMARY KEY, email, city)`，`KEY(email)` 通常能覆盖 `SELECT id,email FROM users WHERE email=?`，因为 InnoDB 二级叶子带主键。改成查 `city` 后通常要回表。传统 `EXPLAIN` 可看 `Using index`。一致性读取遇到某些二级页可见性情况时，InnoDB 仍可能访问聚簇记录确认版本。\n\n[MySQL 手册 · 优化 InnoDB 查询](https://dev.mysql.com/doc/refman/8.4/en/optimizing-innodb-queries.html)"}],"source":"preview","quote":"索引里有的数据就不去表里取了","expanded":false},{"key":"mysql-596","number":596,"bank":"mysql","position":13,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295459037186","title":"MySQL 的索引下推是什么？","sections":[{"kind":"回答重点","text":"MySQL 5.6 引入索引条件下推。对可以在索引项上检查的条件，存储引擎先用索引列过滤候选记录，通过后才回表读完整的数据行。联合索引中的部分条件无法缩小扫描区间时，仍可能用于这一层过滤。"},{"kind":"扩展知识","text":"**例子与追问**　对 `KEY(city, name)`，查 `SELECT phone FROM users WHERE city='上海' AND name LIKE '%明%'` 时，`city` 可定位范围，包含匹配通常无法缩小 B+ 树搜索区间，但可用索引里的 `name` 先过滤再取 `phone`。传统计划中的 `Using index condition` 对应 ICP，`Using index` 常用于提示覆盖访问。InnoDB 的 ICP 用于二级索引，适用还要看访问方式及谓词可下推性。\n\n[MySQL 手册 · 索引条件下推](https://dev.mysql.com/doc/refman/8.4/en/index-condition-pushdown-optimization.html)"}],"source":"preview","expanded":false},{"key":"mysql-597","number":597,"bank":"mysql","position":14,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295459037187","title":"在 MySQL 中建索引时需要注意哪些事项？","sections":[{"kind":"回答重点","text":"先看维护成本，再看筛选效果。多一棵索引树就多一份存储和写入维护。低选择性的列通常过滤不了多少数据，但状态分布倾斜时例外，例如失败任务很少，按失败状态查询就可能有明显收益。长文本还要评估索引体积。"},{"kind":"扩展知识","text":"订单列表常查 `tenant_id=? AND status=? ORDER BY created_at DESC, id DESC`，可评估 `(tenant_id,status,created_at,id)`。另有跨状态的租户时间线时，单独验证这个索引能否提供所需顺序。长字符串前缀索引要评估碰撞与覆盖能力，业务唯一性优先用唯一约束。上线前比对扫描行数、读写延迟和索引大小，并检查重叠索引。\n\n[MySQL 手册 · 优化与索引](https://dev.mysql.com/doc/refman/8.4/en/optimization-indexes.html)"}],"source":"preview","expanded":false},{"key":"mysql-598","number":598,"bank":"mysql","position":15,"priority":false,"url":"https://www.mianshiya.com/bank/1791003439968264194/question/1780933295463231490","title":"MySQL 中使用索引一定有效吗？如何排查索引效果？","sections":[{"kind":"回答重点","text":"索引是否被选用由成本决定。小表、命中比例高或需要大量回表时，扫表可能更便宜。统计信息偏差也会让优化器误估成本。排查从 `EXPLAIN` 下手，看候选索引和实际使用的访问路径。"},{"kind":"扩展知识","text":"**排查步骤**　对真实参数运行 `EXPLAIN`，看 `possible_keys`、`key`、`key_len`、`rows`、`filtered`。在受控环境用 `EXPLAIN ANALYZE` 核对实际行数与循环。常见改写是把 `DATE(created_at)='2026-01-01'` 改为与业务时区一致的半开时间区间，或让绑定参数类型与索引列匹配。分布变化时检查统计信息，再按需要分析表或建立直方图，最后用同口径负载复测。\n\n[MySQL
